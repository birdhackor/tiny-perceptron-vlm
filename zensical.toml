[project.theme]
language = "zh-Hant"
custom_dir = "course/web/overrides"
features = [
  "navigation.tabs",
  "navigation.indexes",
  "navigation.path",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.footer",
  "navigation.top",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
]

# 使用本機字型，避免讀者需要另外連線下載字型。
[project.theme.font]
text = ""
code = ""

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "切換深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "切換淺色模式"

[project.markdown_extensions]
attr_list = {}
tables = {}
admonition = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.superfences = {}
pymdownx.details = {}
