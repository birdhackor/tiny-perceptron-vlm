[project]
name = "tiny-perceptron-vlm"
version = "0.1.0"
description = "小小感知機 Tiny Perceptron: a playful multimodal from-scratch tutorial"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "birdhackor" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11",           # 模型、訓練、STFT / mel 頻譜都自己用 PyTorch 寫
    "numpy>=1.26",
    "pillow>=11.0",          # 影像解碼
    "soundfile>=0.13",       # 音訊解碼（wav / flac / mp3 / ogg），wheel 已內建 libsndfile
    "tokenizers>=0.21",      # 自己訓練中英文 BPE tokenizer
    "datasets>=4.0",         # 下載與讀取資料集
    "huggingface-hub>=0.34", # 下載檔案；支援 HF_ENDPOINT 鏡像
]

# 依硬體選擇 PyTorch 版本（擇一）。不加 extra 時用 PyPI 預設版：
# Linux 是 CUDA 13.0 版、macOS 支援 MPS、Windows 只有 CPU。
#   uv sync --extra cpu     沒有 GPU，只想裝小一點的 CPU 版
#   uv sync --extra cu126   NVIDIA 驅動 < 580，或 GTX 9 / 10 系列、V100 等舊顯卡（不支援 RTX 50 系列）
#   uv sync --extra cu130   Windows + NVIDIA GPU（驅動 >= 580）
# 注意：用了 extra 之後，`uv run` 也要帶同一個 --extra，否則 uv 會把 torch 換回預設版。
[project.optional-dependencies]
cpu = ["torch>=2.11"]
cu126 = ["torch>=2.11"]
cu130 = ["torch>=2.11"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]
notebook = [
    "ipykernel>=6",
    "matplotlib>=3.9",
    "jupyterlab>=4",
    "nbclient>=0.10",
]
site = [
    "zensical==0.0.67",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_perceptron"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 120
# 審閱證據保留實際執行時的原始 bytes；其 SHA 由技術審閱檢查器核對。
# 不讓專案 formatter 改寫公開證據中的驗證程式。
extend-exclude = [
    # 可讀性證據含原始 notebook cell 與實跑腳本，保留其 bytes；
    # cell 可依賴暖身及前一格，不當成獨立的產品 Python 模組格式化。
    "docs/reader-reviews/artifacts",
    "docs/technical-reviews/artifacts",
    # 固定版本的上游 model card 是原始證據，保留其 bytes 與來源指紋。
    "docs/natural-assistant/evidence",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"] # ruff 預設規則 + import 排序 + 新語法

[tool.ruff.lint.per-file-ignores]
# Notebook 在需要時才引入零件；暖身 cell 預先提供 torch、nn、F。
"notebooks/**/*.ipynb" = ["E402", "F401", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
