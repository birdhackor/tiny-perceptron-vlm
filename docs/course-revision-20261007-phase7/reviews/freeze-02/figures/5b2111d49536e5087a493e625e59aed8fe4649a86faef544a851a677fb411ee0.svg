<svg xmlns="http://www.w3.org/2000/svg" width="850" height="525" viewBox="0 0 850 525" role="img" aria-labelledby="title desc">
  <title id="title">同一條線索只改位置</title>
  <desc id="desc">八筆相同紀錄排列成三列。綠色線索T提供攝影社的代碼M17，分別在第一、第四、第八筆；灰色U1至U7保持相對順序。三版都問攝影社的活動室代碼，紙上答案都是M17。每格代表一筆紀錄，不是token。</desc>
  <style>
    text { font-family: "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif; fill: #17324d; }
    .card { fill: #eef2f6; stroke: #7c8a9a; stroke-width: 2; }
    .clue { fill: #e5f4ec; stroke: #14724d; stroke-width: 3; }
    .value { font-size: 32px; font-weight: 700; text-anchor: middle; }
    .place { font-size: 34px; font-weight: 700; }
  </style>
  <rect width="850" height="525" rx="18" fill="#ffffff"/>
  <text x="32" y="48" font-size="36" font-weight="700">只換 T 的位置</text>
  <text x="32" y="88" font-size="30">綠框 T：攝影社 → M17</text>
  <text x="32" y="122" font-size="28">灰框保留原順序；每格是一筆紀錄</text>
  <text class="place" x="34" y="183">首</text>
  <rect class="clue" x="104" y="140" width="84" height="64" rx="10"/>
  <text class="value" x="146" y="182">M17</text>
  <rect class="card" x="195" y="140" width="84" height="64" rx="10"/><text class="value" x="237" y="182">U1</text>
  <rect class="card" x="286" y="140" width="84" height="64" rx="10"/><text class="value" x="328" y="182">U2</text>
  <rect class="card" x="377" y="140" width="84" height="64" rx="10"/><text class="value" x="419" y="182">U3</text>
  <rect class="card" x="468" y="140" width="84" height="64" rx="10"/><text class="value" x="510" y="182">U4</text>
  <rect class="card" x="559" y="140" width="84" height="64" rx="10"/><text class="value" x="601" y="182">U5</text>
  <rect class="card" x="650" y="140" width="84" height="64" rx="10"/><text class="value" x="692" y="182">U6</text>
  <rect class="card" x="741" y="140" width="84" height="64" rx="10"/><text class="value" x="783" y="182">U7</text>
  <text class="place" x="34" y="289">中</text>
  <rect class="card" x="104" y="246" width="84" height="64" rx="10"/><text class="value" x="146" y="288">U1</text>
  <rect class="card" x="195" y="246" width="84" height="64" rx="10"/><text class="value" x="237" y="288">U2</text>
  <rect class="card" x="286" y="246" width="84" height="64" rx="10"/><text class="value" x="328" y="288">U3</text>
  <rect class="clue" x="377" y="246" width="84" height="64" rx="10"/><text class="value" x="419" y="288">M17</text>
  <rect class="card" x="468" y="246" width="84" height="64" rx="10"/><text class="value" x="510" y="288">U4</text>
  <rect class="card" x="559" y="246" width="84" height="64" rx="10"/><text class="value" x="601" y="288">U5</text>
  <rect class="card" x="650" y="246" width="84" height="64" rx="10"/><text class="value" x="692" y="288">U6</text>
  <rect class="card" x="741" y="246" width="84" height="64" rx="10"/><text class="value" x="783" y="288">U7</text>
  <text class="place" x="34" y="395">尾</text>
  <rect class="card" x="104" y="352" width="84" height="64" rx="10"/><text class="value" x="146" y="394">U1</text>
  <rect class="card" x="195" y="352" width="84" height="64" rx="10"/><text class="value" x="237" y="394">U2</text>
  <rect class="card" x="286" y="352" width="84" height="64" rx="10"/><text class="value" x="328" y="394">U3</text>
  <rect class="card" x="377" y="352" width="84" height="64" rx="10"/><text class="value" x="419" y="394">U4</text>
  <rect class="card" x="468" y="352" width="84" height="64" rx="10"/><text class="value" x="510" y="394">U5</text>
  <rect class="card" x="559" y="352" width="84" height="64" rx="10"/><text class="value" x="601" y="394">U6</text>
  <rect class="card" x="650" y="352" width="84" height="64" rx="10"/><text class="value" x="692" y="394">U7</text>
  <rect class="clue" x="741" y="352" width="84" height="64" rx="10"/><text class="value" x="783" y="394">M17</text>
  <text x="32" y="465" font-size="32">同一題：攝影社的活動室代碼？</text>
  <text x="32" y="507" font-size="32" font-weight="700">三版的紙上答案：M17</text>
</svg>
