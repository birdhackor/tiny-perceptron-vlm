<svg xmlns="http://www.w3.org/2000/svg" width="640" height="845" viewBox="0 0 640 845" role="img" aria-labelledby="title desc"><title id="title">LoRA：同一輸入走兩條路</title><desc id="desc">輸入16個數，左路凍結W有192個權重，右路可訓練A與B，中間寬度2，共56個參數。兩路輸出都是12個數，相加才得到最後結果。alpha和rank相同時修正倍率1。</desc><defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#173047}.title{font-size:32px;font-weight:700}.bold{font-weight:700}.small{font-size:28px}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6e8b"/></marker></defs><rect width="640" height="845" fill="#ffffff"/><text x="32" y="48" class="title">LoRA：同一輸入走兩條路</text><rect x="32" y="78" width="576" height="90" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="120" class="bold">同一份輸入：16 個數</text><path d="M195 168 L170 215" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><path d="M445 168 L470 215" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="225" width="270" height="200" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="267" class="bold">原路：W</text><text x="50" y="307" class="">16 → 12</text><text x="50" y="347" class="">192 個權重</text><text x="50" y="387" class="">凍結不更新</text><rect x="338" y="225" width="270" height="130" rx="12" fill="#e8f6ef" stroke="#579478" stroke-width="2"/><text x="356" y="267" class="bold">修正：A</text><text x="356" y="307" class="">16 → 2</text><path d="M470 355 L470 395" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="410" width="270" height="130" rx="12" fill="#e8f6ef" stroke="#579478" stroke-width="2"/><text x="356" y="452" class="bold">修正：B</text><text x="356" y="492" class="">2 → 12</text><text x="344" y="582" class="">可訓練：32+24=56</text><path d="M167 425 L167 615" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><path d="M167 615 L250 615" fill="none" stroke="#3b6e8b" stroke-width="3"/><path d="M470 594 L470 615" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 615 L390 615" fill="none" stroke="#3b6e8b" stroke-width="3"/><rect x="218" y="603" width="204" height="76" rx="12" fill="#fff4d9" stroke="#b18f45" stroke-width="2"/><text x="236" y="645" class="bold">相加</text><path d="M320 679 L320 718" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="730" width="576" height="82" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="772" class="bold">最後輸出：12 個數</text></svg>