<svg xmlns="http://www.w3.org/2000/svg" width="640" height="767" viewBox="0 0 640 767" role="img" aria-labelledby="title desc"><title id="title">找資料、回答，再回查</title><desc id="desc">本地公告依問題檢索，原文與問題送入模型，回答後核對引用支持。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#14724d"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#17324d}</style><rect width="640" height="767" rx="18" fill="white"/><text x="28" y="48" font-size="32" font-weight="700" text-anchor="start">找資料、回答，再回查</text><rect x="32" y="82" width="576" height="94" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="56" y="124" font-size="32" font-weight="700" text-anchor="start">問題：書店新地址？</text><text x="56" y="162" font-size="28" font-weight="400" text-anchor="start">本地來源有公告與其他文件</text><path d="M320 185 V208" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="225" width="576" height="94" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="56" y="267" font-size="32" font-weight="700" text-anchor="start">檢索：取回公告1原文</text><text x="56" y="305" font-size="28" font-weight="400" text-anchor="start">書店地址是青街8號</text><path d="M320 328 V351" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="368" width="576" height="94" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="56" y="410" font-size="32" font-weight="700" text-anchor="start">輸入：問題＋公告1原文</text><text x="56" y="448" font-size="28" font-weight="400" text-anchor="start">把來源標籤與資料完整放入</text><path d="M320 471 V494" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="511" width="576" height="94" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="56" y="553" font-size="32" font-weight="700" text-anchor="start">生成：青街8號〔公告1〕</text><text x="56" y="591" font-size="28" font-weight="400" text-anchor="start">這是紙上期待答案</text><path d="M320 614 V637" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="654" width="576" height="94" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="56" y="696" font-size="32" font-weight="700" text-anchor="start">回查來源與主張</text><text x="56" y="734" font-size="28" font-weight="400" text-anchor="start">公告1存在？支持這個地址？</text></svg>
