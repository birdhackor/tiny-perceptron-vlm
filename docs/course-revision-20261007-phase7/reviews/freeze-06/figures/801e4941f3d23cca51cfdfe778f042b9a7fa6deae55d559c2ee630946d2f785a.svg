<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1060" viewBox="0 0 640 1060" role="img" aria-labelledby="title desc"><title id="title">Embedding如何影響候選分數</title><desc id="desc">手算示意。每字ID查一列三格可調數字，交給共用的候選狗配方2乘第一格加第三格。改貓列能改候選分數；這不表示已做更新或訓練。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#54728c"/></marker></defs><rect width="640" height="1060" fill="#fff"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="320" y="46" text-anchor="middle" font-size="36" fill="#173047" font-weight="bold">每字的一排可調數字</text><text x="320" y="87" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">手動指定的表；不是已訓練的字義</text><rect x="35" y="112" width="180" height="52" rx="12" fill="#eef0f2" stroke="#54728c" stroke-width="2"/><text x="125" y="149" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">0／。</text><rect x="230" y="112" width="375" height="52" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="417" y="149" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">[0, 0, 0]</text><rect x="35" y="173" width="180" height="52" rx="12" fill="#fff0d9" stroke="#54728c" stroke-width="2"/><text x="125" y="210" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">1／貓</text><rect x="230" y="173" width="375" height="52" rx="12" fill="#fff0d9" stroke="#54728c" stroke-width="2"/><text x="417" y="210" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">[1, 0, 0]</text><rect x="35" y="234" width="180" height="52" rx="12" fill="#eef0f2" stroke="#54728c" stroke-width="2"/><text x="125" y="271" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">2／看</text><rect x="230" y="234" width="375" height="52" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="417" y="271" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">[0, 1, 0]</text><rect x="35" y="295" width="180" height="52" rx="12" fill="#eef0f2" stroke="#54728c" stroke-width="2"/><text x="125" y="332" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">3／狗</text><rect x="230" y="295" width="375" height="52" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="417" y="332" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">[0, 0, 1]</text><rect x="35" y="356" width="180" height="52" rx="12" fill="#eef0f2" stroke="#54728c" stroke-width="2"/><text x="125" y="393" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">4／，</text><rect x="230" y="356" width="375" height="52" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="417" y="393" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">[1, 1, 1]</text><path d="M320,430 L320,469" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="515" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">ID 1（貓）查出 [1, 0, 0]</text><path d="M320,535 L320,574" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="590" width="580" height="121" rx="12" fill="#e7f6ec" stroke="#54728c" stroke-width="2"/><text x="320" y="635" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">候選「狗」的共用配方</text><text x="320" y="684" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">2 × 第一格 + 第三格</text><text x="320" y="766" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">貓：[1, 0, 0] → 分數 2</text><text x="320" y="812" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">看：[0, 1, 0] → 分數 0</text><rect x="30" y="852" width="580" height="124" rx="12" fill="#fff0d9" stroke="#54728c" stroke-width="2"/><text x="320" y="896" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">假設調貓列：第一格 1 → 1.5</text><text x="320" y="942" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">同一配方下，分數 2 → 3</text><text x="320" y="1020" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">查表 → 算分數 → 才能評答案代價</text></g></svg>