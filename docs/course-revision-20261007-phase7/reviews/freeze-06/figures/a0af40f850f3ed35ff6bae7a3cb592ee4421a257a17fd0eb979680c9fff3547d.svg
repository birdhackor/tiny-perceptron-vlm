<svg xmlns="http://www.w3.org/2000/svg" width="640" height="865" viewBox="0 0 640 865" role="img" aria-labelledby="title desc">
  <title id="title">打字、聲音、再打字，共用同一份對話歷史</title>
  <desc id="desc">五張按先後排列的訊息卡：文字要求兩點回答；聲音特徵位置；手寫希望的兩點答覆；文字要求改成一句；手寫希望的一句答覆。語音卡不含逐字稿。每輪歷史送給同一聊天核心。</desc>
  <style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#203047}.main{font-size:32px;font-weight:700;text-anchor:middle}.body{font-size:28px}.label{font-size:28px;font-weight:700}.arrow{stroke:#415a77;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#415a77"/></marker></defs>
  <rect width="640" height="865" rx="16" fill="#f7f9fc"/>
  <text x="320" y="43" class="main">同一份歷史，兩種入口</text>
  <text x="320" y="84" class="body" text-anchor="middle">每輪都送給同一聊天核心</text>
  <rect x="55" y="112" width="530" height="95" rx="12" fill="#eaf1fa" stroke="#7598c2" stroke-width="2"/>
  <text x="80" y="147" class="label">① 使用者・文字</text>
  <text x="80" y="187" class="body">接下來請用兩點回答。</text>
  <path d="M320 211 V236" class="arrow"/>
  <rect x="55" y="246" width="530" height="114" rx="12" fill="#f1edfa" stroke="#9b86bd" stroke-width="2"/>
  <text x="80" y="283" class="label">② 使用者・聲音</text>
  <text x="80" y="319" class="body">〈聲音開始〉特徵位置…</text>
  <text x="80" y="349" class="body">〈聲音結束〉</text>
  <path d="M320 364 V389" class="arrow"/>
  <rect x="55" y="399" width="530" height="119" rx="12" fill="#e9f6ef" stroke="#64a282" stroke-width="2"/>
  <text x="80" y="436" class="label">③ 助手・希望生成</text>
  <text x="80" y="472" class="body">1. 檢查網路。</text>
  <text x="80" y="507" class="body">2. 重新啟動 App。</text>
  <path d="M320 522 V547" class="arrow"/>
  <rect x="55" y="557" width="530" height="92" rx="12" fill="#eaf1fa" stroke="#7598c2" stroke-width="2"/>
  <text x="80" y="592" class="label">④ 使用者・文字</text>
  <text x="80" y="630" class="body">改成一句。</text>
  <path d="M320 653 V678" class="arrow"/>
  <rect x="55" y="688" width="530" height="120" rx="12" fill="#e9f6ef" stroke="#64a282" stroke-width="2"/>
  <text x="80" y="725" class="label">⑤ 助手・希望生成</text>
  <text x="80" y="762" class="body">先檢查網路，</text>
  <text x="80" y="797" class="body">再重新啟動 App。</text>
  <text x="320" y="848" class="body" text-anchor="middle">手寫設計示例，並非模型輸出</text>
</svg>
