<svg xmlns="http://www.w3.org/2000/svg" width="640" height="610" viewBox="0 0 640 610" role="img" aria-labelledby="title desc">
  <title id="title">同一活動的條件逐項更新</title>
  <desc id="desc">十月一日有效條件是15點、活動室M17、段落格式。十月三日只將時間改為16點，地點和格式仍保留。十月四日只將格式改為兩個條列，16點和M17仍保留。三則訊息都說十月十日同一場活動。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#526577"/></marker></defs>
  <style>text { font-family: "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif; fill: #17324d; }</style>
  <rect width="640" height="610" rx="18" fill="#ffffff"/>
  <text x="28" y="48" font-size="32" font-weight="700">同一活動，條件逐項更新</text>
  <text x="28" y="87" font-size="28">每個框整理當時有效的條件</text>
  <rect x="32" y="108" width="576" height="112" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/>
  <text x="56" y="151" font-size="32" font-weight="700">10月1日：原安排</text>
  <text x="56" y="196" font-size="32">15:00｜M17｜段落</text>
  <path d="M320 229 V248" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="32" y="265" width="576" height="112" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="3"/>
  <text x="56" y="308" font-size="32" font-weight="700">10月3日：只改時間</text>
  <text x="56" y="353" font-size="32"><tspan fill="#14724d" font-weight="700">16:00</tspan><tspan>｜M17｜段落</tspan></text>
  <path d="M320 386 V405" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="32" y="422" width="576" height="112" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="3"/>
  <text x="56" y="465" font-size="32" font-weight="700">10月4日：只改格式</text>
  <text x="56" y="510" font-size="32"><tspan>16:00｜M17｜</tspan><tspan fill="#14724d" font-weight="700">兩個條列</tspan></text>
  <text x="28" y="580" font-size="28">訊息日不同，活動同為10月10日</text>
</svg>
