<svg xmlns="http://www.w3.org/2000/svg" width="640" height="905" viewBox="0 0 640 905" role="img" aria-labelledby="title desc"><title id="title">Shift答案配對與因果可讀範圍</title><desc id="desc">手工序列示意。原序列1、2、3、4取輸入1、2、3答案2、3、4，各位置只能讀自身及以前，三格各比較下一字答案。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#54728c"/></marker></defs><rect width="640" height="905" fill="#fff"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="320" y="45" text-anchor="middle" font-size="36" fill="#173047" font-weight="bold">原序列 [1, 2, 3, 4]</text><text x="320" y="90" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">輸入少最後格，答案少第一格</text><rect x="30" y="119" width="580" height="68" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="164" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">輸入 x = [1, 2, 3]</text><rect x="30" y="210" width="580" height="68" rx="12" fill="#e7f6ec" stroke="#54728c" stroke-width="2"/><text x="320" y="255" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">答案 y = [2, 3, 4]</text><rect x="25" y="323" width="590" height="111" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="365" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">位置 0 可讀 [1]</text><text x="320" y="410" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">這格分數只與答案 ID 2 比</text><rect x="25" y="463" width="590" height="111" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="505" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">位置 1 可讀 [1, 2]</text><text x="320" y="550" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">這格分數只與答案 ID 3 比</text><rect x="25" y="603" width="590" height="111" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="645" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">位置 2 可讀 [1, 2, 3]</text><text x="320" y="690" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">這格分數只與答案 ID 4 比</text><text x="320" y="813" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">資料知道答案 ≠ 每格有權讀答案</text><text x="320" y="860" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">shift 配答案；因果許可限制前文</text></g></svg>