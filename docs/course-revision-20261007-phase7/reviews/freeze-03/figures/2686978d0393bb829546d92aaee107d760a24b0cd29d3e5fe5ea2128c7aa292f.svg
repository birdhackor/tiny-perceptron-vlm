<svg xmlns="http://www.w3.org/2000/svg" width="640" height="916" viewBox="0 0 640 916" role="img" aria-labelledby="title desc"><title id="title">QK匹配後按比例讀V</title><desc id="desc">手算未縮放例子。Q對兩個K得分1和0，softmax0.731和0.269，兩個三格V加權混合後輸出7.042、14.083、21.125。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#54728c"/></marker></defs><rect width="640" height="916" fill="#fff"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="320" y="45" text-anchor="middle" font-size="34" fill="#173047" font-weight="bold">匹配線索與取回內容分工</text><rect x="110" y="79" width="420" height="58" rx="12" fill="#fff0d9" stroke="#54728c" stroke-width="2"/><text x="320" y="119" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">Q：需求 [1, 0]</text><text x="75" y="189" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">位置 0</text><rect x="20" y="214" width="290" height="60" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="165" y="254" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">K：[1, 0]</text><path d="M210,143 L165,205" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><text x="165" y="324" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">匹配分數 1</text><path d="M165,340 L165,377" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="392" width="290" height="58" rx="12" fill="#fff0d9" stroke="#54728c" stroke-width="2"/><text x="165" y="431" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">比例 0.731</text><path d="M165,459 L165,494" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="509" width="290" height="102" rx="12" fill="#e7f6ec" stroke="#54728c" stroke-width="2"/><text x="165" y="548" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">V：取回內容</text><text x="165" y="591" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">[10, 20, 30]</text><text x="565" y="189" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">位置 1</text><rect x="330" y="214" width="290" height="60" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="475" y="254" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">K：[0, 1]</text><path d="M430,143 L475,205" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><text x="475" y="324" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">匹配分數 0</text><path d="M475,340 L475,377" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="392" width="290" height="58" rx="12" fill="#fff0d9" stroke="#54728c" stroke-width="2"/><text x="475" y="431" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">比例 0.269</text><path d="M475,459 L475,494" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="509" width="290" height="102" rx="12" fill="#e7f6ec" stroke="#54728c" stroke-width="2"/><text x="475" y="548" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">V：取回內容</text><text x="475" y="591" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">[−1, −2, −3]</text><text x="320" y="378" text-anchor="middle" font-size="28" fill="#173047">softmax</text><path d="M165,620 L250,696" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><path d="M475,620 L390,696" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="715" width="590" height="113" rx="12" fill="#e7f6ec" stroke="#54728c" stroke-width="2"/><text x="320" y="757" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">0.731 × V₀ + 0.269 × V₁</text><text x="320" y="806" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">[7.042, 14.083, 21.125]</text><text 