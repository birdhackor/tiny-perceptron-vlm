<svg xmlns="http://www.w3.org/2000/svg" width="640" height="482" viewBox="0 0 640 482" role="img" aria-labelledby="title desc"><title id="title">一次回饋，答4稍微更可能</title><desc id="desc">人工選答4，比baseline好0.5，更新兩個分數後答4機率由0.5升至0.512497。沒有訓練語言模型。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#14724d"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#17324d}</style><rect width="640" height="482" rx="18" fill="white"/><text x="28" y="48" font-size="32" font-weight="700" text-anchor="start">一次回饋，答4稍微更可能</text><text x="28" y="87" font-size="28" font-weight="400" text-anchor="start">兩個位置順序：答3／答4</text><rect x="32" y="108" width="576" height="112" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="56" y="150" font-size="32" font-weight="700" text-anchor="start">更新前分數：0，0</text><text x="56" y="188" font-size="28" font-weight="400" text-anchor="start">機率：0.5，0.5</text><path d="M320 231 V280" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/><text x="28" y="259" font-size="28" font-weight="400" text-anchor="start">優勢+0.5，步幅0.1</text><rect x="32" y="297" width="576" height="112" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="56" y="339" font-size="28" font-weight="700" text-anchor="start">更新後：−0.025，0.025</text><text x="56" y="377" font-size="28" font-weight="400" text-anchor="start">機率：0.487503，0.512497</text><text x="28" y="454" font-size="32" font-weight="700" text-anchor="start">分數的變動不是機率的變動</text></svg>
