<svg xmlns="http://www.w3.org/2000/svg" width="640" height="884" viewBox="0 0 640 884" role="img" aria-labelledby="title desc"><title id="title">同一成品的接續訓練</title><desc id="desc">MoE從隨機初始化依序接續八段；箭頭載入自己前段選定的best權重。Dense停在weighted。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#14724d"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#17324d} .main{font-size:30px;font-weight:700}.body{font-size:27px}.small{font-size:26px} .line{stroke:#14724d;stroke-width:3;fill:none}</style><rect width="640" height="884" fill="white"/><text x="28" y="48" font-size="32" font-weight="700">同一成品的接續訓練</text><text x="28" y="86" class="small">起點：所有神經權重隨機初始化</text><rect x="28" y="110" width="584" height="62" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="48" y="150" class="body">pretrain：有限文字接續</text><path d="M320 172 V190" class="line" marker-end="url(#arrow)"/><rect x="28" y="196" width="584" height="62" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="48" y="236" class="body">SFT：回答與工具示範</text><path d="M320 258 V276" class="line" marker-end="url(#arrow)"/><rect x="28" y="282" width="584" height="62" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="48" y="322" class="body">vision：商品辨識</text><path d="M320 344 V362" class="line" marker-end="url(#arrow)"/><rect x="28" y="368" width="584" height="62" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="48" y="408" class="body">OCR：指定框內讀字</text><path d="M320 430 V448" class="line" marker-end="url(#arrow)"/><rect x="28" y="454" width="584" height="62" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="48" y="494" class="body">audio：聲音意圖</text><path d="M320 516 V534" class="line" marker-end="url(#arrow)"/><rect x="28" y="540" width="584" height="62" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="48" y="580" class="body">joint：材料與回答合作</text><path d="M320 602 V620" class="line" marker-end="url(#arrow)"/><rect x="28" y="626" width="584" height="62" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="48" y="666" class="body">weighted：工具與數字加權</text><path d="M320 688 V706" class="line" marker-end="url(#arrow)"/><rect x="28" y="712" width="584" height="62" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="48" y="752" class="body">native：原始語音示範加權</text><text x="28" y="817" class="small">每支箭頭載入自己的 best.pt</text><text x="28" y="858" class="small">新段重建更新器與抽樣狀態</text></svg>