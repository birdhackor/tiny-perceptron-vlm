<svg xmlns="http://www.w3.org/2000/svg" width="480" height="840" viewBox="0 0 480 840" role="img" aria-labelledby="title desc">
<title id="title">四個振幅點，如何比對不同頻率</title>
<desc id="desc">人工波形為1、0、負1、0。與一週期的餘弦樣板逐點相乘後相加為2，與錯開四分之一週期的樣板相乘相加為0。兩個分數平方相加得到4。與兩週期的樣板相乘相加為0。這些只是未加窗的四點手算例子。</desc>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans",sans-serif;fill:#18344d;font-size:20px}.heading{font-size:24px;font-weight:700}.small{font-size:20px}.panel{fill:#f4f7fb;stroke:#b6c8d9;stroke-width:1.5}.line{fill:none;stroke-width:3;stroke-linejoin:round}.axis{stroke:#bdcbd6;stroke-width:1.5}.value{font-size:20px;font-weight:600}</style>
<rect width="480" height="840" rx="18" fill="#ffffff"/>
<text x="24" y="37" class="heading">先用四個點，比對起伏的速度</text>
<text x="24" y="67" class="small">人工材料，未加窗；每格是一個取樣點</text>
<rect x="18" y="88" width="444" height="165" rx="12" class="panel"/>
<text x="35" y="118" class="heading">波形：[1, 0, −1, 0]</text>
<line x1="65" y1="184" x2="420" y2="184" class="axis"/>
<polyline points="80,145 185,184 290,223 395,184" class="line" stroke="#2563a6"/>
<g fill="#2563a6"><circle cx="80" cy="145" r="5"/><circle cx="185" cy="184" r="5"/><circle cx="290" cy="223" r="5"/><circle cx="395" cy="184" r="5"/></g>
<rect x="18" y="274" width="444" height="236" rx="12" class="panel"/>
<text x="35" y="306" class="heading">候選：每四點一個週期</text>
<text x="35" y="341">樣板甲：[1, 0, −1, 0]</text>
<text x="35" y="371">逐點乘，再加：1 + 0 + 1 + 0 = 2</text>
<text x="35" y="414">樣板乙：[0, 1, 0, −1]</text>
<text x="35" y="444">逐點乘，再加：0 + 0 + 0 + 0 = 0</text>
<text x="35" y="483" class="value">兩份合起來的強弱：2² + 0² = 4</text>
<rect x="18" y="531" width="444" height="156" rx="12" class="panel"/>
<text x="35" y="563" class="heading">候選：每四點兩個週期</text>
<text x="35" y="599">樣板：[1, −1, 1, −1]</text>
<text x="35" y="630">逐點乘，再加：1 + 0 − 1 + 0 = 0</text>
<text x="35" y="665" class="small">這組取樣下，錯相樣板全為 0</text>
<text x="24" y="725">同一波形，對不同頻率得到不同分數。</text>
<text x="24" y="762">一週期候選搭配兩份錯相樣板，</text>
<text x="24" y="792">將各自分數平方相加，衡量強弱。</text>
<text x="24" y="823" class="small">正式功率的尺度還取決於窗與正規化。</text>
</svg>
