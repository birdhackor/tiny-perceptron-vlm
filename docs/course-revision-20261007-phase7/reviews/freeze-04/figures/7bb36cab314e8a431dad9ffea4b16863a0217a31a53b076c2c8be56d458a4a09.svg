<svg xmlns="http://www.w3.org/2000/svg" width="440" height="842" viewBox="0 0 440 842" role="img" aria-labelledby="title desc">
  <title id="title">同一題可以使用三份學習目標</title>
  <desc id="desc">原資料是問題2加2與答案4。三條可選訓練路使用同一學生架構與起始權重：第一條學原答案4，第二條學教師交出的相同答案4，第三條學教師對候選4、3、100的比例70%、20%、10%。左側分叉箭頭表示替代路徑，不是依次訓練。比例是人工示例。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#17324d;font-size:22px}
    .heading{font-size:26px;font-weight:700;text-anchor:middle}
    .card-title{font-size:23px;font-weight:700}
    .answer{font-size:25px;font-weight:600}
  </style>
  <rect width="440" height="842" rx="16" fill="#f8fafc"/>
  <text x="220" y="38" class="heading">同一題，三份學習目標</text>
  <text x="220" y="80" text-anchor="middle" class="answer">原資料：2+2=? → 4</text>
  <text x="220" y="117" text-anchor="middle">同一學生架構與起始權重</text>
  <path d="M220 138 H30 V590 M30 227 H62 M30 382 H62 M30 590 H62" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <path d="M30 227 H62" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M30 382 H62" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M30 590 H62" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="66" y="164" width="350" height="122" rx="12" fill="#eaf2fc" stroke="#8caed5"/>
  <text x="86" y="198" class="card-title">① 原資料直接教學生</text>
  <text x="86" y="237" class="answer">目標文字：4</text>
  <text x="86" y="270">提高原答案的機率</text>
  <rect x="66" y="320" width="350" height="126" rx="12" fill="#eaf2fc" stroke="#8caed5"/>
  <text x="86" y="355" class="card-title">② 教師只交出答案</text>
  <text x="86" y="394" class="answer">目標文字：4</text>
  <text x="86" y="429">完整目標相同，指導也相同</text>
  <rect x="66" y="480" width="350" height="222" rx="12" fill="#edf8f3" stroke="#81b8a1"/>
  <text x="86" y="516" class="card-title">③ 教師交出候選比例</text>
  <text x="86" y="560" class="answer">4</text>
  <rect x="163" y="539" width="133" height="27" rx="4" fill="#4f83c7"/>
  <text x="394" y="561" text-anchor="end" class="answer">70%</text>
  <text x="86" y="606" class="answer">3</text>
  <rect x="163" y="585" width="38" height="27" rx="4" fill="#e8a04b"/>
  <text x="394" y="607" text-anchor="end" class="answer">20%</text>
  <text x="86" y="652" class="answer">100</text>
  <rect x="163" y="631" width="19" height="27" rx="4" fill="#58a285"/>
  <text x="394" y="653" text-anchor="end" class="answer">10%</text>
  <text x="86" y="687">合計100%；不只指定第一名</text>
  <text x="220" y="746" text-anchor="middle" font-weight="600">前兩路：完整目標相同</text>
  <text x="220" y="782" text-anchor="middle" font-weight="600">第三路：多了候選比例</text>
  <text x="220" y="823" text-anchor="middle">人工比例，不是教師實測</text>
</svg>
