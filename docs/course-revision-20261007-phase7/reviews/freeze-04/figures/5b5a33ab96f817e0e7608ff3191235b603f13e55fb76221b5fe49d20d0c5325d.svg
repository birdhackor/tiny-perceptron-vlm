<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
  <title id="title">兩區中文字卡，只讀右側框內的出口</title>
  <desc id="desc">左區文字入口，右區文字出口。綠色實線框指定右區。要求只讀右側框內的字，希望答案出口。</desc>
  <style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#203047;text-anchor:middle}.main{font-size:32px;font-weight:700}.body{font-size:28px}.glyph{font-size:76px;font-weight:700}.note{font-size:24px;fill:#526174}</style>
  <rect width="640" height="410" rx="16" fill="#f7f9fc"/>
  <text x="320" y="44" class="main">只讀綠色框內的字</text>
  <text x="180" y="91" class="body">左區</text>
  <text x="460" y="91" class="body">右區・指定</text>
  <rect x="35" y="107" width="570" height="157" rx="10" fill="white" stroke="#cad5e1" stroke-width="2"/>
  <rect x="67" y="120" width="226" height="130" rx="5" fill="#f5f7fa" stroke="#8b9aac" stroke-width="2"/>
  <rect x="347" y="120" width="226" height="130" rx="5" fill="#ecf9f2" stroke="#168252" stroke-width="6"/>
  <text x="180" y="215" class="glyph">入口</text>
  <text x="460" y="215" class="glyph">出口</text>
  <text x="320" y="311" class="body">請只讀右側框內的字。</text>
  <text x="320" y="364" class="main">希望答案：出口</text>
  <text x="320" y="399" class="note">作者自製字卡</text>
</svg>
