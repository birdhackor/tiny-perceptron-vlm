<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
<title id="title">單音分類校準後，測試答案不變而信心增加</title><desc id="desc">在八段驗證錄音上選擇溫度零點五，最後十四段測試的答對數仍為十一。平均信心從百分之八十七點九六升到九十二點七三，超過固定的百分之七十八點五七正確率；ECE和Brier誤差均增加。</desc>
<style>text{font-family:system-ui,"Noto Sans TC",sans-serif;fill:#172033;font-size:23px}.title{font-size:27px;font-weight:700}.heading{font-size:25px;font-weight:700}.value{font-size:25px;font-weight:700}.small{font-size:22px}</style>
<rect width="640" height="800" rx="16" fill="#f8fafc"/>

<text x="24" y="42" class="title">同批14段單音，答案不變，信心變大</text>
<text x="24" y="79">在8段驗證錄音選溫度；選中0.5。</text>
<text x="24" y="112">驗證8/8全對，測試仍只答對11/14。</text>
<rect x="16" y="133" width="608" height="242" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="32" y="169" class="heading">原始：溫度1</text>
<text x="32" y="203" class="value">平均信心87.96%</text>
<rect x="32" y="227" width="560" height="32" fill="#e8edf3"/><rect x="32" y="227" width="492.576" height="32" fill="#357ba9"/>
<line x1="472" y1="217" x2="472" y2="270" stroke="#7a3b81" stroke-width="4" stroke-dasharray="7 5"/>
<text x="32" y="292" class="small">0%</text><text x="536" y="292" class="small">100%</text>
<text x="32" y="327">ECE 0.13186　Brier 0.20207</text>
<text x="32" y="360" class="small">紫色虛線：正確率11/14（78.57%）</text>
<rect x="16" y="393" width="608" height="242" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="32" y="429" class="heading">校準後：溫度0.5</text>
<text x="32" y="463" class="value">平均信心92.73%</text>
<rect x="32" y="487" width="560" height="32" fill="#e8edf3"/><rect x="32" y="487" width="519.288" height="32" fill="#357ba9"/>
<line x1="472" y1="477" x2="472" y2="530" stroke="#7a3b81" stroke-width="4" stroke-dasharray="7 5"/>
<text x="32" y="552" class="small">0%</text><text x="536" y="552" class="small">100%</text>
<text x="32" y="587">ECE 0.14154　Brier 0.25337</text>
<text x="32" y="620" class="small">虛線位置不變，藍色信心條更長。</text>
<text x="24" y="671" class="small">兩項誤差越小越好，這次都增加。</text>
<text x="24" y="705" class="small">驗證較好，沒有保證新頻率也較好。</text>
<text x="24" y="746" class="small">這是low／high分類器的信心，</text>
<text x="24" y="780" class="small">不是生成回答或安全判斷的可靠度。</text>
</svg>
