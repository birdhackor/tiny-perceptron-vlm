<svg xmlns="http://www.w3.org/2000/svg" width="640" height="990" viewBox="0 0 640 990" role="img" aria-labelledby="title desc"><title id="title">非線性插入後的規則轉折</title><desc id="desc">手算示意。輸入負2零2，純線性全0；中間ReLU清負數後得到2零2，上下兩圖使用相同權重。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#54728c"/></marker></defs><rect width="640" height="990" fill="#fff"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="320" y="45" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">相同權重，只改中間有無 ReLU</text><rect x="25" y="80" width="590" height="373" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="126" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">純線性：三個輸出都是 0</text><text x="86" y="174" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">輸出</text><text x="577" y="404" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">輸入</text><path d="M110,360 L545,360" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><path d="M110,360 L110,191" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><text x="80" y="245" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">2</text><text x="80" y="369" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">0</text><path d="M165,360 L320,360 L475,360" fill="none" stroke="#a65317" stroke-width="4"/><circle cx="165" cy="360" r="7" fill="#a65317"/><text x="165" y="406" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">−2</text><text x="165" y="340" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">0</text><circle cx="320" cy="360" r="7" fill="#a65317"/><text x="320" y="406" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">0</text><text x="320" y="340" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">0</text><circle cx="475" cy="360" r="7" fill="#a65317"/><text x="475" y="406" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">2</text><text x="475" y="340" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">0</text><rect x="25" y="490" width="590" height="373" rx="12" fill="#fff0d9" stroke="#54728c" stroke-width="2"/><text x="320" y="536" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">加 ReLU：輸出是 2、0、2</text><text x="86" y="584" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">輸出</text><text x="577" y="814" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">輸入</text><path d="M110,770 L545,770" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><path d="M110,770 L110,601" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><text x="80" y="655" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">2</text><text x="80" y="779" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">0</text><path d="M165,645 L320,770 L475,645" fill="none" stroke="#a65317" stroke-width="4"/><circle cx="165" cy="645" r="7" fill="#a65317"/><text x="165" y="816" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">−2</text><text x="165" y="625" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">2</text><circle cx="320" cy="770" r="7" fill="#a65317"/><text x="320" y="816" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">0</text><text x="320" y="750" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">0</text><circle cx="475" cy="645" r="7" fill="#a65317"/><text x="475" y="816" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">2</text><text x="475" y="625" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">2</text><text x="320" y="945" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">三點來自正文手動配方，不是訓練結果</text></g></svg>