<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">真人數字錄音：說話者分開，辨識仍很弱</title>
  <desc id="desc">FSDD教學樣本共60段，jackson訓練20段，nicolas驗證20段，theo測試20段，每位0至9各兩次。全開更新250次後，驗證5/20、測試3/20，兩側都20/20以EOS結束。原8kHz PCM16錄音真正插值成16kHz FLOAT；0_jackson_5.wav由4591點變9182點，時長同為0.573875秒，不新增4kHz以上資訊。此為自訂說話者留出，並非官方benchmark。</desc>
  <style>
    text {font-family:system-ui,"Noto Sans TC",sans-serif;fill:#22304a;font-size:28px;}
    .heading {font-size:34px;font-weight:700;}
    .label {font-size:30px;font-weight:650;}
    .score {font-size:32px;font-weight:700;fill:#255694;}
    .note {font-size:26px;fill:#536174;}
  </style>
  <rect width="1120" height="720" rx="22" fill="#f5f7fb"/>
  <text class="heading" x="42" y="57">真人數字錄音：說話者分開，辨識仍很弱</text>
  <text x="42" y="105">共60段；每位0–9各兩段，三位說話者留在各自一側。</text>
  <rect x="42" y="140" width="320" height="235" rx="15" fill="#ffffff"/>
  <rect x="400" y="140" width="320" height="235" rx="15" fill="#ffffff"/>
  <rect x="758" y="140" width="320" height="235" rx="15" fill="#ffffff"/>
  <text class="label" x="202" y="185" text-anchor="middle">訓練</text>
  <text class="label" x="560" y="185" text-anchor="middle">驗證</text>
  <text class="label" x="918" y="185" text-anchor="middle">最後測試</text>
  <text x="202" y="239" text-anchor="middle">jackson · 20段</text>
  <text x="560" y="239" text-anchor="middle">nicolas · 20段</text>
  <text x="918" y="239" text-anchor="middle">theo · 20段</text>
  <text x="202" y="296" text-anchor="middle">用這20段教模型</text>
  <text class="score" x="560" y="296" text-anchor="middle">5/20 · 25%</text>
  <text class="score" x="918" y="296" text-anchor="middle">3/20 · 15%</text>
  <text x="202" y="344" text-anchor="middle">250次更新</text>
  <text x="560" y="344" text-anchor="middle">EOS 20/20</text>
  <text x="918" y="344" text-anchor="middle">EOS 20/20</text>
  <rect x="42" y="409" width="1036" height="157" rx="15" fill="#e4ecf6"/>
  <text class="label" x="69" y="451">先真正重採樣，聲音的時長不變</text>
  <text x="260" y="514" text-anchor="middle">8kHz：4,591點</text>
  <text x="820" y="514" text-anchor="middle">16kHz：9,182點</text>
  <path d="M491 504H622 M608 491L622 504L608 517" fill="none" stroke="#516988" stroke-width="4"/>
  <text class="note" x="42" y="606">兩邊都是0.573875秒；加窗sinc插值，半徑16個原始取樣點。</text>
  <text class="note" x="42" y="648">補點不新增4kHz以上資訊；會以EOS結束，也不等於數字聽對。</text>
  <text class="note" x="42" y="691">自訂說話者留出，不是官方benchmark；數字取自完整實跑報告。</text>
</svg>
