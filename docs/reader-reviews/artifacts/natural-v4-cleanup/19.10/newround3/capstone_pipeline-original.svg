<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 610" role="img" aria-labelledby="title desc">
  <title id="title">同一位小助理接續學習，每站留下可核對的快照</title>
  <desc id="desc">凍結資料家族後，同一語言核心先預訓練，再監督式微調，接圖片與聲音；再從joint分出DPO偏好比較支線。每站保存權重與父檔案指紋並重做同一驗證。本輪依驗證選joint為推薦成品，DPO分支保留退步。PPO是另外的概念支線，學生與量化另有部署比較；箭頭不保證能力提升。</desc>
  <style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:600}.main{font-size:25px}.small{font-size:22px}</style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#496a93"/></marker></defs>
  <rect width="920" height="610" fill="#fff"/>
  <text x="460" y="42" text-anchor="middle" class="title">同一核心接續學，每站留下快照</text>
  <rect x="35" y="70" width="850" height="64" rx="12" fill="#f4f6fa" stroke="#8199be"/>
  <text x="460" y="111" text-anchor="middle" class="main">先凍結資料家族：訓練／驗證／最後檢查</text>
  <rect x="35" y="169" width="390" height="100" rx="12" fill="#e8f1ff" stroke="#8199be"/>
  <text x="230" y="207" text-anchor="middle" class="main">① 預訓練：讀短文字</text>
  <text x="230" y="246" text-anchor="middle" class="small">保存權重 A</text>
  <path d="M429 219H489" fill="none" stroke="#496a93" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="500" y="169" width="385" height="100" rx="12" fill="#e8f1ff" stroke="#8199be"/>
  <text x="692" y="207" text-anchor="middle" class="main">② SFT：練習理想回答</text>
  <text x="692" y="246" text-anchor="middle" class="small">讀 A → 保存 B＋A 的指紋</text>
  <path d="M692 274V307" fill="none" stroke="#496a93" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="500" y="318" width="385" height="100" rx="12" fill="#e0f3e8" stroke="#8199be"/>
  <text x="692" y="356" text-anchor="middle" class="main">③ Joint：文字＋圖＋音</text>
  <text x="692" y="395" text-anchor="middle" class="small">讀 B → 保存 C（本輪推薦）</text>
  <path d="M495 368H434" fill="none" stroke="#496a93" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="35" y="318" width="390" height="100" rx="12" fill="#fff0d8" stroke="#8199be"/>
  <text x="230" y="356" text-anchor="middle" class="main">④ DPO：偏好比較支線</text>
  <text x="230" y="395" text-anchor="middle" class="small">讀 C → 保存 D＋固定參照</text>
  <rect x="35" y="454" width="850" height="73" rx="12" fill="#f4f6fa" stroke="#8199be"/>
  <text x="460" y="485" text-anchor="middle" class="main">每站都重做同一能力檢查，改善與退步一起保留</text>
  <text x="460" y="515" text-anchor="middle" class="small">最終工具程式：驗證請求 → 執行 → 交回同一核心</text>
  <text x="460" y="564" text-anchor="middle" class="small">PPO：另學一條更新方法　　學生／量化：另選部署版本</text>
  <text x="460" y="596" text-anchor="middle" class="small">本輪依驗證選 C；偏好支線的退步也留在教材。</text>
</svg>
