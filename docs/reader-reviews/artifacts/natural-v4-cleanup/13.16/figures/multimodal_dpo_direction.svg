<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">偏好梯度推動哪一個方向？</title><desc id="desc">參考與策略起點一樣，DPO beta0.1得較佳梯度-0.05、較差梯度+0.05。梯度下降提高較佳分數，降低較差分數。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#54768c"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif}svg{background:white}</style><rect width="900" height="400" fill="#fff"/><text x="450" y="34" text-anchor="middle" font-size="24" fill="#18354a">偏好梯度推動哪一個方向？</text><text x="235" y="80" text-anchor="middle" font-size="18" fill="#18354a">固定參考：較佳-4，較差-3，差距-1</text><text x="665" y="80" text-anchor="middle" font-size="18" fill="#18354a">策略起點：較佳-4，較差-3，差距-1</text><text x="450" y="130" text-anchor="middle" font-size="20" fill="#18354a">相對差距 = -1 - (-1) = 0 → 代價約0.6931</text><rect x="45" y="180" width="340" height="60" rx="8" fill="#eef5ff" stroke="#54768c"/><text x="215.0" y="216.0" text-anchor="middle" font-size="19" fill="#18354a">較佳梯度 -0.05</text><rect x="515" y="180" width="340" height="60" rx="8" fill="#eef5ff" stroke="#54768c"/><text x="685.0" y="216.0" text-anchor="middle" font-size="19" fill="#18354a">較差梯度 +0.05</text><path d="M215 240L215 290" fill="none" stroke="#54768c" stroke-width="2" marker-end="url(#arrow)"/><path d="M685 240L685 290" fill="none" stroke="#54768c" stroke-width="2" marker-end="url(#arrow)"/><text x="215" y="321" text-anchor="middle" font-size="19" fill="#18354a">步長0.1：-4 → -3.995</text><text x="685" y="321" text-anchor="middle" font-size="19" fill="#18354a">步長0.1：-3 → -3.005</text><text x="450" y="370" text-anchor="middle" font-size="18" fill="#18354a">策略差距變-0.99，相對固定參考進步0.01。</text></svg>