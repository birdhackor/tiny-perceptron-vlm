<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="title desc">
  <title id="title">PPO正負優勢在不同方向形成平台</title>
  <desc id="desc">裁切界限為ratio0.8與1.2。正優勢加1的目標min(r,clip(r))在1.2以上變平；負優勢負1的目標min(-r,-clip(r))在0.8以下變平。此圖表達代價項平台，不是策略機率的硬限制。</desc>
  <rect width="820" height="470" rx="16" fill="#f8fafc"/>
  <g font-family="Noto Sans CJK TC, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="410" y="38" font-size="24" font-weight="bold">已沿有利方向改夠：這筆舊評語暫停額外鼓勵</text>
    <text x="220" y="85" font-size="21" font-weight="bold">優勢 +1：鼓勵更常選</text>
    <text x="610" y="85" font-size="21" font-weight="bold">優勢 −1：鼓勵少選</text>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <path d="M60 310H380M60 310V105M450 130H770M450 130V335"/>
    <path d="M160 110V315M260 110V315M550 120V340M650 120V340" stroke-dasharray="5 5"/>
  </g>
  <path d="M60 260L360 110" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M60 260L260 160H360" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M450 180L750 330" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M450 230H550L750 330" fill="none" stroke="#c2410c" stroke-width="5"/>
  <g font-family="Noto Sans CJK TC, sans-serif" fill="#0f172a" text-anchor="middle" font-size="18">
    <text x="60" y="338">0.4</text><text x="160" y="338">0.8</text><text x="210" y="338">1</text><text x="260" y="338">1.2</text><text x="360" y="338">1.6</text>
    <text x="450" y="365">0.4</text><text x="550" y="365">0.8</text><text x="600" y="365">1</text><text x="650" y="365">1.2</text><text x="750" y="365">1.6</text>
    <text x="300" y="149" fill="#1d4ed8">超過1.2變平</text>
    <text x="506" y="219" fill="#9a3412">低於0.8變平</text>
    <text x="218" y="116">待提高的值</text>
    <text x="610" y="116">待提高的值</text>
    <text x="380" y="367">ratio</text><text x="763" y="395">ratio</text>
    <text x="410" y="431">實線：PPO目標　　虛線：未裁切的延伸</text>
    <text x="410" y="458">平台表示這項暫停額外鼓勵；新機率沒有被硬鎖在區間內。</text>
  </g>
</svg>
