<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1010" role="img" aria-labelledby="title desc">
  <title id="title">打字與說話，共用同一位聊天助理</title>
  <desc id="desc">打字問題直接加入對話，不經語音辨識。錄音先經獨立的語音辨識模型，得到可能出錯的實際逐字稿，不用正確原話冒充逐字稿。兩條路共用對話歷史，再與實際圖片一起交給同一份圖文底座及可選的本課微調，最終生成文字回答；不包含語音合成。</desc>
  <style>
    text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#172b4d}
    .title{font-size:34px;font-weight:600}
    .main{font-size:34px;font-weight:600}
    .small{font-size:30px}
    .edge{fill:none;stroke:#496a93;stroke-width:4;stroke-linejoin:round}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#496a93"/></marker>
  </defs>
  <rect width="720" height="1010" fill="#fff"/>
  <text x="360" y="44" text-anchor="middle" class="title">打字與說話，共用同一位助理</text>

  <rect x="30" y="76" width="300" height="116" rx="16" fill="#e0f3e8" stroke="#6a9b80" stroke-width="2"/>
  <text x="180" y="120" text-anchor="middle" class="main">打字提問</text>
  <text x="180" y="167" text-anchor="middle" class="small">「招牌寫什麼？」</text>
  <rect x="390" y="76" width="300" height="116" rx="16" fill="#e8f1ff" stroke="#8199be" stroke-width="2"/>
  <text x="540" y="120" text-anchor="middle" class="main">錄音提問</text>
  <text x="540" y="167" text-anchor="middle" class="small">同一句話的聲音</text>

  <path d="M540 199V219" class="edge" marker-end="url(#arrow)"/>
  <rect x="390" y="232" width="300" height="169" rx="16" fill="#e8f1ff" stroke="#8199be" stroke-width="2"/>
  <text x="540" y="279" text-anchor="middle" class="main">語音辨識：聽寫</text>
  <text x="540" y="328" text-anchor="middle" class="small">認出的逐字稿</text>
  <text x="540" y="377" text-anchor="middle" class="small">可能漏字或聽錯</text>

  <path d="M180 199V423H250V445" class="edge" marker-end="url(#arrow)"/>
  <rect x="75" y="258" width="210" height="88" rx="12" fill="#fff"/>
  <text x="180" y="291" text-anchor="middle" class="small">直接加入</text>
  <text x="180" y="334" text-anchor="middle" class="small">不經聽寫</text>
  <path d="M540 408V423H470V445" class="edge" marker-end="url(#arrow)"/>

  <rect x="30" y="458" width="660" height="141" rx="16" fill="#f4f6fa" stroke="#8199be" stroke-width="2"/>
  <text x="360" y="503" text-anchor="middle" class="main">同一份歷史＋目前問題</text>
  <text x="360" y="548" text-anchor="middle" class="small">語音路線用實際辨識結果</text>
  <text x="360" y="587" text-anchor="middle" class="small">不用正確原話冒充逐字稿</text>
  <path d="M495 606V628" class="edge" marker-end="url(#arrow)"/>

  <rect x="30" y="663" width="200" height="115" rx="16" fill="#fff0d8" stroke="#bc8e49" stroke-width="2"/>
  <text x="130" y="710" text-anchor="middle" class="main">實際圖片</text>
  <text x="130" y="754" text-anchor="middle" class="small">圖片像素</text>
  <path d="M237 720H287" class="edge" marker-end="url(#arrow)"/>
  <rect x="300" y="641" width="390" height="169" rx="16" fill="#e0f3e8" stroke="#6a9b80" stroke-width="2"/>
  <text x="495" y="683" text-anchor="middle" class="main">同一圖文底座</text>
  <text x="495" y="723" text-anchor="middle" class="main">可選本課微調</text>
  <text x="495" y="764" text-anchor="middle" class="small">使用問題、歷史</text>
  <text x="495" y="799" text-anchor="middle" class="small">與圖片特徵</text>
  <path d="M495 817V847" class="edge" marker-end="url(#arrow)"/>

  <rect x="300" y="860" width="390" height="88" rx="16" fill="#f4f6fa" stroke="#8199be" stroke-width="2"/>
  <text x="495" y="915" text-anchor="middle" class="main">生成文字回答</text>
  <text x="360" y="993" text-anchor="middle" class="small">此路線不包含語音合成</text>
</svg>
