<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 810" role="img" aria-labelledby="title desc">
<title id="title">提高蒸餾溫度，低機率候選的份量增加</title>
<desc id="desc">三個候選4、3、5的固定分數是4、1、0。各條總和100%。溫度1時份量約93.62%、4.66%、1.71%；溫度2時73.61%、16.43%、9.96%；溫度4時54.34%、25.67%、19.99%。排名不變；百分比標註四捨五入。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#163552;text-anchor:middle}.label{font-size:24px}.percent{font-size:28px;font-weight:600}.note{font-size:23px}</style>
<rect width="600" height="810" rx="12" fill="#f7fafc"/>
<text x="300" y="39" font-size="30">候選不換，改變展示給學生的比例</text>
<text x="300" y="79" class="note">每條總和100%；由左至右是候選4、3、5。</text>
<text x="40" y="120" class="label" style="text-anchor:start">溫度 T = 1</text>
<defs><clipPath id="bar-1"><rect x="40" y="144" width="520" height="43" rx="8"/></clipPath></defs><g clip-path="url(#bar-1)">
<rect x="40.0000" y="144" width="486.8446" height="43" fill="#4f83c7"/>
<rect x="526.8446" y="144" width="24.2386" height="43" fill="#e8a04b"/>
<rect x="551.0831" y="144" width="8.9169" height="43" fill="#58a285"/>
</g>
<rect x="78" y="207" width="14" height="14" rx="3" fill="#4f83c7"/><text x="140" y="222" class="label">候選4</text><text x="130" y="259" class="percent">93.62%</text>
<rect x="248" y="207" width="14" height="14" rx="3" fill="#e8a04b"/><text x="310" y="222" class="label">候選3</text><text x="300" y="259" class="percent">4.66%</text>
<rect x="418" y="207" width="14" height="14" rx="3" fill="#58a285"/><text x="480" y="222" class="label">候選5</text><text x="470" y="259" class="percent">1.71%</text>
<text x="40" y="335" class="label" style="text-anchor:start">溫度 T = 2</text>
<defs><clipPath id="bar-2"><rect x="40" y="359" width="520" height="43" rx="8"/></clipPath></defs><g clip-path="url(#bar-2)">
<rect x="40.0000" y="359" width="382.7849" height="43" fill="#4f83c7"/>
<rect x="422.7849" y="359" width="85.4108" height="43" fill="#e8a04b"/>
<rect x="508.1957" y="359" width="51.8043" height="43" fill="#58a285"/>
</g>
<rect x="78" y="422" width="14" height="14" rx="3" fill="#4f83c7"/><text x="140" y="437" class="label">候選4</text><text x="130" y="474" class="percent">73.61%</text>
<rect x="248" y="422" width="14" height="14" rx="3" fill="#e8a04b"/><text x="310" y="437" class="label">候選3</text><text x="300" y="474" class="percent">16.43%</text>
<rect x="418" y="422" width="14" height="14" rx="3" fill="#58a285"/><text x="480" y="437" class="label">候選5</text><text x="470" y="474" class="percent">9.96%</text>
<text x="40" y="550" class="label" style="text-anchor:start">溫度 T = 4</text>
<defs><clipPath id="bar-4"><rect x="40" y="574" width="520" height="43" rx="8"/></clipPath></defs><g clip-path="url(#bar-4)">
<rect x="40.0000" y="574" width="282.5709" height="43" fill="#4f83c7"/>
<rect x="322.5709" y="574" width="133.4771" height="43" fill="#e8a04b"/>
<rect x="456.0480" y="574" width="103.9520" height="43" fill="#58a285"/>
</g>
<rect x="78" y="637" width="14" height="14" rx="3" fill="#4f83c7"/><text x="140" y="652" class="label">候選4</text><text x="130" y="689" class="percent">54.34%</text>
<rect x="248" y="637" width="14" height="14" rx="3" fill="#e8a04b"/><text x="310" y="652" class="label">候選3</text><text x="300" y="689" class="percent">25.67%</text>
<rect x="418" y="637" width="14" height="14" rx="3" fill="#58a285"/><text x="480" y="652" class="label">候選5</text><text x="470" y="689" class="percent">19.99%</text>
<text x="300" y="754" class="label">第一名仍是候選4，次要選項更清楚。</text>
<text x="300" y="793" class="note">比例標註四捨五入到小數點後兩位。</text></svg>
