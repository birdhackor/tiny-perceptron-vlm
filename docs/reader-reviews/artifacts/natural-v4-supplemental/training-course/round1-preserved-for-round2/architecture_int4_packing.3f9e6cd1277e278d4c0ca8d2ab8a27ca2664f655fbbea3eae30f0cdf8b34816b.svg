<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" role="img" aria-labelledby="title desc">
<title id="title">兩個四位元碼裝進同一byte</title>
<desc id="desc">由上而下看兩組例子。每個signed值先加8；綠色的第一碼放低四位，橘色的第二碼放高四位。-8與-1得到01110000，即112；0與1得到10011000，即152。交叉箭頭表示高低位的排列，沒有交換原數字的順序。</desc>
<style>
text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#172b4d;text-anchor:middle}
.low{fill:#d7f5e6;stroke:#26875b;stroke-width:2}
.high{fill:#ffe8ce;stroke:#c38a47;stroke-width:2}
.first{fill:none;stroke:#26875b;stroke-width:3;stroke-dasharray:7 5}
.second{fill:none;stroke:#c38a47;stroke-width:3}
</style>
<defs>
<marker id="low-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#26875b"/></marker>
<marker id="high-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#c38a47"/></marker>
</defs>
<rect width="600" height="850" fill="white"/>
<text x="300" y="38" font-size="30">兩個四位元碼 → 一個byte</text>
<text x="300" y="77" font-size="25">本教材約定：儲存碼 = 原數字 + 8</text>

<g>
<rect x="24" y="98" width="552" height="304" rx="14" fill="#f7f9fc"/>
<text x="300" y="134" font-size="28">原順序：−8，−1</text>
<text x="300" y="174" font-size="26">各加8 → 0，7</text>
<text x="170" y="210" font-size="24">第1碼</text><text x="430" y="210" font-size="24">第2碼</text>
<rect class="low" x="90" y="221" width="160" height="48" rx="7"/>
<rect class="high" x="350" y="221" width="160" height="48" rx="7"/>
<text x="170" y="255" font-size="33">0000</text><text x="430" y="255" font-size="33">0111</text>
<path class="first" d="M170 270L385 309" marker-end="url(#low-arrow)"/>
<path class="second" d="M430 270L215 309" marker-end="url(#high-arrow)"/>
<rect class="high" x="130" y="316" width="170" height="72"/>
<rect class="low" x="300" y="316" width="170" height="72"/>
<text x="215" y="349" font-size="33">0111</text><text x="385" y="349" font-size="33">0000</text>
<text x="215" y="377" font-size="23">高四位</text><text x="385" y="377" font-size="23">低四位</text>
</g>
<text x="300" y="439" font-size="29">0111 0000 → 十進位112</text>

<g transform="translate(0 355)">
<rect x="24" y="98" width="552" height="304" rx="14" fill="#f7f9fc"/>
<text x="300" y="134" font-size="28">原順序：0，1</text>
<text x="300" y="174" font-size="26">各加8 → 8，9</text>
<text x="170" y="210" font-size="24">第1碼</text><text x="430" y="210" font-size="24">第2碼</text>
<rect class="low" x="90" y="221" width="160" height="48" rx="7"/>
<rect class="high" x="350" y="221" width="160" height="48" rx="7"/>
<text x="170" y="255" font-size="33">1000</text><text x="430" y="255" font-size="33">1001</text>
<path class="first" d="M170 270L385 309" marker-end="url(#low-arrow)"/>
<path class="second" d="M430 270L215 309" marker-end="url(#high-arrow)"/>
<rect class="high" x="130" y="316" width="170" height="72"/>
<rect class="low" x="300" y="316" width="170" height="72"/>
<text x="215" y="349" font-size="33">1001</text><text x="385" y="349" font-size="33">1000</text>
<text x="215" y="377" font-size="23">高四位</text><text x="385" y="377" font-size="23">低四位</text>
</g>
<text x="300" y="794" font-size="29">1001 1000 → 十進位152</text>
<text x="300" y="831" font-size="24">第一碼在右邊的低位；第二碼在左邊的高位</text>
</svg>
