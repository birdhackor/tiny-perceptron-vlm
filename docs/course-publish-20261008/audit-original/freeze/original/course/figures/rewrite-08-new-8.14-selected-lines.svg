<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
  <title id="title">完整告示中選取第1、3列中文</title>
  <desc id="desc">四行告示全部可讀。第1列今日休館和第3列明日開放用綠框表示選中，兩行英文留在灰框。選中的兩列沿箭頭成為一行一項的中文回答。</desc>
  <defs>
    <style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#172b3a;font-size:28px}.heading{font-size:32px;font-weight:700}.selected{fill:#e3f5e8;stroke:#29814a;stroke-width:3}.other{fill:#f3f5f7;stroke:#8a98a4;stroke-width:2}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#29814a"/></marker>
  </defs>
  <rect width="640" height="760" fill="#fff"/>
  <text x="28" y="48" class="heading">看完整材料，按要求選取</text>
  <rect x="28" y="98" width="532" height="60" rx="9" class="selected"/>
  <rect x="28" y="176" width="532" height="60" rx="9" class="other"/>
  <rect x="28" y="254" width="532" height="60" rx="9" class="selected"/>
  <rect x="28" y="332" width="532" height="60" rx="9" class="other"/>
  <text x="48" y="139">第1列｜今日休館</text>
  <text x="48" y="217">第2列｜Closed today</text>
  <text x="48" y="295">第3列｜明日開放</text>
  <text x="48" y="373">第4列｜Open tomorrow</text>
  <path d="M560 128 H604 V586 H564" fill="none" stroke="#29814a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M560 284 H604" fill="none" stroke="#29814a" stroke-width="3"/>
  <rect x="28" y="418" width="532" height="62" rx="9" fill="#fff5d9" stroke="#ad8325" stroke-width="2"/>
  <text x="48" y="459">要求：只抄中文，一行一項</text>
  <rect x="28" y="522" width="532" height="154" rx="9" class="selected"/>
  <text x="48" y="574" class="heading">今日休館</text>
  <text x="48" y="631" class="heading">明日開放</text>
  <text x="28" y="728">範圍同時包括兩行，也排除英文。</text>
</svg>
