<svg xmlns="http://www.w3.org/2000/svg" width="640" height="763" viewBox="0 0 640 763" role="img" aria-labelledby="title desc">
<title id="title">YaRN的分頻縮放與注意力尺度</title>
<desc id="desc">上半部是較快組保留原轉速、中間組逐步過渡、較慢組按延長倍數減速。下半部將比對分數乘上尺度係數後交給softmax，轉為注意力權重。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="640" height="763" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, Noto Sans CJK, sans-serif">
<text x="24" y="43" font-size="30" fill="#172b42" text-anchor="start" font-weight="700">YaRN 的兩個改動</text>
<text x="24" y="93" font-size="30" fill="#172b42" text-anchor="start" font-weight="700">1　旋轉頻段 → 新轉速</text>
<rect x="24" y="118" width="592" height="62" rx="10" fill="#edf5fb" stroke="#246a9e" stroke-width="2"/>
<text x="44" y="159" font-size="28" fill="#246a9e" text-anchor="start" font-weight="400">較快的組</text>
<line x1="220" y1="149" x2="282" y2="149" stroke="#246a9e" stroke-width="3" marker-end="url(#arrow)"/>
<text x="312" y="159" font-size="28" fill="#246a9e" text-anchor="start" font-weight="400">保留原轉速</text>
<rect x="24" y="197" width="592" height="62" rx="10" fill="#f3eef9" stroke="#71519b" stroke-width="2"/>
<text x="44" y="238" font-size="28" fill="#71519b" text-anchor="start" font-weight="400">中間的組</text>
<line x1="220" y1="228" x2="282" y2="228" stroke="#71519b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="312" y="238" font-size="28" fill="#71519b" text-anchor="start" font-weight="400">逐步過渡</text>
<rect x="24" y="276" width="592" height="62" rx="10" fill="#fff0e6" stroke="#b85119" stroke-width="2"/>
<text x="44" y="317" font-size="28" fill="#b85119" text-anchor="start" font-weight="400">較慢的組</text>
<line x1="220" y1="307" x2="282" y2="307" stroke="#b85119" stroke-width="3" marker-end="url(#arrow)"/>
<text x="312" y="317" font-size="28" fill="#b85119" text-anchor="start" font-weight="400">按延長倍數減速</text>
<text x="24" y="397" font-size="30" fill="#172b42" text-anchor="start" font-weight="700">2　調分數尺度 → 注意力權重</text>
<rect x="80" y="423" width="480" height="65" rx="10" fill="#f5f7fa" stroke="#c3cfda" stroke-width="2"/>
<text x="320" y="465" font-size="28" fill="#172b42" text-anchor="middle" font-weight="400">各候選位置的比對分數</text>
<line x1="320" y1="494" x2="320" y2="520" stroke="#172b42" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="80" y="533" width="480" height="65" rx="10" fill="#edf5fb" stroke="#246a9e" stroke-width="2"/>
<text x="320" y="575" font-size="28" fill="#172b42" text-anchor="middle" font-weight="400">乘上正的尺度係數</text>
<line x1="320" y1="605" x2="320" y2="631" stroke="#172b42" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="80" y="644" width="480" height="91" rx="10" fill="#f5f7fa" stroke="#c3cfda" stroke-width="2"/>
<text x="320" y="680" font-size="30" fill="#172b42" text-anchor="middle" font-weight="700">softmax</text>
<text x="320" y="717" font-size="28" fill="#172b42" text-anchor="middle" font-weight="400">轉成總和為 1 的權重</text>
</g>
</svg>
