<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">按來源列號加回，不照完成順序排</title><desc id="desc">三份完成貢獻依序來自列2、列0、列2，收回後列0是2,2，列1是0,0，列2是1,1加3,3等於4,4。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#496276"/></marker><marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#245ba8"/></marker><marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#107b6e"/></marker><marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ac5016"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172e45;font-size:30px} .small{font-size:28px} .title{font-size:32px;font-weight:700} .number{font-variant-numeric:tabular-nums}</style><rect width="640" height="660" fill="#fff"/>
<text x="320" y="48" text-anchor="middle" class="title" style="fill:#172e45;">按來源列號加回，不照完成順序排</text>
<text x="166" y="107" text-anchor="middle" class="small" style="fill:#172e45;">完成順序</text>
<text x="487" y="107" text-anchor="middle" class="small" style="fill:#172e45;">原token順序</text>
<rect x="28" y="150" width="278" height="115" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="167" y="189" text-anchor="middle" class="" style="fill:#172e45;">① 來源列2</text>
<text x="167" y="236" text-anchor="middle" class="" style="fill:#172e45;font-size:34px;">[1, 1]</text>
<rect x="28" y="318" width="278" height="115" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="167" y="357" text-anchor="middle" class="" style="fill:#172e45;">② 來源列0</text>
<text x="167" y="404" text-anchor="middle" class="" style="fill:#172e45;font-size:34px;">[2, 2]</text>
<rect x="28" y="486" width="278" height="115" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="167" y="525" text-anchor="middle" class="" style="fill:#172e45;">③ 來源列2</text>
<text x="167" y="572" text-anchor="middle" class="" style="fill:#172e45;font-size:34px;">[3, 3]</text>
<rect x="372" y="150" width="240" height="115" rx="14" fill="#eef7f5" stroke="#cad8e4" stroke-width="2"/>
<text x="492" y="189" text-anchor="middle" class="" style="fill:#172e45;">列0</text>
<text x="492" y="236" text-anchor="middle" class="" style="fill:#107b6e;font-size:34px;">[2, 2]</text>
<rect x="372" y="318" width="240" height="115" rx="14" fill="#eef7f5" stroke="#cad8e4" stroke-width="2"/>
<text x="492" y="357" text-anchor="middle" class="" style="fill:#172e45;">列1</text>
<text x="492" y="404" text-anchor="middle" class="" style="fill:#107b6e;font-size:34px;">[0, 0]</text>
<rect x="372" y="486" width="240" height="115" rx="14" fill="#eef7f5" stroke="#cad8e4" stroke-width="2"/>
<text x="492" y="525" text-anchor="middle" class="" style="fill:#172e45;">列2</text>
<text x="492" y="572" text-anchor="middle" class="" style="fill:#107b6e;font-size:34px;">[4, 4]</text>
<path d="M306 208 C341 208 342 524 372 524" fill="none" stroke="#245ba8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M306 376 C326 376 351 208 372 208" fill="none" stroke="#ac5016" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="306" y1="559" x2="365" y2="559" stroke="#107b6e" stroke-width="3" marker-end="url(#arrow-teal)"/>
<text x="320" y="642" text-anchor="middle" class="small" style="fill:#172e45;">列2：[1,1] + [3,3] = [4,4]</text>
</svg>
