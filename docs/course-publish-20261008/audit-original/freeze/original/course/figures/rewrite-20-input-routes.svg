<svg xmlns="http://www.w3.org/2000/svg" width="640" height="669" viewBox="0 0 640 669" role="img" aria-labelledby="title desc"><title id="title">成熟模型入口的分工</title><desc id="desc">延伸：沿用上游Qwen與Whisper。各入口會合到同一個核心。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#14724d"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#17324d}</style><rect width="640" height="669" rx="18" fill="white"/><text x="28" y="48" font-size="32" font-weight="700" text-anchor="start">成熟模型入口的分工</text><text x="28" y="87" font-size="28" font-weight="400" text-anchor="start">延伸：沿用上游Qwen與Whisper</text><rect x="32" y="108" width="516" height="86" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="56" y="150" font-size="32" font-weight="700" text-anchor="start">打字→這輪文字</text><text x="56" y="188" font-size="28" font-weight="400" text-anchor="start">保留此前對話條件</text><path d="M548 151 H598" fill="none" stroke="#14724d" stroke-width="3"/><rect x="32" y="228" width="516" height="86" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="56" y="270" font-size="32" font-weight="700" text-anchor="start">錄音→Whisper→逐字稿</text><text x="56" y="308" font-size="28" font-weight="400" text-anchor="start">顯示原稿，送出前可更正</text><path d="M548 271 H598" fill="none" stroke="#14724d" stroke-width="3"/><rect x="32" y="348" width="516" height="86" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="56" y="390" font-size="32" font-weight="700" text-anchor="start">照片→配套圖片處理器</text><text x="56" y="428" font-size="28" font-weight="400" text-anchor="start">保留本段照片供追問</text><path d="M548 391 H598" fill="none" stroke="#14724d" stroke-width="3"/><path d="M598 151 V476 H320 V500" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="516" width="576" height="94" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="56" y="558" font-size="32" font-weight="700" text-anchor="start">Qwen圖文核心（無LoRA）</text><text x="56" y="596" font-size="28" font-weight="400" text-anchor="start">同一歷史、照片與這輪問題</text><text x="28" y="645" font-size="28" font-weight="400" text-anchor="start">ASR輸出逐字稿，Qwen才生成回答</text></svg>
