<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc"><title id="title">偏好訓練：同一起點分成兩路</title><desc id="desc">同一示範起點，一路先訓練評分員再收集選擇並以PPO更新policy和critic；另一路直接用偏好對與固定參考做DPO。兩路最終使用同一任務題評價，不是PPO後接DPO。</desc><defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#173047}.title{font-size:32px;font-weight:700}.bold{font-weight:700}.small{font-size:28px}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6e8b"/></marker></defs><rect width="640" height="860" fill="#ffffff"/><text x="32" y="48" class="title">偏好訓練：同一起點分成兩路</text><rect x="32" y="82" width="576" height="116" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="124" class="bold">同一份示範訓練起點</text><text x="50" y="164" class="">複製為兩路policy與固定reference</text><path d="M190 198 L168 249" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 198 L471 249" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="265" width="270" height="322" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="307" class="bold">PPO路線</text><text x="50" y="347" class="">偏好 → 評分員</text><text x="50" y="387" class="">policy 選卡</text><text x="50" y="427" class="">得分與估計</text><text x="50" y="467" class="">ratio 與裁切</text><text x="50" y="507" class="">更新policy／critic</text><rect x="338" y="265" width="270" height="322" rx="12" fill="#e8f6ef" stroke="#579478" stroke-width="2"/><text x="356" y="307" class="bold">DPO路線</text><text x="356" y="347" class="">直接讀偏好對</text><text x="356" y="387" class="">較佳／較差機率</text><text x="356" y="427" class="">扣固定參考差距</text><text x="356" y="467" class="">DPO代價</text><text x="356" y="507" class="">更新policy</text><path d="M167 587 L167 675" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 587 L470 675" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="675" width="576" height="136" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="717" class="bold">同一批任務檢查</text><text x="50" y="757" class="">內容、完整要求、原能力與成本</text><text x="50" y="797" class="">兩路各自判斷，不要求串接</text></svg>