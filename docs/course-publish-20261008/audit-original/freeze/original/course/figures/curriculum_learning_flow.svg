<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1900" role="img" aria-labelledby="title desc">
<title id="title">從一筆文字練習，到一次更新</title>
<desc id="desc">先把原始樣本排好角色與文字，轉成識別編號，取得輸入X和下一步答案Y。模型以X及可讀前文的遮罩算預測；Y和指定計分的位置決定代價。可以讀哪些前文、哪些答案要計分，是兩個不同的問題。一次不累積舊梯度的更新先清除舊梯度，再依代價算梯度，最後調整權重。刻意累積梯度時另訂清零時機。</desc>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;fill:#172b4d;text-anchor:middle;font-size:32px}.title{font-size:36px;font-weight:700}.label{font-size:34px;font-weight:700;text-anchor:start}.api{font-size:30px}.note{font-size:30px;text-anchor:start}.box{stroke:#54799f;stroke-width:2}.flow{fill:none;stroke:#466b97;stroke-width:3;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#466b97"/></marker></defs>
<rect width="640" height="1900" rx="12" fill="#fff"/>
<text class="title" x="320" y="50">從一筆文字練習，</text>
<text class="title" x="320" y="96">到一次更新</text>

<rect x="16" y="145" width="608" height="500" rx="14" fill="#f3f7fc"/>
<text class="label" x="32" y="190">① 準備輸入與答案</text>
<rect class="box" x="40" y="205" width="560" height="86" rx="10" fill="#e8f1ff"/>
<text x="320" y="259">原始樣本</text>
<path class="flow" d="M320 291 V322"/>
<rect class="box" x="40" y="334" width="560" height="120" rx="10" fill="#e8f1ff"/>
<text x="320" y="381">排好角色與文字</text>
<text x="320" y="425">轉成識別編號</text>
<path class="flow" d="M320 454 V485"/>
<rect class="box" x="40" y="498" width="560" height="120" rx="10" fill="#e8f1ff"/>
<text x="320" y="545">輸入 X</text>
<text x="320" y="589">下一步答案 Y</text>
<path class="flow" d="M320 645 V676"/>

<rect x="16" y="689" width="608" height="525" rx="14" fill="#f1f9f4"/>
<text class="label" x="32" y="735">② 算預測，再對照答案</text>
<rect class="box" x="40" y="763" width="560" height="138" rx="10" fill="#e1f1e7"/>
<text x="320" y="808">X 與可讀前文的遮罩</text>
<text x="320" y="850">模型算出各位置的預測</text>
<text class="api" x="320" y="886">forward</text>
<path class="flow" d="M320 901 V932"/>
<rect class="box" x="40" y="944" width="560" height="142" rx="10" fill="#e1f1e7"/>
<text x="320" y="990">Y 與指定計分的位置</text>
<text x="320" y="1032">對照下一步答案</text>
<text x="320" y="1075">只算指定位置的代價</text>
<text x="320" y="1135">可讀哪些前文、哪些答案要計分，</text>
<text x="320" y="1177">是兩個不同的問題。</text>
<path class="flow" d="M320 1214 V1245"/>

<rect x="16" y="1258" width="608" height="516" rx="14" fill="#fff7eb"/>
<text class="label" x="32" y="1304">③ 做一次權重更新</text>
<text class="note" x="32" y="1348">這次不累積舊梯度</text>
<rect class="box" x="40" y="1377" width="560" height="96" rx="10" fill="#ffedcf"/>
<text x="320" y="1418">清除舊梯度</text>
<text class="api" x="320" y="1455">zero_grad</text>
<path class="flow" d="M320 1473 V1504"/>
<rect class="box" x="40" y="1516" width="560" height="96" rx="10" fill="#ffedcf"/>
<text x="320" y="1557">依代價算出梯度</text>
<text class="api" x="320" y="1594">backward</text>
<path class="flow" d="M320 1612 V1643"/>
<rect class="box" x="40" y="1655" width="560" height="96" rx="10" fill="#ffedcf"/>
<text x="320" y="1696">調整權重</text>
<text class="api" x="320" y="1733">optimizer.step</text>

<text class="note" x="24" y="1828">每個小節只拆開其中一個步驟；</text>
<text class="note" x="24" y="1870">刻意累積梯度時，另訂清零時機。</text>
</svg>
