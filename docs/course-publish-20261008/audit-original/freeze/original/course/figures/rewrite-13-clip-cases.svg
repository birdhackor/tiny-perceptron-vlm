<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc"><title id="title">手算：PPO在哪一側停止鼓勵？</title><desc id="desc">裁切區間0.8至1.2。正優勢1的目標在ratio高於1.2變平；負優勢負1的目標在ratio低於0.8變平。沿反方向改變仍降低待提高目標。這不是硬限制所有概率。</desc><defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#173047}.title{font-size:32px;font-weight:700}.bold{font-weight:700}.small{font-size:28px}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6e8b"/></marker></defs><rect width="640" height="850" fill="#ffffff"/><text x="32" y="48" class="title">手算：PPO在哪一側停止鼓勵？</text><rect x="32" y="86" width="576" height="280" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="128" class="bold">正優勢 +1：應提高機率</text><text x="50" y="168" class="">ratio　0.7　　 1.0　　 1.3</text><text x="50" y="208" class="">目標　 0.7　　 1.0　　 1.2</text><text x="50" y="248" class="">梯度　 −1　　  −1　　  0</text><text x="50" y="288" class="">超過 1.2，這項不再往上推</text><rect x="32" y="395" width="576" height="280" rx="12" fill="#fff0e8" stroke="#c48b5b" stroke-width="2"/><text x="50" y="437" class="bold">負優勢 −1：應降低機率</text><text x="50" y="477" class="">ratio　0.7　　 1.0　　 1.3</text><text x="50" y="517" class="">目標　−0.8　　−1.0　　−1.3</text><text x="50" y="557" class="">梯度　 0　　　 1　　　 1</text><text x="50" y="597" class="">低於 0.8，這項不再往下推</text><rect x="32" y="714" width="576" height="100" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="756" class="bold">梯度指「下降代價對ratio」</text><text x="50" y="796" class="">共享參數仍可能改變其他機率</text></svg>