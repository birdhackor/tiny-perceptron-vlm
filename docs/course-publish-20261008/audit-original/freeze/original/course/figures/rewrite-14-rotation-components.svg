<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 850" role="img" aria-labelledby="title desc"><title id="title">旋轉後，水平與垂直各是多少？</title><desc id="desc">同樣長度一的箭頭，45度水平與垂直都是正0.7071；135度的水平改為負0.7071，垂直仍為正。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#496276"/></marker><marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#245ba8"/></marker><marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#107b6e"/></marker><marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ac5016"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172e45;font-size:30px} .small{font-size:28px} .title{font-size:32px;font-weight:700} .number{font-variant-numeric:tabular-nums}</style><rect width="640" height="850" fill="#fff"/>
<text x="320" y="48" text-anchor="middle" class="title" style="fill:#172e45;">旋轉後，水平與垂直各是多少？</text>
<rect x="30" y="90" width="580" height="346" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="134" text-anchor="middle" class="" style="fill:#172e45;">45°｜長度1</text>
<circle cx="320" cy="275" r="93" fill="none" stroke="#c3d1de" stroke-width="2"/>
<line x1="204" y1="275" x2="436" y2="275" stroke="#496276" stroke-width="2"/>
<line x1="320" y1="378" x2="320" y2="171" stroke="#496276" stroke-width="2"/>
<text x="452" y="284" text-anchor="middle" class="small" style="fill:#172e45;">右</text>
<text x="328" y="159" text-anchor="middle" class="small" style="fill:#172e45;">上</text>
<line x1="320" y1="275" x2="385.76093065034894" y2="209.2390693496511" stroke="#245ba8" stroke-width="5" marker-end="url(#arrow-blue)"/>
<line x1="320" y1="275" x2="385.76093065034894" y2="275" stroke="#ac5016" stroke-width="5" marker-end="url(#arrow-orange)"/>
<line x1="385.76093065034894" y1="275" x2="385.76093065034894" y2="209.2390693496511" stroke="#107b6e" stroke-width="5" marker-end="url(#arrow-teal)"/>
<circle cx="385.76093065034894" cy="209.2390693496511" r="5" fill="#245ba8" stroke="#245ba8" stroke-width="2"/>
<text x="320" y="380" text-anchor="middle" class="" style="fill:#ac5016;">cos = +0.7071</text>
<text x="320" y="418" text-anchor="middle" class="" style="fill:#107b6e;">sin = +0.7071</text>
<rect x="30" y="475" width="580" height="346" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="519" text-anchor="middle" class="" style="fill:#172e45;">135°｜長度1</text>
<circle cx="320" cy="660" r="93" fill="none" stroke="#c3d1de" stroke-width="2"/>
<line x1="204" y1="660" x2="436" y2="660" stroke="#496276" stroke-width="2"/>
<line x1="320" y1="763" x2="320" y2="556" stroke="#496276" stroke-width="2"/>
<text x="452" y="669" text-anchor="middle" class="small" style="fill:#172e45;">右</text>
<text x="328" y="544" text-anchor="middle" class="small" style="fill:#172e45;">上</text>
<line x1="320" y1="660" x2="254.2390693496511" y2="594.2390693496511" stroke="#245ba8" stroke-width="5" marker-end="url(#arrow-blue)"/>
<line x1="320" y1="660" x2="254.2390693496511" y2="660" stroke="#ac5016" stroke-width="5" marker-end="url(#arrow-orange)"/>
<line x1="254.2390693496511" y1="660" x2="254.2390693496511" y2="594.2390693496511" stroke="#107b6e" stroke-width="5" marker-end="url(#arrow-teal)"/>
<circle cx="254.2390693496511" cy="594.2390693496511" r="5" fill="#245ba8" stroke="#245ba8" stroke-width="2"/>
<text x="320" y="765" text-anchor="middle" class="" style="fill:#ac5016;">cos = −0.7071</text>
<text x="320" y="803" text-anchor="middle" class="" style="fill:#107b6e;">sin = +0.7071</text>
</svg>
