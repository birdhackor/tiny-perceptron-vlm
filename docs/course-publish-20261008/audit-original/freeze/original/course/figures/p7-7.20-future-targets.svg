<svg xmlns="http://www.w3.org/2000/svg" width="560" height="650" viewBox="0 0 560 650" role="img" aria-labelledby="title desc">
  <title id="title">同一份已讀特徵，兩份未來目標</title>
  <desc id="desc">共同核心只讀開始標記和雨，特徵分別送往下一項及隔兩格分支。第一條的標準答案是停，第二條是了，兩答案都不輸入核心。</desc>
  <defs>
    <style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#172b3a;font-size:27px}.heading{font-size:31px;font-weight:700}.box{fill:#e8f1fc;stroke:#3c70a4;stroke-width:2}.goal{fill:#e3f5e8;stroke:#29814a;stroke-width:2}.arrow{fill:none;stroke:#3c70a4;stroke-width:3;marker-end:url(#tip)}</style>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3c70a4"/></marker>
  </defs>
  <rect width="560" height="650" fill="#fff"/>
  <text x="24" y="48" class="heading">從「雨」準備兩步未來</text>
  <rect x="65" y="80" width="430" height="68" rx="12" class="box"/>
  <text x="280" y="123" text-anchor="middle">已讀前文：〈B〉／雨</text>
  <path d="M280 150V186" class="arrow"/>
  <rect x="65" y="190" width="430" height="85" rx="12" class="box"/>
  <text x="280" y="224" text-anchor="middle">共同核心的特徵</text>
  <text x="280" y="259" text-anchor="middle">未讀到「停」與「了」</text>
  <path d="M280 277V313H150V347" class="arrow"/>
  <path d="M280 313H410V347" class="arrow"/>
  <rect x="30" y="355" width="240" height="82" rx="12" class="box"/>
  <rect x="290" y="355" width="240" height="82" rx="12" class="box"/>
  <text x="150" y="389" text-anchor="middle">下一項分支</text>
  <text x="150" y="423" text-anchor="middle">預測隔1格</text>
  <text x="410" y="389" text-anchor="middle">較遠項分支</text>
  <text x="410" y="423" text-anchor="middle">預測隔2格</text>
  <path d="M150 439V480" class="arrow"/>
  <path d="M410 439V480" class="arrow"/>
  <rect x="30" y="488" width="240" height="68" rx="12" class="goal"/>
  <rect x="290" y="488" width="240" height="68" rx="12" class="goal"/>
  <text x="150" y="531" text-anchor="middle">標準答案：停</text>
  <text x="410" y="531" text-anchor="middle">標準答案：了</text>
  <text x="280" y="601" text-anchor="middle">兩份答案用來核對，不輸入核心。</text>
</svg>
