<svg xmlns="http://www.w3.org/2000/svg" width="640" height="775" viewBox="0 0 640 775" role="img" aria-labelledby="title desc"><title id="title">編碼示意：兩個4-bit碼放一byte</title><desc id="desc">有號值負8與負1加8映成0與7。第一碼0放低四位0000，第二碼7放高四位0111，byte爲01110000，十進制112。拆回先低碼再高碼，各減8，得到原順序負8、負1。</desc><defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#173047}.title{font-size:32px;font-weight:700}.bold{font-weight:700}.small{font-size:28px}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6e8b"/></marker></defs><rect width="640" height="775" fill="#ffffff"/><text x="32" y="48" class="title">編碼示意：兩個4-bit碼放一byte</text><rect x="32" y="85" width="576" height="120" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="127" class="bold">原順序：第一值 −8，第二值 −1</text><text x="50" y="167" class="">各加8 → 第一碼 0，第二碼 7</text><path d="M320 205 L320 250" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="270" width="270" height="130" rx="12" fill="#fff0e8" stroke="#c48b5b" stroke-width="2"/><text x="50" y="312" class="bold">高四位：第二碼</text><text x="50" y="352" class="">7 → 0111</text><rect x="338" y="270" width="270" height="130" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="356" y="312" class="bold">低四位：第一碼</text><text x="356" y="352" class="">0 → 0000</text><path d="M167 400 L167 440" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 400 L470 440" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="440" width="576" height="120" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="482" class="bold">合併byte：0111 0000</text><text x="50" y="522" class="">十進位：7 × 16 + 0 = 112</text><path d="M320 560 L320 605" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="630" width="576" height="112" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="672" class="bold">拆回：先低碼0，再高碼7</text><text x="50" y="712" class="">各減8 → 第一值−8，第二值−1</text></svg>