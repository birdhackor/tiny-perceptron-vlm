<svg xmlns="http://www.w3.org/2000/svg" width="640" height="920" viewBox="0 0 640 920" role="img" aria-labelledby="title desc">
  <title id="title">12格前文、最多4格新回答，共用16格容量</title>
  <desc id="desc">序列分成兩排，每排8格。第1至12格是前文，第13至15格填入小小、書店、EOS，第16格未使用。下方列出每個玩具token符號的完整意義。</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans CJK TC",sans-serif;fill:#172b3a;font-size:28px}
      .heading{font-size:32px;font-weight:700}.symbol{font-size:34px;font-weight:700;text-anchor:middle}.position{font-size:25px;text-anchor:middle}.input{fill:#e8f1fc;stroke:#3c70a4;stroke-width:2}.output{fill:#e3f5e8;stroke:#29814a;stroke-width:3}
    </style>
  </defs>
  <rect width="640" height="920" fill="#fff"/>
  <text x="28" y="48" class="heading">前文與新回答共用16格</text>
  <text x="28" y="91" fill="#315f8d">藍色：已送入的前文12格</text>
  <text x="28" y="133" fill="#247344">綠色：這次新增的回答3格</text>

  <g class="position">
    <text x="54" y="177">1</text><text x="130" y="177">2</text><text x="206" y="177">3</text><text x="282" y="177">4</text>
    <text x="358" y="177">5</text><text x="434" y="177">6</text><text x="510" y="177">7</text><text x="586" y="177">8</text>
    <text x="54" y="313">9</text><text x="130" y="313">10</text><text x="206" y="313">11</text><text x="282" y="313">12</text>
    <text x="358" y="313">13</text><text x="434" y="313">14</text><text x="510" y="313">15</text><text x="586" y="313">16</text>
  </g>
  <g class="input">
    <rect x="20" y="193" width="68" height="70" rx="8"/><rect x="96" y="193" width="68" height="70" rx="8"/>
    <rect x="172" y="193" width="68" height="70" rx="8"/><rect x="248" y="193" width="68" height="70" rx="8"/>
    <rect x="324" y="193" width="68" height="70" rx="8"/><rect x="400" y="193" width="68" height="70" rx="8"/>
    <rect x="476" y="193" width="68" height="70" rx="8"/><rect x="552" y="193" width="68" height="70" rx="8"/>
    <rect x="20" y="329" width="68" height="70" rx="8"/><rect x="96" y="329" width="68" height="70" rx="8"/>
    <rect x="172" y="329" width="68" height="70" rx="8"/><rect x="248" y="329" width="68" height="70" rx="8"/>
  </g>
  <g class="output">
    <rect x="324" y="329" width="68" height="70" rx="8"/><rect x="400" y="329" width="68" height="70" rx="8"/>
    <rect x="476" y="329" width="68" height="70" rx="8"/>
  </g>
  <rect x="552" y="329" width="68" height="70" rx="8" fill="#fff" stroke="#657582" stroke-width="2" stroke-dasharray="7 5"/>
  <g class="symbol">
    <text x="54" y="241">U</text><text x="130" y="241">a</text><text x="206" y="241">E</text><text x="282" y="241">A</text>
    <text x="358" y="241">b</text><text x="434" y="241">E</text><text x="510" y="241">U</text><text x="586" y="241">c</text>
    <text x="54" y="377">d</text><text x="130" y="377">e</text><text x="206" y="377">E</text><text x="282" y="377">A</text>
    <text x="358" y="377">f</text><text x="434" y="377">g</text><text x="510" y="377">E</text>
  </g>
  <text x="586" y="372" text-anchor="middle" font-size="26">未用</text>
  <text x="28" y="452">預留G＝4，不必寫滿4格。</text>
  <text x="28" y="497">前文P＝12；總容量C＝16。</text>
  <line x1="28" y1="526" x2="612" y2="526" stroke="#c7d0d8" stroke-width="2"/>
  <text x="28" y="571" class="heading">本圖的玩具token字表</text>
  <text x="28" y="615">U＝user　A＝assistant　E＝EOS</text>
  <text x="28" y="665">a＝店名是小小書店。</text><text x="365" y="665">b＝好。</text>
  <text x="28" y="713">c＝現在</text><text x="365" y="713">d＝只答</text>
  <text x="28" y="761">e＝店名。</text><text x="365" y="761">f＝小小</text>
  <text x="28" y="809">g＝書店</text>
  <text x="28" y="867">每個符號只在本例各佔一格。</text>
</svg>
