<svg xmlns="http://www.w3.org/2000/svg" width="560" height="960" viewBox="0 0 560 960" role="img" aria-labelledby="title desc">
  <title id="title">順序MTP的訓練前文與預測目標</title>
  <desc id="desc">主核心讀到雨，預測停。主核心特徵和標準停的向量只送往額外模組一，預測了。其特徵和標準了的向量送往模組二，預測結束。圖示兩個额外模組，不是DeepSeek-V3實際一個額外模組的配置。</desc>
  <defs>
    <style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#172b3a;font-size:27px}.heading{font-size:30px;font-weight:700}.core{fill:#e8f1fc;stroke:#3c70a4;stroke-width:2}.given{fill:#fff1d9;stroke:#b67b24;stroke-width:2}.goal{fill:#e3f5e8;stroke:#29814a;stroke-width:2}.arrow{fill:none;stroke:#3c70a4;stroke-width:3;marker-end:url(#tip)}</style>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3c70a4"/></marker>
  </defs>
  <rect width="560" height="960" fill="#fff"/>
  <text x="24" y="46" class="heading">沿著標準前文向後練習</text>
  <rect x="45" y="77" width="470" height="92" rx="12" class="core"/>
  <text x="280" y="114" text-anchor="middle">主核心讀：〈B〉／雨</text>
  <text x="280" y="149" text-anchor="middle">得到主核心特徵</text>
  <rect x="45" y="183" width="470" height="55" rx="10" class="goal"/>
  <text x="280" y="220" text-anchor="middle">主模型目標：停</text>
  <path d="M45 155H20V376H59" class="arrow"/>
  <rect x="105" y="266" width="370" height="77" rx="12" class="given"/>
  <text x="290" y="297" text-anchor="middle">標準下一項：停</text>
  <text x="290" y="330" text-anchor="middle">查成向量，只供後面讀</text>
  <path d="M290 345V365" class="arrow"/>
  <rect x="65" y="374" width="450" height="72" rx="12" class="core"/>
  <text x="290" y="402" text-anchor="middle">額外模組1</text>
  <text x="290" y="434" text-anchor="middle">合併前一特徵與「停」向量</text>
  <rect x="65" y="460" width="450" height="55" rx="10" class="goal"/>
  <text x="290" y="497" text-anchor="middle">模組1目標：了</text>
  <path d="M65 429H20V650H59" class="arrow"/>
  <rect x="105" y="540" width="370" height="77" rx="12" class="given"/>
  <text x="290" y="571" text-anchor="middle">標準再下一項：了</text>
  <text x="290" y="604" text-anchor="middle">查成向量，只供後面讀</text>
  <path d="M290 619V639" class="arrow"/>
  <rect x="65" y="648" width="450" height="72" rx="12" class="core"/>
  <text x="290" y="677" text-anchor="middle">額外模組2</text>
  <text x="290" y="708" text-anchor="middle">合併前一特徵與「了」向量</text>
  <rect x="65" y="734" width="450" height="55" rx="10" class="goal"/>
  <text x="290" y="771" text-anchor="middle">模組2目標：〈E〉</text>
  <text x="24" y="835">藍色：處理前文；綠色：核對目標。</text>
  <text x="24" y="877">橘色標準token不流回主核心。</text>
  <text x="24" y="923">此圖示範2個；V3實際採1個額外模組。</text>
</svg>
