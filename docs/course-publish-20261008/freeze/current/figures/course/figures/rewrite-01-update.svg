<svg xmlns="http://www.w3.org/2000/svg" width="640" height="795" viewBox="0 0 640 795" role="img" aria-labelledby="title desc"><title id="title">求導與更新分開</title><desc id="desc">手算示意。w1代價4，求導得到負4但參數不變；學習率0.1真正更新到1.4，重算代價2.56。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#54728c"/></marker></defs><rect width="640" height="795" fill="#fff"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="320" y="48" text-anchor="middle" font-size="34" fill="#173047" font-weight="bold">求導、更新、重算是三步</text><rect x="30" y="86" width="580" height="106" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="130" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">更新前：w = 1</text><text x="320" y="174" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">L = (1 − 3)² = 4</text><path d="M320,199 L320,239" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="254" width="580" height="108" rx="12" fill="#fff0d9" stroke="#54728c" stroke-width="2"/><text x="320" y="300" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">① 求導：梯度 = −4</text><text x="320" y="343" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">此時 w 仍是 1</text><path d="M320,371 L320,411" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="425" width="580" height="113" rx="12" fill="#e7f6ec" stroke="#54728c" stroke-width="2"/><text x="320" y="470" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">② 更新：學習率 0.1</text><text x="320" y="515" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">新 w = 1 − 0.1 × (−4) = 1.4</text><path d="M320,546 L320,586" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="600" width="580" height="104" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="644" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">③ 用新參數重算</text><text x="320" y="687" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">新 L = (1.4 − 3)² = 2.56</text><text x="320" y="753" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">backward() 本身不改參數</text></g></svg>