<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1140" role="img" aria-labelledby="title desc">
  <title id="title">相同人物與腳踏車，可以是不同動作和關係</title>
  <desc id="desc">上下兩個人工場景都有一個人與一輛腳踏車。上方場景 A 的人物坐在車上，雙手握把、雙腿彎曲，正在騎車；下方場景 B 的人物直立在車旁。因此物件名稱一致不足以判斷活動或關係一致。本圖是概念示意，不是自然照片能力實測。</desc>
  <style>
    text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#172b4d}
    .title{font-size:38px;font-weight:600}
    .label{font-size:36px;font-weight:600}
    .main{font-size:34px}
    .bike{fill:none;stroke:#37668d;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
    .person{fill:none;stroke:#b66d18;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
    .ground{fill:none;stroke:#a4b0be;stroke-width:3}
  </style>
  <rect width="720" height="1140" fill="#fff"/>
  <text x="360" y="50" text-anchor="middle" class="title">知道「有誰」</text>
  <text x="360" y="110" text-anchor="middle" class="title">還要看「正在做什麼」</text>

  <rect x="28" y="132" width="664" height="420" rx="16" fill="#f2f6fb" stroke="#8199be" stroke-width="2"/>
  <text x="360" y="181" text-anchor="middle" class="label">人工場景 A：人在騎車</text>
  <g aria-label="人物坐在腳踏車上，雙手握把，雙腿彎曲">
    <circle cx="270" cy="409" r="62" class="bike"/>
    <circle cx="530" cy="409" r="62" class="bike"/>
    <path d="M270 409L350 340L399 409H270M350 340H470L399 409M470 340L530 409M350 340L340 319H367M470 340L487 310H511" class="bike"/>
    <circle cx="399" cy="409" r="9" fill="#37668d"/>
    <circle cx="400" cy="239" r="25" fill="#b66d18"/>
    <path d="M390 272L350 319L399 357L407 405H429M350 319L331 368L376 409M382 281L443 304L487 310" class="person"/>
  </g>
  <path d="M83 478H637" class="ground"/>
  <text x="360" y="529" text-anchor="middle" class="main">物件：人、腳踏車</text>

  <rect x="28" y="572" width="664" height="420" rx="16" fill="#f2f6fb" stroke="#8199be" stroke-width="2"/>
  <text x="360" y="621" text-anchor="middle" class="label">人工場景 B：人站在車旁</text>
  <g aria-label="人物直立在腳踏車旁">
    <circle cx="270" cy="849" r="62" class="bike"/>
    <circle cx="530" cy="849" r="62" class="bike"/>
    <path d="M270 849L350 780L399 849H270M350 780H470L399 849M470 780L530 849M350 780L340 759H367M470 780L487 750H511" class="bike"/>
    <circle cx="399" cy="849" r="9" fill="#37668d"/>
    <circle cx="125" cy="688" r="25" fill="#b66d18"/>
    <path d="M125 724V828L96 911M125 828L158 911M125 754L174 798M125 754L87 800" class="person"/>
  </g>
  <path d="M83 918H637" class="ground"/>
  <text x="360" y="969" text-anchor="middle" class="main">物件：人、腳踏車</text>

  <text x="360" y="1051" text-anchor="middle" class="main">相同物件，活動／關係不同。</text>
  <text x="360" y="1106" text-anchor="middle" class="main">人工概念圖，非自然照片能力實測。</text>
</svg>
