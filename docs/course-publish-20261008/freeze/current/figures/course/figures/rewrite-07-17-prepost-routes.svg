<svg xmlns="http://www.w3.org/2000/svg" width="640" height="790" viewBox="0 0 640 790" role="img" aria-labelledby="title desc"><title id="title">文章建立底座，示範教任務</title><desc id="desc">文章的下一字目標訓練共用底座，保存後可以分別用客服或程式示範繼續更新，分支各需評測。</desc>
<defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#172b3a}.strong{font-weight:700}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#3c70a4"/></marker></defs>
<rect width="640" height="790" fill="white"/>
<text x="28" y="48" font-size="32" style="font-size:32px" text-anchor="start" class="strong">文章建立底座，示範教任務</text>
<rect x="28" y="89" width="584" height="117" rx="10" fill="#e8f1fc" stroke="#3c70a4" stroke-width="2"/>
<text x="48" y="132" font-size="30" style="font-size:30px" text-anchor="start" class="strong">一般文章</text>
<text x="48" y="179" font-size="28" style="font-size:28px" text-anchor="start">花生可用來製作糖果。</text>
<path d="M320 208V253" fill="none" stroke="#3c70a4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="28" y="266" width="584" height="117" rx="10" fill="#e3f5e8" stroke="#29814a" stroke-width="2"/>
<text x="48" y="309" font-size="30" style="font-size:30px" text-anchor="start" class="strong">共用底座：已預訓練的權重</text>
<text x="48" y="356" font-size="28" style="font-size:28px" text-anchor="start">可保存，供各任務接續</text>
<path d="M194 385V439" fill="none" stroke="#3c70a4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="28" y="452" width="584" height="126" rx="10" fill="#e8f1fc" stroke="#3c70a4" stroke-width="2"/>
<text x="48" y="499" font-size="30" style="font-size:30px" text-anchor="start" class="strong">分支一：客服問答示範</text>
<text x="48" y="546" font-size="28" style="font-size:28px" text-anchor="start">繼續更新，再查新客服題</text>
<rect x="28" y="632" width="584" height="126" rx="10" fill="#e8f1fc" stroke="#3c70a4" stroke-width="2"/>
<text x="48" y="679" font-size="30" style="font-size:30px" text-anchor="start" class="strong">分支二：程式題示範</text>
<text x="48" y="726" font-size="28" style="font-size:28px" text-anchor="start">繼續更新，再查新程式題</text>
<path d="M612 324H626V696H614" fill="none" stroke="#3c70a4" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
