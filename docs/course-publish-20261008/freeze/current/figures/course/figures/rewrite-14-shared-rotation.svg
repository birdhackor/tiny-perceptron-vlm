<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" role="img" aria-labelledby="title desc"><title id="title">一起平移，夾角保持135°</title><desc id="desc">Q、K內容固定。位置2與5的單位箭頭相差135度；一起移到12與15後，夾角與點積仍相同。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#496276"/></marker><marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#245ba8"/></marker><marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#107b6e"/></marker><marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ac5016"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172e45;font-size:30px} .small{font-size:28px} .title{font-size:32px;font-weight:700} .number{font-variant-numeric:tabular-nums}</style><rect width="640" height="820" fill="#fff"/>
<text x="320" y="48" text-anchor="middle" class="title" style="fill:#172e45;">一起平移，夾角保持135°</text>
<text x="320" y="91" text-anchor="middle" class="small" style="fill:#172e45;">青色Q；橘色K｜單位長度</text>
<rect x="32" y="113" width="576" height="260" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="157" text-anchor="middle" class="" style="fill:#172e45;">Q位置2；K位置5</text>
<circle cx="320" cy="251" r="83" fill="none" stroke="#c3d1de" stroke-width="2"/>
<line x1="320" y1="251" x2="320.0" y2="171.0" stroke="#107b6e" stroke-width="5" marker-end="url(#arrow-teal)"/>
<line x1="320" y1="251" x2="263.4314575050762" y2="307.5685424949238" stroke="#ac5016" stroke-width="5" marker-end="url(#arrow-orange)"/>
<text x="350.0" y="195.0" text-anchor="middle" class="" style="fill:#107b6e;">Q</text>
<text x="238.4314575050762" y="329.5685424949238" text-anchor="middle" class="" style="fill:#ac5016;">K</text>
<text x="488" y="267" text-anchor="middle" class="" style="fill:#172e45;font-size:34px;">135°</text>
<text x="320" y="356" text-anchor="middle" class="number" style="fill:#172e45;">點積 −0.7071</text>
<rect x="32" y="493" width="576" height="260" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="537" text-anchor="middle" class="" style="fill:#172e45;">Q位置12；K位置15</text>
<circle cx="320" cy="631" r="83" fill="none" stroke="#c3d1de" stroke-width="2"/>
<line x1="320" y1="631" x2="240.0" y2="631.0" stroke="#107b6e" stroke-width="5" marker-end="url(#arrow-teal)"/>
<line x1="320" y1="631" x2="376.5685424949238" y2="687.5685424949238" stroke="#ac5016" stroke-width="5" marker-end="url(#arrow-orange)"/>
<text x="217.0" y="623.0" text-anchor="middle" class="" style="fill:#107b6e;">Q</text>
<text x="401.5685424949238" y="709.5685424949238" text-anchor="middle" class="" style="fill:#ac5016;">K</text>
<text x="488" y="647" text-anchor="middle" class="" style="fill:#172e45;font-size:34px;">135°</text>
<text x="320" y="736" text-anchor="middle" class="number" style="fill:#172e45;">點積 −0.7071</text>
<line x1="320" y1="390" x2="320" y2="452" stroke="#496276" stroke-width="3" marker-end="url(#arrow)"/>
<text x="320" y="495" text-anchor="middle" class="small" style="fill:#172e45;">兩者共同多轉450°</text>
<text x="320" y="799" text-anchor="middle" class="small" style="fill:#172e45;">只改位置；沒有改向量內容</text>
</svg>
