<svg xmlns="http://www.w3.org/2000/svg" width="560" height="660" viewBox="0 0 560 660" role="img" aria-labelledby="title desc">
  <title id="title">在第一個不符處修正，丟棄後續草稿</title>
  <desc id="desc">草稿是今天、下雨、嗎。固定greedy的目標模型接受今天，第二格改成晴天。嗎依賴已被拒絕的下雨，不能保留，這輪得到今天、晴天。</desc>
  <defs>
    <style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#172b3a;font-size:27px}.heading{font-size:30px;font-weight:700}.ok{fill:#e3f5e8;stroke:#29814a;stroke-width:2}.bad{fill:#ffe5e3;stroke:#bf493e;stroke-width:2}.discard{fill:#edf0f3;stroke:#657582;stroke-width:2}</style>
  </defs>
  <rect width="560" height="660" fill="#fff"/>
  <text x="24" y="46" class="heading">草稿不直接成為答案</text>
  <text x="24" y="97">草稿：今天／下雨／嗎</text>
  <rect x="24" y="130" width="512" height="120" rx="12" class="ok"/>
  <text x="46" y="169">第1格：草稿「今天」</text>
  <text x="46" y="210">主模型也選今天 → 保留</text>
  <rect x="24" y="271" width="512" height="125" rx="12" class="bad"/>
  <text x="46" y="310">第2格：草稿「下雨」</text>
  <text x="46" y="351">主模型在今天後選晴天</text>
  <text x="46" y="383">→ 改接晴天，停止收草稿</text>
  <rect x="24" y="417" width="512" height="102" rx="12" class="discard"/>
  <text x="46" y="453">第3格「嗎」：丟棄</text>
  <text x="46" y="492">它依賴今天下雨，前文已改了。</text>
  <rect x="24" y="548" width="512" height="65" rx="12" class="ok"/>
  <text x="280" y="590" text-anchor="middle">這輪結果：今天／晴天</text>
</svg>
