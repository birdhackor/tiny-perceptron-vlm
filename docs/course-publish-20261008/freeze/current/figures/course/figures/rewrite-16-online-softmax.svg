<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 883" role="img" aria-labelledby="title desc"><title id="title">最大值變了，分子分母一起縮</title><desc id="desc">分數0,log2,log4，Value10,20,30。第一塊分母1.5分子25。最大值改成log4，兩者乘0.5，再加新權重1與Value30，得42.5/1.75。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#496276"/></marker><marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#245ba8"/></marker><marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#107b6e"/></marker><marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ac5016"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172e45;font-size:30px} .small{font-size:28px} .title{font-size:32px;font-weight:700} .number{font-variant-numeric:tabular-nums}</style><rect width="640" height="883" fill="#fff"/>
<text x="320" y="48" text-anchor="middle" class="title" style="fill:#172e45;">最大值變了，分子分母一起縮</text>
<text x="320" y="102" text-anchor="middle" class="small" style="fill:#172e45;">分數：[0, log2, log4]</text>
<text x="320" y="143" text-anchor="middle" class="small" style="fill:#172e45;">Value：[10, 20, 30]</text>
<rect x="30" y="183" width="580" height="123" rx="14" fill="#eef4fa" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="224" text-anchor="middle" class="" style="fill:#172e45;">① 第一塊：0、log2</text>
<text x="320" y="272" text-anchor="middle" class="" style="fill:#245ba8;">分母1.5；分子25</text>
<line x1="320" y1="313" x2="320" y2="350" stroke="#496276" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="369" width="580" height="166" rx="14" fill="#fff4e9" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="408" text-anchor="middle" class="" style="fill:#ac5016;">② 新最大值是log4</text>
<text x="320" y="455" text-anchor="middle" class="small" style="fill:#172e45;">舊分母：1.5×0.5 = 0.75</text>
<text x="320" y="503" text-anchor="middle" class="small" style="fill:#172e45;">舊分子：25×0.5 = 12.5</text>
<line x1="320" y1="544" x2="320" y2="583" stroke="#496276" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="601" width="580" height="156" rx="14" fill="#eef7f5" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="643" text-anchor="middle" class="" style="fill:#107b6e;">③ 加入新權重1、Value30</text>
<text x="320" y="690" text-anchor="middle" class="small" style="fill:#172e45;">分母：0.75+1 = 1.75</text>
<text x="320" y="736" text-anchor="middle" class="small" style="fill:#172e45;">分子：12.5+30 = 42.5</text>
<text x="320" y="822" text-anchor="middle" class="" style="fill:#107b6e;font-size:34px;">42.5 ÷ 1.75 = 24.2857</text>
<text x="320" y="867" text-anchor="middle" class="small" style="fill:#172e45;">和一次算完整softmax相同</text>
</svg>
