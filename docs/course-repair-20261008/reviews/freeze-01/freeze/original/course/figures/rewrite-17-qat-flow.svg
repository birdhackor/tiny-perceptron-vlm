<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1020" viewBox="0 0 640 1020" role="img" aria-labelledby="title desc"><title id="title">QAT：體驗誤差與打包要分開</title><desc id="desc">訓練保留FP32主權重；前向臨時模擬量化和還原，例子0.1 0.4 0.9變1 3 7並還原0.1286 0.3857 0.9。反向用STE近似計算梯度，更新器step才改主權重。完成訓練後才保存整數碼、刻度和形狀成爲packed4。當前小程序只算梯度。</desc><defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#173047}.title{font-size:32px;font-weight:700}.bold{font-weight:700}.small{font-size:28px}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6e8b"/></marker></defs><rect width="640" height="1020" fill="#ffffff"/><text x="32" y="48" class="title">QAT：體驗誤差與打包要分開</text><rect x="32" y="84" width="576" height="116" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="126" class="bold">可更新的FP32主權重</text><text x="50" y="166" class="">算例：[0.1, 0.4, 0.9]</text><path d="M320 200 L320 241" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="255" width="576" height="165" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="297" class="bold">前向：臨時模擬量化與還原</text><text x="50" y="337" class="">scale=0.9/7，碼 [1, 3, 7]</text><text x="50" y="377" class="">使用 [0.1286, 0.3857, 0.9]</text><path d="M320 420 L320 464" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="478" width="576" height="116" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="520" class="bold">反向：STE是近似規則</text><text x="50" y="560" class="">backward()只算梯度</text><path d="M320 594 L320 638" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="652" width="576" height="116" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="694" class="bold">更新器step()才改主權重</text><text x="50" y="734" class="">下次前向重新模擬</text><path d="M320 768 L320 809" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="823" width="576" height="116" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="865" class="bold">訓練完成後另行打包</text><text x="50" y="905" class="">保存整數碼、scale與形狀</text><text x="32" y="988" class="">流程示意；本節短程式沒有參數更新。</text></svg>