<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="title desc"><title id="title">手算：加總係數可以改變排名</title><desc id="desc">兩份回答的風格與正確分項固定。風格係數0.2時準確短答1.2大於華麗錯答0.6；係數2時3小於6。錯答的正確項始終是0。</desc><defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#173047}.title{font-size:32px;font-weight:700}.bold{font-weight:700}.small{font-size:28px}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6e8b"/></marker></defs><rect width="640" height="690" fill="#ffffff"/><text x="32" y="48" class="title">手算：加總係數可以改變排名</text><rect x="32" y="82" width="576" height="128" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="124" class="bold">準確短答：4</text><text x="50" y="164" class="">風格 1　｜　正確 1</text><rect x="32" y="234" width="576" height="128" rx="12" fill="#fff0e8" stroke="#c48b5b" stroke-width="2"/><text x="50" y="276" class="bold">華麗錯答：5，數字如星光流動</text><text x="50" y="316" class="">風格 3　｜　正確 0</text><rect x="32" y="398" width="576" height="112" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="440" class="bold">風格係數 0.2</text><text x="50" y="480" class="">短答 1.2 ＞ 錯答 0.6</text><rect x="32" y="538" width="576" height="112" rx="12" fill="#fff0e8" stroke="#c48b5b" stroke-width="2"/><text x="50" y="580" class="bold">風格係數 2</text><text x="50" y="620" class="">短答 3 ＜ 錯答 6</text></svg>