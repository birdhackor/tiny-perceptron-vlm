<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="title desc"><title id="title">同一份成績沿不同軸平均</title><desc id="desc">兩位同學三次小考，甲60、70、80，乙80、90、100。跨小考平均是70、90；跨同學平均是70、80、90。</desc><style>text{font-family:system-ui,"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#172554}.title{font-size:30px;font-weight:600}.number{font-size:32px;font-weight:600;text-anchor:middle}</style><rect width="640" height="760" rx="18" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs>
<text class="title" x="28" y="46">同一份成績：2 位同學 × 3 次小考</text>
<text x="225" y="110" text-anchor="middle">小考 1</text>
<text x="365" y="110" text-anchor="middle">小考 2</text>
<text x="505" y="110" text-anchor="middle">小考 3</text>
<text x="45" y="180">同學甲</text>
<rect x="160" y="135" width="128" height="68" rx="8" fill="#dbeafe" stroke="#64748b"/><text class="number" x="224" y="180">60</text>
<rect x="300" y="135" width="128" height="68" rx="8" fill="#dbeafe" stroke="#64748b"/><text class="number" x="364" y="180">70</text>
<rect x="440" y="135" width="128" height="68" rx="8" fill="#dbeafe" stroke="#64748b"/><text class="number" x="504" y="180">80</text>
<text x="45" y="265">同學乙</text>
<rect x="160" y="220" width="128" height="68" rx="8" fill="#dbeafe" stroke="#64748b"/><text class="number" x="224" y="265">80</text>
<rect x="300" y="220" width="128" height="68" rx="8" fill="#dbeafe" stroke="#64748b"/><text class="number" x="364" y="265">90</text>
<rect x="440" y="220" width="128" height="68" rx="8" fill="#dbeafe" stroke="#64748b"/><text class="number" x="504" y="265">100</text>
<text class="title" x="28" y="350">跨小考：每人平均，dim＝1</text>
<text x="46" y="426">60、70、80</text><path d="M310 416H410" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><text class="number" x="490" y="426">70</text>
<text x="46" y="493">80、90、100</text><path d="M310 483H410" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><text class="number" x="490" y="493">90</text>
<text class="title" x="28" y="575">跨同學：每次小考平均，dim＝0</text>
<text x="110" y="628" text-anchor="middle">60、80</text><path d="M110 645V690" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><text class="number" x="110" y="733">70</text>
<text x="317" y="628" text-anchor="middle">70、90</text><path d="M317 645V690" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><text class="number" x="317" y="733">80</text>
<text x="524" y="628" text-anchor="middle">80、100</text><path d="M524 645V690" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><text class="number" x="524" y="733">90</text>
</svg>
