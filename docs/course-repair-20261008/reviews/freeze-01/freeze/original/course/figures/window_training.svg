<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img" aria-labelledby="title desc">
<title id="title">窗口更長，這次的新題成績卻較差</title>
<desc id="desc">三個特徵寬度16的MLP以相同切分、種子42，各更新200次。窗口1、3、5字的訓練平均下一字代價約為0.334、0.213、0.199；驗證代價約為0.431、0.306、0.513。窗口變長時參數也增多；驗證只有一篇短文。這次5字窗口的訓練代價較低，但驗證代價較高，不能推論所有任務都以3字最好。</desc>
<style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:14px;fill:#17212b}.grid{stroke:#e2e8f0;stroke-width:1}.axis{stroke:#475569;stroke-width:1}</style>
<rect width="360" height="340" fill="white"/>
<text x="16" y="24" style="font-weight:700;font-size:16px">窗口更長，這次的新題成績卻較差</text>
<path d="M 18 49 H 42" stroke="#2563eb" stroke-width="2.5"/><circle cx="30" cy="49" r="3.5" fill="#2563eb"/><text x="50" y="54">教過的 9 篇短文</text>
<path d="M 18 74 H 42" stroke="#d97706" stroke-width="2.5"/><circle cx="30" cy="74" r="3.5" fill="#d97706"/><text x="50" y="79">沒有教過的 1 篇短文</text>
<text x="16" y="105">平均猜錯代價（越低越好）</text>
