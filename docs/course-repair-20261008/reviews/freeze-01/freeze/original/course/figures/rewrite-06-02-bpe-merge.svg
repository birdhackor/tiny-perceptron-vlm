<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-labelledby="title desc"><title id="title">最高頻相鄰對合成一項</title><desc id="desc">abab與abac各自計相鄰對，a-b三次最高，合併後是ab ab及ab a c，不跨文件。</desc>
