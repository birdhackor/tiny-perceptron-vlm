<svg xmlns="http://www.w3.org/2000/svg" width="440" height="638" viewBox="0 0 440 638" role="img" aria-labelledby="title desc">
<title id="title">同一組候選，提高溫度讓次要比例更明顯</title>
<desc id="desc">候選4、3、100的人工分數是4、1、0。溫度1、2、4的機率分別約93.62/4.66/1.71、73.61/16.43/9.96、54.34/25.67/19.99百分比。各條總長都是100%，排名保持不變。標註數字四捨五入。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#17324d;font-size:23px;text-anchor:middle}.heading{font-size:26px;font-weight:700}.percent{font-weight:600}.label{font-size:24px;text-anchor:start}</style>
<rect width="440" height="638" rx="16" fill="#f8fafc"/>
<text x="220" y="38" class="heading">候選不換，比例變平</text>
<rect x="68" y="63" width="16" height="16" rx="3" fill="#4f83c7"/><text x="101" y="80">4</text>
<rect x="182" y="63" width="16" height="16" rx="3" fill="#e8a04b"/><text x="215" y="80">3</text>
<rect x="290" y="63" width="16" height="16" rx="3" fill="#58a285"/><text x="346" y="80">100</text>
<rect x="24" y="108" width="392" height="134" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="44" y="142" class="label">溫度 T = 1</text>
<defs><clipPath id="bar-1"><rect x="44" y="156" width="352" height="34" rx="6"/></clipPath></defs><g clip-path="url(#bar-1)">
<rect x="44.000000" y="156" width="329.556322" height="34" fill="#4f83c7"/>
<rect x="373.556322" y="156" width="16.407643" height="34" fill="#e8a04b"/>
<rect x="389.963965" y="156" width="6.036035" height="34" fill="#58a285"/>
</g>
<text x="102" y="223" class="percent">93.62%</text>
<text x="219" y="223" class="percent">4.66%</text>
<text x="343" y="223" class="percent">1.71%</text>
<rect x="24" y="263" width="392" height="134" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="44" y="297" class="label">溫度 T = 2</text>
<defs><clipPath id="bar-2"><rect x="44" y="311" width="352" height="34" rx="6"/></clipPath></defs><g clip-path="url(#bar-2)">
<rect x="44.000000" y="311" width="259.115903" height="34" fill="#4f83c7"/>
<rect x="303.115903" y="311" width="57.816573" height="34" fill="#e8a04b"/>
<rect x="360.932476" y="311" width="35.067524" height="34" fill="#58a285"/>
</g>
<text x="102" y="378" class="percent">73.61%</text>
<text x="219" y="378" class="percent">16.43%</text>
<text x="343" y="378" class="percent">9.96%</text>
<rect x="24" y="418" width="392" height="134" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="44" y="452" class="label">溫度 T = 4</text>
<defs><clipPath id="bar-4"><rect x="44" y="466" width="352" height="34" rx="6"/></clipPath></defs><g clip-path="url(#bar-4)">
<rect x="44.000000" y="466" width="191.278775" height="34" fill="#4f83c7"/>
<rect x="235.278775" y="466" width="90.353696" height="34" fill="#e8a04b"/>
<rect x="325.632471" y="466" width="70.367529" height="34" fill="#58a285"/>
</g>
<text x="102" y="533" class="percent">54.34%</text>
<text x="219" y="533" class="percent">25.67%</text>
<text x="343" y="533" class="percent">19.99%</text>
<text x="220" y="588">每條總長100%；4仍是第一名</text>
<text x="220" y="623">分數 [4,1,0]；比例標註四捨五入</text>
</svg>
