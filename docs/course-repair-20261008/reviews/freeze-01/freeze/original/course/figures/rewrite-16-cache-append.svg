<text x="320" y="390" text-anchor="middle" class="" style="fill:#ac5016;">K3/V3</text>
<line x1="320" y1="426" x2="320" y2="472" stroke="#496276" stroke-width="3" marker-end="url(#arrow)"/>
<text x="320" y="514" text-anchor="middle" class="" style="fill:#172e45;">接到尾端 → 快取長度4</text>
<rect x="27" y="546" width="139" height="76" rx="14" fill="#eef4fa" stroke="#cad8e4" stroke-width="2"/>
<text x="96" y="595" text-anchor="middle" class="small" style="fill:#172e45;">K0/V0</text>
<rect x="176" y="546" width="139" height="76" rx="14" fill="#eef4fa" stroke="#cad8e4" stroke-width="2"/>
<text x="245" y="595" text-anchor="middle" class="small" style="fill:#172e45;">K1/V1</text>
<rect x="325" y="546" width="139" height="76" rx="14" fill="#eef4fa" stroke="#cad8e4" stroke-width="2"/>
<text x="394" y="595" text-anchor="middle" class="small" style="fill:#172e45;">K2/V2</text>
<rect x="474" y="546" width="139" height="76" rx="14" fill="#fff4e9" stroke="#cad8e4" stroke-width="2"/>
