<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 694" role="img" aria-labelledby="title desc"><title id="title">保存舊K/V，再接上新的一格</title><desc id="desc">前三位置K和V已保存，新位置3只算自己的K和V，接到快取後，新位置Query讀全部四格。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#496276"/></marker><marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#245ba8"/></marker><marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#107b6e"/></marker><marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ac5016"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172e45;font-size:30px} .small{font-size:28px} .title{font-size:32px;font-weight:700} .number{font-variant-numeric:tabular-nums}</style><rect width="640" height="694" fill="#fff"/>
<text x="320" y="48" text-anchor="middle" class="title" style="fill:#172e45;">保存舊K/V，再接上新的一格</text>
<text x="320" y="107" text-anchor="middle" class="" style="fill:#172e45;">已保存：位置0、1、2</text>
<rect x="34" y="135" width="168" height="78" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="118" y="185" text-anchor="middle" class="" style="fill:#172e45;">K0/V0</text>
<rect x="236" y="135" width="168" height="78" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="185" text-anchor="middle" class="" style="fill:#172e45;">K1/V1</text>
<rect x="438" y="135" width="168" height="78" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="522" y="185" text-anchor="middle" class="" style="fill:#172e45;">K2/V2</text>
<line x1="320" y1="222" x2="320" y2="266" stroke="#496276" stroke-width="3" marker-end="url(#arrow)"/>
