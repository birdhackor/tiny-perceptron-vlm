<svg xmlns="http://www.w3.org/2000/svg" width="360" height="570" viewBox="0 0 360 570" role="img" aria-labelledby="title desc">
  <title id="title">物理座標決定旋轉，序列序號決定可讀位置</title>
  <desc id="desc">影格 F5 的物理時間為一千兩百五十毫秒，即五個時間單位；聲音 A1 的中心可是一千三百或兩千三百毫秒，即五點二或九點二時間單位。六維向量三對依序使用時間、高度、寬度。F5 與 A1 的序列序號固定為六與二十，因果遮罩不隨物理移時改變。</desc>
  <style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#172b4d;font-size:17px}.title{font-size:21px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.white{fill:white}.line{stroke:#51657d;stroke-width:2;fill:none}</style>
  <rect width="360" height="570" rx="12" fill="#f7f9fc"/>
  <text class="title" x="20" y="34">座標旋轉，序號管可見範圍</text>
  <rect x="20" y="54" width="320" height="94" rx="8" fill="#e2f0f4"/>
  <text class="label" x="34" y="82">影格 F5</text>
  <text x="34" y="110">1250 ms ÷ 250 = t 5</text>
  <text class="small" x="34" y="135">序列 index 6</text>
  <rect x="20" y="165" width="320" height="118" rx="8" fill="#f9e8ed"/>
  <text class="label" x="34" y="193">聲音 A1（同一塊、只移時）</text>
  <text x="34" y="221">1300 / 250 = t 5.2</text>
  <text x="34" y="247">2300 / 250 = t 9.2</text>
  <text class="small" x="34" y="272">兩次序列 index 都是 20</text>
  <text class="label" x="20" y="319">六維 Q 或 K：每兩格一對</text>
  <g stroke="white" stroke-width="2"><rect x="30" y="335" width="100" height="49" fill="#b83155"/><rect x="130" y="335" width="100" height="49" fill="#237a9b"/><rect x="230" y="335" width="100" height="49" fill="#627f42"/></g>
  <g text-anchor="middle"><text class="white" x="80" y="366">第 0、1 格</text><text class="white" x="180" y="366">第 2、3 格</text><text class="white" x="280" y="366">第 4、5 格</text><text x="80" y="413">時間 t</text><text x="180" y="413">高度 h</text><text x="280" y="413">寬度 w</text></g>
  <text x="20" y="449">本次移時：只改第一對的角度</text>
  <rect x="20" y="470" width="320" height="79" rx="8" fill="#e7edf3"/>
  <text class="label" x="34" y="500">因果遮罩仍用序列 index</text>
  <text x="34" y="528">index 20 可讀 index 0–20</text>
</svg>
