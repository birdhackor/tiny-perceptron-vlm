<svg xmlns="http://www.w3.org/2000/svg" width="380" height="1050" viewBox="0 0 380 1050" role="img" aria-labelledby="title desc">
<title id="title">兩代Omni的文字條件與聲音輸出路線</title>
<desc id="desc">上半為2.5：輸入到Thinker，將高階文字表示和抽樣文字token交Talker，再經含未來block的DiT、mel與BigVGAN生成波形。下半為3：Thinker送文字token及音影條件，Talker預測第0碼本，MTP補同框其餘碼本，因果Code2Wav輸出波形。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#334155"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#172033;font-size:16px}.heading{font-size:18px;font-weight:700}.note{font-size:14px}.arrow{stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}</style>
<rect width="380" height="1050" fill="white"/>
<text x="190" y="27" text-anchor="middle" class="heading">箭頭表示資料傳遞，不表示速度</text>
<rect x="10" y="48" width="360" height="458" rx="12" fill="#eff6ff" stroke="#93b5df"/>
<text x="26" y="79" class="heading">Qwen2.5-Omni</text>
<rect x="10" y="526" width="360" height="514" rx="12" fill="#f5f3ff" stroke="#b5a6df"/>
<text x="26" y="556" class="heading">Qwen3-Omni</text>
<rect x="30" y="96" width="320" height="34" rx="7" fill="#ffffff" stroke="#536377"/>
<text x="190" y="118" text-anchor="middle">文字／影像／聲音</text>
<line x1="190" y1="130" x2="190" y2="142" class="arrow"/>
<rect x="30" y="146" width="320" height="38" rx="7" fill="#dbeafe" stroke="#536377"/>
<text x="190" y="170" text-anchor="middle">Thinker：理解與文字生成</text>
<line x1="190" y1="184" x2="190" y2="196" class="arrow"/>
<rect x="30" y="200" width="320" height="50" rx="7" fill="#fef3c7" stroke="#536377"/>
<text x="190" y="219" text-anchor="middle">高階文字表示</text>
<text x="190" y="241" text-anchor="middle">＋ 抽樣文字 token 的 embedding</text>
<line x1="190" y1="250" x2="190" y2="262" class="arrow"/>
<rect x="30" y="266" width="320" height="38" rx="7" fill="#dcfce7" stroke="#536377"/>
<text x="190" y="290" text-anchor="middle">Talker → 聲音碼</text>
<line x1="190" y1="304" x2="190" y2="316" class="arrow"/>
<rect x="30" y="320" width="320" height="54" rx="7" fill="#ede9fe" stroke="#536377"/>
<text x="190" y="341" text-anchor="middle">DiT → mel 頻譜</text>
<text x="190" y="363" text-anchor="middle">需要 1 個未來 block</text>
<line x1="190" y1="374" x2="190" y2="386" class="arrow"/>
<rect x="30" y="390" width="320" height="40" rx="7" fill="#ede9fe" stroke="#536377"/>
<text x="190" y="415" text-anchor="middle">BigVGAN → 波形</text>
<line x1="190" y1="430" x2="190" y2="442" class="arrow"/>
<rect x="30" y="446" width="320" height="34" rx="7" fill="#ffffff" stroke="#536377"/>
<text x="190" y="468" text-anchor="middle">可播放 waveform</text>
<rect x="30" y="572" width="320" height="34" rx="7" fill="#ffffff" stroke="#536377"/>
<text x="190" y="594" text-anchor="middle">文字／影像／聲音</text>
<line x1="190" y1="606" x2="190" y2="618" class="arrow"/>
<rect x="30" y="622" width="320" height="38" rx="7" fill="#dbeafe" stroke="#536377"/>
<text x="190" y="646" text-anchor="middle">Thinker：理解與文字生成</text>
<line x1="190" y1="660" x2="190" y2="672" class="arrow"/>
<rect x="30" y="676" width="320" height="50" rx="7" fill="#fef3c7" stroke="#536377"/>
<text x="190" y="695" text-anchor="middle">文字 tokens ＋ 音／影條件</text>
<text x="190" y="717" text-anchor="middle">保留歷史與目前逐步送出的文字</text>
<line x1="190" y1="726" x2="190" y2="738" class="arrow"/>
<rect x="30" y="742" width="320" height="38" rx="7" fill="#dcfce7" stroke="#536377"/>
<text x="190" y="766" text-anchor="middle">Talker → 第 0 碼本</text>
<line x1="190" y1="780" x2="190" y2="792" class="arrow"/>
<rect x="30" y="796" width="320" height="46" rx="7" fill="#dcfce7" stroke="#536377"/>
<text x="190" y="824" text-anchor="middle">MTP → 同音框其餘碼本</text>
<line x1="190" y1="842" x2="190" y2="854" class="arrow"/>
<rect x="30" y="858" width="320" height="50" rx="7" fill="#ede9fe" stroke="#536377"/>
<text x="190" y="877" text-anchor="middle">Code2Wav → 波形</text>
<text x="190" y="899" text-anchor="middle">因果卷積，只讀左側上下文</text>
<line x1="190" y1="908" x2="190" y2="920" class="arrow"/>
<rect x="30" y="924" width="320" height="34" rx="7" fill="#ffffff" stroke="#536377"/>
<text x="190" y="946" text-anchor="middle">可播放 waveform</text>
<text x="190" y="987" text-anchor="middle" class="note">MTP沿同音框的碼本軸補細節，</text>
<text x="190" y="1009" text-anchor="middle" class="note">不是預測未來文字位置。</text>
</svg>
