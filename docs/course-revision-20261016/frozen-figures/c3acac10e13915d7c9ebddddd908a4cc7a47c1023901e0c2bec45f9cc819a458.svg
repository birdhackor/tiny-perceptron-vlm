<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-labelledby="title desc">
  <title id="title">固定舊 A，新增影音判斷分支</title>
  <desc id="desc">舊任務仍走固定版本的自訓舊 A。新影音任務分成灰階影格 CNN 與兩百毫秒局部聲音特徵投影，附上共同時間、固定序列與有效 mask，經共享注意力和三類 head 產生唯一語義紀錄，再分別提供對話與 Talker；unknown 轉交。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#51657d"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#172b4d;font-size:17px}.title{font-size:21px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.line{stroke:#51657d;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <rect width="360" height="760" rx="12" fill="#f7f9fc"/>
  <text class="title" x="20" y="34">固定舊 A，新增影音分支</text>
  <rect x="20" y="53" width="320" height="69" rx="8" fill="#e7edf3"/>
  <text class="label" x="34" y="82">舊任務 → 固定舊 A</text>
  <text class="small" x="34" y="108">權重、tokenizer、前處理版本固定</text>
  <text class="label" x="20" y="157">新影音任務：從零學新分支</text>
  <rect x="20" y="177" width="152" height="116" rx="8" fill="#e2f0f4"/>
  <rect x="188" y="177" width="152" height="116" rx="8" fill="#f9e8ed"/>
  <g text-anchor="middle"><text class="label" x="96" y="205">最多 16 影格</text><text x="96" y="232">32×32 灰階</text><text x="96" y="263">CNN → 向量</text><text class="label" x="264" y="205">200 ms 音塊</text><text x="264" y="232">各塊獨立特徵</text><text x="264" y="263">投影 → 向量</text></g>
  <path class="line" d="M96 293V314H180V331"/><path class="line" d="M264 293V314H180V331"/>
  <rect x="20" y="336" width="320" height="75" rx="8" fill="#fff0df"/>
  <text class="label" x="34" y="366">共同時間：250 ms 為一單位</text>
  <text x="34" y="393">固定序列＋有效 mask</text>
  <path class="line" d="M180 411V436"/>
  <rect x="20" y="441" width="320" height="54" rx="8" fill="#e2f0f4"/>
  <text class="label" x="76" y="475">共享 fusion attention</text>
  <path class="line" d="M180 495V520"/>
  <rect x="20" y="525" width="320" height="76" rx="8" fill="#e7edf3"/>
  <text class="label" x="34" y="555">三類 head → canonical record</text>
  <text class="small" x="34" y="583">semantic: circle / square / unknown</text>
  <path class="line" d="M180 601V622H96V641"/><path class="line" d="M180 601V622H264V641"/>
  <rect x="20" y="646" width="152" height="64" rx="8" fill="#e2f0f4"/><rect x="188" y="646" width="152" height="64" rx="8" fill="#f9e8ed"/>
  <g text-anchor="middle"><text class="label" x="96" y="674">共同對話紀錄</text><text class="small" x="96" y="699">保留原語義</text><text class="label" x="264" y="674">Talker 條件</text><text class="small" x="264" y="699">unknown 轉交</text></g>
  <text class="small" x="20" y="741">LM 潤飾文字，不覆寫 head 語義</text>
</svg>
