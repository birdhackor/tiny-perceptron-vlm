<svg xmlns="http://www.w3.org/2000/svg" width="380" height="746" viewBox="0 0 380 746" role="img" aria-labelledby="title desc">
  <title id="title">A的語義結果通往可播放波形的資料流</title>
  <desc id="desc">A輸出canonical semantic result，例如circle代表圓；正式凍結公開字典將圓對應220Hz零點二秒、停零點一秒、440Hz零點二秒。Talker讀取這份公開音型程式，從BOS自主生成碼直到EOS或上限，再經凍結decoder得到8kHz波形。分析器比較頻率、順序、起訖、時值與停頓。gold只供獨立條件對照與評分，不能覆寫A的結果。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172554;text-anchor:middle;font-size:18px}.title{font-size:21px;font-weight:700}.label{font-weight:700}.small{font-size:17px}.arrow{stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="380" height="746" rx="14" fill="#fff"/>
  <text class="title" x="190" y="31">一次有解題的發聲流程</text>
  <rect x="18" y="57" width="344" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="label" x="190" y="85">A 的 canonical semantic result</text>
  <text x="190" y="112">例：circle（圓）</text>
  <path class="arrow" d="M190 129V150"/>
  <rect x="18" y="154" width="344" height="104" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text class="label" x="190" y="181">凍結的公開音型字典</text>
  <text x="190" y="209">圓 → 220Hz 0.2秒</text>
  <text x="190" y="237">停 0.1秒 → 440Hz 0.2秒</text>
  <path class="arrow" d="M190 260V281"/>
  <rect x="18" y="285" width="344" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="label" x="190" y="313">Talker：讀公開音型程式</text>
  <text x="190" y="341">BOS → 自己預測的碼</text>
  <text x="190" y="367">→ EOS／上限</text>
  <path class="arrow" d="M190 383V404"/>
  <rect x="18" y="408" width="344" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="label" x="190" y="437">凍結的 codec decoder</text>
  <text x="190" y="465">聲音碼 → 8kHz 波形</text>
  <path class="arrow" d="M190 486V507"/>
  <rect x="18" y="511" width="344" height="102" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text class="label" x="190" y="541">分析器對照正解音型</text>
  <text x="190" y="570">頻率、順序、起訖</text>
  <text x="190" y="598">時值、停頓</text>
  <path class="arrow" d="M190 651V620"/>
  <text class="small" x="259" y="639">評分依據</text>
  <rect x="18" y="655" width="344" height="76" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text class="small" x="190" y="685">gold：獨立條件對照與評分</text>
  <text class="small" x="190" y="713">不覆寫 A 的 semantic result</text>
</svg>
