<svg xmlns="http://www.w3.org/2000/svg" width="480" height="450" viewBox="0 0 480 450" role="img" aria-labelledby="title desc">
  <title id="title">三份權重的堆疊與一份權重的三輪更新</title>
  <desc id="desc">左邊輸入依序經過權重A、B、C，右邊同一權重F每輪讀原輸入e及前一狀態，更新後再交回F。兩邊都執行三次區塊。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#30485d" stroke-width="1.3"/></marker></defs>
  <rect width="480" height="450" rx="14" fill="#f7fafc"/>
  <g font-family="sans-serif" font-size="18" fill="#142f45" text-anchor="middle">
    <text x="113" y="30" font-weight="bold">堆疊：三份權重</text>
    <text x="354" y="30" font-weight="bold">循環：一份權重</text>
    <text x="113" y="65">輸入</text><text x="354" y="65">原輸入 e</text>
    <rect x="32" y="95" width="162" height="48" rx="8" fill="#dcebf7" stroke="#366383"/><text x="113" y="125">區塊 A</text>
    <rect x="32" y="178" width="162" height="48" rx="8" fill="#dcebf7" stroke="#366383"/><text x="113" y="208">區塊 B</text>
    <rect x="32" y="261" width="162" height="48" rx="8" fill="#dcebf7" stroke="#366383"/><text x="113" y="291">區塊 C</text>
    <rect x="275" y="178" width="158" height="68" rx="8" fill="#d9eee5" stroke="#39725b"/><text x="354" y="205">共享區塊 F</text><text x="354" y="229">更新狀態</text>
    <text x="354" y="114">初始狀態 s₀</text>
    <text x="343" y="295" text-anchor="end" font-size="16">s₁ → s₂ → s₃</text>
    <text x="113" y="365">輸出頭</text><text x="354" y="365">輸出頭讀 s₃</text>
    <text x="240" y="410">都執行三次區塊；共享省權重，仍要計算。</text>
    <text x="240" y="436" font-size="16">箭頭表示資料傳遞；迴線每次帶回更新後的狀態。</text>
  </g>
  <g fill="none" stroke="#30485d" stroke-width="2" marker-end="url(#arrow)">
    <path d="M113 73V91"/><path d="M113 146V174"/><path d="M113 229V257"/><path d="M113 312V339"/>
    <path d="M354 122V174"/><path d="M354 248V339"/>
    <path d="M433 222H460V148H403V174"/>
    <path d="M280 65H252V195H271"/>
  </g>
  <text x="269" y="88" font-family="sans-serif" font-size="15" fill="#30485d" writing-mode="tb">每輪再讀</text>
</svg>
