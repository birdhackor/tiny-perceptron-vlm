<svg xmlns="http://www.w3.org/2000/svg" width="380" height="448" viewBox="0 0 380 448" role="img" aria-labelledby="title desc">
  <title id="title">VQ-VAE三份loss的參數更新路徑</title>
  <desc id="desc">重建loss為0.325，更新encoder經STE與decoder；碼本loss為0.325，只更新碼本；0.25倍承諾loss為0.08125，只更新encoder。三者前向使用同一個選中碼向量1、1。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172554;text-anchor:middle;font-size:20px}.title{font-size:21px;font-weight:700}.small{font-size:17px}.right{font-size:18px}.arrow{stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="380" height="448" rx="14" fill="#fff"/>
  <text class="title" x="190" y="30">三份 loss，三條更新路徑</text>
  <text class="small" x="190" y="60">箭頭＝這份 loss 會更新</text>
  <rect x="16" y="86" width="158" height="82" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="95" y="117">重建</text><text x="95" y="148">0.325</text>
  <path class="arrow" d="M176 127H202"/>
  <rect x="206" y="86" width="158" height="82" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="right" x="285" y="117">encoder（STE）</text><text class="right" x="285" y="148">＋ decoder</text>
  <rect x="16" y="194" width="158" height="82" rx="9" fill="#fff7ed" stroke="#ea580c"/>
  <text x="95" y="225">碼本</text><text x="95" y="256">0.325</text>
  <path class="arrow" d="M176 235H202"/>
  <rect x="206" y="194" width="158" height="82" rx="9" fill="#fff7ed" stroke="#ea580c"/>
  <text x="285" y="243">碼本</text>
  <rect x="16" y="302" width="158" height="82" rx="9" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="95" y="333">承諾 × 0.25</text><text x="95" y="364">0.08125</text>
  <path class="arrow" d="M176 343H202"/>
  <rect x="206" y="302" width="158" height="82" rx="9" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="285" y="351">encoder</text>
  <text class="small" x="190" y="427">前向仍使用同一選中碼向量 [1,1]</text>
</svg>
