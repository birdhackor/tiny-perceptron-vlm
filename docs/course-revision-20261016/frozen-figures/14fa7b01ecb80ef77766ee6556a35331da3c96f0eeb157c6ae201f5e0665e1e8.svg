<svg xmlns="http://www.w3.org/2000/svg" width="380" height="530" viewBox="0 0 380 530" role="img" aria-labelledby="title desc">
  <title id="title">分塊解碼時接續尚未完成的尾部</title>
  <desc id="desc">hop為2，首塊碼1與3輸出0.5、0.25、1.125、0.5625，保存尾部0.25與0.125。第二塊碼2與1與尾部相加後輸出0、0、0.4375、0.21875。已發出的首塊固定不變。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172554;text-anchor:middle;font-size:19px}.title{font-size:21px;font-weight:700}.small{font-size:17px}.label{font-weight:700}.arrow{stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="380" height="530" rx="14" fill="#fff"/>
  <text class="title" x="190" y="30">分塊解碼：尾部必須接續</text>
  <text class="small" x="190" y="58">hop = 2；每塊送入 2 碼</text>
  <rect x="16" y="76" width="348" height="136" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="label" x="190" y="103">首塊：碼 [1, 3]</text>
  <text x="190" y="132">輸出四個樣本：</text>
  <text x="190" y="160">[0.5, 0.25,</text>
  <text x="190" y="188">1.125, 0.5625]</text>
  <path class="arrow" d="M190 213V234"/>
  <rect x="50" y="238" width="280" height="66" rx="9" fill="#fff7ed" stroke="#ea580c"/>
  <text class="label" x="190" y="264">保存尾部 state</text>
  <text x="190" y="290">[0.25, 0.125]</text>
  <path class="arrow" d="M190 305V327"/>
  <text class="small" x="250" y="324">與新貢獻相加</text>
  <rect x="16" y="332" width="348" height="136" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="label" x="190" y="360">第二塊：碼 [2, 1]</text>
  <text x="190" y="388">輸出四個樣本：</text>
  <text x="190" y="416">[0, 0,</text>
  <text x="190" y="444">0.4375, 0.21875]</text>
  <text class="small" x="190" y="497">新碼只改新輸出；首塊已固定</text>
  <text class="small" x="190" y="522">結尾尾部丟棄，合計 8 樣本</text>
</svg>
