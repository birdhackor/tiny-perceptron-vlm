<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" role="img" aria-labelledby="title desc">
  <title id="title">先看任務與工具狀態，再選下一個動作</title>
  <desc id="desc">三張動作卡是人工訂出的策略。精確計算且計算器可用選TOOL，解釋或照抄選DIRECT，缺資料或缺核對工具選ASK。同一個1加2問題，工具可用與停用時應選不同卡。本圖不代表模型實測。</desc>
  <style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#172b4d} .main{font-size:25px} .small{font-size:22px} .heading{font-size:28px;font-weight:600}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#466b97"/></marker></defs>
  <rect width="760" height="570" fill="#fff"/>
  <text x="380" y="40" text-anchor="middle" class="heading">先看任務，再選動作卡</text>
  <text x="380" y="77" text-anchor="middle" class="small">輸入：使用者問題 ＋ 計算器可用／停用</text>
  <rect x="30" y="104" width="350" height="74" rx="12" fill="#e8f1ff" stroke="#8da8ca"/>
  <text x="205" y="134" text-anchor="middle" class="main">需要精確計算</text>
  <text x="205" y="164" text-anchor="middle" class="small">而且計算器可用</text>
  <path d="M383 141H438" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="449" y="104" width="281" height="74" rx="12" fill="#e8f1ff" stroke="#8da8ca"/>
  <text x="589" y="135" text-anchor="middle" class="main">TOOL：需要工具</text>
  <text x="589" y="165" text-anchor="middle" class="small">再接 B.1–B.4 流程</text>
  <rect x="30" y="196" width="350" height="74" rx="12" fill="#d7f5e6" stroke="#8da8ca"/>
  <text x="205" y="226" text-anchor="middle" class="main">需要解釋概念</text>
  <text x="205" y="256" text-anchor="middle" class="small">或照抄已給的資訊</text>
  <path d="M383 233H438" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="449" y="196" width="281" height="74" rx="12" fill="#d7f5e6" stroke="#8da8ca"/>
  <text x="589" y="227" text-anchor="middle" class="main">DIRECT：直接回答</text>
  <text x="589" y="257" text-anchor="middle" class="small">不要求計算器</text>
  <rect x="30" y="288" width="350" height="74" rx="12" fill="#ffe8c7" stroke="#8da8ca"/>
  <text x="205" y="318" text-anchor="middle" class="main">缺少必要資訊</text>
  <text x="205" y="348" text-anchor="middle" class="small">或缺少所需核對工具</text>
  <path d="M383 325H438" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="449" y="288" width="281" height="74" rx="12" fill="#ffe8c7" stroke="#8da8ca"/>
  <text x="589" y="319" text-anchor="middle" class="main">ASK：先求助</text>
  <text x="589" y="349" text-anchor="middle" class="small">補數字或核對方式</text>
  <rect x="30" y="390" width="700" height="132" rx="12" fill="#f5f7fa" stroke="#8da8ca"/>
  <text x="380" y="423" text-anchor="middle" class="main">同一句「1加2等於多少？」</text>
  <text x="380" y="463" text-anchor="middle" class="small">工具可用 → TOOL　　工具停用 → ASK</text>
  <text x="380" y="500" text-anchor="middle" class="small">先教固定策略，再比較能力與成本（B.8）</text>
  <text x="380" y="555" text-anchor="middle" class="small">人工策略圖；不是模型成績，也不是工具已執行。</text>
</svg>
