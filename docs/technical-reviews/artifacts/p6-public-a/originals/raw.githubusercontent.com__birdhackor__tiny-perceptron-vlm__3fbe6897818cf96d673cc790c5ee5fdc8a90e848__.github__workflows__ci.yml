name: Temporary LFS upload

on:
  push:
    branches: [codex/lfs-upload-20261002-abc8e7c]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Rebuild pinned source and verify original archive
        run: uv run --no-project --python 3.13.5 --with pyarrow==25.0.1 .lfs-upload/rebuild.py --asset all
      - name: Upload verified snapshot to Git LFS
        shell: bash
        run: |
          git lfs install --local
          git lfs track '/assets/training/*.tar.gz'
          git add .gitattributes assets/training/*.tar.gz
          python - <<'PY' | git lfs push --object-id origin --stdin
          import json
          from pathlib import Path
          for asset in json.loads(Path('.lfs-upload/spec.json').read_text())['assets']:
              print(asset['archive_sha256'])
          PY
