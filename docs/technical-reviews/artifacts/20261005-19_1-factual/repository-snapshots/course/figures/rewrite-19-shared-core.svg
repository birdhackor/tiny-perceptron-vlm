<svg xmlns="http://www.w3.org/2000/svg" width="640" height="669" viewBox="0 0 640 669" role="img" aria-labelledby="title desc"><title id="title">不同入口，同一核心</title><desc id="desc">整合設計；神經權重均自行訓練。各入口會合到同一個核心。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#14724d"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#17324d}</style><rect width="640" height="669" rx="18" fill="white"/><text x="28" y="48" font-size="32" font-weight="700" text-anchor="start">不同入口，同一核心</text><text x="28" y="87" font-size="28" font-weight="400" text-anchor="start">整合設計；神經權重均自行訓練</text><rect x="32" y="108" width="516" height="86" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="56" y="150" font-size="32" font-weight="700" text-anchor="start">文字＋保留的對話歷史</text><text x="56" y="188" font-size="28" font-weight="400" text-anchor="start">短問答、格式與更改條件</text><path d="M548 151 H598" fill="none" stroke="#14724d" stroke-width="3"/><rect x="32" y="228" width="516" height="86" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="56" y="270" font-size="32" font-weight="700" text-anchor="start">圖片→自訓練入口／投影</text><text x="56" y="308" font-size="28" font-weight="400" text-anchor="start">三類商品／指定框字卡</text><path d="M548 271 H598" fill="none" stroke="#14724d" stroke-width="3"/><rect x="32" y="348" width="516" height="86" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="56" y="390" font-size="32" font-weight="700" text-anchor="start">聲音→自訓練入口／投影</text><text x="56" y="428" font-size="28" font-weight="400" text-anchor="start">三種意圖，保留時間序列</text><path d="M548 391 H598" fill="none" stroke="#14724d" stroke-width="3"/><path d="M598 151 V476 H320 V500" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="516" width="576" height="94" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="56" y="558" font-size="32" font-weight="700" text-anchor="start">同一MoE聊天核心</text><text x="56" y="596" font-size="28" font-weight="400" text-anchor="start">生成回答／補問／工具請求</text><text x="28" y="645" font-size="28" font-weight="400" text-anchor="start">工具程式實算，真結果再交回核心</text></svg>
