<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">交換紅藍順序，平均摘要仍相同</title>
  <desc id="desc">原圖甲紅條在左、藍條在右；原圖乙相反。兩條都在同一個平均格內，平均後都成為相同的紫色，完整序列仍能保留左右差別。</desc>
  <rect width="1200" height="480" rx="18" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#172554" font-size="26">
    <text x="40" y="48" font-size="32" font-weight="bold">座位表的順序，不能從平均顏色還原</text>
    <text x="55" y="105">原圖甲</text><text x="385" y="105">原圖乙</text>
    <rect x="55" y="128" width="250" height="190" fill="#fff" stroke="#64748b" stroke-width="3"/>
    <rect x="385" y="128" width="250" height="190" fill="#fff" stroke="#64748b" stroke-width="3"/>
    <rect x="65" y="178" width="50" height="90" fill="#dc2626"/>
    <rect x="115" y="178" width="50" height="90" fill="#2563eb"/>
    <rect x="395" y="178" width="50" height="90" fill="#2563eb"/>
    <rect x="445" y="178" width="50" height="90" fill="#dc2626"/>
    <rect x="60" y="150" width="110" height="140" fill="none" stroke="#9333ea" stroke-width="3" stroke-dasharray="8 6"/>
    <rect x="390" y="150" width="110" height="140" fill="none" stroke="#9333ea" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="55" y="355">紅在藍左邊</text><text x="385" y="355">藍在紅左邊</text>
    <path d="M665 215H790" stroke="#475569" stroke-width="4"/><path d="M790 215l-18 -10v20Z" fill="#475569"/>
    <text x="670" y="180" font-size="23">格內平均</text>
    <rect x="830" y="150" width="310" height="145" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="850" y="200">兩張得到同一份摘要</text>
    <text x="850" y="245" font-size="23">紅、藍各佔相同份量</text>
    <text x="55" y="420" font-size="25">示意只畫局部；程式實際在32×32圖片的同一個8×8平均格內交換。</text>
  </g>
</svg>
