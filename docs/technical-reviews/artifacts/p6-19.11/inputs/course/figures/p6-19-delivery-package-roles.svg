<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="title desc">
  <title id="title">公開推論包與自己的訓練工作檔用途不同</title>
  <desc id="desc">上方公開的四個安全格式檔案提供回答與評測。下方自己的完整訓練工作檔，best用作新階段起點，latest恢復同階段進度。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#334155" stroke-width="2"/></marker>
  </defs>
  <rect width="640" height="450" rx="16" fill="#f8fafc"/>
  <g font-family="Noto Sans CJK TC, Noto Sans, sans-serif" fill="#0f172a">
    <text x="28" y="43" font-size="27" font-weight="700">拿到哪種包裹，就能做哪種事</text>
    <rect x="24" y="63" width="592" height="135" rx="13" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="42" y="98" font-size="25" font-weight="700">公開推論包：4個安全格式檔案</text>
    <text x="42" y="132" font-size="24">權重＋結構＋字表＋來源清單</text>
    <path d="M45 164 H104" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="127" y="173" font-size="24">載入後回答／評測</text>
    <rect x="24" y="218" width="592" height="208" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="42" y="253" font-size="25" font-weight="700">自己的完整訓練工作檔</text>
    <text x="42" y="286" font-size="23">另存更新器、隨機、取樣與進度</text>
    <text x="42" y="339" font-size="24" font-weight="700">best.pt</text>
    <path d="M166 330 H222" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="246" y="339" font-size="24">開啟新階段</text>
    <text x="42" y="391" font-size="24" font-weight="700">latest.pt</text>
    <path d="M166 382 H222" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="246" y="391" font-size="24">恢復同階段進度</text>
  </g>
</svg>
