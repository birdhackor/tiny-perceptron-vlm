pyproject.toml:L1-L65
1: [project]
2: name = "tiny-perceptron-vlm"
3: version = "0.1.0"
4: description = "小小感知機 Tiny Perceptron: a playful multimodal from-scratch tutorial"
5: readme = "README.md"
6: license = "MIT"
7: license-files = ["LICENSE"]
8: authors = [{ name = "birdhackor" }]
9: requires-python = ">=3.11"
10: dependencies = [
11:     "torch>=2.11",           # 模型、訓練、STFT / mel 頻譜都自己用 PyTorch 寫
12:     "numpy>=1.26",
13:     "pillow>=11.0",          # 影像解碼
14:     "soundfile>=0.13",       # 音訊解碼（wav / flac / mp3 / ogg），wheel 已內建 libsndfile
15:     "tokenizers>=0.21",      # 自己訓練中英文 BPE tokenizer
16:     "datasets>=4.0",         # 下載與讀取資料集
17:     "huggingface-hub>=0.34", # 下載檔案；支援 HF_ENDPOINT 鏡像
18: ]
19: 
20: # 依硬體選擇 PyTorch 版本（擇一）。不加 extra 時用 PyPI 預設版：
21: # Linux 是 CUDA 13.0 版、macOS 支援 MPS、Windows 只有 CPU。
22: #   uv sync --extra cpu     沒有 GPU，只想裝小一點的 CPU 版
23: #   uv sync --extra cu126   NVIDIA 驅動 < 580，或 GTX 9 / 10 系列、V100 等舊顯卡（不支援 RTX 50 系列）
24: #   uv sync --extra cu130   Windows + NVIDIA GPU（驅動 >= 580）
25: # 注意：用了 extra 之後，`uv run` 也要帶同一個 --extra，否則 uv 會把 torch 換回預設版。
26: [project.optional-dependencies]
27: cpu = ["torch>=2.11"]
28: cu126 = ["torch>=2.11"]
29: cu130 = ["torch>=2.11"]
30: selftrained = ["safetensors==0.8.0"]
31: 
32: [dependency-groups]
33: dev = ["pytest>=8", "ruff>=0.14", "safetensors==0.8.0"]
34: notebook = [
35:     "ipykernel>=6",
36:     "matplotlib>=3.9",
37:     "jupyterlab>=4",
38:     "nbclient>=0.10",
39: ]
40: site = [
41:     "zensical==0.0.67",
42: ]
43: 
44: [build-system]
45: requires = ["hatchling"]
46: build-backend = "hatchling.build"
47: 
48: [tool.hatch.build.targets.wheel]
49: packages = ["tiny_perceptron"]
50: 
51: [tool.uv]
52: conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }]]
53: 
54: [tool.uv.sources]
55: torch = [
56:     { index = "pytorch-cpu", extra = "cpu" },
57:     { index = "pytorch-cu126", extra = "cu126" },
58:     { index = "pytorch-cu130", extra = "cu130" },
59: ]
60: 
61: [[tool.uv.index]]
62: name = "pytorch-cpu"
63: url = "https://download.pytorch.org/whl/cpu"
64: explicit = true
65: 
