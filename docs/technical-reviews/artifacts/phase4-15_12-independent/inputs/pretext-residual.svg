<svg xmlns="http://www.w3.org/2000/svg" width="640" height="735" viewBox="0 0 640 735" role="img" aria-labelledby="title desc"><title id="title">殘差兩路的數值和敏感度</title><desc id="desc">手算示意。同一位置兩格1和2，直接保留和乘二修正分支相加為3和6。各格敏感度1加2為3。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#54728c"/></marker></defs><rect width="640" height="735" fill="#fff"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="320" y="45" text-anchor="middle" font-size="34" fill="#173047" font-weight="bold">同一位置的特徵走兩路</text><rect x="125" y="83" width="390" height="68" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="130" text-anchor="middle" font-size="36" fill="#173047" font-weight="normal">x = [1, 2]</text><path d="M180,160 L160,215" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><path d="M460,160 L480,215" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="239" width="290" height="127" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="165" y="282" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">直接保留</text><text x="165" y="332" text-anchor="middle" font-size="34" fill="#173047" font-weight="normal">[1, 2]</text><rect x="330" y="239" width="290" height="127" rx="12" fill="#fff0d9" stroke="#54728c" stroke-width="2"/><text x="475" y="282" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">修正：2 × x</text><text x="475" y="332" text-anchor="middle" font-size="34" fill="#173047" font-weight="normal">[2, 4]</text><path d="M165,376 L277,438" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><path d="M475,376 L363,438" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="480" text-anchor="middle" font-size="46" fill="#173047" font-weight="bold">＋</text><rect x="125" y="513" width="390" height="67" rx="12" fill="#e7f6ec" stroke="#54728c" stroke-width="2"/><text x="320" y="559" text-anchor="middle" font-size="36" fill="#173047" font-weight="normal">y = [3, 6]</text><text x="320" y="639" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">每格敏感度：直接路 1 + 修正路 2</text><text x="320" y="687" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">合成為 3；沒有做參數更新</text></g></svg>