<svg xmlns="http://www.w3.org/2000/svg" width="640" height="795" viewBox="0 0 640 795" role="img" aria-labelledby="title desc"><title id="title">數值和鏈式敏感度</title><desc id="desc">手算示意。w3乘2得u6平方得L36，反向L對u的敏感度12再乘u對w的敏感度2得到24。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#54728c"/></marker></defs><rect width="640" height="795" fill="#fff"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="320" y="45" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">向前算數值，向後算敏感度</text><rect x="145" y="90" width="350" height="67" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="136" text-anchor="middle" font-size="36" fill="#173047" font-weight="normal">w = 3</text><path d="M320,164 L320,203" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="196" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">× 2</text><rect x="145" y="227" width="350" height="67" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="273" text-anchor="middle" font-size="36" fill="#173047" font-weight="normal">u = 6</text><path d="M320,301 L320,340" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="333" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">平方</text><rect x="145" y="364" width="350" height="67" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="410" text-anchor="middle" font-size="36" fill="#173047" font-weight="normal">L = 36</text><rect x="30" y="519" width="580" height="174" rx="12" fill="#fff0d9" stroke="#54728c" stroke-width="2"/><text x="320" y="563" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">反向：L 對 u 的敏感度 12</text><text x="320" y="609" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">再乘 u 對 w 的敏感度 2</text><text x="320" y="660" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">w 的梯度 = 12 × 2 = 24</text><text x="320" y="750" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">L = 36 是代價；24 才是梯度</text></g></svg>