<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">一像素筆畫縮小後變成淡色</title>
  <desc id="desc">原始八欄只有一欄亮，區域平均後亮度從一變成八分之一。放大模型不能讓輸入恢復成原始筆畫，保留較高解析度可以減少這種資訊損失。</desc>
  <rect width="1200" height="430" rx="18" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#172554" font-size="26">
    <text x="40" y="52" font-size="32" font-weight="bold">先縮得太小，細筆畫就可能變淡</text>
    <text x="55" y="115">原圖：每八欄只亮一欄</text>
    <rect x="55" y="140" width="320" height="160" fill="#111827"/>
    <rect x="215" y="140" width="40" height="160" fill="#fff"/>
    <path d="M95 140v160m40 -160v160m40 -160v160m40 -160v160m40 -160v160m40 -160v160m40 -160v160" stroke="#64748b" stroke-width="1"/>
    <text x="55" y="350">最亮的數字：1</text>
    <path d="M420 215H650" stroke="#475569" stroke-width="4"/><path d="M650 215l-18 -10v20Z" fill="#475569"/>
    <text x="435" y="175" font-size="24">八欄平均成一欄</text>
    <rect x="710" y="140" width="160" height="160" fill="#202020" stroke="#64748b" stroke-width="2"/>
    <text x="705" y="350">最亮的數字：0.125</text>
    <text x="920" y="205" font-size="24">不是新的模型錯誤</text>
    <text x="920" y="250" font-size="24">輸入已先變模糊</text>
    <text x="55" y="401" font-size="23">圖上放大像素供觀察；這是一條亮線的縮圖實驗，沒有進行中文辨識。</text>
  </g>
</svg>
