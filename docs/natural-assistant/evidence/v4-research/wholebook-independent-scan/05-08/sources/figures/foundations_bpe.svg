<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" aria-labelledby="title desc"><title id="title">最常見相鄰對 ab，合併成一項</title><desc id="desc">兩份文件abab與abac，各自計數相鄰對，ab三次、ba兩次、ac一次。選ab後第一份變ab ab，第二份變ab a c。不跨文件邊界配對。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="680" height="440" rx="12" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a"><text x="340" y="35" font-size="28" text-anchor="middle" fill="#0f172a">只在各份文件內數相鄰對</text><text x="82" y="98" font-size="25" text-anchor="middle" fill="#0f172a">文件 1</text><rect x="170" y="60" width="64" height="57" rx="8" fill="#ffedd5" stroke="#94a3b8" stroke-width="2"/><text x="202" y="99" font-size="34" text-anchor="middle" fill="#0f172a">a</text><rect x="250" y="60" width="64" height="57" rx="8" fill="#ffedd5" stroke="#94a3b8" stroke-width="2"/><text x="282" y="99" font-size="34" text-anchor="middle" fill="#0f172a">b</text><rect x="330" y="60" width="64" height="57" rx="8" fill="#ffedd5" stroke="#94a3b8" stroke-width="2"/><text x="362" y="99" font-size="34" text-anchor="middle" fill="#0f172a">a</text><rect x="410" y="60" width="64" height="57" rx="8" fill="#ffedd5" stroke="#94a3b8" stroke-width="2"/><text x="442" y="99" font-size="34" text-anchor="middle" fill="#0f172a">b</text><text x="82" y="185" font-size="25" text-anchor="middle" fill="#0f172a">文件 2</text><rect x="170" y="147" width="64" height="57" rx="8" fill="#ffedd5" stroke="#94a3b8" stroke-width="2"/><text x="202" y="186" font-size="34" text-anchor="middle" fill="#0f172a">a</text><rect x="250" y="147" width="64" height="57" rx="8" fill="#ffedd5" stroke="#94a3b8" stroke-width="2"/><text x="282" y="186" font-size="34" text-anchor="middle" fill="#0f172a">b</text><rect x="330" y="147" width="64" height="57" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="362" y="186" font-size="34" text-anchor="middle" fill="#0f172a">a</text><rect x="410" y="147" width="64" height="57" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="442" y="186" font-size="34" text-anchor="middle" fill="#0f172a">c</text><text x="340" y="247" font-size="27" text-anchor="middle" fill="#0f172a">ab：3 次　ba：2 次　ac：1 次</text><path d="M340 261V299" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="478" y="289" font-size="26" text-anchor="middle" fill="#0f172a">選 ab 合併</text><rect x="110" y="320" width="65" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="142" y="360" font-size="31" text-anchor="middle" fill="#0f172a">ab</text><rect x="185" y="320" width="65" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="217" y="360" font-size="31" text-anchor="middle" fill="#0f172a">ab</text><rect x="390" y="320" width="65" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="422" y="360" font-size="31" text-anchor="middle" fill="#0f172a">ab</text><rect x="465" y="320" width="65" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="497" y="360" font-size="31" text-anchor="middle" fill="#0f172a">a</text><rect x="540" y="320" width="65" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="572" y="360" font-size="31" text-anchor="middle" fill="#0f172a">c</text><text x="185" y="418" font-size="25" text-anchor="middle" fill="#0f172a">文件 1：2 項</text><text x="502" y="418" font-size="25" text-anchor="middle" fill="#0f172a">文件 2：3 項</text></g></svg>
