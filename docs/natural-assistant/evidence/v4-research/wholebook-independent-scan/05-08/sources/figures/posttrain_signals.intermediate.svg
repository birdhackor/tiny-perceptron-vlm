<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" role="img" aria-labelledby="title desc">
  <title id="title">示範、比較與作答後評分的三種訓練訊號</title>
  <desc id="desc">示範供SFT學習；回答偏好可直接供DPO，也能先教獎勵模型；獎勵模型或驗算規則評分後，可以用PPO等方法更新策略。各方法是可選路線。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs>
  <rect width="820" height="490" rx="16" fill="#f8fafc"/>
  <g font-family="Noto Sans CJK TC, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="410" y="38" font-size="24" font-weight="bold">先看老師給什麼，再選學法</text>
    <rect x="30" y="73" width="230" height="128" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="145" y="105" font-size="22" font-weight="bold">一份好回答</text>
    <text x="145" y="138" font-size="18">問題：只回數字 1+2</text>
    <text x="145" y="171" font-size="20">示範：「3」</text>
    <path d="M145 205V254" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="30" y="268" width="230" height="98" rx="12" fill="#dcfce7" stroke="#15803d"/>
    <text x="145" y="303" font-size="22" font-weight="bold">SFT</text>
    <text x="145" y="336" font-size="18">提高示範回答的機率</text>
    <rect x="290" y="73" width="240" height="128" rx="12" fill="#fef3c7" stroke="#b45309"/>
    <text x="410" y="105" font-size="22" font-weight="bold">兩篇回答的比較</text>
    <text x="410" y="138" font-size="18">「3」較合適</text>
    <text x="410" y="171" font-size="18">「答案是3喔！」較差</text>
    <path d="M410 205V254" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="290" y="268" width="240" height="98" rx="12" fill="#dcfce7" stroke="#15803d"/>
    <text x="410" y="303" font-size="22" font-weight="bold">DPO</text>
    <text x="410" y="336" font-size="18">直接學相對偏好</text>
    <path d="M535 136H548V242H575V202" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="684" y="221" font-size="18">先教評分員</text>
    <text x="684" y="245" font-size="18">再評新回答</text>
    <rect x="565" y="73" width="225" height="128" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="677" y="105" font-size="22" font-weight="bold">作答後得到分數</text>
    <text x="677" y="138" font-size="18">先選回答，再評分</text>
    <text x="677" y="171" font-size="18">評分也可來自驗算</text>
    <path d="M740 205V254" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="565" y="268" width="225" height="98" rx="12" fill="#dcfce7" stroke="#15803d"/>
    <text x="677" y="303" font-size="22" font-weight="bold">PPO 等更新方法</text>
    <text x="677" y="336" font-size="18">按回饋調整選擇</text>
    <text x="410" y="410" font-size="18">真人回饋：典型 RLHF 來源　｜　程式驗算：可驗證回饋</text>
    <text x="410" y="450" font-size="18">三種教法可選擇與組合，沒有要求逐項全部跑過。</text>
  </g>
</svg>
