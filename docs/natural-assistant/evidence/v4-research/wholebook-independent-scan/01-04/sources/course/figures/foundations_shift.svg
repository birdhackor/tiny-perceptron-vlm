<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="title desc"><title id="title">下一字問題與答案對齊</title><desc id="desc">原句貓看狗句號，建立三題：貓對看、看對狗、狗對句號。最後句號沒有下一字，所以不當問題。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="680" height="300" rx="12" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a"><text x="340" y="37" font-size="30" text-anchor="middle" fill="#0f172a">原句：貓 看 狗 。</text><text x="70" y="110" font-size="26" text-anchor="middle" fill="#0f172a">問題 x</text><text x="70" y="216" font-size="26" text-anchor="middle" fill="#0f172a">答案 y</text><rect x="150" y="66" width="120" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="210" y="112" font-size="38" text-anchor="middle" fill="#0f172a">貓</text><rect x="150" y="171" width="120" height="65" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="210" y="217" font-size="38" text-anchor="middle" fill="#0f172a">看</text><path d="M210 134V160" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="66" width="120" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="400" y="112" font-size="38" text-anchor="middle" fill="#0f172a">看</text><rect x="340" y="171" width="120" height="65" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="400" y="217" font-size="38" text-anchor="middle" fill="#0f172a">狗</text><path d="M400 134V160" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="530" y="66" width="120" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="590" y="112" font-size="38" text-anchor="middle" fill="#0f172a">狗</text><rect x="530" y="171" width="120" height="65" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="590" y="217" font-size="38" text-anchor="middle" fill="#0f172a">。</text><path d="M590 134V160" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="340" y="281" font-size="25" text-anchor="middle" fill="#0f172a">每個箭頭是一題，答案是原句的下一字</text></g></svg>
