<svg xmlns="http://www.w3.org/2000/svg" width="680" height="325" viewBox="0 0 680 325" role="img" aria-labelledby="title desc"><title id="title">兩段運算的敏感度相乘</title><desc id="desc">w等於三，乘二得到u等於六，再平方得到代價三十六。反向時，代價對u的敏感度十二乘u對w的敏感度二，得到w梯度二十四。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#c2410c"/></marker></defs><rect width="680" height="325" rx="12" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a"><text x="340" y="36" font-size="28" text-anchor="middle" fill="#0f172a">向右算數值，向左算局部敏感度</text><rect x="20" y="85" width="150" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="95" y="130" font-size="32" text-anchor="middle" fill="#0f172a">w = 3</text><rect x="265" y="85" width="150" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="340" y="130" font-size="32" text-anchor="middle" fill="#0f172a">u = 6</text><rect x="510" y="85" width="150" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="585" y="130" font-size="32" text-anchor="middle" fill="#0f172a">L = 36</text><path d="M176 117H252" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><path d="M421 117H497" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><text x="215" y="77" font-size="25" text-anchor="middle" fill="#0f172a">u = 2w</text><text x="460" y="77" font-size="25" text-anchor="middle" fill="#0f172a">L = u²</text><path d="M252 200H176" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#orange)"/><path d="M497 200H421" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#orange)"/><text x="215" y="243" font-size="26" text-anchor="middle" fill="#9a3412">du/dw = 2</text><text x="460" y="243" font-size="26" text-anchor="middle" fill="#9a3412">dL/du = 12</text><text x="340" y="302" font-size="30" text-anchor="middle" fill="#9a3412">w 的梯度：12 × 2 = 24</text></g></svg>
