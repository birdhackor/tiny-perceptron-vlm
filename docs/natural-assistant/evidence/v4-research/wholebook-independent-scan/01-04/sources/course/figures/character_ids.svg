<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 346" role="img" aria-labelledby="title desc">
    <title id="title">先約定字表，再替原句的每個字查編號</title><desc id="desc">兩個橘色的「貓」都查到 3；編號不表示字義。所有內容靜態可見。</desc>
    <style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#466b97"/></marker></defs>
    <rect width="800" height="346" fill="#fff"/><text x="400" y="32" font-size="26" fill="#172b4d" text-anchor="middle">先約定字表，再替原句的每個字查編號</text>
    <text x="20" y="103" font-size="24" fill="#172b4d" text-anchor="start">原句</text><text x="20" y="178" font-size="24" fill="#172b4d" text-anchor="start">編號</text><rect x="100" y="68" width="70" height="50" rx="10" fill="#ffe8c7" stroke="#8da8ca"/><text x="135" y="104" font-size="30" fill="#172b4d" text-anchor="middle">貓</text><path d="M135 119V137" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="143" width="70" height="50" rx="10" fill="#ffe8c7" stroke="#8da8ca"/><text x="135" y="179" font-size="30" fill="#172b4d" text-anchor="middle">3</text><rect x="182" y="68" width="70" height="50" rx="10" fill="#e8f1ff" stroke="#8da8ca"/><text x="217" y="104" font-size="30" fill="#172b4d" text-anchor="middle">看</text><path d="M217 119V137" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/><rect x="182" y="143" width="70" height="50" rx="10" fill="#e8f1ff" stroke="#8da8ca"/><text x="217" y="179" font-size="30" fill="#172b4d" text-anchor="middle">2</text><rect x="264" y="68" width="70" height="50" rx="10" fill="#e8f1ff" stroke="#8da8ca"/><text x="299" y="104" font-size="30" fill="#172b4d" text-anchor="middle">狗</text><path d="M299 119V137" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/><rect x="264" y="143" width="70" height="50" rx="10" fill="#e8f1ff" stroke="#8da8ca"/><text x="299" y="179" font-size="30" fill="#172b4d" text-anchor="middle">1</text><rect x="346" y="68" width="70" height="50" rx="10" fill="#e8f1ff" stroke="#8da8ca"/><text x="381" y="104" font-size="30" fill="#172b4d" text-anchor="middle">，</text><path d="M381 119V137" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/><rect x="346" y="143" width="70" height="50" rx="10" fill="#e8f1ff" stroke="#8da8ca"/><text x="381" y="179" font-size="30" fill="#172b4d" text-anchor="middle">4</text><rect x="428" y="68" width="70" height="50" rx="10" fill="#e8f1ff" stroke="#8da8ca"/><text x="463" y="104" font-size="30" fill="#172b4d" text-anchor="middle">狗</text><path d="M463 119V137" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/><rect x="428" y="143" width="70" height="50" rx="10" fill="#e8f1ff" stroke="#8da8ca"/><text x="463" y="179" font-size="30" fill="#172b4d" text-anchor="middle">1</text><rect x="510" y="68" width="70" height="50" rx="10" fill="#e8f1ff" stroke="#8da8ca"/><text x="545" y="104" font-size="30" fill="#172b4d" text-anchor="middle">看</text><path d="M545 119V137" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="143" width="70" height="50" rx="10" fill="#e8f1ff" stroke="#8da8ca"/><text x="545" y="179" font-size="30" fill="#172b4d" text-anchor="middle">2</text><rect x="592" y="68" width="70" height="50" rx="10" fill="#ffe8c7" stroke="#8da8ca"/><text x="627" y="104" font-size="30" fill="#172b4d" text-anchor="middle">貓</text><path d="M627 119V137" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/><rect x="592" y="143" width="70" height="50" rx="10" fill="#ffe8c7" stroke="#8da8ca"/><text x="627" y="179" font-size="30" fill="#172b4d" text-anchor="middle">3</text><rect x="674" y="68" width="70" height="50" rx="10" fill="#e8f1ff" stroke="#8da8ca"/><text x="709" y="104" font-size="30" fill="#172b4d" text-anchor="middle">。</text><path d="M709 119V137" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/><rect x="674" y="143" width="70" height="50" rx="10" fill="#e8f1ff" stroke="#8da8ca"/><text x="709" y="179" font-size="30" fill="#172b4d" text-anchor="middle">0</text><text x="400" y="239" font-size="24" fill="#172b4d" text-anchor="middle">字表：0 → 。　1 → 狗　2 → 看　3 → 貓　4 → ，</text><text x="400" y="283" font-size="24" fill="#172b4d" text-anchor="middle">反向查字表，就能把這排編號還原成原句。</text><text x="400" y="330" font-size="22" fill="#172b4d" text-anchor="middle">兩個橘色的「貓」都查到 3；編號不表示字義</text>
    </svg>