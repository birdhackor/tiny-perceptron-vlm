<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img" aria-labelledby="title desc"><title id="title">兩個 head 各讀整串，再拼回八特徵</title><desc id="desc">一筆四位置八特徵經三套線性配方形成Q K V，投影後的八特徵拆成兩個head，各head仍保留四位置，每位置四特徵，各有四乘四讀取比例表。兩份輸出拼接回四位置八特徵，再用輸出線性層混合。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="680" height="620" rx="12" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a"><text x="340" y="36" font-size="27" text-anchor="middle" fill="#0f172a">2 個 head：每個都保留全部 4 個位置</text><rect x="145" y="55" width="390" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="340" y="91" font-size="30" text-anchor="middle" fill="#0f172a">X：[1, 4, 8]</text><path d="M340 112V146" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="485" y="139" font-size="25" text-anchor="middle" fill="#0f172a">三套 Linear</text><rect x="60" y="159" width="560" height="58" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="340" y="195" font-size="28" text-anchor="middle" fill="#0f172a">Q、K、V 各為 [1, 4, 8]</text><path d="M270 218L180 255" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><path d="M410 218L500 255" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="340" y="249" font-size="24" text-anchor="middle" fill="#0f172a">拆投影後特徵</text><rect x="30" y="270" width="295" height="197" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="177" y="307" font-size="30" text-anchor="middle" fill="#0f172a">head 0</text><text x="177" y="349" font-size="27" text-anchor="middle" fill="#0f172a">4 位置 × 4 特徵</text><text x="177" y="390" font-size="25" text-anchor="middle" fill="#0f172a">自己的 4 × 4 比例表</text><text x="177" y="433" font-size="27" text-anchor="middle" fill="#0f172a">輸出：4 × 4</text><rect x="355" y="270" width="295" height="197" rx="8" fill="#ffedd5" stroke="#64748b" stroke-width="2"/><text x="502" y="307" font-size="30" text-anchor="middle" fill="#0f172a">head 1</text><text x="502" y="349" font-size="27" text-anchor="middle" fill="#0f172a">4 位置 × 4 特徵</text><text x="502" y="390" font-size="25" text-anchor="middle" fill="#0f172a">自己的 4 × 4 比例表</text><text x="502" y="433" font-size="27" text-anchor="middle" fill="#0f172a">輸出：4 × 4</text><path d="M177 470L280 506" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><path d="M502 470L400 506" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="518" width="480" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="340" y="552" font-size="29" text-anchor="middle" fill="#0f172a">拼接 → [1, 4, 8]</text><text x="340" y="603" font-size="25" text-anchor="middle" fill="#0f172a">再經輸出 Linear，混合兩個 head 的特徵</text></g></svg>
