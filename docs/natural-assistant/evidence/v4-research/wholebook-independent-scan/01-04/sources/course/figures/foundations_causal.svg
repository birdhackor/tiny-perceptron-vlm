<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img" aria-labelledby="title desc"><title id="title">四位置只能讀目前及過去</title><desc id="desc">每列為查詢位置零至三，每欄為可讀位置零至三。對角線及左下方綠格允許讀，右上方灰格禁止。匹配分數同為零時，允許的位置平分，依序一、二分之一、三分之一、四分之一。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="680" height="450" rx="12" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a"><text x="340" y="36" font-size="28" text-anchor="middle" fill="#0f172a">同分數時，只在可讀位置平分比例</text><text x="235" y="84" font-size="25" text-anchor="middle" fill="#0f172a">位置 0</text><text x="345" y="84" font-size="25" text-anchor="middle" fill="#0f172a">位置 1</text><text x="455" y="84" font-size="25" text-anchor="middle" fill="#0f172a">位置 2</text><text x="565" y="84" font-size="25" text-anchor="middle" fill="#0f172a">位置 3</text><text x="84" y="142" font-size="26" text-anchor="middle" fill="#0f172a">查詢 0</text><rect x="180" y="101" width="105" height="62" rx="3" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="232" y="143" font-size="31" text-anchor="middle" fill="#0f172a">1</text><rect x="290" y="101" width="105" height="62" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="342" y="143" font-size="31" text-anchor="middle" fill="#0f172a">×</text><rect x="400" y="101" width="105" height="62" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="452" y="143" font-size="31" text-anchor="middle" fill="#0f172a">×</text><rect x="510" y="101" width="105" height="62" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="562" y="143" font-size="31" text-anchor="middle" fill="#0f172a">×</text><text x="84" y="214" font-size="26" text-anchor="middle" fill="#0f172a">查詢 1</text><rect x="180" y="173" width="105" height="62" rx="3" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="232" y="215" font-size="31" text-anchor="middle" fill="#0f172a">1/2</text><rect x="290" y="173" width="105" height="62" rx="3" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="342" y="215" font-size="31" text-anchor="middle" fill="#0f172a">1/2</text><rect x="400" y="173" width="105" height="62" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="452" y="215" font-size="31" text-anchor="middle" fill="#0f172a">×</text><rect x="510" y="173" width="105" height="62" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="562" y="215" font-size="31" text-anchor="middle" fill="#0f172a">×</text><text x="84" y="286" font-size="26" text-anchor="middle" fill="#0f172a">查詢 2</text><rect x="180" y="245" width="105" height="62" rx="3" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="232" y="287" font-size="31" text-anchor="middle" fill="#0f172a">1/3</text><rect x="290" y="245" width="105" height="62" rx="3" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="342" y="287" font-size="31" text-anchor="middle" fill="#0f172a">1/3</text><rect x="400" y="245" width="105" height="62" rx="3" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="452" y="287" font-size="31" text-anchor="middle" fill="#0f172a">1/3</text><rect x="510" y="245" width="105" height="62" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="562" y="287" font-size="31" text-anchor="middle" fill="#0f172a">×</text><text x="84" y="358" font-size="26" text-anchor="middle" fill="#0f172a">查詢 3</text><rect x="180" y="317" width="105" height="62" rx="3" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="232" y="359" font-size="31" text-anchor="middle" fill="#0f172a">1/4</text><rect x="290" y="317" width="105" height="62" rx="3" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="342" y="359" font-size="31" text-anchor="middle" fill="#0f172a">1/4</text><rect x="400" y="317" width="105" height="62" rx="3" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="452" y="359" font-size="31" tex