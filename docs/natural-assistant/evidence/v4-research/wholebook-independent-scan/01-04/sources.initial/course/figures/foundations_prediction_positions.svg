<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 475" role="img" aria-labelledby="title desc">
<title id="title">三個輸入位置各有一份下一字分數</title>
<desc id="desc">輸入編號為1、2、3。位置0只讀到1，位置1讀到1和2，位置2讀到1、2和3；每個位置都給20個候選編號打分。這是原有三個位置的三份預測，續寫時先從最後位置的分數選一個新編號。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#172b4d;text-anchor:middle}.arrow{stroke:#466b97;stroke-width:3;fill:none}</style>
<defs><marker id="next" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466b97"/></marker></defs>
<rect width="600" height="475" fill="white"/>
<text x="300" y="39" font-size="30">輸入1、2、3：每個位置各問一題</text>
<text x="180" y="80" font-size="25">可以讀到的前文</text>
<text x="445" y="80" font-size="25">下一編號的分數</text>
<g>
<rect x="24" y="99" width="552" height="84" rx="12" fill="#eef5ff"/>
<text x="75" y="132" font-size="23">位置0</text>
<text x="190" y="153" font-size="32">[1]</text>
<path class="arrow" d="M290 145H330" marker-end="url(#next)"/>
<text x="445" y="134" font-size="27">候選0到19</text>
<text x="445" y="165" font-size="24">各有一個分數</text>
</g>
<g transform="translate(0 100)">
<rect x="24" y="99" width="552" height="84" rx="12" fill="#eef5ff"/>
<text x="75" y="132" font-size="23">位置1</text>
<text x="190" y="153" font-size="32">[1, 2]</text>
<path class="arrow" d="M290 145H330" marker-end="url(#next)"/>
<text x="445" y="134" font-size="27">候選0到19</text>
<text x="445" y="165" font-size="24">各有一個分數</text>
</g>
<g transform="translate(0 200)">
<rect x="24" y="99" width="552" height="84" rx="12" fill="#d7f5e6" stroke="#26875b" stroke-width="2"/>
<text x="75" y="132" font-size="23">位置2</text>
<text x="190" y="153" font-size="32">[1, 2, 3]</text>
<path class="arrow" d="M290 145H330" marker-end="url(#next)"/>
<text x="445" y="134" font-size="27">候選0到19</text>
<text x="445" y="165" font-size="24">各有一個分數</text>
</g>
<text x="300" y="428" font-size="26">續寫：先從綠色那列選1個新編號</text>
<text x="300" y="460" font-size="24">加回輸入後，再計算下一次的分數</text>
</svg>
