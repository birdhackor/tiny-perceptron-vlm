<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-labelledby="title desc"><title id="title">保留原表示，再加上修正</title><desc id="desc">輸入一與二走兩路，直接路保存一與二，修正路乘二變成二與四，兩路相加得到三與六。直接路的敏感度一加修正路二，合成三。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="680" height="360" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#0f172a" text-anchor="middle"><text x="340" y="32" font-size="23">原表示有一條直接保留的路</text><rect x="30" y="128" width="160" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="110" y="170" font-size="29">x = [1, 2]</text><rect x="270" y="60" width="165" height="70" rx="8" fill="#ffedd5" stroke="#c2410c"/><text x="352" y="88" font-size="18">修正 f(x) = 2x</text><text x="352" y="117" font-size="28">[2, 4]</text><circle cx="495" cy="160" r="25" fill="#fff" stroke="#334155"/><text x="495" y="170" font-size="31">+</text><rect x="550" y="128" width="112" height="66" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="606" y="169" font-size="27">[3, 6]</text>
<g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"><path d="M190 160H220V95H258"/><path d="M435 95H495V124"/><path d="M190 160H230V245H495V198"/><path d="M525 160H541"/></g><text x="348" y="236" font-size="25">直接保留 [1, 2]</text><text x="340" y="300" font-size="22">每格結果 = 原值 + 修正</text><text x="340" y="332" font-size="22">每格敏感度 = 直接路 1 + 修正路 2 = 3</text></g></svg>
