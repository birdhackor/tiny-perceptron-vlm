<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" role="img" aria-labelledby="title desc">
  <title id="title">本例加上ReLU，輸出從直線變成V形</title>
  <desc id="desc">同一組手動指定權重。橫軸輸入依序為負二、零、二。左圖直接相加，三個輸出都是零；右圖先用ReLU把負的中間特徵清零再相加，輸出依序為二、零、二，等於離零的距離。沒有訓練或參數更新。</desc>
  <style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#172b4d}.axis{stroke:#466b97;stroke-width:2}.grid{stroke:#d8e2ef;stroke-width:1;stroke-dasharray:5 5}.blue{fill:#2563b8}.orange{fill:#b6530f}</style>
  <defs><marker id="axis-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#466b97"/></marker></defs>
  <rect width="800" height="570" fill="#fff"/>
  <text x="400" y="36" text-anchor="middle" font-size="28">本例加上ReLU，輸出從直線變成V形</text>
  <rect x="30" y="65" width="350" height="450" rx="12" fill="#f5f9ff" stroke="#bccfe5"/>
  <rect x="420" y="65" width="350" height="450" rx="12" fill="#fff8f0" stroke="#ddc4a6"/>
  <text x="205" y="105" text-anchor="middle" font-size="26">直接相加</text>
  <text x="595" y="105" text-anchor="middle" font-size="26">負數清零後再相加</text>
  <text x="205" y="150" text-anchor="middle" font-size="24">輸出</text>
  <text x="595" y="150" text-anchor="middle" font-size="24">輸出</text>
  <path class="grid" d="M80 210H350 M470 210H740"/>
  <path class="axis" d="M205 390V175" marker-end="url(#axis-arrow)"/>
  <path class="axis" d="M80 380H350" marker-end="url(#axis-arrow)"/>
  <path class="axis" d="M595 390V175" marker-end="url(#axis-arrow)"/>
  <path class="axis" d="M470 380H740" marker-end="url(#axis-arrow)"/>
  <text x="178" y="220" text-anchor="end" font-size="24">2</text>
  <text x="568" y="220" text-anchor="end" font-size="24">2</text>
  <path d="M100 380H310" stroke="#2563b8" stroke-width="5" fill="none"/>
  <path d="M490 210L595 380L700 210" stroke="#b6530f" stroke-width="5" fill="none"/>
  <circle cx="100" cy="380" r="7" fill="#2563b8"/>
  <circle cx="205" cy="380" r="7" fill="#2563b8"/>
  <circle cx="310" cy="380" r="7" fill="#2563b8"/>
  <circle cx="490" cy="210" r="7" fill="#b6530f"/>
  <circle cx="595" cy="380" r="7" fill="#b6530f"/>
  <circle cx="700" cy="210" r="7" fill="#b6530f"/>
  <text class="blue" x="100" y="354" text-anchor="middle" font-size="26">0</text>
  <text class="blue" x="205" y="354" text-anchor="middle" font-size="26">0</text>
  <text class="blue" x="310" y="354" text-anchor="middle" font-size="26">0</text>
  <text class="orange" x="490" y="190" text-anchor="middle" font-size="26">2</text>
  <text class="orange" x="595" y="354" text-anchor="middle" font-size="26">0</text>
  <text class="orange" x="700" y="190" text-anchor="middle" font-size="26">2</text>
  <text x="100" y="421" text-anchor="middle" font-size="24">−2</text>
  <text x="205" y="421" text-anchor="middle" font-size="24">0</text>
  <text x="310" y="421" text-anchor="middle" font-size="24">2</text>
  <text x="490" y="421" text-anchor="middle" font-size="24">−2</text>
  <text x="595" y="421" text-anchor="middle" font-size="24">0</text>
  <text x="700" y="421" text-anchor="middle" font-size="24">2</text>
  <text x="330" y="455" text-anchor="end" font-size="24">輸入</text>
  <text x="720" y="455" text-anchor="end" font-size="24">輸入</text>
  <text x="205" y="494" text-anchor="middle" font-size="24">三個輸出都是0</text>
  <text x="595" y="494" text-anchor="middle" font-size="24">三個輸出是2、0、2</text>
  <text x="400" y="550" text-anchor="middle" font-size="22">同一組指定權重；圖中的數字來自正文三筆輸入</text>
</svg>
