<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
  <title id="title">同一示範起點分叉成PPO與DPO路線</title>
  <desc id="desc">同一示範選卡模型複製成兩支。PPO支線先訓練評分員，選卡後評分並更新；DPO支線直接學偏好對。兩支共用固定起點參考與同一套最後檢查。沒有要求先PPO再DPO。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs>
  <rect width="820" height="520" rx="16" fill="#f8fafc"/>
  <g font-family="Noto Sans CJK TC, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="410" y="38" font-size="24" font-weight="bold">比較兩條路：先讓起點與驗收相同</text>
    <rect x="250" y="70" width="320" height="70" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="410" y="101" font-size="21" font-weight="bold">同一份示範選卡模型</text>
    <text x="410" y="126" font-size="18">SFT checkpoint，複製兩份</text>
    <path d="M410 145V164" fill="none" stroke="#475569" stroke-width="3"/>
    <path d="M410 164H210V188" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M410 164H610V188" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="200" width="340" height="150" rx="12" fill="#fef3c7" stroke="#b45309"/>
    <text x="210" y="234" font-size="23" font-weight="bold">PPO 路線</text>
    <text x="210" y="267" font-size="19">偏好對 → 先教評分員</text>
    <text x="210" y="297" font-size="19">取樣選卡 → 評分 → 更新</text>
    <text x="210" y="326" font-size="18">另有價值估計與參考約束</text>
    <rect x="440" y="200" width="340" height="150" rx="12" fill="#dcfce7" stroke="#15803d"/>
    <text x="610" y="234" font-size="23" font-weight="bold">DPO 路線</text>
    <text x="610" y="267" font-size="19">偏好對 → 直接更新策略</text>
    <text x="610" y="297" font-size="19">比較同題的兩篇機率</text>
    <text x="610" y="326" font-size="18">保留同一個固定參考</text>
    <path d="M210 355V386H610V355" fill="none" stroke="#475569" stroke-width="3"/>
    <path d="M410 386V396" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="250" y="408" width="320" height="60" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="410" y="445" font-size="21" font-weight="bold">相同題目與獨立規則驗收</text>
    <text x="410" y="501" font-size="18">相同步數仍可能有不同資料與計算成本；不用兩法依序全跑。</text>
  </g>
</svg>
