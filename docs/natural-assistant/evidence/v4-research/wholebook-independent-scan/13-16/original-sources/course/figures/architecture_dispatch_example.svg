<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" role="img" aria-labelledby="title desc">
<title id="title">三筆expert貢獻依原token列號相加</title><desc id="desc">來源列2的兩筆貢獻1,1與3,3相加為4,4；來源列0收到2,2；來源列1沒有收到任何貢獻。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#172b4d} .box{fill:#eef5ff;stroke:#8da8ca;stroke-width:2} .arrow{fill:none;stroke:#466b97;stroke-width:2}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466b97"/></marker></defs>
<rect width="840" height="330" fill="white"/>
<text x="420" y="30" font-size="22" text-anchor="middle">完成順序不同，結果仍按原列號相加</text>
<text x="120" y="66" font-size="17" text-anchor="middle">已乘好router比例的貢獻</text>
<text x="430" y="66" font-size="17" text-anchor="middle">依來源列號送回</text>
<text x="710" y="66" font-size="17" text-anchor="middle">原token順序</text>
<rect class="box" x="25" y="86" width="210" height="48" rx="8"/><text x="130" y="116" font-size="18" text-anchor="middle">列2：[1, 1]</text>
<rect class="box" x="25" y="150" width="210" height="48" rx="8"/><text x="130" y="180" font-size="18" text-anchor="middle">列0：[2, 2]</text>
<rect class="box" x="25" y="214" width="210" height="48" rx="8"/><text x="130" y="244" font-size="18" text-anchor="middle">列2：[3, 3]</text>
<rect class="box" x="600" y="86" width="215" height="48" rx="8"/><text x="708" y="116" font-size="18" text-anchor="middle">列0：[2, 2]</text>
<rect class="box" x="600" y="150" width="215" height="48" rx="8"/><text x="708" y="180" font-size="18" text-anchor="middle">列1：[0, 0]</text>
<rect x="600" y="214" width="215" height="48" rx="8" fill="#d7f5e6" stroke="#26875b" stroke-width="2"/><text x="708" y="244" font-size="18" text-anchor="middle">列2：[4, 4]</text>
<path class="arrow" d="M235 110L330 110L490 238L600 238" marker-end="url(#arrow)"/>
<path class="arrow" d="M235 174L315 174L510 110L600 110" marker-end="url(#arrow)"/>
<path class="arrow" d="M235 238L600 238" marker-end="url(#arrow)"/>
<text x="425" y="280" font-size="17" text-anchor="middle">列2： [1, 1] + [3, 3] = [4, 4]</text>
<text x="420" y="313" font-size="15" text-anchor="middle">本例刻意不提供列1的工作；覆蓋會只留下列2最後一筆 [3, 3]</text>
</svg>
