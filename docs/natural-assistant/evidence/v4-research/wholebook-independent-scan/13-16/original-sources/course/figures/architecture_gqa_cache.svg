<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
<title id="title">四個Query頭共用一組Key與Value快取</title><desc id="desc">左側四個Query頭分別讀四組KV，每組96 bytes，合計384。右側四個Query頭讀同一組KV，共96 bytes。每個快取保存三個位置，每位置四項特徵，K與V各一份FP32。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#172b4d}rect.box{fill:#eef5ff;stroke:#8da8ca}path.line{fill:none;stroke:#466b97;stroke-width:2}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466b97"/></marker></defs>
<rect width="840" height="360" fill="white"/><text x="420" y="28" font-size="22" text-anchor="middle">Query仍有四頭；保存的KV可以減少</text>
<text x="210" y="66" font-size="18" text-anchor="middle">4組KV：384 bytes</text><text x="640" y="66" font-size="18" text-anchor="middle">1組KV：96 bytes</text>
<g font-size="16" text-anchor="middle">
<rect class="box" x="20" y="88" width="90" height="38" rx="6"/><text x="65" y="113">Q頭0</text><rect class="box" x="20" y="144" width="90" height="38" rx="6"/><text x="65" y="169">Q頭1</text><rect class="box" x="20" y="200" width="90" height="38" rx="6"/><text x="65" y="225">Q頭2</text><rect class="box" x="20" y="256" width="90" height="38" rx="6"/><text x="65" y="281">Q頭3</text>
<rect class="box" x="205" y="88" width="180" height="38" rx="6"/><text x="295" y="113">KV頭0：96 bytes</text><rect class="box" x="205" y="144" width="180" height="38" rx="6"/><text x="295" y="169">KV頭1：96 bytes</text><rect class="box" x="205" y="200" width="180" height="38" rx="6"/><text x="295" y="225">KV頭2：96 bytes</text><rect class="box" x="205" y="256" width="180" height="38" rx="6"/><text x="295" y="281">KV頭3：96 bytes</text>
<rect class="box" x="455" y="88" width="90" height="38" rx="6"/><text x="500" y="113">Q頭0</text><rect class="box" x="455" y="144" width="90" height="38" rx="6"/><text x="500" y="169">Q頭1</text><rect class="box" x="455" y="200" width="90" height="38" rx="6"/><text x="500" y="225">Q頭2</text><rect class="box" x="455" y="256" width="90" height="38" rx="6"/><text x="500" y="281">Q頭3</text>
<rect x="640" y="144" width="180" height="90" rx="8" fill="#d7f5e6" stroke="#26875b"/><text x="730" y="179">共享KV頭0</text><text x="730" y="206">96 bytes</text>
</g>
<path class="line" d="M110 107L205 107M110 163L205 163M110 219L205 219M110 275L205 275"/>
<path class="line" d="M545 107L640 168M545 163L640 180M545 219L640 198M545 275L640 212"/>
<text x="420" y="333" font-size="15" text-anchor="middle">連線代表該Query讀取的KV；每組：2 × 3位置 × 4特徵 × 4 bytes = 96 bytes</text>
</svg>
