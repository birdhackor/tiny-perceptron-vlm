<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title desc">
  <title id="title">相同記憶體基線上，手寫與Flash注意力的新增峰值</title>
  <desc id="desc">FP16、固定QKV形狀2乘4乘512乘32的L4補驗。四條路線暖機後基線均65MiB。手寫向前增加24.25、總峰值89.25MiB；Flash向前增加約0.267、總峰值約65.267MiB；手寫向前與反傳增加32.75、總峰值97.75MiB；Flash向前與反傳增加約2.032、總峰值約67.032MiB。灰色為基線，彩色為新增配置。這是PyTorch CUDA allocated bytes，並非整張GPU用量或完整模型訓練記憶體。</desc>
  <rect width="800" height="530" fill="#fff"/>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="400" y="36" font-size="26" text-anchor="middle">先看起點，再比較注意力新增的記憶體</text>
    <text x="18" y="76" font-size="20">FP16：固定Q/K/V，L4實測</text>
    <text x="780" y="76" font-size="20" text-anchor="end">總峰值 MiB</text>
    <text x="18" y="136" font-size="21">手寫：只向前</text>
    <rect x="240" y="111" width="292.5" height="34" rx="3" fill="#cbd5e1"/>
    <rect x="532.5" y="111" width="109.125" height="34" fill="#f4a64c"/>
    <text x="386.25" y="135" font-size="20" text-anchor="middle">65.00 基線</text>
    <text x="587.06" y="135" font-size="20" text-anchor="middle">24.25</text>
    <text x="780" y="136" font-size="21" text-anchor="end">89.25</text>
    <text x="18" y="211" font-size="21">Flash：只向前</text>
    <rect x="240" y="186" width="292.5" height="34" rx="3" fill="#cbd5e1"/>
    <rect x="532.5" y="186" width="1.20" height="34" fill="#167947"/>
    <text x="386.25" y="210" font-size="20" text-anchor="middle">65.00 基線</text>
    <text x="545" y="210" font-size="19" fill="#167947">新增 0.27</text>
    <text x="780" y="211" font-size="21" text-anchor="end">65.27</text>
    <text x="18" y="286" font-size="21">手寫：向前＋反傳</text>
    <rect x="240" y="261" width="292.5" height="34" rx="3" fill="#cbd5e1"/>
    <rect x="532.5" y="261" width="147.375" height="34" fill="#f4a64c"/>
    <text x="386.25" y="285" font-size="20" text-anchor="middle">65.00 基線</text>
    <text x="606.19" y="285" font-size="20" text-anchor="middle">32.75</text>
    <text x="780" y="286" font-size="21" text-anchor="end">97.75</text>
    <text x="18" y="361" font-size="21">Flash：向前＋反傳</text>
    <rect x="240" y="336" width="292.5" height="34" rx="3" fill="#cbd5e1"/>
    <rect x="532.5" y="336" width="9.15" height="34" fill="#167947"/>
    <text x="386.25" y="360" font-size="20" text-anchor="middle">65.00 基線</text>
    <text x="553" y="360" font-size="19" fill="#167947">新增 2.03</text>
    <text x="780" y="361" font-size="21" text-anchor="end">67.03</text>
    <rect x="18" y="405" width="18" height="18" fill="#cbd5e1"/>
    <text x="45" y="421" font-size="20">呼叫前現存配置</text>
    <rect x="250" y="405" width="18" height="18" fill="#f4a64c"/>
    <text x="278" y="421" font-size="20">手寫新增</text>
    <rect x="425" y="405" width="18" height="18" fill="#167947"/>
    <text x="453" y="421" font-size="20">Flash新增</text>
    <text x="18" y="460" font-size="18">灰色包含現存張量與工作空間；不是整張顯示卡用量。</text>
    <text x="18" y="488" font-size="18">三次暖機、九次量測；沒有模型權重、loss或更新器。</text>
    <text x="18" y="516" font-size="18">四條圖柱都使用相同尺度；細綠線表示新增配置很少。</text>
  </g>
</svg>
