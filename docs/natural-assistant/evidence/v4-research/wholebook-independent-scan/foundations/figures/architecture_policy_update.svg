<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">答4得到較好回饋後的一次策略更新</title>
<desc id="desc">動作0答3、動作1答4。選到動作1且reward為1、baseline為0.5，梯度為0.25與負0.25。原分數0、0減去0.1倍梯度後成為負0.025與0.025，答4機率從0.5增至0.512497。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4e6d96"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#172b4d}.label{font-size:20px}.small{font-size:17px}</style>
<rect width="900" height="390" fill="#fff"/>
<text x="450" y="32" text-anchor="middle" font-size="24">答3 / 答4：一次更新的分數與機率</text>
<text x="450" y="64" text-anchor="middle" class="small">選到動作1（答4）；reward=1，baseline=0.5，advantage=0.5</text>
<rect x="30" y="102" width="245" height="91" rx="12" fill="#edf3ff" stroke="#839bbd"/>
<text x="152" y="135" text-anchor="middle" class="label">原分數 logits</text>
<text x="152" y="169" text-anchor="middle" class="label">[0, 0]</text>
<path d="M275 147L334 147" stroke="#4e6d96" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="340" y="97" width="220" height="102" rx="12" fill="#fff2e5" stroke="#bb915c"/>
<text x="450" y="132" text-anchor="middle" class="small">梯度 [0.25, −0.25]</text>
<text x="450" y="171" text-anchor="middle" class="small">分數 − 0.1×梯度</text>
<path d="M560 147L614 147" stroke="#4e6d96" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="620" y="102" width="250" height="91" rx="12" fill="#e8f6ed" stroke="#7a9e85"/>
<text x="745" y="135" text-anchor="middle" class="label">新分數 logits</text>
<text x="745" y="169" text-anchor="middle" class="label">[−0.025, 0.025]</text>
<path d="M152 193L152 254" stroke="#4e6d96" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M745 193L745 254" stroke="#4e6d96" stroke-width="3" marker-end="url(#arrow)"/>
<text x="208" y="229" class="small">softmax</text>
<text x="800" y="229" class="small">softmax</text>
<rect x="30" y="260" width="245" height="86" rx="12" fill="#edf3ff" stroke="#839bbd"/>
<text x="152" y="294" text-anchor="middle" class="small">原機率（答3，答4）</text>
<text x="152" y="326" text-anchor="middle" class="label">[0.5, 0.5]</text>
<rect x="620" y="260" width="250" height="86" rx="12" fill="#e8f6ed" stroke="#7a9e85"/>
<text x="745" y="294" text-anchor="middle" class="small">新機率（答3，答4）</text>
<text x="745" y="326" text-anchor="middle" class="label">[0.487503, 0.512497]</text>
<text x="450" y="378" text-anchor="middle" class="small">reward高於baseline，所選答4機率稍微提高；不是一次變成100%。</text>
</svg>
