<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="title desc">
  <title id="title">四套規則都要存，每個位置只使用其中兩套</title>
  <desc id="desc">一層有四個獨立expert，同一個token選其中兩個，未選兩個本次不做前饋計算。但四個expert的全部權重仍需儲存，另外還有共享字表、注意力和路由器。每個token的active參數不代表完整模型記憶體，也不保證實際速度。</desc>
  <style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:600}.main{font-size:25px}.small{font-size:22px}</style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#496a93"/></marker></defs>
  <rect width="900" height="570" fill="#fff"/>
  <text x="450" y="42" text-anchor="middle" class="title">一層工坊：四套都存，這件工作用兩套</text>
  <rect x="30" y="72" width="840" height="71" rx="12" fill="#e8f1ff" stroke="#8199be"/>
  <text x="450" y="102" text-anchor="middle" class="main">共用規則：字表、注意力、路由器與輸出</text>
  <text x="450" y="131" text-anchor="middle" class="small">這些也要儲存與運算；不是四位expert各有完整模型</text>
  <text x="450" y="190" text-anchor="middle" class="main">一個 token → 路由器選第 1 與第 3 套</text>
  <path d="M450 203L139 254" fill="none" stroke="#496a93" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M450 203L556 254" fill="none" stroke="#496a93" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="30" y="269" width="190" height="113" rx="12" fill="#e0f3e8" stroke="#639778" stroke-width="3"/>
  <rect x="246" y="269" width="190" height="113" rx="12" fill="#f4f6fa" stroke="#8199be"/>
  <rect x="462" y="269" width="190" height="113" rx="12" fill="#e0f3e8" stroke="#639778" stroke-width="3"/>
  <rect x="678" y="269" width="190" height="113" rx="12" fill="#f4f6fa" stroke="#8199be"/>
  <text x="125" y="305" text-anchor="middle" class="main">Expert 1</text>
  <text x="341" y="305" text-anchor="middle" class="main">Expert 2</text>
  <text x="557" y="305" text-anchor="middle" class="main">Expert 3</text>
  <text x="773" y="305" text-anchor="middle" class="main">Expert 4</text>
  <text x="125" y="341" text-anchor="middle" class="small">本次使用</text>
  <text x="341" y="341" text-anchor="middle" class="small">本次不算</text>
  <text x="557" y="341" text-anchor="middle" class="small">本次使用</text>
  <text x="773" y="341" text-anchor="middle" class="small">本次不算</text>
  <text x="125" y="370" text-anchor="middle" class="small">要存權重</text>
  <text x="341" y="370" text-anchor="middle" class="small">仍要存權重</text>
  <text x="557" y="370" text-anchor="middle" class="small">要存權重</text>
  <text x="773" y="370" text-anchor="middle" class="small">仍要存權重</text>
  <rect x="30" y="414" width="840" height="101" rx="12" fill="#fff0d8" stroke="#c49855"/>
  <text x="450" y="449" text-anchor="middle" class="main">要分開量：全部權重、每次工作、分派成本</text>
  <text x="450" y="486" text-anchor="middle" class="small">省下部分計算，不等於記憶體更少，也不保證小模型更快</text>
  <text x="450" y="552" text-anchor="middle" class="small">下一個token可能選另一組；本圖不表示expert已各有領域專長。</text>
</svg>
