<svg xmlns="http://www.w3.org/2000/svg" width="680" height="385" viewBox="0 0 680 385" role="img" aria-labelledby="title desc"><title id="title">貓這一列的加一平滑</title><desc id="desc">候選字句號、吃、狗、看、貓、魚、鳥各有一欄。每格先放一，貓看出現兩次，所以看格是三。總數九，看機率三除九，其餘各一除九。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="680" height="385" rx="12" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a"><text x="340" y="35" font-size="28" text-anchor="middle" fill="#0f172a">只看「目前是貓」這一列</text><rect x="342" y="58" width="76" height="215" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="53" y="107" font-size="25" text-anchor="middle" fill="#0f172a">下一字</text><text x="53" y="179" font-size="25" text-anchor="middle" fill="#0f172a">計數</text><text x="53" y="251" font-size="25" text-anchor="middle" fill="#0f172a">機率</text><text x="140" y="107" font-size="34" text-anchor="middle" fill="#0f172a">。</text><text x="140" y="179" font-size="32" text-anchor="middle" fill="#0f172a">1</text><text x="140" y="251" font-size="28" text-anchor="middle" fill="#0f172a">1/9</text><text x="220" y="107" font-size="34" text-anchor="middle" fill="#0f172a">吃</text><text x="220" y="179" font-size="32" text-anchor="middle" fill="#0f172a">1</text><text x="220" y="251" font-size="28" text-anchor="middle" fill="#0f172a">1/9</text><text x="300" y="107" font-size="34" text-anchor="middle" fill="#0f172a">狗</text><text x="300" y="179" font-size="32" text-anchor="middle" fill="#0f172a">1</text><text x="300" y="251" font-size="28" text-anchor="middle" fill="#0f172a">1/9</text><text x="380" y="107" font-size="34" text-anchor="middle" fill="#0f172a">看</text><text x="380" y="179" font-size="32" text-anchor="middle" fill="#0f172a">3</text><text x="380" y="251" font-size="28" text-anchor="middle" fill="#0f172a">3/9</text><text x="460" y="107" font-size="34" text-anchor="middle" fill="#0f172a">貓</text><text x="460" y="179" font-size="32" text-anchor="middle" fill="#0f172a">1</text><text x="460" y="251" font-size="28" text-anchor="middle" fill="#0f172a">1/9</text><text x="540" y="107" font-size="34" text-anchor="middle" fill="#0f172a">魚</text><text x="540" y="179" font-size="32" text-anchor="middle" fill="#0f172a">1</text><text x="540" y="251" font-size="28" text-anchor="middle" fill="#0f172a">1/9</text><text x="620" y="107" font-size="34" text-anchor="middle" fill="#0f172a">鳥</text><text x="620" y="179" font-size="32" text-anchor="middle" fill="#0f172a">1</text><text x="620" y="251" font-size="28" text-anchor="middle" fill="#0f172a">1/9</text><text x="340" y="315" font-size="25" text-anchor="middle" fill="#0f172a">每格先放 1；貓→看再加 2，所以看是 3</text><text x="340" y="359" font-size="24" text-anchor="middle" fill="#0f172a">列總數 9，每格除以 9；其他列用自己的總數</text></g></svg>