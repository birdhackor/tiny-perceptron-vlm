<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1110" viewBox="0 0 640 1110" role="img" aria-labelledby="title desc"><title id="title">每頭各讀完整允許前文再拼接</title><desc id="desc">手算示意。位置1可讀0和1，各頭四格V，頭0比例3/4與1/4得到7.5、5、0、0；頭1比例1/4與3/4得到10、2、0、0，拼成八格再輸出配方。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#54728c"/></marker></defs><rect width="640" height="1110" fill="#fff"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="320" y="44" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">同一查詢位置 1，兩頭都讀前文</text><text x="320" y="86" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">以下 V 與比例是手算指定</text><rect x="25" y="116" width="590" height="249" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="156" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">頭 0：各位置有 4 格 V</text><text x="165" y="201" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">位置 0</text><text x="165" y="242" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">[10, 0, 0, 0]</text><text x="165" y="283" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">比例 3/4</text><text x="475" y="201" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">位置 1</text><text x="475" y="242" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">[0, 20, 0, 0]</text><text x="475" y="283" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">比例 1/4</text><text x="320" y="334" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">取回 [7.5, 5, 0, 0]</text><rect x="25" y="394" width="590" height="249" rx="12" fill="#e7f6ec" stroke="#54728c" stroke-width="2"/><text x="320" y="434" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">頭 1：各位置有 4 格 V</text><text x="165" y="479" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">位置 0</text><text x="165" y="520" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">[4, 8, 0, 0]</text><text x="165" y="561" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">比例 1/4</text><text x="475" y="479" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">位置 1</text><text x="475" y="520" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">[12, 0, 0, 0]</text><text x="475" y="561" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">比例 3/4</text><text x="320" y="612" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">取回 [10, 2, 0, 0]</text><path d="M320,678 L320,718" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="765" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">按頭順序拼接成 8 格</text><rect x="25" y="793" width="590" height="107" rx="12" fill="#fff0d9" stroke="#54728c" stroke-width="2"/><text x="320" y="832" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">[7.5, 5, 0, 0,</text><text x="320" y="876" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">10, 2, 0, 0]</text><path d="M320,908 L320,948" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="961" width="590" height="59" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="1002" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">輸出 Linear → 此位置仍 8 格</text><text x="320" y="1068" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">沒有把半句分給一頭</text></g></svg>