<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1370" role="img" aria-labelledby="title desc">
<title id="title">換成共同原文尺度後，byte與BPE的代價排名不同</title>
<desc id="desc">同20篇最後檢查片段共4193個原文UTF-8 byte。逐byte模型的每目標代價2.77947低於BPE的3.98741，但共同原文byte尺度的BPB是4.02906高於BPE的3.43401。兩者計分目標數為4213與2503，均包含各篇結束記號EOS。EOS計入總代價；原文bytes不含EOS或結構標記。兩種代價都越低越好，只比較這批片段的預測。</desc>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;fill:#172033;font-size:30px}.title{font-size:36px;font-weight:700}.heading{font-size:34px;font-weight:700}.value{font-size:34px;font-weight:700}.byte{fill:#b45309}.bpe{fill:#1d4ed8}</style>
<rect width="640" height="1370" rx="16" fill="#f8fafc"/>
<text x="24" y="50" class="title">同一批原文，換分母</text>
<text x="24" y="96" class="title">會改變排名</text>
<text x="24" y="148">20篇最後檢查片段</text>
<text x="24" y="190">共4,193個原文UTF-8 bytes</text>

<rect x="16" y="218" width="608" height="435" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="32" y="267" class="heading">每token平均代價</text>
<text x="32" y="310">一個token含的原文量不同</text>
<text x="32" y="359" class="value byte">逐byte</text>
<text x="592" y="359" text-anchor="end" class="value byte">2.77947</text>
<rect x="32" y="379" width="333.5364" height="28" fill="#d97706"/>
<text x="32" y="454" class="value bpe">BPE</text>
<text x="592" y="454" text-anchor="end" class="value bpe">3.98741</text>
<rect x="32" y="474" width="478.4892" height="28" fill="#2563eb"/>
<text x="32" y="546">計分目標含各篇結束記號EOS：</text>
<text x="32" y="588">逐byte 4,213；BPE 2,503</text>
<text x="32" y="631">這個尺度：逐byte較低</text>

<rect x="16" y="676" width="608" height="390" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="32" y="723" class="heading">每原文byte代價（BPB）</text>
<text x="32" y="766">兩份總代價都除以4,193</text>
<text x="32" y="808">再換成bit。</text>
<text x="32" y="860" class="value byte">逐byte</text>
<text x="592" y="860" text-anchor="end" class="value byte">4.02906</text>
<rect x="32" y="880" width="483.4872" height="28" fill="#d97706"/>
<text x="32" y="958" class="value bpe">BPE</text>
<text x="592" y="958" text-anchor="end" class="value bpe">3.43401</text>
<rect x="32" y="978" width="412.0812" height="28" fill="#2563eb"/>
<text x="32" y="1045">這個尺度：BPE較低</text>

<text x="24" y="1120">兩種代價都以較低為佳。</text>
<text x="24" y="1162">EOS計入總代價；</text>
<text x="24" y="1204">原文bytes不含EOS或結構標記。</text>
<text x="24" y="1262">只比較這批片段的預測，</text>
<text x="24" y="1304">不代表一般回答能力或工具優劣。</text>
</svg>