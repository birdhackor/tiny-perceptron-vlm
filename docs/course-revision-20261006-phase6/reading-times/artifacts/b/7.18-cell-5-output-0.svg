<svg xmlns="http://www.w3.org/2000/svg" width="640" height="990" viewBox="0 0 640 990" role="img" aria-labelledby="title desc"><title id="title">同一要求，三種教學材料</title><desc id="desc">只回數字1加2。示範給3；偏好比較3勝過答案是3喔；作答後評分為答4得0。方法是可選路線。</desc>
<defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#172b3a}.strong{font-weight:700}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#3c70a4"/></marker></defs>
<rect width="640" height="990" fill="white"/>
<text x="28" y="48" font-size="32" style="font-size:32px" text-anchor="start" class="strong">同一要求，三種教學材料</text>
<text x="28" y="105" font-size="28" style="font-size:28px" text-anchor="start">要求：只回數字，1+2=?</text>
<rect x="28" y="148" width="584" height="193" rx="10" fill="#e8f1fc" stroke="#3c70a4" stroke-width="2"/>
<text x="48" y="193" font-size="32" style="font-size:32px" text-anchor="start" class="strong">示範</text>
<text x="48" y="248" font-size="28" style="font-size:28px" text-anchor="start">理想回答：3</text>
<text x="48" y="303" font-size="28" style="font-size:28px" text-anchor="start">用回答目標教：SFT</text>
<rect x="28" y="385" width="584" height="241" rx="10" fill="#e3f5e8" stroke="#29814a" stroke-width="2"/>
<text x="48" y="430" font-size="32" style="font-size:32px" text-anchor="start" class="strong">偏好比較</text>
<text x="48" y="485" font-size="28" style="font-size:28px" text-anchor="start">較佳：3</text>
<text x="48" y="540" font-size="28" style="font-size:28px" text-anchor="start">較差：答案是3喔！</text>
<text x="48" y="595" font-size="28" style="font-size:28px" text-anchor="start">可用DPO，或教獎勵模型</text>
<rect x="28" y="670" width="584" height="193" rx="10" fill="#e8f1fc" stroke="#3c70a4" stroke-width="2"/>
<text x="48" y="715" font-size="32" style="font-size:32px" text-anchor="start" class="strong">作答後回饋</text>
<text x="48" y="770" font-size="28" style="font-size:28px" text-anchor="start">作答：4　按正誤評0分</text>
<text x="48" y="825" font-size="28" style="font-size:28px" text-anchor="start">按評分更新：例如PPO</text>
<text x="28" y="934" font-size="28" style="font-size:28px" text-anchor="start">不是每個模型都要依序走完。</text>
</svg>