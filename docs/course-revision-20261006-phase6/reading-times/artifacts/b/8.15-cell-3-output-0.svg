<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1030" viewBox="0 0 640 1030" role="img" aria-labelledby="title desc">
  <title id="title">同一份告示配不同要求與示範答案</title>
  <desc id="desc">上方是共同的四行告示。它分別配上全部照抄與只抄中文的要求。第一筆目標有四行，第二筆只有今日休館和明日開放。箭頭表示資料配對，不是模型內部組件。</desc>
  <defs>
    <style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#172b3a;font-size:28px}.heading{font-size:32px;font-weight:700}.label{font-weight:700}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#3c70a4"/></marker>
  </defs>
  <rect width="640" height="1030" fill="#fff"/>
  <text x="28" y="48" class="heading">材料相同，要求與目標配對</text>
  <rect x="28" y="76" width="564" height="254" rx="12" fill="#f3f5f7" stroke="#8a98a4" stroke-width="2"/>
  <text x="48" y="119" class="label">共同材料</text>
  <text x="48" y="168">今日休館</text><text x="48" y="212">Closed today</text>
  <text x="48" y="256">明日開放</text><text x="48" y="300">Open tomorrow</text>
  <path d="M310 330 V365" fill="none" stroke="#3c70a4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M592 203 H617 V781 H595" fill="none" stroke="#3c70a4" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="28" y="373" width="564" height="284" rx="12" fill="#e8f1fc" stroke="#3c70a4" stroke-width="2"/>
  <text x="48" y="418" class="label">要求一：全部照抄，一行一項</text>
  <line x1="48" y1="439" x2="572" y2="439" stroke="#a8bfd8" stroke-width="2"/>
  <text x="48" y="481">目標：</text>
  <text x="156" y="481">今日休館</text><text x="156" y="527">Closed today</text>
  <text x="156" y="573">明日開放</text><text x="156" y="619">Open tomorrow</text>

  <rect x="28" y="709" width="564" height="235" rx="12" fill="#e3f5e8" stroke="#29814a" stroke-width="3"/>
  <text x="48" y="754" class="label">要求二：只抄中文，一行一項</text>
  <line x1="48" y1="775" x2="572" y2="775" stroke="#a6cdb2" stroke-width="2"/>
  <text x="48" y="823">目標：</text>
  <text x="156" y="823">今日休館</text><text x="156" y="875">明日開放</text>
  <text x="28" y="997">要求不同，合格示範也要跟著改。</text>
</svg>