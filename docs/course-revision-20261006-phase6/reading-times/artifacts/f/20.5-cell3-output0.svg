<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 960" role="img" aria-labelledby="title desc">
  <title id="title">先按來源家族切分，再製作裁切與不同題目</title>
  <desc id="desc">家族A的原圖、裁切、換問法與繁中改寫全部留在訓練。另一來源家族B的新照片與兩道問題一起留出作驗證或測試。這是資料卡示意，不是實際照片或資料數量。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker></defs>
  <rect width="760" height="960" rx="24" fill="#f8fafc"/>
  <g font-family="Noto Sans CJK TC,Noto Sans CJK SC,sans-serif" fill="#17243b" text-anchor="middle">
    <text x="380" y="57" font-size="34" font-weight="700">同一來源的變體，一起切分</text>
    <rect x="36" y="93" width="688" height="440" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="380" y="144" font-size="34" fill="#166534" font-weight="700">家族 A → 訓練</text>
    <rect x="265" y="178" width="230" height="91" rx="14" fill="#ffffff" stroke="#4d9670" stroke-width="2"/>
    <text x="380" y="234" font-size="32">原圖 A</text>
    <path d="M380 274V303H170V337M380 303V337M380 303H590V337" fill="none" stroke="#166534" stroke-width="3"/>
    <g font-size="30">
      <rect x="66" y="342" width="208" height="96" rx="14" fill="#ffffff" stroke="#4d9670" stroke-width="2"/><text x="170" y="400">裁切 A</text>
      <rect x="276" y="342" width="208" height="96" rx="14" fill="#ffffff" stroke="#4d9670" stroke-width="2"/><text x="380" y="400">換問法 A</text>
      <rect x="486" y="342" width="208" height="96" rx="14" fill="#ffffff" stroke="#4d9670" stroke-width="2"/><text x="590" y="400">繁中改寫</text>
    </g>
    <text x="380" y="492" font-size="30" fill="#166534">共享原始線索，不分到別份考卷</text>
    <rect x="36" y="575" width="688" height="254" rx="22" fill="#fffbeb" stroke="#b7791f" stroke-width="3"/>
    <text x="380" y="628" font-size="32" fill="#8a5314" font-weight="700">家族 B → 留出（驗證或測試）</text>
    <rect x="68" y="668" width="224" height="110" rx="14" fill="#ffffff" stroke="#b7791f" stroke-width="2"/><text x="180" y="733" font-size="31">新照片 B</text>
    <path d="M298 723H335" fill="none" stroke="#8a5314" stroke-width="3"/>
    <rect x="350" y="663" width="340" height="120" rx="14" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
    <text x="520" y="711" font-size="30">問題 B1</text><text x="520" y="756" font-size="30">問題 B2</text>
    <text x="380" y="885" font-size="32">先切來源家族，再製作衍生題。</text>
    <text x="380" y="931" font-size="28">這是資料卡示意，不是實際資料數量。</text>
  </g>
</svg>