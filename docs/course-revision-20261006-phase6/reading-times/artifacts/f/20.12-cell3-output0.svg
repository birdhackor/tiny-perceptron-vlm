<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1030" role="img" aria-labelledby="title desc">
  <title id="title">同一問題的正確文字路線與真語音路線分開核對</title>
  <desc id="desc">同一來源問題，左路用來源正確逐字稿直接交給聊天模型。右路送入真錄音，經ASR產生原始辨識稿，再交給同一聊天模型。兩路共用相同權重、歷史與照片，各生成一次回答；轉寫先核對原話，回答另外核對用途。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52657d"/></marker></defs>
  <rect width="760" height="1030" rx="24" fill="#f8fafc"/>
  <g font-family="Noto Sans CJK TC,Noto Sans CJK SC,sans-serif" fill="#17243b" text-anchor="middle">
    <text x="380" y="54" font-size="34" font-weight="700">先聽寫，再回答：分開核對</text>
    <rect x="70" y="90" width="620" height="86" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="380" y="143" font-size="32">同一問題：來源原話</text>
    <path d="M380 181V200H210V234" fill="none" stroke="#52657d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M380 200H550V234" fill="none" stroke="#52657d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="60" y="246" width="300" height="92" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="210" y="302" font-size="30">來源正確逐字稿</text>
    <rect x="400" y="246" width="300" height="92" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="550" y="302" font-size="31">真錄音</text>
    <path d="M550 343V371" fill="none" stroke="#52657d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="400" y="383" width="300" height="86" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="550" y="436" font-size="31">ASR 聽寫</text>
    <path d="M550 474V502" fill="none" stroke="#52657d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="400" y="514" width="300" height="86" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="550" y="567" font-size="30">原始辨識稿</text>
    <path d="M210 344V652" fill="none" stroke="#52657d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M550 605V652" fill="none" stroke="#52657d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="60" y="666" width="300" height="90" rx="16" fill="#fff7ed" stroke="#ea8a31" stroke-width="3"/>
    <rect x="400" y="666" width="300" height="90" rx="16" fill="#fff7ed" stroke="#ea8a31" stroke-width="3"/>
    <text x="210" y="721" font-size="29">同一聊天模型</text><text x="550" y="721" font-size="29">同一聊天模型</text>
    <path d="M210 761V792" fill="none" stroke="#52657d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M550 761V792" fill="none" stroke="#52657d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="60" y="807" width="300" height="88" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="400" y="807" width="300" height="88" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="210" y="861" font-size="29">文字路線回答</text><text x="550" y="861" font-size="29">語音路線回答</text>
    <text x="380" y="945" font-size="30">兩路使用相同權重、歷史與照片</text>
    <text x="380" y="989" font-size="29">先核對聽寫，再核對兩份完整回答。</text>
  </g>
</svg>