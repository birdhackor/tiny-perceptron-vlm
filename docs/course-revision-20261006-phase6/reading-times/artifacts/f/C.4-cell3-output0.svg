<svg xmlns="http://www.w3.org/2000/svg" width="640" height="438" viewBox="0 0 640 438" role="img" aria-labelledby="title desc"><title id="title">找到正解，仍可能選錯</title><desc id="desc">候選3、3、4包含正解4。多數決選3，精確算術驗證選4，兩路皆從完整集合出發。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#14724d"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#17324d}</style><rect width="640" height="438" rx="18" fill="white"/><text x="28" y="48" font-size="32" font-weight="700" text-anchor="start">找到正解，仍可能選錯</text><text x="28" y="87" font-size="28" font-weight="400" text-anchor="start">兩條路使用同一候選集合</text><rect x="32" y="108" width="576" height="68" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="320" y="154" font-size="32" font-weight="700" text-anchor="middle">候選：[3,3,4]　真值：4</text><path d="M320 188 V207 H164 V237" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 207 H476 V237" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="253" width="264" height="112" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="164" y="297" font-size="32" font-weight="700" text-anchor="middle">多數決</text><text x="164" y="339" font-size="32" font-weight="700" text-anchor="middle">選3（錯）</text><rect x="344" y="253" width="264" height="112" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="476" y="297" font-size="32" font-weight="700" text-anchor="middle">精確驗算</text><text x="476" y="339" font-size="32" font-weight="700" text-anchor="middle">選4（對）</text><text x="28" y="411" font-size="28" font-weight="400" text-anchor="start">驗算可直接取得這道算術題的真值</text></svg>