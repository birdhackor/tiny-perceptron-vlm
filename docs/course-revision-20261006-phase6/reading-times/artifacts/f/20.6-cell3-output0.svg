<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc">
  <title id="title">固定原矩陣，分支學修正</title>
  <desc id="desc">同一份輸入 x 分成兩條計算路。灰色路的原矩陣 W 數字固定，但照常運算，得到 Wx。藍色路先通過可學矩陣 A 縮小維度，再通過可學矩陣 B 形成輸出維度，修正結果乘上 α/r。兩路在加號會合，輸出 Wx + (α/r)BAx。訓練時只更新 A、B；r 是中間的小維度，α/r 控制修正的大小。</desc>
  <style>
    text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#172b4d;text-anchor:middle;font-size:34px}
    .title{font-size:38px;font-weight:600}
    .main{font-size:36px;font-weight:500}
    .fixed-text{fill:#374151}
    .learn-text{fill:#164b88}
    .edge{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
    .fixed{stroke:#6b7280}
    .learn{stroke:#2c67b1}
  </style>
  <defs>
    <marker id="fixed-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#6b7280"/></marker>
    <marker id="learn-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#2c67b1"/></marker>
    <marker id="out-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#398064"/></marker>
  </defs>
  <rect width="720" height="1200" fill="#fff"/>
  <text x="360" y="58" class="title">固定原矩陣，分支學修正</text>

  <rect x="214" y="100" width="292" height="90" rx="16" fill="#fff2dc" stroke="#b97723" stroke-width="3"/>
  <text x="360" y="157" class="main">同一份輸入 x</text>
  <path d="M360 190V232" class="edge" stroke="#697586"/>
  <path d="M360 232H184V284" class="edge fixed" marker-end="url(#fixed-arrow)"/>
  <path d="M360 232H536V284" class="edge learn" marker-end="url(#learn-arrow)"/>
  <circle cx="360" cy="232" r="6" fill="#697586"/>

  <rect x="40" y="296" width="288" height="258" rx="16" fill="#f1f3f5" stroke="#86909d" stroke-width="3"/>
  <text x="184" y="350" class="main fixed-text">原矩陣 W</text>
  <text x="184" y="408" class="fixed-text">數字固定</text>
  <text x="184" y="466" class="fixed-text">照常運算</text>
  <text x="184" y="526" class="main fixed-text">得到 Wx</text>

  <rect x="392" y="296" width="288" height="144" rx="16" fill="#eaf2ff" stroke="#2162b2" stroke-width="3"/>
  <text x="536" y="350" class="main learn-text">可學矩陣 A</text>
  <text x="536" y="408" class="learn-text">先縮小維度</text>
  <path d="M536 440V496" class="edge learn" marker-end="url(#learn-arrow)"/>

  <rect x="392" y="508" width="288" height="144" rx="16" fill="#eaf2ff" stroke="#2162b2" stroke-width="3"/>
  <text x="536" y="562" class="main learn-text">可學矩陣 B</text>
  <text x="536" y="620" class="learn-text">形成輸出維度</text>
  <path d="M536 652V708" class="edge learn" marker-end="url(#learn-arrow)"/>

  <rect x="392" y="720" width="288" height="144" rx="16" fill="#eaf2ff" stroke="#2162b2" stroke-width="3"/>
  <text x="536" y="770" class="learn-text">縮放修正</text>
  <text x="536" y="828" class="learn-text">乘上 α/r</text>

  <path d="M184 554V906H314" class="edge fixed" marker-end="url(#fixed-arrow)"/>
  <path d="M536 864V906H406" class="edge learn" marker-end="url(#learn-arrow)"/>
  <circle cx="360" cy="906" r="34" fill="#e6f4ed" stroke="#398064" stroke-width="3"/>
  <text x="360" y="922" style="font-size:48px;fill:#246544">＋</text>
  <path d="M360 940V976" class="edge" stroke="#398064" marker-end="url(#out-arrow)"/>

  <rect x="44" y="988" width="632" height="132" rx="16" fill="#e6f4ed" stroke="#398064" stroke-width="3"/>
  <text x="360" y="1040" class="main">輸出</text>
  <text x="360" y="1100" style="font-size:38px">Wx + (α/r)BAx</text>
  <text x="360" y="1170">訓練時只更新 A、B</text>
</svg>