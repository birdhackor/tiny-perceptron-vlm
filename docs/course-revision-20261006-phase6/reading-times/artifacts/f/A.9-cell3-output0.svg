<svg xmlns="http://www.w3.org/2000/svg" width="640" height="458" viewBox="0 0 640 458" role="img" aria-labelledby="title desc">
  <title id="title">用同一代碼連接兩筆紀錄</title>
  <desc id="desc">紀錄T寫攝影社的活動室代碼是M17；用M17找到紀錄U3，內容是M17在二樓。這兩筆關係支持紙上答案二樓。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#14724d"/></marker></defs>
  <style>text { font-family: "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif; fill: #17324d; }</style>
  <rect width="640" height="458" rx="18" fill="#ffffff"/>
  <text x="28" y="48" font-size="32" font-weight="700">兩筆關係，接成一個答案</text>
  <text x="28" y="87" font-size="28">箭頭：用上一筆的代碼找下一筆</text>
  <rect x="32" y="108" width="576" height="68" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="3"/>
  <text x="56" y="153" font-size="32" font-weight="700">T　攝影社 → M17</text>
  <path d="M320 185 V236" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="343" y="218" font-size="28">同一個 M17</text>
  <rect x="32" y="250" width="576" height="68" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="3"/>
  <text x="56" y="295" font-size="32" font-weight="700">U3　M17 → 二樓</text>
  <path d="M320 328 V364" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="32" y="378" width="576" height="58" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/>
  <text x="320" y="417" font-size="32" font-weight="700" text-anchor="middle">紙上答案：二樓</text>
</svg>