<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc">
  <title id="title">同一批中文字，顛倒行序仍會讀錯</title>
  <desc id="desc">上方購物單先寫牛奶，下方寫麵包，向下箭頭指定先上後下。下方正確轉寫為牛奶再麵包；錯序轉寫為麵包再牛奶。字元與數量相同仍不代表順序相同。多欄或直排文件需要另外標註閱讀規則。</desc>
  <style>
    text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#172b4d}
    .title{font-size:38px;font-weight:600}
    .label{font-size:36px;font-weight:600}
    .main{font-size:34px}
    .word{font-size:60px;font-weight:600}
    .order{font-size:46px;font-weight:600}
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7" fill="#b66d18"/>
    </marker>
  </defs>
  <rect width="720" height="1160" fill="#fff"/>
  <text x="360" y="50" text-anchor="middle" class="title">字都出現過</text>
  <text x="360" y="110" text-anchor="middle" class="title">還要核對原來的行序</text>

  <rect x="96" y="137" width="528" height="354" rx="16" fill="#fffdf7" stroke="#a9a291" stroke-width="2"/>
  <text x="360" y="184" text-anchor="middle" class="label">購物單：先上後下</text>
  <text x="179" y="277" text-anchor="middle" style="font-size:42px">①</text>
  <text x="405" y="280" text-anchor="middle" class="word">牛奶</text>
  <path d="M179 300V367" fill="none" stroke="#b66d18" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="179" y="425" text-anchor="middle" style="font-size:42px">②</text>
  <text x="405" y="428" text-anchor="middle" class="word">麵包</text>

  <rect x="28" y="525" width="664" height="170" rx="16" fill="#e0f3e8" stroke="#6a9b80" stroke-width="2"/>
  <text x="360" y="573" text-anchor="middle" class="label">正確：先上後下</text>
  <text x="360" y="643" text-anchor="middle" class="order">牛奶 → 麵包</text>

  <rect x="28" y="717" width="664" height="170" rx="16" fill="#fff0d8" stroke="#bc8e49" stroke-width="2"/>
  <text x="360" y="765" text-anchor="middle" class="label">錯序：上下顛倒</text>
  <text x="360" y="835" text-anchor="middle" class="order">麵包 → 牛奶</text>

  <text x="360" y="946" text-anchor="middle" class="label">同字元、同數量</text>
  <text x="360" y="1006" text-anchor="middle" class="label">不等於同順序。</text>
  <text x="360" y="1075" text-anchor="middle" class="main">多欄與直排文件</text>
  <text x="360" y="1130" text-anchor="middle" class="main">需要另外標註閱讀規則。</text>
</svg>