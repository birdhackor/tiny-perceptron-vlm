<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1345" role="img" aria-labelledby="title desc">
<title id="title">單音分類校準後，測試答案不變而信心增加</title>
<desc id="desc">在八段驗證錄音上選擇溫度零點五，驗證八段全對；另留十四段測試仍只答對十一段，正確率百分之七十八點五七。原始溫度一的平均信心百分之八十七點九六，ECE零點一三一八六、Brier零點二零二零七；校準後平均信心百分之九十二點七三，ECE零點一四一五四、Brier零點二五三三七。兩張卡都用零到百分之一百尺度。驗證較好沒有保證新頻率也較好；這是low/high分類器的信心，不是生成回答或安全判斷的可靠度。</desc>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;fill:#172033;font-size:30px}.title{font-size:36px;font-weight:700}.heading{font-size:34px;font-weight:700}.value{font-size:34px;font-weight:700}</style>
<rect width="640" height="1345" rx="16" fill="#f8fafc"/>
<text x="24" y="50" class="title">同批14段單音</text>
<text x="24" y="96" class="title">答案不變，信心變大</text>
<text x="24" y="150">在8段驗證錄音選溫度0.5。</text>
<text x="24" y="195">驗證8/8全對。</text>
<text x="24" y="240">另留14段測試，只答對11/14。</text>

<rect x="16" y="270" width="608" height="325" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="32" y="315" class="heading">原始：溫度1</text>
<text x="32" y="363" class="value">平均信心87.96%</text>
<rect x="32" y="390" width="560" height="36" fill="#e8edf3"/>
<rect x="32" y="390" width="492.576" height="36" fill="#357ba9"/>
<line x1="472" y1="380" x2="472" y2="440" stroke="#7a3b81" stroke-width="4" stroke-dasharray="7 5"/>
<text x="32" y="472">0%</text>
<text x="592" y="472" text-anchor="end">100%</text>
<text x="32" y="520">ECE　0.13186</text>
<text x="32" y="563">Brier　0.20207</text>

<rect x="16" y="624" width="608" height="325" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="32" y="669" class="heading">校準後：溫度0.5</text>
<text x="32" y="717" class="value">平均信心92.73%</text>
<rect x="32" y="744" width="560" height="36" fill="#e8edf3"/>
<rect x="32" y="744" width="519.288" height="36" fill="#357ba9"/>
<line x1="472" y1="734" x2="472" y2="794" stroke="#7a3b81" stroke-width="4" stroke-dasharray="7 5"/>
<text x="32" y="826">0%</text>
<text x="592" y="826" text-anchor="end">100%</text>
<text x="32" y="874">ECE　0.14154</text>
<text x="32" y="917">Brier　0.25337</text>

<text x="24" y="992">紫色虛線：固定正確率11/14</text>
<text x="24" y="1034">（78.57%）；兩卡都是0–100%尺度。</text>
<text x="24" y="1082">藍色信心條變長，虛線位置不變。</text>
<text x="24" y="1130">ECE與Brier越小越好；</text>
<text x="24" y="1172">這次兩項誤差都增加。</text>
<text x="24" y="1222">驗證較好，沒有保證新頻率也較好。</text>
<text x="24" y="1272">這是low／high分類器的信心，</text>
<text x="24" y="1314">不是生成回答或安全判斷的可靠度。</text>
</svg>