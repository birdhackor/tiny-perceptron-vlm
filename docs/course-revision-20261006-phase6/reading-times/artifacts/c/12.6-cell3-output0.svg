<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" role="img" aria-labelledby="title desc">
<title id="title">同一頻率格可以貢獻給兩個區段</title>
<desc id="desc">三個頻率格的功率是4、2、1。區段A使用權重1、0.5、0，得到5；區段B使用0、0.5、1，得到2。中間格的功率2乘0.5，分別為兩個區段貢獻1。圖只畫非零權重的路徑。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#163552;text-anchor:middle}.label{font-size:24px}.value{font-size:32px;font-weight:600}.note{font-size:23px}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#557eab"/></marker></defs>
<rect width="600" height="650" rx="12" fill="#f7fafc"/>
<text x="300" y="40" font-size="30">三個頻率格，兩個重疊區段</text>
<text x="300" y="77" class="label">先讀原功率，再乘路徑上的權重</text>
<rect x="40" y="106" width="120" height="96" rx="12" fill="#e8f1ff"/>
<rect x="240" y="106" width="120" height="96" rx="12" fill="#fff0cf" stroke="#bd8930"/>
<rect x="440" y="106" width="120" height="96" rx="12" fill="#e8f1ff"/>
<text x="100" y="136" class="label">頻率格0</text><text x="100" y="178" class="value">4</text>
<text x="300" y="136" class="label">頻率格1</text><text x="300" y="178" class="value">2</text>
<text x="500" y="136" class="label">頻率格2</text><text x="500" y="178" class="value">1</text>
<path d="M100 203V356" fill="none" stroke="#557eab" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M300 203L197 356" fill="none" stroke="#557eab" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M300 203L403 356" fill="none" stroke="#557eab" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M500 203V356" fill="none" stroke="#557eab" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="37" y="237" width="126" height="44" rx="8" fill="#f7fafc"/>
<rect x="160" y="282" width="132" height="44" rx="8" fill="#fff0cf"/>
<rect x="310" y="282" width="132" height="44" rx="8" fill="#fff0cf"/>
<rect x="437" y="237" width="126" height="44" rx="8" fill="#f7fafc"/>
<text x="100" y="267" class="label">4 × 1 = 4</text>
<text x="226" y="312" class="label">2 × 0.5 = 1</text>
<text x="376" y="312" class="label">2 × 0.5 = 1</text>
<text x="500" y="267" class="label">1 × 1 = 1</text>
<rect x="30" y="370" width="250" height="132" rx="14" fill="#daf2e4" stroke="#429268"/>
<rect x="320" y="370" width="250" height="132" rx="14" fill="#daf2e4" stroke="#429268"/>
<text x="155" y="410" class="label">區段A</text><text x="155" y="462" class="value">4 + 1 = 5</text>
<text x="445" y="410" class="label">區段B</text><text x="445" y="462" class="value">1 + 1 = 2</text>
<text x="300" y="548" class="label">中間格替兩個區段各提供1。</text>
<text x="300" y="587" class="note">完整權重：A [1, 0.5, 0]；B [0, 0.5, 1]</text>
<text x="300" y="625" class="note">未畫的路徑權重為0；圖只使用本節小表。</text>
</svg>