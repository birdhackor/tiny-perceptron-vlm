<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">一像素筆畫縮小後變成淡色</title>
  <desc id="desc">原始八欄只有一欄亮，區域平均後亮度從一變成八分之一。這是單條亮線的縮圖實驗，沒有中文辨識；後面的模型再大也不能唯一還原已丟掉的筆畫位置。</desc>
  <rect width="720" height="1080" rx="18" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#172554" font-size="32">
    <text x="36" y="60" font-size="36" font-weight="bold">先縮得太小，細筆畫可能變淡</text>
    <text x="36" y="120">原圖：八欄裡，只有一欄是亮的。</text>
    <rect x="120" y="164" width="480" height="200" fill="#111827"/>
    <rect x="360" y="164" width="60" height="200" fill="#fff"/>
    <path d="M180 164v200m60 -200v200m60 -200v200m60 -200v200m60 -200v200m60 -200v200m60 -200v200" stroke="#64748b" stroke-width="2"/>
    <text x="120" y="412">亮欄的數字：1</text><text x="120" y="458">暗欄的數字：0</text>
    <path d="M360 486v64" stroke="#475569" stroke-width="4"/><path d="M360 554l-12 -20h24Z" fill="#475569"/>
    <text x="150" y="604">八欄平均成一欄：1 ÷ 8</text>
    <rect x="260" y="644" width="200" height="160" fill="#202020" stroke="#64748b" stroke-width="2"/>
    <text x="150" y="855">留下的數字：0.125</text>
    <text x="36" y="930">放大格子供觀察：亮線已變成暗灰。</text>
    <text x="36" y="978">圖只示範縮小造成的資訊損失，</text><text x="36" y="1026">沒有進行中文辨識。</text>
  </g>
</svg>