<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" role="img" aria-labelledby="title desc">
  <title id="title">正弦起伏的一個週期與相位</title>
  <desc id="desc">橫向表示一週期的進度，也就是相位。振幅從起點0升到四分之一週期的0.5，半週期回到0，四分之三週期降到負0.5，一週期結束回到0，接著再重複。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#64748b"/>
    </marker>
  </defs>
  <style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#18354a}</style>
  <rect width="600" height="460" rx="12" fill="#f8fafc"/>
  <text x="300" y="36" font-size="28" text-anchor="middle">平滑起伏，走完一輪再重複</text>
  <text x="300" y="70" font-size="24" text-anchor="middle">0 → 最高 → 0 → 最低 → 0</text>
  <text x="30" y="103" font-size="22" text-anchor="middle">振幅</text>
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5">
    <path d="M80 125H540M80 295H540"/>
    <path d="M80 210V350M195 125V350M310 210V350M425 295V350M540 210V350"/>
  </g>
  <path d="M80 315V100" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M80 210H561" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="67" y="133" font-size="24" text-anchor="end">0.5</text>
  <text x="67" y="218" font-size="24" text-anchor="end">0</text>
  <text x="67" y="303" font-size="24" text-anchor="end">-0.5</text>
  <path d="M80 210C122 161 147 125 195 125C243 125 268 161 310 210C352 259 377 295 425 295C473 295 498 259 540 210" fill="none" stroke="#2563eb" stroke-width="4"/>
  <g fill="#2563eb" stroke="white" stroke-width="2">
    <circle cx="80" cy="210" r="6"/>
    <circle cx="195" cy="125" r="6"/>
    <circle cx="310" cy="210" r="6"/>
    <circle cx="425" cy="295" r="6"/>
    <circle cx="540" cy="210" r="6"/>
  </g>
  <text x="195" y="104" font-size="24" text-anchor="middle">最高</text>
  <text x="425" y="328" font-size="24" text-anchor="middle">最低</text>
  <path d="M80 350H540" fill="none" stroke="#64748b" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="2">
    <path d="M80 345V355M195 345V355M310 345V355M425 345V355M540 345V355"/>
  </g>
  <g font-size="25" text-anchor="middle">
    <text x="80" y="383">0</text>
    <text x="195" y="383">1/4</text>
    <text x="310" y="383">1/2</text>
    <text x="425" y="383">3/4</text>
    <text x="540" y="383">1</text>
  </g>
  <text x="80" y="411" font-size="22" text-anchor="middle">起點</text>
  <text x="540" y="411" font-size="22" text-anchor="middle">完成</text>
  <text x="310" y="438" font-size="25" text-anchor="middle">週期進度（相位）</text>
</svg>