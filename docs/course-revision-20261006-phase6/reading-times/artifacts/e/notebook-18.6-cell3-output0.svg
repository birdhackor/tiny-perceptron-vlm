<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 704" role="img" aria-labelledby="title desc"><title id="title">配候選身份，不是配相同ID</title><desc id="desc">教師ID0是貓、ID1是狗；學生ID0是狗、ID1是貓。雙方貓0.8狗0.2，按學生索引1,0重排後對齊。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#496276"/></marker><marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#245ba8"/></marker><marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#107b6e"/></marker><marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ac5016"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172e45;font-size:30px} .small{font-size:28px} .title{font-size:32px;font-weight:700} .number{font-variant-numeric:tabular-nums}</style><rect width="640" height="704" fill="#fff"/>
<text x="320" y="48" text-anchor="middle" class="title" style="fill:#172e45;">配候選身份，不是配相同ID</text>
<rect x="29" y="86" width="276" height="195" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="167" y="128" text-anchor="middle" class="" style="fill:#172e45;">教師</text>
<text x="167" y="188" text-anchor="middle" class="small" style="fill:#107b6e;">ID0：貓 0.8</text>
<text x="167" y="245" text-anchor="middle" class="small" style="fill:#ac5016;">ID1：狗 0.2</text>
<rect x="335" y="86" width="276" height="195" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="473" y="128" text-anchor="middle" class="" style="fill:#172e45;">學生</text>
<text x="473" y="188" text-anchor="middle" class="small" style="fill:#ac5016;">ID0：狗 0.2</text>
<text x="473" y="245" text-anchor="middle" class="small" style="fill:#107b6e;">ID1：貓 0.8</text>
<rect x="30" y="322" width="580" height="80" rx="14" fill="#eef7f5" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="373" text-anchor="middle" class="" style="fill:#107b6e;">貓：教師ID0 ↔ 學生ID1</text>
<rect x="30" y="422" width="580" height="80" rx="14" fill="#fff4e9" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="473" text-anchor="middle" class="" style="fill:#ac5016;">狗：教師ID1 ↔ 學生ID0</text>
<text x="320" y="562" text-anchor="middle" class="" style="fill:#172e45;">取學生欄順序：[1, 0]</text>
<text x="320" y="615" text-anchor="middle" class="" style="fill:#107b6e;">對齊後：[0.8, 0.2]</text>
<text x="320" y="682" text-anchor="middle" class="small" style="fill:#172e45;">平均絕對差：0.6 → 0</text>
</svg>