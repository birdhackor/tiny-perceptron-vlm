<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 635" role="img" aria-labelledby="title desc"><title id="title">滑窗的直接讀取與跨層傳遞</title><desc id="desc">窗口寬度3包含自己；第2層位置7直接讀第1層5、6、7；輸入位置3可經第1層位置5傳遞資訊。</desc><style>text{font-family:system-ui,-apple-system,"Noto Sans CJK TC",sans-serif;fill:#172554}.small{font-size:26px}.main{font-size:28px}.label{font-size:30px;font-weight:600}.cell{stroke:#64748b;stroke-width:1.5}</style><rect width="640" height="635" rx="18" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs>
<text class="label" x="28" y="45">每層只直接讀附近 3 格</text>
<text class="main" x="28" y="91">輸入的位置</text>
<rect x="28" y="115" width="64" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text class="label" x="60" y="152" text-anchor="middle">0</text>
<rect x="101" y="115" width="64" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text class="label" x="133" y="152" text-anchor="middle">1</text>
<rect x="174" y="115" width="64" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text class="label" x="206" y="152" text-anchor="middle">2</text>
<rect x="247" y="115" width="64" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text class="label" x="279" y="152" text-anchor="middle">3</text>
<rect x="320" y="115" width="64" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text class="label" x="352" y="152" text-anchor="middle">4</text>
<rect x="393" y="115" width="64" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text class="label" x="425" y="152" text-anchor="middle">5</text>
<rect x="466" y="115" width="64" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text class="label" x="498" y="152" text-anchor="middle">6</text>
<rect x="539" y="115" width="64" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text class="label" x="571" y="152" text-anchor="middle">7</text>
<text class="main" x="28" y="301">第 1 層的位置</text>
<rect x="28" y="325" width="64" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text class="label" x="60" y="362" text-anchor="middle">0</text>
<rect x="101" y="325" width="64" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text class="label" x="133" y="362" text-anchor="middle">1</text>
<rect x="174" y="325" width="64" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text class="label" x="206" y="362" text-anchor="middle">2</text>
<rect x="247" y="325" width="64" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text class="label" x="279" y="362" text-anchor="middle">3</text>
<rect x="320" y="325" width="64" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text class="label" x="352" y="362" text-anchor="middle">4</text>
<rect x="393" y="325" width="64" height="56" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text class="label" x="425" y="362" text-anchor="middle">5</text>
<rect x="466" y="325" width="64" height="56" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text class="label" x="498" y="362" text-anchor="middle">6</text>
<rect x="539" y="325" width="64" height="56" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text class="label" x="571" y="362" text-anchor="middle">7</text>
<path d="M279 179L425 310" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text class="main" x="28" y="238">位置 5 能讀到輸入的 3</text>
<text class="main" x="28" y="444">第 2 層的位置 7</text>
<rect x="529" y="485" width="64" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text class="label" x="561" y="522" text-anchor="middle">7</text>
<path d="M425 389L561 470" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#orange)"/>
<path d="M498 389L561 470" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#orange)"/>
<path d="M571 389L561 470" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#orange)"/>
<text class="main" x="28" y="587">較早線索可沿 3 → 5 → 7 傳遞</text></svg>