<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 662" role="img" aria-labelledby="title desc"><title id="title">同一個答案，各找自己的預測列</title><desc id="desc">教師16個前文位置，學生4個；答案A0、A1、A2對應教師預測列15,16,17與學生3,4,5，不按絕對索引盲配。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#496276"/></marker><marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#245ba8"/></marker><marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#107b6e"/></marker><marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ac5016"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172e45;font-size:30px} .small{font-size:28px} .title{font-size:32px;font-weight:700} .number{font-variant-numeric:tabular-nums}</style><rect width="640" height="662" fill="#fff"/>
<text x="320" y="48" text-anchor="middle" class="title" style="fill:#172e45;">同一個答案，各找自己的預測列</text>
<text x="320" y="104" text-anchor="middle" class="" style="fill:#172e45;">教師前文16格；學生前文4格</text>
<rect x="30" y="144" width="580" height="124" rx="14" fill="#eef7f5" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="186" text-anchor="middle" class="" style="fill:#107b6e;">預測答案A0</text>
<text x="320" y="239" text-anchor="middle" class="" style="fill:#172e45;">教師列15 ↔ 學生列3</text>
<rect x="30" y="294" width="580" height="124" rx="14" fill="#eef4fa" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="336" text-anchor="middle" class="" style="fill:#245ba8;">預測答案A1</text>
<text x="320" y="389" text-anchor="middle" class="" style="fill:#172e45;">教師列16 ↔ 學生列4</text>
<rect x="30" y="444" width="580" height="124" rx="14" fill="#eef4fa" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="486" text-anchor="middle" class="" style="fill:#245ba8;">預測答案A2</text>
<text x="320" y="539" text-anchor="middle" class="" style="fill:#172e45;">教師列17 ↔ 學生列5</text>
<text x="320" y="626" text-anchor="middle" class="small" style="fill:#172e45;">預測位置是答案輸入的前一格</text>
</svg>