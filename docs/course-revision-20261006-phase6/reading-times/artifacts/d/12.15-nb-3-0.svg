<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
  <title id="title">有限中文語音問答的設計流程</title>
  <desc id="desc">真人錄音先算固定 log-mel 聲音特徵，再經自行訓練的語音入口接到同一文字核心，生成短中文答覆。聲音色塊與希望答案均為設計示例，不是公開錄音量測或模型成果。</desc>
  <style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#203047;text-anchor:middle}.main{font-size:32px;font-weight:700}.body{font-size:28px}.note{font-size:24px;fill:#526174}.arrow{stroke:#415a77;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#415a77"/></marker></defs>
  <rect width="640" height="760" rx="16" fill="#f7f9fc"/>
  <text x="320" y="44" class="main">有限語音問答的設計</text>
  <text x="320" y="88" class="body">真人錄音</text>
  <path d="M320 101 V127" class="arrow"/>
  <rect x="65" y="137" width="510" height="132" rx="12" fill="#f1edfa" stroke="#9b86bd" stroke-width="2"/>
  <text x="320" y="178" class="body">固定 log-mel 聲音特徵</text>
  <g transform="translate(90 195)">
    <rect width="460" height="52" fill="#e3dcee"/>
    <path d="M0 17 H460 M0 35 H460" stroke="white" stroke-width="3"/>
    <path d="M46 0 V52 M92 0 V52 M138 0 V52 M184 0 V52 M230 0 V52 M276 0 V52 M322 0 V52 M368 0 V52 M414 0 V52" stroke="white" stroke-width="3"/>
    <g fill="#8061a3"><rect x="48" y="19" width="42" height="14"/><rect x="94" y="2" width="42" height="13"/><rect x="140" y="37" width="42" height="13"/><rect x="232" y="19" width="42" height="14"/><rect x="324" y="2" width="42" height="13"/><rect x="370" y="37" width="42" height="13"/></g>
    <g fill="#bca8d0"><rect x="2" y="37" width="42" height="13"/><rect x="186" y="2" width="42" height="13"/><rect x="278" y="37" width="42" height="13"/><rect x="416" y="19" width="42" height="14"/></g>
  </g>
  <path d="M320 274 V305" class="arrow"/>
  <rect x="65" y="315" width="510" height="100" rx="12" fill="#e9f6ef" stroke="#64a282" stroke-width="2"/>
  <text x="320" y="356" class="body">自行訓練的語音入口與接頭</text>
  <text x="320" y="395" class="body">接成核心可用的特徵位置</text>
  <path d="M320 420 V451" class="arrow"/>
  <rect x="65" y="461" width="510" height="94" rx="12" fill="#eaf1fa" stroke="#7598c2" stroke-width="2"/>
  <text x="320" y="499" class="body">同一文字核心</text>
  <text x="320" y="538" class="body">讀聲音特徵與歷史，生成答覆</text>
  <path d="M320 560 V589" class="arrow"/>
  <rect x="65" y="599" width="510" height="114" rx="12" fill="white" stroke="#cad5e1" stroke-width="2"/>
  <text x="320" y="634" class="body">希望答案（手寫示例）</text>
  <text x="320" y="667" class="body">先檢查網路，</text>
  <text x="320" y="702" class="body">再重新啟動 App。</text>
  <text x="320" y="750" class="note">聲音色塊為示意，並非錄音量測</text>
</svg>