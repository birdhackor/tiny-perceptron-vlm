<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 630" role="img" aria-labelledby="title desc"><title id="title">兩份expert輸出，合回兩項特徵</title><desc id="desc">兩位輸出1,0與0,2，用0.7,0.2加權。直接加權得0.7,0.4；除選中總和0.9後得0.7778,0.4444。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#496276"/></marker><marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#245ba8"/></marker><marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#107b6e"/></marker><marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ac5016"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172e45;font-size:30px} .small{font-size:28px} .title{font-size:32px;font-weight:700} .number{font-variant-numeric:tabular-nums}</style><rect width="640" height="630" fill="#fff"/>
<text x="320" y="48" text-anchor="middle" class="title" style="fill:#172e45;">兩份expert輸出，合回兩項特徵</text>
<rect x="32" y="92" width="274" height="113" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="169" y="132" text-anchor="middle" class="" style="fill:#172e45;">expert A</text>
<text x="169" y="182" text-anchor="middle" class="" style="fill:#172e45;font-size:34px;">[1, 0]</text>
<rect x="334" y="92" width="274" height="113" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="471" y="132" text-anchor="middle" class="" style="fill:#172e45;">expert B</text>
<text x="471" y="182" text-anchor="middle" class="" style="fill:#172e45;font-size:34px;">[0, 2]</text>
<text x="320" y="255" text-anchor="middle" class="" style="fill:#172e45;">比例：0.7、0.2；總和0.9</text>
<rect x="30" y="295" width="580" height="107" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="334" text-anchor="middle" class="" style="fill:#172e45;">直接相加</text>
<text x="320" y="379" text-anchor="middle" class="small" style="fill:#172e45;">0.7×[1,0] + 0.2×[0,2] = [0.7,0.4]</text>
<rect x="30" y="437" width="580" height="126" rx="14" fill="#eef7f5" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="479" text-anchor="middle" class="" style="fill:#107b6e;">先除0.9，再逐項相加</text>
<text x="320" y="529" text-anchor="middle" class="small" style="fill:#172e45;">(7/9)×[1,0] + (2/9)×[0,2]</text>
<text x="320" y="609" text-anchor="middle" class="" style="fill:#107b6e;font-size:32px;">→ [0.7778, 0.4444]</text>
</svg>