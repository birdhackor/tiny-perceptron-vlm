<text x="245.5" y="313" text-anchor="middle" class="small" style="fill:#172e45;">KV1</text>
<rect x="327" y="131" width="135" height="69" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="394.5" y="175" text-anchor="middle" class="" style="fill:#245ba8;">Q2</text>
<line x1="394.5" y1="204" x2="394.5" y2="249" stroke="#496276" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="327" y="264" width="135" height="81" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="394.5" y="313" text-anchor="middle" class="small" style="fill:#172e45;">KV2</text>
<rect x="476" y="131" width="135" height="69" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="543.5" y="175" text-anchor="middle" class="" style="fill:#245ba8;">Q3</text>
