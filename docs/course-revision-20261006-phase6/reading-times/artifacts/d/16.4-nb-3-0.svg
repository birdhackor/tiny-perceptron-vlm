<text x="543.5" y="313" text-anchor="middle" class="small" style="fill:#172e45;">KV3</text>
<text x="320" y="395" text-anchor="middle" class="" style="fill:#245ba8;">4組 × 3位置 → 384 bytes</text>
<line x1="35" y1="434" x2="605" y2="434" stroke="#496276" stroke-width="2"/>
<text x="320" y="488" text-anchor="middle" class="" style="fill:#172e45;">四個Query，共用一組KV</text>
