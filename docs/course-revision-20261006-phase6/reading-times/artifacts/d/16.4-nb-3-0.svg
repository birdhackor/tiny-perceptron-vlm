<rect x="327" y="515" width="135" height="69" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="394.5" y="559" text-anchor="middle" class="" style="fill:#245ba8;">Q2</text>
<line x1="394.5" y1="590" x2="320" y2="649" stroke="#496276" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="476" y="515" width="135" height="69" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="543.5" y="559" text-anchor="middle" class="" style="fill:#245ba8;">Q3</text>
<line x1="543.5" y1="590" x2="320" y2="649" stroke="#496276" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="200" y="664" width="240" height="83" rx="14" fill="#eef7f5" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="716" text-anchor="middle" class="" style="fill:#107b6e;">共用KV</text>
<text x="320" y="795" text-anchor="middle" class="" style="fill:#107b6e;">1組 × 3位置 → 96 bytes</text>
<text x="320" y="851" text-anchor="middle" class="small" style="fill:#172e45;">一層｜FP32｜每頭4項特徵</text>
