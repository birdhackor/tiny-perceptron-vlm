<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 870" role="img" aria-labelledby="title desc"><title id="title">四個Query，KV可存四組或一組</title><desc id="desc">四個Query各保留四特徵。三位置單層FP32快取，四組KV是384bytes，共用一組是96bytes；Query頭數不變。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#496276"/></marker><marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#245ba8"/></marker><marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#107b6e"/></marker><marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ac5016"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172e45;font-size:30px} .small{font-size:28px} .title{font-size:32px;font-weight:700} .number{font-variant-numeric:tabular-nums}</style><rect width="640" height="870" fill="#fff"/>
<text x="320" y="48" text-anchor="middle" class="title" style="fill:#172e45;">四個Query，KV可存四組或一組</text>
<text x="320" y="104" text-anchor="middle" class="" style="fill:#172e45;">四個Query，各讀自己的KV</text>
<rect x="29" y="131" width="135" height="69" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="96.5" y="175" text-anchor="middle" class="" style="fill:#245ba8;">Q0</text>
<line x1="96.5" y1="204" x2="96.5" y2="249" stroke="#496276" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="29" y="264" width="135" height="81" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="96.5" y="313" text-anchor="middle" class="small" style="fill:#172e45;">KV0</text>
<rect x="178" y="131" width="135" height="69" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="245.5" y="175" text-anchor="middle" class="" style="fill:#245ba8;">Q1</text>
