<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 825" role="img" aria-labelledby="title desc"><title id="title">同一張卡片，兩種尺度規則</title><desc id="desc">輸入是同位置的三個特徵1、2、3。LayerNorm先減平均再除標準差；RMSNorm不減平均，只除均方根。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#496276"/></marker><marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#245ba8"/></marker><marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#107b6e"/></marker><marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ac5016"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172e45;font-size:30px} .small{font-size:28px} .title{font-size:32px;font-weight:700} .number{font-variant-numeric:tabular-nums}</style><rect width="640" height="825" fill="#fff"/>
<text x="320" y="48" text-anchor="middle" class="title" style="fill:#172e45;">同一張卡片，兩種尺度規則</text>
<rect x="60" y="82" width="520" height="73" rx="14" fill="#f0f5fa" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="130" text-anchor="middle" class="" style="fill:#172e45;">輸入：[1, 2, 3]</text>
<text x="320" y="191" text-anchor="middle" class="small" style="fill:#172e45;">兩條規則各讀同一份輸入</text>
<rect x="30" y="208" width="580" height="245" rx="14" fill="#eef7f5" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="250" text-anchor="middle" class="" style="fill:#107b6e;">LayerNorm</text>
<text x="320" y="298" text-anchor="middle" class="" style="fill:#172e45;">減平均2 → [−1, 0, 1]</text>
<text x="320" y="346" text-anchor="middle" class="" style="fill:#172e45;">除標準差 √(2/3)</text>
<text x="320" y="408" text-anchor="middle" class="" style="fill:#107b6e;">[−1.2247, 0, 1.2247]</text>
<rect x="30" y="482" width="580" height="223" rx="14" fill="#fff4e9" stroke="#cad8e4" stroke-width="2"/>
<text x="320" y="526" text-anchor="middle" class="" style="fill:#ac5016;">RMSNorm</text>
<text x="320" y="573" text-anchor="middle" class="" style="fill:#172e45;">直接除均方根 √(14/3)</text>
<text x="320" y="642" text-anchor="middle" class="" style="fill:#ac5016;">[0.4629, 0.9258, 1.3887]</text>
<text x="320" y="753" text-anchor="middle" class="small" style="fill:#172e45;">固定 γ=1；LayerNorm β=0</text>
<text x="320" y="798" text-anchor="middle" class="small" style="fill:#172e45;">兩者都輸出3項特徵</text>
</svg>