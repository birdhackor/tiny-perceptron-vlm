<svg xmlns="http://www.w3.org/2000/svg" width="640" height="648" viewBox="0 0 640 648" role="img" aria-labelledby="title desc">
<title id="title">快慢旋轉在統一插值後都縮小差角</title>
<desc id="desc">兩張相鄰卡片的原座標0與1變成0與0.5；每格60度的組差角變30度，每格15度的組差角變7.5度。虛線是固定的起點，橘色實線是第二張卡的旋轉方向。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="640" height="648" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, Noto Sans CJK, sans-serif">
<text x="24" y="43" font-size="30" fill="#172b42" text-anchor="start" font-weight="700">相鄰兩張卡，差角都減半</text>
<text x="172" y="94" font-size="30" fill="#172b42" text-anchor="middle" font-weight="700">原刻度</text>
<text x="470" y="94" font-size="30" fill="#172b42" text-anchor="middle" font-weight="700">座標 ÷ 2</text>
<text x="24" y="138" font-size="28" fill="#172b42" text-anchor="start" font-weight="400">虛線：位置 0　實線：緊鄰的卡</text>
<text x="24" y="183" font-size="28" fill="#246a9e" text-anchor="start" font-weight="700">快組：每格轉 60°</text>
<text x="24" y="399" font-size="28" fill="#71519b" text-anchor="start" font-weight="700">慢組：每格轉 15°</text>
<circle cx="172" cy="270" r="64" fill="#f7f9fc" stroke="#bdcad6" stroke-width="2"/>
<line x1="172" y1="270" x2="236" y2="270" stroke="#246a9e" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="172" y1="270" x2="204.0000" y2="214.5744" stroke="#b85119" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 218 270 A 46 46 0 0 0 195.0000 230.1628" fill="none" stroke="#b85119" stroke-width="3"/>
<circle cx="172" cy="270" r="4" fill="#172b42"/>
<text x="172" y="368" font-size="30" fill="#b85119" text-anchor="middle" font-weight="700">60°</text>
<circle cx="470" cy="270" r="64" fill="#f7f9fc" stroke="#bdcad6" stroke-width="2"/>
<line x1="470" y1="270" x2="534" y2="270" stroke="#246a9e" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="470" y1="270" x2="525.4256" y2="238.0000" stroke="#b85119" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 516 270 A 46 46 0 0 0 509.8372 247.0000" fill="none" stroke="#b85119" stroke-width="3"/>
<circle cx="470" cy="270" r="4" fill="#172b42"/>
<text x="470" y="368" font-size="30" fill="#b85119" text-anchor="middle" font-weight="700">30°</text>
<circle cx="172" cy="486" r="64" fill="#f7f9fc" stroke="#bdcad6" stroke-width="2"/>
<line x1="172" y1="486" x2="236" y2="486" stroke="#246a9e" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="172" y1="486" x2="233.8193" y2="469.4356" stroke="#b85119" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 218 486 A 46 46 0 0 0 216.4326 474.0943" fill="none" stroke="#b85119" stroke-width="3"/>
<circle cx="172" cy="486" r="4" fill="#172b42"/>
<text x="172" y="584" font-size="30" fill="#b85119" text-anchor="middle" font-weight="700">15°</text>
<circle cx="470" cy="486" r="64" fill="#f7f9fc" stroke="#bdcad6" stroke-width="2"/>
<line x1="470" y1="486" x2="534" y2="486" stroke="#246a9e" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="470" y1="486" x2="533.4525" y2="477.6463" stroke="#b85119" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 516 486 A 46 46 0 0 0 515.6065 479.9958" fill="none" stroke="#b85119" stroke-width="3"/>
<circle cx="470" cy="486" r="4" fill="#172b42"/>
<text x="470" y="584" font-size="30" fill="#b85119" text-anchor="middle" font-weight="700">7.5°</text>
<text x="24" y="620" font-size="28" fill="#172b42" text-anchor="start" font-weight="400">卡片仍鄰接，新座標只差 0.5</text>
</g>
</svg>