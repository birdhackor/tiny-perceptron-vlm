<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="title desc">
    <title id="title">圖片切小方塊：先檢查能不能拼回來</title><desc id="desc">16×16 RGB，patch邊長4，得到16個patch。。橘色輪流提示閱讀步驟，所有內容靜態可見。</desc>
    <style>
    text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif}
    rect.pulse,.pulse rect{animation:pulse 6s infinite}.step1,.step1 rect{animation-delay:0s}.step2,.step2 rect{animation-delay:1.5s}.step3,.step3 rect{animation-delay:3s}.step4,.step4 rect{animation-delay:4.5s}
    @keyframes pulse{0%,23%{stroke:#e87924;stroke-width:4}24%,100%{stroke:#8da8ca;stroke-width:1}}
    @media(prefers-reduced-motion:reduce){rect.pulse,.pulse rect{animation:none}}
    </style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#466b97"/></marker></defs>
    <rect width="800" height="330" fill="#fff"/><text x="400" y="32" font-size="24" fill="#172b4d" text-anchor="middle">圖片切小方塊：先檢查能不能拼回來</text>
    <rect class="pulse step1" x="95" y="90" width="42" height="42" fill="#d7f5e6" stroke="#fff"/><text x="116" y="117" font-size="15" fill="#172b4d" text-anchor="middle">0</text><rect class="pulse step2" x="140" y="90" width="42" height="42" fill="#b7deff" stroke="#fff"/><text x="161" y="117" font-size="15" fill="#172b4d" text-anchor="middle">1</text><rect class="pulse step3" x="185" y="90" width="42" height="42" fill="#d7f5e6" stroke="#fff"/><text x="206" y="117" font-size="15" fill="#172b4d" text-anchor="middle">2</text><rect class="pulse step4" x="230" y="90" width="42" height="42" fill="#b7deff" stroke="#fff"/><text x="251" y="117" font-size="15" fill="#172b4d" text-anchor="middle">3</text><rect class="pulse step2" x="95" y="135" width="42" height="42" fill="#b7deff" stroke="#fff"/><text x="116" y="162" font-size="15" fill="#172b4d" text-anchor="middle">4</text><rect class="pulse step3" x="140" y="135" width="42" height="42" fill="#d7f5e6" stroke="#fff"/><text x="161" y="162" font-size="15" fill="#172b4d" text-anchor="middle">5</text><rect class="pulse step4" x="185" y="135" width="42" height="42" fill="#b7deff" stroke="#fff"/><text x="206" y="162" font-size="15" fill="#172b4d" text-anchor="middle">6</text><rect class="pulse step1" x="230" y="135" width="42" height="42" fill="#d7f5e6" stroke="#fff"/><text x="251" y="162" font-size="15" fill="#172b4d" text-anchor="middle">7</text><rect class="pulse step3" x="95" y="180" width="42" height="42" fill="#d7f5e6" stroke="#fff"/><text x="116" y="207" font-size="15" fill="#172b4d" text-anchor="middle">8</text><rect class="pulse step4" x="140" y="180" width="42" height="42" fill="#b7deff" stroke="#fff"/><text x="161" y="207" font-size="15" fill="#172b4d" text-anchor="middle">9</text><rect class="pulse step1" x="185" y="180" width="42" height="42" fill="#d7f5e6" stroke="#fff"/><text x="206" y="207" font-size="15" fill="#172b4d" text-anchor="middle">10</text><rect class="pulse step2" x="230" y="180" width="42" height="42" fill="#b7deff" stroke="#fff"/><text x="251" y="207" font-size="15" fill="#172b4d" text-anchor="middle">11</text><rect class="pulse step4" x="95" y="225" width="42" height="42" fill="#b7deff" stroke="#fff"/><text x="116" y="252" font-size="15" fill="#172b4d" text-anchor="middle">12</text><rect class="pulse step1" x="140" y="225" width="42" height="42" fill="#d7f5e6" stroke="#fff"/><text x="161" y="252" font-size="15" fill="#172b4d" text-anchor="middle">13</text><rect class="pulse step2" x="185" y="225" width="42" height="42" fill="#b7deff" stroke="#fff"/><text x="206" y="252" font-size="15" fill="#172b4d" text-anchor="middle">14</text><rect class="pulse step3" x="230" y="225" width="42" height="42" fill="#d7f5e6" stroke="#fff"/><text x="251" y="252" font-size="15" fill="#172b4d" text-anchor="middle">15</text><text x="490" y="140" font-size="20" fill="#172b4d" text-anchor="middle">→ 依列展開成16張小卡</text><text x="495" y="185" font-size="17" fill="#172b4d" text-anchor="middle">每張：3×4×4 = 48 個像素值</text><text x="400" y="314" font-size="15" fill="#172b4d" text-anchor="middle">16×16 RGB，patch邊長4，得到16個patch。</text>
    </svg>