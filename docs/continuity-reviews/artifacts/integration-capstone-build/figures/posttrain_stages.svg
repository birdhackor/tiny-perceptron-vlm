<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-labelledby="title desc">
  <title id="title">大量閱讀形成共用底座，再依任務繼續訓練</title>
  <desc id="desc">一般文章用來預訓練底座；同一份底座可以另存三個副本，分別以任務資料後訓練並評測。此圖不表示後訓練只有風格，也不表示所有配方階段相同。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs>
  <rect width="820" height="460" rx="16" fill="#f8fafc"/>
  <g font-family="Noto Sans CJK TC, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="410" y="38" font-size="24" font-weight="bold">兩個階段，回應兩種資料問題</text>
    <rect x="40" y="76" width="220" height="108" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="150" y="107" font-size="21" font-weight="bold">一般文章</text>
    <text x="150" y="138" font-size="18">前文 → 原文下一項</text>
    <text x="150" y="166" font-size="17">文字本身提供預測目標</text>
    <path d="M265 130H330" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="340" y="76" width="220" height="108" rx="12" fill="#dcfce7" stroke="#15803d"/>
    <text x="450" y="108" font-size="21" font-weight="bold">預訓練底座</text>
    <text x="450" y="140" font-size="18">保存已學到的權重</text>
    <text x="450" y="166" font-size="17">可另存副本，繼續更新</text>
    <text x="650" y="111" font-size="18">語言、知識關聯</text>
    <text x="650" y="140" font-size="18">與文字中的做法</text>
    <path d="M450 189V215" fill="none" stroke="#475569" stroke-width="3"/>
    <path d="M450 215H160V247" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M450 215V247" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M450 215H700V247" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="260" width="240" height="126" rx="12" fill="#fff7ed" stroke="#c2410c"/>
    <text x="160" y="291" font-size="21" font-weight="bold">客服助理</text>
    <text x="160" y="323" font-size="18">客服示範／回饋</text>
    <text x="160" y="354" font-size="18">更新後另做客服評測</text>
    <rect x="330" y="260" width="240" height="126" rx="12" fill="#fff7ed" stroke="#c2410c"/>
    <text x="450" y="291" font-size="21" font-weight="bold">程式助理</text>
    <text x="450" y="323" font-size="18">程式示範／回饋</text>
    <text x="450" y="354" font-size="18">更新後另做程式評測</text>
    <rect x="610" y="260" width="180" height="126" rx="12" fill="#fff7ed" stroke="#c2410c"/>
    <text x="700" y="291" font-size="21" font-weight="bold">圖文助理</text>
    <text x="700" y="323" font-size="18">圖文資料</text>
    <text x="700" y="354" font-size="18">另測圖文表現</text>
    <text x="410" y="423" font-size="18">後訓練可學任務能力；效果由新題驗證，不由箭頭保證。</text>
  </g>
</svg>
