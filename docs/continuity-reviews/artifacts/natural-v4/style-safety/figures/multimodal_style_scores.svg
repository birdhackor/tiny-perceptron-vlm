<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">風格與正確性分開看</title><desc id="desc">兩篇固定回答，風格係數0.2時短答總分1.2勝出，係數2時錯答總分6勝出。分項仍是1與1、3與0。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#54768c"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif}svg{background:white}</style><rect width="900" height="330" fill="#fff"/><text x="450" y="34" text-anchor="middle" font-size="24" fill="#18354a">風格與正確性分開看</text><text x="175" y="85" text-anchor="middle" font-size="19" fill="#18354a">固定兩篇回答</text><text x="395" y="85" text-anchor="middle" font-size="19" fill="#18354a">風格／正確</text><text x="605" y="85" text-anchor="middle" font-size="19" fill="#18354a">風格係數0.2</text><text x="790" y="85" text-anchor="middle" font-size="19" fill="#18354a">風格係數2.0</text><rect x="45" y="110" width="260" height="60" rx="8" fill="#eef5ff" stroke="#54768c"/><text x="175.0" y="146.0" text-anchor="middle" font-size="19" fill="#18354a">準確短答</text><text x="395" y="148" text-anchor="middle" font-size="19" fill="#18354a">1 ／ 1</text><text x="605" y="148" text-anchor="middle" font-size="23" fill="#18354a">1.2</text><text x="790" y="148" text-anchor="middle" font-size="23" fill="#18354a">3.0</text><rect x="45" y="180" width="260" height="60" rx="8" fill="#eef5ff" stroke="#54768c"/><text x="175.0" y="216.0" text-anchor="middle" font-size="19" fill="#18354a">華麗錯答</text><text x="395" y="218" text-anchor="middle" font-size="19" fill="#18354a">3 ／ 0</text><text x="605" y="218" text-anchor="middle" font-size="23" fill="#18354a">0.6</text><text x="790" y="218" text-anchor="middle" font-size="23" fill="#18354a">6.0</text><text x="450" y="290" text-anchor="middle" font-size="19" fill="#18354a">只改加總係數，排名就翻轉；原本的正確標籤沒有變。</text></svg>