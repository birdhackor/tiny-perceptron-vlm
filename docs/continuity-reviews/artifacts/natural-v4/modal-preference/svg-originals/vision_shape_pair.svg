<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">一半答對，仍可能沒跟著形狀改答</title>
  <desc id="desc">正式視覺介入實驗中，六道形狀題在原圖與形狀替換圖都回答 circle。原圓換方會由對變錯，原方換圓會由錯變對；兩邊各答對三題，但六組配對中沒有一組兩邊都正確。圖片為簡化示意，回答和計數來自實際實驗。</desc>
  <style>
    text {font-family:system-ui,"Noto Sans TC",sans-serif;fill:#22304a;font-size:27px;}
    .heading {font-size:34px;font-weight:700;}
    .label {font-size:30px;font-weight:650;}
    .correct {fill:#17643d;font-weight:650;}
    .wrong {fill:#a83737;font-weight:650;}
    .note {fill:#536174;font-size:26px;}
    .image {fill:#d35252;}
  </style>
  <rect width="1120" height="720" rx="22" fill="#f5f7fb"/>
  <text class="heading" x="42" y="55">一半答對，仍可能沒跟著形狀改答</text>
  <text x="42" y="101">問題固定：「什麼形狀？」　六道形狀題，兩次都回答 circle。</text>
  <text class="label" x="255" y="160" text-anchor="middle">原圖</text>
  <text class="label" x="835" y="160" text-anchor="middle">換形狀，同步改真值</text>
  <rect x="42" y="185" width="480" height="155" rx="14" fill="#ffffff"/>
  <rect x="598" y="185" width="480" height="155" rx="14" fill="#ffffff"/>
  <circle class="image" cx="122" cy="260" r="42"/>
  <text x="195" y="245">模型答：circle</text>
  <text class="correct" x="195" y="289">答對：這是圓</text>
  <rect class="image" x="638" y="218" width="84" height="84"/>
  <text x="753" y="245">模型答：circle</text>
  <text class="wrong" x="753" y="289">答錯：這是方</text>
  <path d="M535 260H581 M570 249L581 260L570 271" fill="none" stroke="#516988" stroke-width="4"/>
  <rect x="42" y="360" width="480" height="155" rx="14" fill="#ffffff"/>
  <rect x="598" y="360" width="480" height="155" rx="14" fill="#ffffff"/>
  <rect class="image" x="80" y="393" width="84" height="84"/>
  <text x="195" y="420">模型答：circle</text>
  <text class="wrong" x="195" y="464">答錯：這是方</text>
  <circle class="image" cx="680" cy="435" r="42"/>
  <text x="753" y="420">模型答：circle</text>
  <text class="correct" x="753" y="464">答對：這是圓</text>
  <path d="M535 435H581 M570 424L581 435L570 446" fill="none" stroke="#516988" stroke-width="4"/>
  <rect x="42" y="542" width="1036" height="106" rx="14" fill="#e4ecf6"/>
  <text class="label" x="68" y="583">原圖：3/6　換形狀：3/6　　但兩端都答對：0/6</text>
  <text x="68" y="627">換了哪三題答對，總分仍相同；不能據此認定模型會辨形狀。</text>
  <text class="note" x="42" y="690">圖片為簡化示意；回答與計數取自固定模型、六組成對形狀題。</text>
</svg>
