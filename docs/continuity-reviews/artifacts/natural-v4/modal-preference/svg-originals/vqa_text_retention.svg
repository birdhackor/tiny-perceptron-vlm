<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">學會看圖回答，也可能忘掉原本的文字題</title>
  <desc id="desc">同一起點的四個版本。只訓接頭：圖片問答3/12、文字5/10；最後文字區塊加接頭：12/12、2/10；全模型：9/12、1/10；全模型加舊題回放：9/12、4/10。比例分母不同，題目少且只有一個種子，回放版本的訓練目標數較多。</desc>
  <style>
    text { font-family: system-ui, "Noto Sans TC", sans-serif; fill: #22304a; font-size: 26px; }
    .heading { font-size: 34px; font-weight: 700; }
    .label { font-size: 28px; font-weight: 650; }
    .count { font-size: 28px; font-weight: 650; }
    .axis { fill: #526278; }
    .grid { stroke: #bdc8d8; stroke-width: 1.5; stroke-dasharray: 5 6; }
    .track { fill: #e2e9f1; }
    .vision { fill: #2d80a5; }
    .text-task { fill: #8763b5; }
  </style>
  <rect width="1120" height="690" rx="22" fill="#f5f7fb"/>
  <text class="heading" x="44" y="55">學會看圖回答，也可能忘掉原本的文字題</text>
  <rect class="vision" x="44" y="84" width="24" height="24" rx="4"/>
  <text x="80" y="106">圖片問答：12 題</text>
  <rect class="text-task" x="490" y="84" width="24" height="24" rx="4"/>
  <text x="526" y="106">原本的文字留出題：10 題</text>
  <text class="axis" x="320" y="157">0%</text>
  <text class="axis" x="610" y="157" text-anchor="middle">50%</text>
  <text class="axis" x="900" y="157" text-anchor="end">100%</text>
  <text class="axis" x="956" y="157">答對幾題</text>
  <path class="grid" d="M320 172V553 M610 172V553 M900 172V553"/>

  <text class="label" x="44" y="212">只訓練接頭</text>
  <rect class="track" x="320" y="188" width="580" height="26" rx="5"/>
  <rect class="vision" x="320" y="188" width="145" height="26" rx="5"/>
  <text class="count" x="956" y="212">3/12</text>
  <rect class="track" x="320" y="228" width="580" height="26" rx="5"/>
  <rect class="text-task" x="320" y="228" width="290" height="26" rx="5"/>
  <text class="count" x="956" y="252">5/10</text>

  <text class="label" x="44" y="311">最後文字區塊</text>
  <text class="label" x="44" y="350">＋接頭</text>
  <rect class="track" x="320" y="286" width="580" height="26" rx="5"/>
  <rect class="vision" x="320" y="286" width="580" height="26" rx="5"/>
  <text class="count" x="956" y="310">12/12</text>
  <rect class="track" x="320" y="326" width="580" height="26" rx="5"/>
  <rect class="text-task" x="320" y="326" width="116" height="26" rx="5"/>
  <text class="count" x="956" y="350">2/10</text>

  <text class="label" x="44" y="408">全模型</text>
  <rect class="track" x="320" y="384" width="580" height="26" rx="5"/>
  <rect class="vision" x="320" y="384" width="435" height="26" rx="5"/>
  <text class="count" x="956" y="408">9/12</text>
  <rect class="track" x="320" y="424" width="580" height="26" rx="5"/>
  <rect class="text-task" x="320" y="424" width="58" height="26" rx="5"/>
  <text class="count" x="956" y="448">1/10</text>

  <text class="label" x="44" y="507">全模型</text>
  <text class="label" x="44" y="546">＋舊題回放</text>
  <rect class="track" x="320" y="482" width="580" height="26" rx="5"/>
  <rect class="vision" x="320" y="482" width="435" height="26" rx="5"/>
  <text class="count" x="956" y="506">9/12</text>
  <rect class="track" x="320" y="522" width="580" height="26" rx="5"/>
  <rect class="text-task" x="320" y="522" width="232" height="26" rx="5"/>
  <text class="count" x="956" y="546">4/10</text>

  <text x="44" y="603">同一接頭起點；答案需與標準答案完全相同，是否自行結束另計。</text>
  <text x="44" y="642">題目少、只有一個種子；回放多看了舊題，不代表等量計算。</text>
</svg>
