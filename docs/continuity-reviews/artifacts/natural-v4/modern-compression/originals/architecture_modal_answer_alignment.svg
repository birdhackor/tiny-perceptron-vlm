<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
<title id="title">模態前文長度不同，按同一待預測答案對齊</title><desc id="desc">教師前文16格，學生前文4格。三個答案token A0 A1 A2應比較教師query位置15 16 17與學生3 4 5。第一個答案由前文最後一格預測。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#172b4d}.box{fill:#eef5ff;stroke:#8da8ca;stroke-width:2}.line{fill:none;stroke:#466b97;stroke-width:2}</style>
<rect width="900" height="340" fill="white"/><text x="450" y="29" font-size="22" text-anchor="middle">對齊的是「要預測哪個答案token」</text>
<text x="225" y="70" font-size="18" text-anchor="middle">教師：前文16格</text><text x="675" y="70" font-size="18" text-anchor="middle">學生：前文4格</text>
<g font-size="18" text-anchor="middle">
<rect class="box" x="45" y="91" width="360" height="50" rx="8"/><text x="225" y="122">query15 → 預測A0</text><rect class="box" x="495" y="91" width="360" height="50" rx="8"/><text x="675" y="122">query3 → 預測A0</text>
<rect class="box" x="45" y="165" width="360" height="50" rx="8"/><text x="225" y="196">query16 → 預測A1</text><rect class="box" x="495" y="165" width="360" height="50" rx="8"/><text x="675" y="196">query4 → 預測A1</text>
<rect class="box" x="45" y="239" width="360" height="50" rx="8"/><text x="225" y="270">query17 → 預測A2</text><rect class="box" x="495" y="239" width="360" height="50" rx="8"/><text x="675" y="270">query5 → 預測A2</text></g>
<path class="line" d="M405 116L495 116M405 190L495 190M405 264L495 264"/>
<text x="450" y="324" font-size="16" text-anchor="middle">第一個答案在前文最後一格預測；不能從答案輸入位置16與4開始取logits</text>
</svg>
