<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="title desc">
    <title id="title">成對feature像鐘面指針：用相對旋轉記位置</title><desc id="desc">單一pair的旋轉示意；不同pair有不同角速度。。所有內容靜態可見。</desc>
    <style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#466b97"/></marker></defs>
    <rect width="800" height="330" fill="#fff"/><text x="400" y="32" font-size="24" fill="#172b4d" text-anchor="middle">成對feature像鐘面指針：用相對旋轉記位置</text>
    <circle cx="250" cy="165" r="90" fill="#edf5ff" stroke="#8da8ca"/><line x1="250" y1="165" x2="325.0" y2="165.0" stroke="#3b82f6" stroke-width="4"/><text x="337.0" y="157.0" font-size="18" fill="#3b82f6" text-anchor="middle">Q</text><line x1="250" y1="165" x2="303.03300858899104" y2="111.96699141100893" stroke="#d97706" stroke-width="4"/><text x="315.03300858899104" y="103.96699141100893" font-size="18" fill="#d97706" text-anchor="middle">K</text><text x="540" y="130" font-size="20" fill="#172b4d" text-anchor="middle">兩者一起旋轉：長度不變</text><text x="540" y="170" font-size="18" fill="#172b4d" text-anchor="middle">相對角度仍45°，點積不變</text><text x="540" y="210" font-size="18" fill="#172b4d" text-anchor="middle">位置像鐘面角度</text><text x="400" y="314" font-size="15" fill="#172b4d" text-anchor="middle">單一pair的旋轉示意；不同pair有不同角速度。</text>
    </svg>