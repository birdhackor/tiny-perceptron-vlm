<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" role="img" aria-labelledby="title desc">
<title id="title">同一個token必須比較到同一欄</title><desc id="desc">教師ID0是貓機率0.8，ID1是狗0.2；學生ID0是狗0.2，ID1是貓0.8。連線按token文字交叉匹配，不能按ID數字直接比較。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#172b4d}.box{fill:#eef5ff;stroke:#8da8ca;stroke-width:2}.cat{stroke:#26875b;stroke-width:3;fill:none}.dog{stroke:#c38a47;stroke-width:3;fill:none}</style>
<rect width="860" height="310" fill="white"/><text x="430" y="31" font-size="22" text-anchor="middle">維度都為2，欄位意義仍可能不同</text>
<text x="175" y="77" font-size="18" text-anchor="middle">教師分布</text><text x="685" y="77" font-size="18" text-anchor="middle">學生分布</text>
<rect class="box" x="35" y="104" width="280" height="50" rx="8"/><rect class="box" x="35" y="197" width="280" height="50" rx="8"/><rect class="box" x="545" y="104" width="280" height="50" rx="8"/><rect class="box" x="545" y="197" width="280" height="50" rx="8"/>
<g font-size="20" text-anchor="middle"><text x="175" y="136">ID0：貓 = 0.8</text><text x="175" y="229">ID1：狗 = 0.2</text><text x="685" y="136">ID0：狗 = 0.2</text><text x="685" y="229">ID1：貓 = 0.8</text></g>
<path class="cat" d="M315 129L545 222"/><path class="dog" d="M315 222L545 129"/>
<text x="430" y="280" font-size="16" text-anchor="middle">按教師順序重排學生欄位：[學生ID1, 學生ID0] → [0.8, 0.2]</text>
</svg>
