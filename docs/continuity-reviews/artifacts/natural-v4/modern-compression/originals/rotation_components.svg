<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 482" role="img" aria-labelledby="title desc">
  <title id="title">旋轉後的位置，拆成水平與垂直兩份</title>
  <desc id="desc">兩欄使用同樣尺度與長度一的箭頭。從朝右的箭頭逆時針轉45度，終點為水平0.7071、垂直0.7071；轉135度，終點為水平負0.7071、垂直0.7071。橘色線是水平cos分量，青色線是垂直sin分量；虛線圓標出長度一的箭頭終點。數值是四位小數近似。</desc>
  <defs>
    <marker id="axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#9aa6b4"/></marker>
    <marker id="vector" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5.5 L0,11" fill="#243b53"/></marker>
    <marker id="horizontal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10" fill="#c85a24"/></marker>
    <marker id="vertical" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10" fill="#087f8c"/></marker>
  </defs>
  <rect width="800" height="482" rx="16" fill="#f7f9fc"/>
  <g font-family="Noto Sans CJK TC, sans-serif" fill="#243b53">
    <text x="400" y="37" text-anchor="middle" font-size="28" font-weight="700">旋轉後的位置，拆成水平與垂直兩份</text>
    <text x="400" y="72" text-anchor="middle" font-size="22">長度都是 1，從朝右開始，逆時針轉動。</text>
    <rect x="16" y="99" width="376" height="341" rx="14" fill="#ffffff" stroke="#dbe3ed" stroke-width="2"/>
    <rect x="408" y="99" width="376" height="341" rx="14" fill="#ffffff" stroke="#dbe3ed" stroke-width="2"/>
    <text x="204" y="132" text-anchor="middle" font-size="28" font-weight="700">45°</text>
    <text x="596" y="132" text-anchor="middle" font-size="28" font-weight="700">135°</text>
    <text x="204" y="165" text-anchor="middle" font-size="23">終點：[+0.7071, +0.7071]</text>
    <text x="596" y="165" text-anchor="middle" font-size="23">終點：[-0.7071, +0.7071]</text>
    <g fill="none" stroke="#9aa6b4" stroke-width="2">
      <circle cx="204" cy="282" r="85" stroke-dasharray="5 5"/>
      <circle cx="596" cy="282" r="85" stroke-dasharray="5 5"/>
      <path d="M83 282 H325" marker-end="url(#axis)"/><path d="M204 383 V183" marker-end="url(#axis)"/>
      <path d="M475 282 H717" marker-end="url(#axis)"/><path d="M596 383 V183" marker-end="url(#axis)"/>
    </g>
    <g font-size="22" fill="#6b7e90">
      <text x="333" y="290">x</text><text x="211" y="190">y</text>
      <text x="725" y="290">x</text><text x="603" y="190">y</text>
    </g>
    <g fill="none" stroke-width="5">
      <path d="M204 282 H264.1041" stroke="#c85a24" marker-end="url(#horizontal)"/>
      <path d="M264.1041 282 V221.8959" stroke="#087f8c" marker-end="url(#vertical)"/>
      <path d="M596 282 H535.8959" stroke="#c85a24" marker-end="url(#horizontal)"/>
      <path d="M535.8959 282 V221.8959" stroke="#087f8c" marker-end="url(#vertical)"/>
      <path d="M204 282 L264.1041 221.8959" stroke="#243b53" marker-end="url(#vector)"/>
      <path d="M596 282 L535.8959 221.8959" stroke="#243b53" marker-end="url(#vector)"/>
    </g>
    <g fill="none" stroke="#243b53" stroke-width="2.5">
      <path d="M232 282 A28 28 0 0 0 223.799 262.201"/>
      <path d="M624 282 A28 28 0 0 0 576.201 262.201"/>
    </g>
    <circle cx="204" cy="282" r="4" fill="#243b53"/><circle cx="596" cy="282" r="4" fill="#243b53"/>
    <g font-size="23">
      <text x="39" y="395" fill="#c85a24">水平 x = cos(角度) = +0.7071</text>
      <text x="39" y="426" fill="#087f8c">垂直 y = sin(角度) = +0.7071</text>
      <text x="431" y="395" fill="#c85a24">水平 x = cos(角度) = -0.7071</text>
      <text x="431" y="426" fill="#087f8c">垂直 y = sin(角度) = +0.7071</text>
    </g>
    <text x="400" y="470" text-anchor="middle" font-size="22">虛線圓上的點離起點都是 1；數值取四位小數。</text>
  </g>
</svg>
