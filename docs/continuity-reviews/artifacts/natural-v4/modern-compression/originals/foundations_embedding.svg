<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" aria-labelledby="title desc"><title id="title">三個位置查同一張特徵表</title><desc id="desc">左側五列三特徵表，右側三個位置查ID一、二、一，依序取一零零、零一零、一零零。同ID共用同一列，橘色標ID一、藍色標ID二。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="680" height="350" rx="12" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a"><text x="340" y="35" font-size="27" text-anchor="middle" fill="#0f172a">三個位置查同一張 5 × 3 特徵表</text><rect x="20" y="60" width="220" height="272" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="55" y="94" font-size="26" text-anchor="middle" fill="#0f172a">ID</text><text x="155" y="94" font-size="25" text-anchor="middle" fill="#0f172a">三特徵</text><text x="55" y="134" font-size="29" text-anchor="middle" fill="#0f172a">0</text><text x="155" y="134" font-size="28" text-anchor="middle" fill="#0f172a">[0,0,0]</text><rect x="25" y="147" width="210" height="41" rx="1" fill="#ffedd5" stroke="#fff" stroke-width="2"/><text x="55" y="178" font-size="29" text-anchor="middle" fill="#0f172a">1</text><text x="155" y="178" font-size="28" text-anchor="middle" fill="#0f172a">[1,0,0]</text><rect x="25" y="191" width="210" height="41" rx="1" fill="#dbeafe" stroke="#fff" stroke-width="2"/><text x="55" y="222" font-size="29" text-anchor="middle" fill="#0f172a">2</text><text x="155" y="222" font-size="28" text-anchor="middle" fill="#0f172a">[0,1,0]</text><text x="55" y="266" font-size="29" text-anchor="middle" fill="#0f172a">3</text><text x="155" y="266" font-size="28" text-anchor="middle" fill="#0f172a">[0,0,1]</text><text x="55" y="310" font-size="29" text-anchor="middle" fill="#0f172a">4</text><text x="155" y="310" font-size="28" text-anchor="middle" fill="#0f172a">[1,1,1]</text><rect x="265" y="90" width="170" height="60" rx="8" fill="#ffedd5" stroke="#94a3b8" stroke-width="2"/><text x="350" y="130" font-size="25" text-anchor="middle" fill="#0f172a">位置 0：ID 1</text><rect x="475" y="90" width="185" height="60" rx="8" fill="#ffedd5" stroke="#94a3b8" stroke-width="2"/><text x="568" y="131" font-size="29" text-anchor="middle" fill="#0f172a">[1,0,0]</text><path d="M440 120H464" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="81" font-size="23" text-anchor="middle" fill="#0f172a">查表</text><rect x="265" y="180" width="170" height="60" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="350" y="220" font-size="25" text-anchor="middle" fill="#0f172a">位置 1：ID 2</text><rect x="475" y="180" width="185" height="60" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="568" y="221" font-size="29" text-anchor="middle" fill="#0f172a">[0,1,0]</text><path d="M440 210H464" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="171" font-size="23" text-anchor="middle" fill="#0f172a">查表</text><rect x="265" y="270" width="170" height="60" rx="8" fill="#ffedd5" stroke="#94a3b8" stroke-width="2"/><text x="350" y="310" font-size="25" text-anchor="middle" fill="#0f172a">位置 2：ID 1</text><rect x="475" y="270" width="185" height="60" rx="8" fill="#ffedd5" stroke="#94a3b8" stroke-width="2"/><text x="568" y="311" font-size="29" text-anchor="middle" fill="#0f172a">[1,0,0]</text><path d="M440 300H464" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="261" font-size="23" text-anchor="middle" fill="#0f172a">查表</text></g></svg>
