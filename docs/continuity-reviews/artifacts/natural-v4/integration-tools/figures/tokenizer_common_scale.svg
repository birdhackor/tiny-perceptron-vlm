<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">換成共同原文尺度後，byte與BPE的代價排名不同</title>
  <desc id="desc">同20篇最後檢查片段共4193個原文byte。逐byte模型的每目標代價2.77947低於BPE的3.98741，但共同原文byte尺度的BPB是4.02906高於BPE的3.43401。兩者計分目標數為4213與2503，均包含結束標記。</desc>
  <rect width="1120" height="560" rx="20" fill="#f8fafc"/>
  <g font-family="system-ui, 'Noto Sans TC', sans-serif" fill="#172033">
    <text x="48" y="52" font-size="30" font-weight="700">同一批原文，先問「每一份」有多大</text>
    <text x="48" y="90" font-size="23">20篇最後檢查片段，共4,193個原文 UTF-8 bytes</text>
    <rect x="40" y="120" width="488" height="328" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="592" y="120" width="488" height="328" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/>
    <text x="68" y="163" font-size="25" font-weight="700">每個 token 的平均代價</text>
    <text x="68" y="196" font-size="21" fill="#475569">一個 token 含的原文量不同</text>
    <text x="620" y="163" font-size="25" font-weight="700">每個原文 byte 的代價（BPB）</text>
    <text x="620" y="196" font-size="21" fill="#475569">分母都用同一份原文的4,193 bytes</text>
    <text x="68" y="242" font-size="23">逐 byte</text>
    <rect x="68" y="258" width="208" height="40" rx="6" fill="#d97706"/>
    <text x="286" y="286" font-size="24" font-weight="700">2.77947</text>
    <text x="68" y="336" font-size="23">BPE</text>
    <rect x="68" y="352" width="299" height="40" rx="6" fill="#2563eb"/>
    <text x="377" y="380" font-size="24" font-weight="700">3.98741</text>
    <text x="68" y="429" font-size="23" fill="#92400e">這個尺度下：逐 byte 較低</text>
    <text x="620" y="242" font-size="23">逐 byte</text>
    <rect x="620" y="258" width="390" height="40" rx="6" fill="#d97706"/>
    <text x="620" y="322" font-size="24" font-weight="700">4.02906</text>
    <text x="620" y="359" font-size="23">BPE</text>
    <rect x="620" y="375" width="332" height="40" rx="6" fill="#2563eb"/>
    <text x="962" y="403" font-size="21" font-weight="700">3.43401</text>
    <text x="620" y="439" font-size="21" fill="#1d4ed8">換成共同尺度：BPE 較低</text>
    <text x="48" y="488" font-size="22">左圖計分目標：逐 byte 4,213個；BPE 2,503個。兩者都包含各篇的結束目標。</text>
    <text x="48" y="528" font-size="22" fill="#475569">兩種代價都以較低為佳；本例只比較這批片段的預測，不代表一般回答能力。</text>
  </g>
</svg>
