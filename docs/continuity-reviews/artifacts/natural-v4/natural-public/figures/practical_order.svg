<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
  <title id="title">交換紅藍順序，平均摘要仍相同</title>
  <desc id="desc">原圖甲紅條在左、藍條在右；原圖乙相反。交換只發生在同一個平均格內，紅藍份量相同，所以兩圖的區域平均相同。完整像素序列仍能保留左右差別。</desc>
  <rect width="720" height="1120" rx="18" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#172554" font-size="32">
    <text x="36" y="60" font-size="36" font-weight="bold">平均顏色相同，左右卻不同</text>
    <text x="36" y="115">兩張圖，只交換同一格內的紅藍條。</text>
    <text x="56" y="190" font-weight="bold">甲：紅在藍左邊</text>
    <rect x="56" y="214" width="608" height="190" fill="#fff" stroke="#64748b" stroke-width="3"/>
    <rect x="84" y="258" width="64" height="98" fill="#dc2626"/>
    <rect x="148" y="258" width="64" height="98" fill="#2563eb"/>
    <rect x="70" y="236" width="156" height="142" fill="none" stroke="#9333ea" stroke-width="4" stroke-dasharray="8 6"/>
    <text x="270" y="297">虛線框是</text><text x="270" y="345">同一個平均格。</text>
    <text x="56" y="470" font-weight="bold">乙：藍在紅左邊</text>
    <rect x="56" y="494" width="608" height="190" fill="#fff" stroke="#64748b" stroke-width="3"/>
    <rect x="84" y="538" width="64" height="98" fill="#2563eb"/>
    <rect x="148" y="538" width="64" height="98" fill="#dc2626"/>
    <rect x="70" y="516" width="156" height="142" fill="none" stroke="#9333ea" stroke-width="4" stroke-dasharray="8 6"/>
    <text x="270" y="577">紅藍各自的份量</text><text x="270" y="625">都沒有改變。</text>
    <path d="M360 704v62" stroke="#475569" stroke-width="4"/><path d="M360 770l-12 -20h24Z" fill="#475569"/>
    <rect x="56" y="792" width="608" height="134" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="84" y="842" font-weight="bold">兩張圖得到同一份平均摘要</text><text x="84" y="890">摘要無法告訴我們誰在左邊。</text>
    <text x="36" y="989">示意只畫局部，放大紅藍條供觀察。</text>
    <text x="36" y="1040">程式在32×32圖的同一個8×8格內交換。</text>
  </g>
</svg>
