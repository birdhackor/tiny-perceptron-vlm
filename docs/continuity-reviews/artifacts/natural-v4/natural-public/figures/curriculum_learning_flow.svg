<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" role="img" aria-labelledby="title desc">
<title id="title">從一筆文字練習，到一次更新</title>
<desc id="desc">先把樣本排成文字單位，取得輸入X和下一步答案Y。模型以X及可讀前文的遮罩算預測；Y和指定計分的位置決定代價。單步更新先清除舊梯度，再依代價算梯度，最後調整權重。可讀位置和計分位置是兩種不同的選擇。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#172b4d;text-anchor:middle;font-size:24px}.label{font-size:22px;text-anchor:start}.heading{font-size:28px;font-weight:700}.box{stroke:#54799f;stroke-width:2}.flow{fill:none;stroke:#466b97;stroke-width:3;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#466b97"/></marker></defs>
<rect width="900" height="800" rx="12" fill="#fff"/>
<text class="heading" x="450" y="43">從一筆文字練習，到一次更新</text>
<rect x="16" y="76" width="868" height="164" rx="14" fill="#f3f7fc"/>
<text class="label" x="36" y="108">① 準備同一道題目的輸入與答案</text>
<rect class="box" x="38" y="130" width="220" height="80" rx="10" fill="#e8f1ff"/>
<text x="148" y="178">原始樣本</text>
<path class="flow" d="M258 170 H300"/>
<rect class="box" x="310" y="130" width="255" height="80" rx="10" fill="#e8f1ff"/>
<text x="437.5" y="163">排好角色與文字</text><text x="437.5" y="193">轉成識別編號</text>
<path class="flow" d="M565 170 H605"/>
<rect class="box" x="615" y="130" width="247" height="80" rx="10" fill="#e8f1ff"/>
<text x="738.5" y="163">輸入 X</text><text x="738.5" y="193">下一步答案 Y</text>
<path class="flow" d="M450 240 V266"/>
<rect x="16" y="278" width="868" height="262" rx="14" fill="#f1f9f4"/>
<text class="label" x="36" y="310">② 算預測，再對照需要計分的答案</text>
<rect class="box" x="38" y="330" width="370" height="158" rx="10" fill="#e1f1e7"/>
<text x="223" y="367">X 與可讀前文的遮罩</text><text x="223" y="413">模型算出各位置的預測</text><text x="223" y="459">forward</text>
<path class="flow" d="M408 409 H480"/>
<rect class="box" x="492" y="330" width="370" height="158" rx="10" fill="#e1f1e7"/>
<text x="677" y="367">Y 與指定計分的位置</text><text x="677" y="413">對照下一步答案</text><text x="677" y="459">只算指定位置的代價</text>
<text x="450" y="524" style="font-size:22px">可以讀哪些前文，與哪些答案要計分，是兩個不同的問題。</text>
<path class="flow" d="M450 540 V566"/>
<rect x="16" y="578" width="868" height="168" rx="14" fill="#fff7eb"/>
<text class="label" x="36" y="610">③ 做一次不累積舊梯度的更新</text>
<rect class="box" x="38" y="630" width="220" height="86" rx="10" fill="#ffedcf"/>
<text x="148" y="664">清除舊梯度</text><text x="148" y="698">zero_grad</text>
<path class="flow" d="M258 673 H300"/>
<rect class="box" x="310" y="630" width="255" height="86" rx="10" fill="#ffedcf"/>
<text x="437.5" y="664">依代價算出梯度</text><text x="437.5" y="698">backward</text>
<path class="flow" d="M565 673 H605"/>
<rect class="box" x="615" y="630" width="247" height="86" rx="10" fill="#ffedcf"/>
<text x="738.5" y="664">調整權重</text><text x="738.5" y="698">optimizer.step</text>
<text x="450" y="780" style="font-size:22px">每個小節只拆開其中一個步驟；刻意累積梯度時另訂清零時機。</text>
</svg>
