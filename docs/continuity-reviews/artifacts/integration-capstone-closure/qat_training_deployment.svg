<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
  <title id="title">QAT：保留浮點主權重，訓練時模擬捨入，部署時才打包</title>
  <desc id="desc">第一步保留可更新的浮點主權重。第二步在每次前向計算使用捨入後還原的浮點值，反向則用 STE 近似梯度來更新主權重。第三步在訓練結束後，將主權重量化成真正打包的四位元檔案。本教材的部署程式仍將打包值還原成浮點數計算，因此不代表使用四位元運算核心。</desc>
  <defs>
    <marker id="down" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#345678"/></marker>
    <marker id="back" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a05a19"/></marker>
  </defs>
  <rect width="1120" height="820" rx="20" fill="#f7f9fc"/>
  <g font-family="sans-serif" fill="#20344a">
    <text x="60" y="52" font-size="32" font-weight="700">QAT：先練習承受捨入，最後再縮小存檔</text>
    <rect x="60" y="82" width="880" height="155" rx="16" fill="#e4eefb" stroke="#4576ab" stroke-width="2"/>
    <text x="86" y="122" font-size="30" font-weight="700">① 訓練保留浮點主權重</text>
    <text x="86" y="166" font-size="28">例如：[0.1, 0.4, 0.9]</text>
    <text x="86" y="208" font-size="26">它們仍能細微調整，也仍以浮點格式儲存。</text>
    <path d="M500 237 V292" fill="none" stroke="#345678" stroke-width="4" marker-end="url(#down)"/>
    <rect x="60" y="305" width="880" height="197" rx="16" fill="#fff0df" stroke="#b77a32" stroke-width="2"/>
    <text x="86" y="347" font-size="30" font-weight="700">② 每次前向：捨入，再還原成浮點數</text>
    <text x="86" y="391" font-size="28">scale = 0.9 ÷ 7；整數格點：[1, 3, 7]</text>
    <text x="86" y="435" font-size="28">計算使用：約 [0.1286, 0.3857, 0.9]</text>
    <text x="86" y="477" font-size="26">反向用 STE 近似梯度，更新上面的主權重。</text>
    <path d="M940 407 H1020 V157 H955" fill="none" stroke="#a05a19" stroke-width="4" marker-end="url(#back)"/>
    <text x="975" y="290" font-size="25" fill="#8b4b16" text-anchor="middle">再</text>
    <text x="975" y="324" font-size="25" fill="#8b4b16" text-anchor="middle">練</text>
    <text x="975" y="358" font-size="25" fill="#8b4b16" text-anchor="middle">一</text>
    <text x="975" y="392" font-size="25" fill="#8b4b16" text-anchor="middle">步</text>
    <path d="M500 502 V584" fill="none" stroke="#345678" stroke-width="4" marker-end="url(#down)"/>
    <text x="527" y="551" font-size="26">訓練結束，另做一次打包</text>
    <rect x="60" y="599" width="880" height="160" rx="16" fill="#e3f3ea" stroke="#4d8568" stroke-width="2"/>
    <text x="86" y="640" font-size="30" font-weight="700">③ 部署：真正存成 packed4 檔案</text>
    <text x="86" y="684" font-size="26">每個被量化的 Linear 權重用 4 bits 打包。</text>
    <text x="86" y="727" font-size="26">本教材載入後還原為 FP32，仍用一般浮點運算。</text>
    <text x="60" y="797" font-size="26">模擬捨入 ≠ 已縮小訓練記憶體；縮小存檔 ≠ 已加速運算。</text>
  </g>
</svg>
