<svg xmlns="http://www.w3.org/2000/svg" width="560" height="550" viewBox="0 0 560 550" role="img" aria-labelledby="title desc">
  <title id="title">只編材料，分支唯讀共享記憶體</title>
  <desc id="desc">材料經只讀材料的編碼器產生M。Q1與Q2各自的候選分支從M讀取，產生特徵及分數，不寫回M。箭頭只往分支，沒有回到M。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315c76"/></marker>
  </defs>
  <rect width="560" height="550" rx="16" fill="#fbfcfe"/>
  <g font-family="Noto Sans CJK TC, Noto Sans, sans-serif" text-anchor="middle" fill="#17364a">
    <rect x="60" y="20" width="440" height="60" rx="12" fill="#eef2f6" stroke="#8698a8" stroke-width="2"/>
    <text x="280" y="60" font-size="26">同一份材料 state</text>
    <path d="M280 82 V108" fill="none" stroke="#315c76" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="60" y="116" width="440" height="70" rx="12" fill="#dcebf4" stroke="#4d7790" stroke-width="2"/>
    <text x="280" y="159" font-size="26">只編材料 E(state)</text>
    <path d="M280 188 V214" fill="none" stroke="#315c76" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="60" y="222" width="440" height="70" rx="12" fill="#dceee5" stroke="#44745b" stroke-width="2"/>
    <text x="280" y="265" font-size="26">共享 M：保持原值</text>
    <path d="M160 294 V338" fill="none" stroke="#315c76" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M400 294 V338" fill="none" stroke="#315c76" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="30" y="348" width="240" height="140" rx="12" fill="#edf3fa" stroke="#547b9b" stroke-width="2"/>
    <rect x="290" y="348" width="240" height="140" rx="12" fill="#edf3fa" stroke="#547b9b" stroke-width="2"/>
    <text x="150" y="383" font-size="25">Q1＋各候選</text>
    <text x="410" y="383" font-size="25">Q2＋各候選</text>
    <text x="150" y="423" font-size="22">自己的 query 讀 M</text>
    <text x="410" y="423" font-size="22">自己的 query 讀 M</text>
    <text x="150" y="464" font-size="23">特徵 hᵢ → 分數 sᵢ</text>
    <text x="410" y="464" font-size="23">特徵 hᵢ → 分數 sᵢ</text>
    <text x="280" y="528" font-size="23" fill="#365e4b">兩條分支都不寫回 M</text>
  </g>
</svg>
