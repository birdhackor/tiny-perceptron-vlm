<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
<title id="title">同樣三個區塊，邊界可以不同</title>
<desc id="desc">手工示意：catcatdogdog共12個ASCII bytes，等長切成catc、atdo、gdog，另一種切法為cat、catdog、dog，兩者都是3塊，未量測優劣。下半圖為共同思路：已讀bytes經局部編碼、邊界判斷形成3個區塊特徵，由主要模型處理，再與保留的局部資訊一起預測後續bytes。這是概念資料流，不是BLT或H-Net的完整架構。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#3c5670" stroke-width="2"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;font-size:28px;fill:#172b3a}.strong{font-weight:700}.byte{font-family:"DejaVu Sans Mono",monospace;font-size:32px;text-anchor:middle}.flow{fill:none;stroke:#3c5670;stroke-width:3;marker-end:url(#arrow)}.node{fill:#f0f5fb;stroke:#3c70a4;stroke-width:2}.center{text-anchor:middle}</style>
<rect width="640" height="1120" fill="white"/>
<text x="28" y="47" class="strong" style="font-size:32px">同樣三個區塊，邊界可以不同</text>
<text x="28" y="94">原文 catcatdogdog：12 bytes</text>
<text x="28" y="143">等長分塊：4／4／4</text>
<g fill="#e8f1fc" stroke="#3c70a4" stroke-width="2">
<rect x="54" y="163" width="172" height="58" rx="7"/><rect x="230" y="163" width="172" height="58" rx="7"/><rect x="406" y="163" width="172" height="58" rx="7"/>
</g>
<g class="byte"><text x="74" y="203">c</text><text x="118" y="203">a</text><text x="162" y="203">t</text><text x="206" y="203">c</text><text x="250" y="203">a</text><text x="294" y="203">t</text><text x="338" y="203">d</text><text x="382" y="203">o</text><text x="426" y="203">g</text><text x="470" y="203">d</text><text x="514" y="203">o</text><text x="558" y="203">g</text></g>
<text x="28" y="271">另一種切法：3／6／3</text>
<g fill="#e3f5e8" stroke="#29814a" stroke-width="2">
<rect x="54" y="291" width="128" height="58" rx="7"/><rect x="186" y="291" width="260" height="58" rx="7"/><rect x="450" y="291" width="128" height="58" rx="7"/>
</g>
<g class="byte"><text x="74" y="331">c</text><text x="118" y="331">a</text><text x="162" y="331">t</text><text x="206" y="331">c</text><text x="250" y="331">a</text><text x="294" y="331">t</text><text x="338" y="331">d</text><text x="382" y="331">o</text><text x="426" y="331">g</text><text x="470" y="331">d</text><text x="514" y="331">o</text><text x="558" y="331">g</text></g>
<text x="28" y="393">兩者都是三塊；內容分組不同。</text>
<text x="28" y="435">手工示意，沒有量測哪種較好。</text>
<path d="M28 466 H612" stroke="#c4d1dd" stroke-width="2"/>
<text x="28" y="514" class="strong">從已讀內容到後續預測</text>
<rect x="42" y="541" width="426" height="62" rx="9" class="node"/>
<text x="255" y="582" class="center">已讀 bytes（12 個位置）</text>
<path d="M255 605 V635" class="flow"/>
<rect x="42" y="643" width="426" height="62" rx="9" class="node"/>
<text x="255" y="684" class="center">局部編碼：讀 byte 細節</text>
<path d="M255 707 V737" class="flow"/>
<rect x="42" y="745" width="426" height="90" rx="9" fill="#e3f5e8" stroke="#29814a" stroke-width="2"/>
<text x="255" y="782" class="center">決定邊界、形成區塊特徵</text>
<text x="255" y="820" class="center">較短序列（3 個位置）</text>
<path d="M255 837 V867" class="flow"/>
<rect x="42" y="875" width="426" height="62" rx="9" class="node"/>
<text x="255" y="916" class="center">主要模型（3 個位置）</text>
<path d="M255 939 V969" class="flow"/>
<rect x="42" y="977" width="426" height="62" rx="9" class="node"/>
<text x="255" y="1018" class="center">局部預測：仍按 byte 處理</text>
<path d="M255 1041 V1067" class="flow"/>
<text x="255" y="1101" class="center">預測後續 byte</text>
<path d="M470 674 H567 V1008 H480" class="flow"/>
<rect x="486" y="797" width="126" height="86" rx="6" fill="white"/>
<text x="549" y="828" class="center">保留</text><text x="549" y="868" class="center">局部細節</text>
</svg>
