<svg xmlns="http://www.w3.org/2000/svg" width="640" height="835" viewBox="0 0 640 835" role="img" aria-labelledby="title desc"><title id="title">視窗是否包含紅藍線索</title><desc id="desc">手工資料示意。紅色物體是答圓，藍色物體是答方是本例規則。最近一字或三字相同，五字才保留紅藍差別。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#54728c"/></marker></defs><rect width="640" height="835" fill="#fff"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="320" y="45" text-anchor="middle" font-size="34" fill="#173047" font-weight="bold">兩題的答案規則：圓／方</text><text x="320" y="90" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">灰字未送入，藍框是實際輸入</text><text x="40" y="160" text-anchor="middle" font-size="36" fill="#173047" font-weight="normal">圓</text><text x="580" y="160" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">答案</text><text x="80" y="229" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">1 字</text><rect x="492" y="195" width="88" height="54" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="180" y="232" text-anchor="middle" font-size="32" fill="#8b9198" font-weight="normal">紅</text><text x="268" y="232" text-anchor="middle" font-size="32" fill="#8b9198" font-weight="normal">色</text><text x="356" y="232" text-anchor="middle" font-size="32" fill="#8b9198" font-weight="normal">物</text><text x="444" y="232" text-anchor="middle" font-size="32" fill="#8b9198" font-weight="normal">體</text><text x="532" y="232" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">是</text><text x="80" y="299" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">3 字</text><rect x="316" y="265" width="264" height="54" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="180" y="302" text-anchor="middle" font-size="32" fill="#8b9198" font-weight="normal">紅</text><text x="268" y="302" text-anchor="middle" font-size="32" fill="#8b9198" font-weight="normal">色</text><text x="356" y="302" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">物</text><text x="444" y="302" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">體</text><text x="532" y="302" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">是</text><text x="80" y="369" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">5 字</text><rect x="140" y="335" width="440" height="54" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="180" y="372" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">紅</text><text x="268" y="372" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">色</text><text x="356" y="372" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">物</text><text x="444" y="372" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">體</text><text x="532" y="372" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">是</text><text x="320" y="420" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">一字與三字輸入都無法區分</text><text x="40" y="470" text-anchor="middle" font-size="36" fill="#173047" font-weight="normal">方</text><text x="580" y="470" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">答案</text><text x="80" y="539" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">1 字</text><rect x="492" y="505" width="88" height="54" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="180" y="542" text-anchor="middle" font-size="32" fill="#8b9198" font-weight="normal">藍</text><text x="268" y="542" text-anchor="middle" font-size="32" fill="#8b9198" font-weight="normal">色</text><text x="356" y="542" text-anchor="middle" font-size="32" fill="#8b9198" font-weight="normal">物</text><text x="444" y="542" text-anchor="middle" font-size="32" fill="#8b9198" font-weight="normal">體</text><text x="532" y="542" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">是</text><text x="80" y="609" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">3 字</text><rect x="316" y="575" width="264" height="54" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="180" y="612" text-anchor="middle" font-size="32" fill="#8b9198" font-weight="normal">藍</text><text x="268" y="612" text-anchor="middle" font-size="32" fill="#8b9198" font-weight="normal">色</text><text x="356" y="612" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">物</text><text x="444" y="612" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">體</text><text x="532" y="612" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">是</text><text x="80" y="679" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">5 字</text><rect x="140" y="645" width="440" height="54" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="180" y="682" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">藍</text><text x="268" y="682" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">色</text><text x="356" y="682" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">物</text><text x="444" y="682" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">體</text><text x="532" y="682" text-anchor="middle" font-size="32" fill="#173047" font-weight="bold">是</text><text x="320" y="730" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">到五字，紅／藍才一起送進去</text><text x="320" y="793" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">線索可見 ≠ 已學會用好線索</text></g></svg>