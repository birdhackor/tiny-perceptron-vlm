<svg xmlns="http://www.w3.org/2000/svg" width="640" height="807" viewBox="0 0 640 807" role="img" aria-labelledby="title desc"><title id="title">請求與答案中間，有真執行</title><desc id="desc">期待路徑示意。模型先請求，程式真算，回填後同一模型再答。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#14724d"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#17324d}</style><rect width="640" height="807" rx="18" fill="white"/><text x="28" y="48" font-size="32" font-weight="700" text-anchor="start">請求與答案中間，有真執行</text><rect x="32" y="82" width="576" height="94" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="56" y="124" font-size="32" font-weight="700" text-anchor="start">問題：1+2等於多少？</text><text x="56" y="162" font-size="28" font-weight="400" text-anchor="start">模型接收原問題與工具狀態</text><path d="M320 185 V208" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="225" width="576" height="94" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="56" y="267" font-size="32" font-weight="700" text-anchor="start">模型第一段：應請求工具</text><text x="56" y="305" font-size="28" font-weight="400" text-anchor="start">TOOL:calculator:1+2</text><path d="M320 328 V351" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="368" width="576" height="94" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="56" y="410" font-size="32" font-weight="700" text-anchor="start">程式：驗證後實算</text><text x="56" y="448" font-size="28" font-weight="400" text-anchor="start">真正的返回值是3</text><path d="M320 471 V494" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="511" width="576" height="94" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="56" y="553" font-size="32" font-weight="700" text-anchor="start">回填：外部結果3</text><text x="56" y="591" font-size="28" font-weight="400" text-anchor="start">與原題一起交回同一核心</text><path d="M320 614 V637" fill="none" stroke="#14724d" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="654" width="576" height="94" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="56" y="696" font-size="32" font-weight="700" text-anchor="start">模型第二段：應回答3</text><text x="56" y="734" font-size="28" font-weight="400" text-anchor="start">另查內容與正常結束</text><text x="28" y="781" font-size="28" font-weight="400" text-anchor="start">工具已算對，模型讀回仍可能答錯</text></svg>
