<svg xmlns="http://www.w3.org/2000/svg" width="380" height="628" viewBox="0 0 380 628" role="img" aria-labelledby="title desc">
  <title id="title">分開聲音碼本深度與未來文字時間</title>
  <desc id="desc">上半部的橫軸是音框時間，直向是碼本深度。第0音框的三個碼本ID依次為1、2、0，沿同一欄向下，相加得到1.375；第1音框另在右欄。下半部文字MTP沿文字時間向右，讀雨後預測距離1的停、距離2的了。</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#c2410c"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172554;text-anchor:middle;font-size:18px}.title{font-size:20px;font-weight:700}.small{font-size:17px}.id{font-size:25px;font-weight:700}.arrow{stroke:#c2410c;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="380" height="628" rx="14" fill="#fff"/>
  <rect x="12" y="12" width="356" height="404" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="title" x="190" y="41">A 聲音：往下補同一音框</text>
  <text class="small" x="238" y="70">音框時間 →</text>
  <text x="175" y="99">第0框</text><text x="295" y="99">第1框</text>
  <text x="63" y="151">碼本0</text><text x="63" y="231">碼本1</text><text x="63" y="311">碼本2</text>
  <rect x="130" y="118" width="90" height="54" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="130" y="198" width="90" height="54" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="130" y="278" width="90" height="54" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text class="id" x="175" y="154">1</text><text class="id" x="175" y="234">2</text><text class="id" x="175" y="314">0</text>
  <path class="arrow" d="M175 174V194"/><path class="arrow" d="M175 254V274"/>
  <rect x="250" y="118" width="90" height="54" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="250" y="198" width="90" height="54" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="250" y="278" width="90" height="54" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text class="id" x="295" y="154">?</text><text class="id" x="295" y="234">?</text><text class="id" x="295" y="314">?</text>
  <text class="small" x="190" y="365">表內是 ID；第0框為 [1,2,0]</text>
  <text class="small" x="190" y="394">相加：1 + 0.5 − 0.125 = 1.375</text>
  <rect x="12" y="434" width="356" height="182" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="title" x="190" y="464">B 文字：往右猜更遠位置</text>
  <text class="small" x="190" y="491">文字時間 →</text>
  <rect x="24" y="510" width="92" height="67" rx="8" fill="#fff" stroke="#3b82f6"/>
  <rect x="144" y="510" width="92" height="67" rx="8" fill="#fff" stroke="#3b82f6"/>
  <rect x="264" y="510" width="92" height="67" rx="8" fill="#fff" stroke="#3b82f6"/>
  <text class="small" x="70" y="533">已讀 t</text><text class="small" x="190" y="533">t+1</text><text class="small" x="310" y="533">t+2</text>
  <text class="id" x="70" y="562">雨</text><text class="id" x="190" y="562">停</text><text class="id" x="310" y="562">了</text>
  <path class="arrow" d="M118 545H140"/><path class="arrow" d="M238 545H260"/>
  <text class="small" x="190" y="603">距離1：停；距離2：了</text>
</svg>
