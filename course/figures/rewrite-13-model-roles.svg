<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1010" viewBox="0 0 640 1010" role="img" aria-labelledby="title desc"><title id="title">選卡PPO：五種角色要分清</title><desc id="desc">策略模型（policy）根據情境選擇回答卡，獎勵模型（reward model）根據情境和已選的卡評分，價值模型（critic）看情境估計平均獎勵並在PPO期間另外學習。舊策略（old policy）是本輪收集時的選卡機率紀錄，下輪更換；參考模型（reference）保留PPO開始時已完成SFT的策略模型，整段PPO期間固定。</desc><defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#173047}.title{font-size:32px;font-weight:700}.bold{font-weight:700}.small{font-size:28px}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6e8b"/></marker></defs><rect width="640" height="1010" fill="#ffffff"/><text x="32" y="48" class="title">選卡PPO：五種角色要分清</text><rect x="32" y="82" width="576" height="156" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="124" class="bold">策略模型（policy）</text><text x="50" y="164" class="">看情境 → 各卡機率</text><text x="50" y="204" class="">PPO期間更新，之後實際選卡</text><rect x="32" y="263" width="576" height="156" rx="12" fill="#e8f6ef" stroke="#6487a0" stroke-width="2"/><text x="50" y="305" class="bold">獎勵模型（reward model）</text><text x="50" y="345" class="">看情境與卡 → 本次分數</text><text x="50" y="385" class="">先學比較，PPO期間固定</text><rect x="32" y="444" width="576" height="156" rx="12" fill="#fff4d9" stroke="#6487a0" stroke-width="2"/><text x="50" y="486" class="bold">價值模型（critic）</text><text x="50" y="526" class="">看情境 → 平均分數估計</text><text x="50" y="566" class="">PPO期間另學估計</text><rect x="32" y="625" width="576" height="156" rx="12" fill="#f0edf8" stroke="#6487a0" stroke-width="2"/><text x="50" y="667" class="bold">舊策略（old policy）</text><text x="50" y="707" class="">保存選卡時的log機率</text><text x="50" y="747" class="">同輪固定；下輪重新收集</text><rect x="32" y="806" width="576" height="156" rx="12" fill="#f0edf8" stroke="#6487a0" stroke-width="2"/><text x="50" y="848" class="bold">參考模型（reference）</text><text x="50" y="888" class="">看情境 → SFT底座的各卡機率</text><text x="50" y="928" class="">整段PPO期間不更新</text></svg>