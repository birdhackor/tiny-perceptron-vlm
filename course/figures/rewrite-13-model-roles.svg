<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1010" viewBox="0 0 640 1010" role="img" aria-labelledby="title desc"><title id="title">選卡PPO：五種角色要分清</title><desc id="desc">policy根據情境選擇卡片，reward根據情境和已經選中的卡評分，critic看情境估計平均reward並參與更新。old是本輪收集時的卡片概率快照，下輪更換；reference保留PPO開始時已完成示範微調的策略，整段PPO期間固定。</desc><defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#173047}.title{font-size:32px;font-weight:700}.bold{font-weight:700}.small{font-size:28px}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6e8b"/></marker></defs><rect width="640" height="1010" fill="#ffffff"/><text x="32" y="48" class="title">選卡PPO：五種角色要分清</text><rect x="32" y="82" width="576" height="156" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="124" class="bold">policy：策略</text><text x="50" y="164" class="">看情境 → 各卡機率</text><text x="50" y="204" class="">PPO期間更新，之後實際選卡</text><rect x="32" y="263" width="576" height="156" rx="12" fill="#e8f6ef" stroke="#6487a0" stroke-width="2"/><text x="50" y="305" class="bold">reward：評分員</text><text x="50" y="345" class="">看情境與卡 → 本次分數</text><text x="50" y="385" class="">先學比較，PPO期間固定</text><rect x="32" y="444" width="576" height="156" rx="12" fill="#fff4d9" stroke="#6487a0" stroke-width="2"/><text x="50" y="486" class="bold">critic：價值估計員</text><text x="50" y="526" class="">看情境 → 平均分數估計</text><text x="50" y="566" class="">PPO期間另學估計</text><rect x="32" y="625" width="576" height="156" rx="12" fill="#f0edf8" stroke="#6487a0" stroke-width="2"/><text x="50" y="667" class="bold">old：本輪舊紀錄</text><text x="50" y="707" class="">保存選卡時的log機率</text><text x="50" y="747" class="">同輪固定；下輪重新收集</text><rect x="32" y="806" width="576" height="156" rx="12" fill="#f0edf8" stroke="#6487a0" stroke-width="2"/><text x="50" y="848" class="bold">reference：PPO起點</text><text x="50" y="888" class="">看情境 → 起點各卡機率</text><text x="50" y="928" class="">整段PPO期間不更新</text></svg>