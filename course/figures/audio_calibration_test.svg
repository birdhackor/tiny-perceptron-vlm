<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" style="display:block;max-width:100%;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">單音分類校準後，測試答案不變而信心增加</title>
  <desc id="desc">在八段驗證錄音上選擇溫度零點五，最後十四段測試的答對數仍為十一。平均信心從百分之八十七點九六升到九十二點七三，超過固定的百分之七十八點五七正確率；ECE和Brier誤差均增加。</desc>
  <style>text{font-family:system-ui,"Noto Sans TC",sans-serif;fill:#243247;font-size:26px}.title{font-size:31px;font-weight:700}.heading{font-size:28px;font-weight:700}.small{font-size:25px}.value{font-size:28px;font-weight:700}</style>
  <rect width="1120" height="560" rx="20" fill="#f5f7fb"/>
  <text x="40" y="49" class="title">同一批 14 段單音，答案沒有改，信心卻變大</text>
  <text x="40" y="89">只在 8 段驗證錄音選溫度：驗證 8/8 全對，選中 0.5。</text>
  <rect x="40" y="119" width="500" height="340" rx="16" fill="#fff" stroke="#c8d2df" stroke-width="2"/>
  <rect x="580" y="119" width="500" height="340" rx="16" fill="#fff" stroke="#c8d2df" stroke-width="2"/>
  <text x="70" y="163" class="heading">原始分數　溫度 1</text>
  <text x="610" y="163" class="heading">校準後　溫度 0.5</text>
  <text x="70" y="208">答對仍是 11/14（78.57%）</text>
  <text x="610" y="208">答對仍是 11/14（78.57%）</text>
  <text x="70" y="248" class="value">平均信心 87.96%</text>
  <text x="610" y="248" class="value">平均信心 92.73%</text>
  <rect x="70" y="268" width="410" height="42" rx="7" fill="#e8edf3"/>
  <rect x="610" y="268" width="410" height="42" rx="7" fill="#e8edf3"/>
  <rect x="70" y="268" width="360.635" height="42" rx="7" fill="#357ba9"/>
  <rect x="610" y="268" width="380.173" height="42" rx="7" fill="#357ba9"/>
  <line x1="392.143" y1="258" x2="392.143" y2="321" stroke="#7a3b81" stroke-width="4" stroke-dasharray="7 5"/>
  <line x1="932.143" y1="258" x2="932.143" y2="321" stroke="#7a3b81" stroke-width="4" stroke-dasharray="7 5"/>
  <text x="70" y="343" class="small">虛線：同批測試正確率 78.57%</text>
  <text x="610" y="343" class="small">虛線位置不變，信心條更長</text>
  <text x="70" y="389">ECE：0.13186</text>
  <text x="610" y="389">ECE：0.14154（增加）</text>
  <text x="70" y="431">Brier：0.20207</text>
  <text x="610" y="431">Brier：0.25337（增加）</text>
  <text x="40" y="500">兩項誤差越小越好；驗證集選得較好，沒有保證新頻率也較好。</text>
  <text x="40" y="540" class="small">這是 low／high 分類器的信心，不是生成回答或安全判斷的可靠度。</text>
</svg>
