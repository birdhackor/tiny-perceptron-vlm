<svg xmlns="http://www.w3.org/2000/svg" width="640" height="770" viewBox="0 0 640 770" role="img" aria-labelledby="title desc"><title id="title">左PAD：格子移了，位置不移</title><desc id="desc">原序列ID1至3的模型位置0至2。左PAD後物理欄0至4，前兩格無效，末三格模型位置仍0至2。</desc>
<defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#172b3a}.strong{font-weight:700}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#3c70a4"/></marker></defs>
<rect width="640" height="770" fill="white"/>
<text x="28" y="48" font-size="32" style="font-size:32px" text-anchor="start" class="strong">左PAD：格子移了，位置不移</text>
<text x="28" y="102" font-size="28" style="font-size:28px" text-anchor="start">未補齊：三個真實token</text>
<rect x="180" y="129" width="108" height="64" rx="10" fill="#e3f5e8" stroke="#29814a" stroke-width="2"/>
<text x="234" y="172" font-size="32" style="font-size:32px" text-anchor="middle" class="strong">1</text>
<text x="234" y="237" font-size="28" style="font-size:28px" text-anchor="middle">0</text>
<rect x="310" y="129" width="108" height="64" rx="10" fill="#e3f5e8" stroke="#29814a" stroke-width="2"/>
<text x="364" y="172" font-size="32" style="font-size:32px" text-anchor="middle" class="strong">2</text>
<text x="364" y="237" font-size="28" style="font-size:28px" text-anchor="middle">1</text>
<rect x="440" y="129" width="108" height="64" rx="10" fill="#e3f5e8" stroke="#29814a" stroke-width="2"/>
<text x="494" y="172" font-size="32" style="font-size:32px" text-anchor="middle" class="strong">3</text>
<text x="494" y="237" font-size="28" style="font-size:28px" text-anchor="middle">2</text>
<text x="28" y="237" font-size="28" style="font-size:28px" text-anchor="start">模型位置</text>
<text x="28" y="305" font-size="28" style="font-size:28px" text-anchor="start">左補兩格PAD</text>
<rect x="28" y="331" width="108" height="64" rx="10" fill="#e8f1fc" stroke="#3c70a4" stroke-width="2"/>
<text x="82" y="375" font-size="30" style="font-size:30px" text-anchor="middle" class="strong">PAD</text>
<rect x="146" y="331" width="108" height="64" rx="10" fill="#e8f1fc" stroke="#3c70a4" stroke-width="2"/>
<text x="200" y="375" font-size="30" style="font-size:30px" text-anchor="middle" class="strong">PAD</text>
<rect x="264" y="331" width="108" height="64" rx="10" fill="#e3f5e8" stroke="#29814a" stroke-width="2"/>
<text x="318" y="375" font-size="30" style="font-size:30px" text-anchor="middle" class="strong">1</text>
<rect x="382" y="331" width="108" height="64" rx="10" fill="#e3f5e8" stroke="#29814a" stroke-width="2"/>
<text x="436" y="375" font-size="30" style="font-size:30px" text-anchor="middle" class="strong">2</text>
<rect x="500" y="331" width="108" height="64" rx="10" fill="#e3f5e8" stroke="#29814a" stroke-width="2"/>
<text x="554" y="375" font-size="30" style="font-size:30px" text-anchor="middle" class="strong">3</text>
<text x="28" y="447" font-size="28" style="font-size:28px" text-anchor="start">物理欄位</text>
<text x="82" y="493" font-size="28" style="font-size:28px" text-anchor="middle">0</text>
<text x="200" y="493" font-size="28" style="font-size:28px" text-anchor="middle">1</text>
<text x="318" y="493" font-size="28" style="font-size:28px" text-anchor="middle">2</text>
<text x="436" y="493" font-size="28" style="font-size:28px" text-anchor="middle">3</text>
<text x="554" y="493" font-size="28" style="font-size:28px" text-anchor="middle">4</text>
<text x="28" y="546" font-size="28" style="font-size:28px" text-anchor="start">valid</text>
<text x="82" y="592" font-size="28" style="font-size:28px" text-anchor="middle">假</text>
<text x="200" y="592" font-size="28" style="font-size:28px" text-anchor="middle">假</text>
<text x="318" y="592" font-size="28" style="font-size:28px" text-anchor="middle">真</text>
<text x="436" y="592" font-size="28" style="font-size:28px" text-anchor="middle">真</text>
<text x="554" y="592" font-size="28" style="font-size:28px" text-anchor="middle">真</text>
<text x="28" y="641" font-size="28" style="font-size:28px" text-anchor="start">模型位置</text>
<text x="82" y="687" font-size="28" style="font-size:28px" text-anchor="middle">—</text>
<text x="200" y="687" font-size="28" style="font-size:28px" text-anchor="middle">—</text>
<text x="318" y="687" font-size="28" style="font-size:28px" text-anchor="middle">0</text>
<text x="436" y="687" font-size="28" style="font-size:28px" text-anchor="middle">1</text>
<text x="554" y="687" font-size="28" style="font-size:28px" text-anchor="middle">2</text>
<text x="28" y="743" font-size="28" style="font-size:28px" text-anchor="start">同時禁止讀PAD，保留真實位置。</text>
</svg>
