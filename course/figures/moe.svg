<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc">
    <title id="title">四位師傅都在，這張訂單只請兩位動手</title><desc id="desc">例中只派給A與C；未選中師傅的權重仍佔儲存空間。。橘色輪流提示閱讀步驟，所有內容靜態可見。</desc>
    <style>
    text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif}
    rect.pulse,.pulse rect{animation:pulse 6s infinite}.step1,.step1 rect{animation-delay:0s}.step2,.step2 rect{animation-delay:1.5s}.step3,.step3 rect{animation-delay:3s}.step4,.step4 rect{animation-delay:4.5s}
    @keyframes pulse{0%,23%{stroke:#e87924;stroke-width:4}24%,100%{stroke:#8da8ca;stroke-width:1}}
    @media(prefers-reduced-motion:reduce){rect.pulse,.pulse rect{animation:none}}
    </style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#466b97"/></marker></defs>
    <rect width="800" height="390" fill="#fff"/><text x="400" y="32" font-size="24" fill="#172b4d" text-anchor="middle">四位師傅都在，這張訂單只請兩位動手</text>
    <path d="M345 190L430 95" stroke="#167947" fill="none"  marker-end="url(#arrow)"/><path d="M575 95L655 190" stroke="#167947" fill="none" marker-end="url(#arrow)"/><g class="pulse step2"><rect x="430" y="65" width="145" height="60" rx="12" fill="#d7f5e6" stroke="#8da8ca"/><text x="502.5" y="91.0" font-size="19" fill="#172b4d" text-anchor="middle">師傅 A</text><text x="502.5" y="118.0" font-size="14" fill="#172b4d" text-anchor="middle">混合占60%</text></g><path d="M345 190L430 169" stroke="#167947" fill="none" stroke-dasharray="4 5" marker-end="url(#arrow)"/><g><rect x="430" y="139" width="145" height="60" rx="12" fill="#edf0f4" stroke="#8da8ca"/><text x="502.5" y="165.0" font-size="19" fill="#172b4d" text-anchor="middle">師傅 B</text><text x="502.5" y="192.0" font-size="14" fill="#172b4d" text-anchor="middle">本次不運算</text></g><path d="M345 190L430 243" stroke="#167947" fill="none"  marker-end="url(#arrow)"/><path d="M575 243L655 190" stroke="#167947" fill="none" marker-end="url(#arrow)"/><g class="pulse step4"><rect x="430" y="213" width="145" height="60" rx="12" fill="#d7f5e6" stroke="#8da8ca"/><text x="502.5" y="239.0" font-size="19" fill="#172b4d" text-anchor="middle">師傅 C</text><text x="502.5" y="266.0" font-size="14" fill="#172b4d" text-anchor="middle">混合占40%</text></g><path d="M345 190L430 317" stroke="#167947" fill="none" stroke-dasharray="4 5" marker-end="url(#arrow)"/><g><rect x="430" y="287" width="145" height="60" rx="12" fill="#edf0f4" stroke="#8da8ca"/><text x="502.5" y="313.0" font-size="19" fill="#172b4d" text-anchor="middle">師傅 D</text><text x="502.5" y="340.0" font-size="14" fill="#172b4d" text-anchor="middle">本次不運算</text></g><g class="pulse step1"><rect x="15" y="150" width="135" height="80" rx="12" fill="#e8f1ff" stroke="#8da8ca"/><text x="82.5" y="186.0" font-size="19" fill="#172b4d" text-anchor="middle">一張字卡</text><text x="82.5" y="213.0" font-size="14" fill="#172b4d" text-anchor="middle">待加工的向量</text></g><path d="M150 190L205 190" stroke="#466b97" marker-end="url(#arrow)"/><g class="pulse step2"><rect x="205" y="150" width="140" height="80" rx="12" fill="#e8f1ff" stroke="#8da8ca"/><text x="275.0" y="186.0" font-size="19" fill="#172b4d" text-anchor="middle">分單員</text><text x="275.0" y="213.0" font-size="14" fill="#172b4d" text-anchor="middle">選兩位師傅</text></g><rect x="655" y="150" width="130" height="80" rx="12" fill="#e8f1ff" stroke="#8da8ca"/><text x="720.0" y="186.0" font-size="19" fill="#172b4d" text-anchor="middle">混合結果</text><text x="720.0" y="213.0" font-size="14" fill="#172b4d" text-anchor="middle">依比例相加</text><text x="400" y="374" font-size="15" fill="#172b4d" text-anchor="middle">例中只派給A與C；未選中師傅的權重仍佔儲存空間。</text>
    </svg>