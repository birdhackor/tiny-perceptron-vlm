<svg xmlns="http://www.w3.org/2000/svg" width="640" height="438" viewBox="0 0 640 438" role="img" aria-labelledby="title desc"><title id="title">只讀指定的下框</title><desc id="desc">上框入口，下框出口。指定下框時只讀出口，不多讀上框。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#14724d"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#17324d}</style><rect width="640" height="438" rx="18" fill="white"/><text x="28" y="48" font-size="32" font-weight="700" text-anchor="start">只讀指定的下框</text><text x="28" y="87" font-size="28" font-weight="400" text-anchor="start">合成字卡示意；上、下各一個區域</text><rect x="32" y="110" width="576" height="96" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="320" y="179" font-size="60" font-weight="700" text-anchor="middle">入口</text><rect x="32" y="266" width="576" height="96" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="320" y="335" font-size="60" font-weight="700" text-anchor="middle">出口</text><text x="32" y="249" font-size="32" font-weight="700" text-anchor="start">指定下框</text><text x="32" y="412" font-size="32" font-weight="700" text-anchor="start">紙上答案：出口</text></svg>
