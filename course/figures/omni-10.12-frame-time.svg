<svg xmlns="http://www.w3.org/2000/svg" width="360" height="510" viewBox="0 0 360 510" role="img" aria-labelledby="title desc">
  <title id="title">同樣四個影格，不同時間戳</title>
  <desc id="desc">圓圓方方四個影格在 A 於零、一千、兩千、三千毫秒出現，在 B 於零、五百、一千、一千五百毫秒出現。保持到下一格後，同一個一千五百毫秒查詢，在 A 是圓，在 B 是方。</desc>
  <style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#172b4d;font-size:17px}.title{font-size:21px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.white{fill:white}.axis{stroke:#51657d;stroke-width:2}.query{stroke:#942b4b;stroke-width:2;stroke-dasharray:5 4}</style>
  <rect width="360" height="510" rx="12" fill="#f7f9fc"/>
  <text class="title" x="20" y="34">同一組影格，換時間戳</text>
  <text x="20" y="65">影格序號</text>
  <g text-anchor="middle">
    <circle cx="53" cy="99" r="17" fill="#237a9b"/><circle cx="137" cy="99" r="17" fill="#237a9b"/>
    <rect x="204" y="82" width="34" height="34" fill="#bd6c25"/><rect x="288" y="82" width="34" height="34" fill="#bd6c25"/>
    <text x="53" y="143">0：圓</text><text x="137" y="143">1：圓</text><text x="221" y="143">2：方</text><text x="305" y="143">3：方</text>
  </g>
  <text class="label" x="20" y="183">A：0 / 1000 / 2000 / 3000 ms</text>
  <rect x="30" y="204" width="150" height="43" fill="#237a9b"/><rect x="180" y="204" width="150" height="43" fill="#bd6c25"/>
  <text class="white" x="90" y="232">圓</text><text class="white" x="245" y="232">方</text>
  <line class="axis" x1="30" y1="251" x2="330" y2="251"/>
  <g text-anchor="middle" class="small"><text x="30" y="277">0</text><text x="180" y="277">2000</text><text x="320" y="277">4000</text></g>
  <line class="query" x1="142.5" y1="194" x2="142.5" y2="257"/>
  <text class="label" x="20" y="320">B：0 / 500 / 1000 / 1500 ms</text>
  <rect x="30" y="341" width="75" height="43" fill="#237a9b"/><rect x="105" y="341" width="225" height="43" fill="#bd6c25"/>
  <text class="white" x="58" y="369">圓</text><text class="white" x="214" y="369">方</text>
  <line class="axis" x1="30" y1="388" x2="330" y2="388"/>
  <g text-anchor="middle" class="small"><text x="30" y="414">0</text><text x="105" y="414">1000</text><text x="320" y="414">4000</text></g>
  <line class="query" x1="142.5" y1="331" x2="142.5" y2="394"/>
  <rect x="20" y="441" width="320" height="49" rx="8" fill="#f9e8ed"/>
  <text class="label" x="34" y="471">虛線：同一個 1500 ms</text>
</svg>
