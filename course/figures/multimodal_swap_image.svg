<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">同問題換圖，答案應按規則變</title><desc id="desc">固定形狀問題，紅圓換藍方，正確答案從circle變square。顏色同時改變，但題目只問形狀。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#54768c"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif}svg{background:white}</style><rect width="900" height="360" fill="#fff"/><text x="450" y="34" text-anchor="middle" font-size="24" fill="#18354a">同問題換圖，答案應按規則變</text><rect x="30" y="80" width="225" height="55" rx="8" fill="#eef5ff" stroke="#54768c"/><text x="142.5" y="113.5" text-anchor="middle" font-size="19" fill="#18354a">問題固定：什麼形狀？</text><text x="400" y="90" text-anchor="middle" font-size="19" fill="#18354a">原圖</text><text x="730" y="90" text-anchor="middle" font-size="19" fill="#18354a">替換圖</text><circle cx="400" cy="175" r="43" fill="#d8564c"/><rect x="687" y="132" width="86" height="86" fill="#4677d4"/><path d="M465 175L650 175" fill="none" stroke="#54768c" stroke-width="2" marker-end="url(#arrow)"/><text x="555" y="152" text-anchor="middle" font-size="17" fill="#18354a">換圖片</text><text x="400" y="272" text-anchor="middle" font-size="19" fill="#18354a">正確答案：circle</text><text x="730" y="272" text-anchor="middle" font-size="19" fill="#18354a">正確答案：square</text><text x="450" y="330" text-anchor="middle" font-size="18" fill="#18354a">只猜circle兩次都不變；利用圖片的答案應按形狀改變。</text></svg>