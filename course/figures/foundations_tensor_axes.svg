<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="title desc"><title id="title">同一張成績表，兩種平均方向</title><desc id="desc">兩列代表同學，三欄代表小考。沿小考軸平均，每人得到七十與九十；沿同學軸平均，每次小考得到七十、八十與九十。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="680" height="500" rx="12" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a"><text x="340" y="36" font-size="27" text-anchor="middle" fill="#0f172a">shape = [2, 3]：2 位同學 × 3 次小考</text><text x="215" y="82" font-size="25" text-anchor="middle" fill="#0f172a">小考 1</text><text x="345" y="82" font-size="25" text-anchor="middle" fill="#0f172a">小考 2</text><text x="475" y="82" font-size="25" text-anchor="middle" fill="#0f172a">小考 3</text><text x="72" y="150" font-size="25" text-anchor="middle" fill="#0f172a">同學 1</text><text x="72" y="230" font-size="25" text-anchor="middle" fill="#0f172a">同學 2</text><rect x="150" y="105" width="125" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="212" y="150" font-size="34" text-anchor="middle" fill="#0f172a">60</text><rect x="280" y="105" width="125" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="342" y="150" font-size="34" text-anchor="middle" fill="#0f172a">70</text><rect x="410" y="105" width="125" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="472" y="150" font-size="34" text-anchor="middle" fill="#0f172a">80</text><rect x="150" y="185" width="125" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="212" y="230" font-size="34" text-anchor="middle" fill="#0f172a">80</text><rect x="280" y="185" width="125" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="342" y="230" font-size="34" text-anchor="middle" fill="#0f172a">90</text><rect x="410" y="185" width="125" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="472" y="230" font-size="34" text-anchor="middle" fill="#0f172a">100</text><path d="M165 280H515" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="340" y="314" font-size="26" text-anchor="middle" fill="#0f172a">dim=1：跨每列的 3 次小考</text><rect x="90" y="330" width="500" height="46" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="340" y="361" font-size="28" text-anchor="middle" fill="#0f172a">每人平均 [70, 90]</text><text x="340" y="430" font-size="26" text-anchor="middle" fill="#0f172a">dim=0：跨每欄的 2 位同學</text><text x="340" y="472" font-size="28" text-anchor="middle" fill="#0f172a">每次小考平均 [70, 80, 90]</text><path d="M625 112V248" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="610" y="290" font-size="23" text-anchor="middle" fill="#0f172a">dim=0</text><path d="M130 389H550" fill="none" stroke="#cbd5e1" stroke-width="2"/></g></svg>
