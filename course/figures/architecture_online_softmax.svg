<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
<title id="title">分塊softmax：最大值改變時同步縮放舊統計</title><desc id="desc">第一塊分數0與log2，值10與20；最大值log2，分母1.5，分子25。第二塊分數log4，值30；舊分母與分子乘0.5，新分母1.75，分子42.5，結果24.2857。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#172b4d}rect.box{fill:#eef5ff;stroke:#8da8ca;stroke-width:2}.arrow{fill:none;stroke:#466b97;stroke-width:2}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466b97"/></marker></defs>
<rect width="960" height="330" fill="white"/><text x="480" y="32" font-size="22" text-anchor="middle">不用保存整列權重，仍得到相同加權平均</text>
<rect class="box" x="15" y="94" width="210" height="155" rx="10"/><rect class="box" x="255" y="94" width="210" height="155" rx="10"/><rect class="box" x="495" y="94" width="210" height="155" rx="10"/><rect x="735" y="94" width="210" height="155" rx="10" fill="#d7f5e6" stroke="#26875b" stroke-width="2"/>
<g text-anchor="middle" font-size="17"><text x="120" y="122">第一塊</text><text x="120" y="152">分數：[0, log2]</text><text x="120" y="181">值：[10, 20]</text><text x="120" y="211">權重：[0.5, 1]</text><text x="360" y="122">目前統計</text><text x="360" y="152">最大值：log2</text><text x="360" y="181">分母：1.5</text><text x="360" y="211">分子：25</text><text x="600" y="122">新最大值：log4</text><text x="600" y="152">舊統計 × 0.5</text><text x="600" y="181">分母：0.75 + 1</text><text x="600" y="211">分子：12.5 + 30</text><text x="840" y="122">第二塊合併後</text><text x="840" y="152">分母：1.75</text><text x="840" y="181">分子：42.5</text><text x="840" y="211">42.5 / 1.75</text><text x="840" y="238">= 24.2857</text></g>
<path class="arrow" d="M225 171L255 171" marker-end="url(#arrow)"/>
<path class="arrow" d="M465 171L495 171" marker-end="url(#arrow)"/>
<path class="arrow" d="M705 171L735 171" marker-end="url(#arrow)"/>
<text x="480" y="290" font-size="16" text-anchor="middle">第二塊：分數log4、值30；乘0.5讓舊資料改以新最大值為基準</text>
</svg>
