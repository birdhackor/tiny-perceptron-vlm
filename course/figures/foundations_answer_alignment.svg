<svg xmlns="http://www.w3.org/2000/svg" width="680" height="545" viewBox="0 0 680 545" role="img" aria-labelledby="title desc"><title id="title">assistant位置預測首答案 A</title><desc id="desc">完整序列BOS user Q EOS assistant A EOS，輸入去最後一項，目標去第一項並忽略非回答。六位置中前四個目標忽略，位置四輸入assistant編號四預測A編號七十三，位置五輸入A預測EOS編號二。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="680" height="545" rx="12" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a"><text x="340" y="35" font-size="24" text-anchor="middle" fill="#0f172a">完整原序列：BOS user Q EOS assistant A EOS</text><text x="340" y="72" font-size="25" text-anchor="middle" fill="#0f172a">X 去末項；Y 去首項，非回答目標用 -100</text><text x="80" y="119" font-size="26" text-anchor="middle" fill="#0f172a">位置</text><text x="280" y="119" font-size="26" text-anchor="middle" fill="#0f172a">X：已看到的輸入</text><text x="535" y="119" font-size="26" text-anchor="middle" fill="#0f172a">Y：下一項答案</text><rect x="30" y="137" width="620" height="46" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="170" font-size="29" text-anchor="middle" fill="#0f172a">0</text><text x="277" y="170" font-size="28" text-anchor="middle" fill="#0f172a">BOS · 1</text><text x="535" y="170" font-size="28" text-anchor="middle" fill="#0f172a">忽略 · -100</text><rect x="30" y="189" width="620" height="46" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="222" font-size="29" text-anchor="middle" fill="#0f172a">1</text><text x="277" y="222" font-size="28" text-anchor="middle" fill="#0f172a">user · 3</text><text x="535" y="222" font-size="28" text-anchor="middle" fill="#0f172a">忽略 · -100</text><rect x="30" y="241" width="620" height="46" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="274" font-size="29" text-anchor="middle" fill="#0f172a">2</text><text x="277" y="274" font-size="28" text-anchor="middle" fill="#0f172a">Q · 89</text><text x="535" y="274" font-size="28" text-anchor="middle" fill="#0f172a">忽略 · -100</text><rect x="30" y="293" width="620" height="46" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="326" font-size="29" text-anchor="middle" fill="#0f172a">3</text><text x="277" y="326" font-size="28" text-anchor="middle" fill="#0f172a">EOS · 2</text><text x="535" y="326" font-size="28" text-anchor="middle" fill="#0f172a">忽略 · -100</text><rect x="30" y="345" width="620" height="46" rx="4" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="378" font-size="29" text-anchor="middle" fill="#0f172a">4</text><text x="277" y="378" font-size="28" text-anchor="middle" fill="#0f172a">assistant · 4</text><text x="535" y="378" font-size="28" text-anchor="middle" fill="#0f172a">A · 73</text><path d="M398 368H442" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="397" width="620" height="46" rx="4" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="430" font-size="29" text-anchor="middle" fill="#0f172a">5</text><text x="277" y="430" font-size="28" text-anchor="middle" fill="#0f172a">A · 73</text><text x="535" y="430" font-size="28" text-anchor="middle" fill="#0f172a">EOS · 2</text><path d="M398 420H442" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="340" y="483" font-size="26" text-anchor="middle" fill="#0f172a">綠列才計直接 loss；灰列的輸入仍可讀</text><text x="340" y="524" font-size="26" text-anchor="middle" fill="#0f172a">首答案 A 在位置 4 被預測，不在位置 5</text></g></svg>
