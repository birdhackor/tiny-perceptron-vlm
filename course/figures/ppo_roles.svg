<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
  <title id="title">PPO有限選卡任務的四種不同角色</title>
  <desc id="desc">獎勵模型先學偏好後固定；價值模型每輪學預期回饋；每輪收集時的舊log機率固定供該輪更新使用；SFT參考全程固定供KL比較。回答策略依這些訊號更新。</desc>
  <rect width="820" height="520" rx="16" fill="#f8fafc"/>
  <g font-family="Noto Sans CJK TC, sans-serif" fill="#0f172a">
    <text x="410" y="39" font-size="24" font-weight="bold" text-anchor="middle">都參與更新，但工作與凍結時間不同</text>
    <text x="48" y="80" font-size="19" font-weight="bold">角色</text>
    <text x="274" y="80" font-size="19" font-weight="bold">在這個選卡任務做什麼</text>
    <text x="592" y="80" font-size="19" font-weight="bold">何時改變</text>
    <rect x="25" y="99" width="770" height="75" rx="10" fill="#fef3c7" stroke="#b45309"/>
    <text x="48" y="129" font-size="21" font-weight="bold">獎勵模型</text>
    <text x="48" y="155" font-size="18">reward model</text>
    <text x="260" y="130" font-size="18">看情境與已選卡</text>
    <text x="260" y="156" font-size="18">→ 這次回答的分數</text>
    <text x="570" y="130" font-size="18">先學比較</text>
    <text x="570" y="156" font-size="18">策略更新時固定</text>
    <rect x="25" y="188" width="770" height="75" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="48" y="218" font-size="21" font-weight="bold">價值模型</text>
    <text x="48" y="244" font-size="18">critic / value</text>
    <text x="260" y="219" font-size="18">先看情境</text>
    <text x="260" y="245" font-size="18">→ 估計預期回饋</text>
    <text x="570" y="219" font-size="18">用觀察到的回饋</text>
    <text x="570" y="245" font-size="18">每輪學估計</text>
    <rect x="25" y="277" width="770" height="75" rx="10" fill="#dcfce7" stroke="#15803d"/>
    <text x="48" y="307" font-size="21" font-weight="bold">舊策略紀錄</text>
    <text x="48" y="333" font-size="18">old log 機率</text>
    <text x="260" y="308" font-size="18">記下作答當時的機率</text>
    <text x="260" y="334" font-size="18">→ 供更新前後機率比較</text>
    <text x="570" y="308" font-size="18">同一輪更新內固定</text>
    <text x="570" y="334" font-size="18">下輪重新作答、記錄</text>
    <rect x="25" y="366" width="770" height="75" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="48" y="396" font-size="21" font-weight="bold">固定參考</text>
    <text x="48" y="422" font-size="18">reference</text>
    <text x="260" y="397" font-size="18">保留示範訓練起點</text>
    <text x="260" y="423" font-size="18">→ KL 的對照分布</text>
    <text x="570" y="397" font-size="18">整段後訓練不改</text>
    <text x="570" y="423" font-size="18">與每輪 old 不同</text>
    <text x="410" y="485" font-size="19" text-anchor="middle">回答策略 policy 才是最後選卡的模型；它依這些訊號更新。</text>
  </g>
</svg>
