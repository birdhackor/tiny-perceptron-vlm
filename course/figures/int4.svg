<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img" aria-labelledby="title desc">
    <title id="title">兩個小格裝一個byte：低四位與高四位</title><desc id="desc">本例signed加8：−3→0101，+4→1100，合成11000101。。橘色輪流提示閱讀步驟，所有內容靜態可見。</desc>
    <style>
    text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif}
    rect.pulse,.pulse rect{animation:pulse 6s infinite}.step1,.step1 rect{animation-delay:0s}.step2,.step2 rect{animation-delay:1.5s}.step3,.step3 rect{animation-delay:3s}.step4,.step4 rect{animation-delay:4.5s}
    @keyframes pulse{0%,23%{stroke:#e87924;stroke-width:4}24%,100%{stroke:#8da8ca;stroke-width:1}}
    @media(prefers-reduced-motion:reduce){rect.pulse,.pulse rect{animation:none}}
    </style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#466b97"/></marker></defs>
    <rect width="800" height="358" fill="#fff"/><text x="400" y="32" font-size="24" fill="#172b4d" text-anchor="middle">兩個小格裝一個byte：低四位與高四位</text>
    <text x="12" y="104" font-size="16" fill="#172b4d" text-anchor="start">signed值</text><g class="pulse step1"><rect x="125" y="72" width="80" height="48" rx="12" fill="#d7f5e6" stroke="#8da8ca"/><text x="165.0" y="92.0" font-size="19" fill="#172b4d" text-anchor="middle">−3</text><text x="165.0" y="119.0" font-size="14" fill="#172b4d" text-anchor="middle"></text></g><g class="pulse step2"><rect x="213" y="72" width="80" height="48" rx="12" fill="#d7f5e6" stroke="#8da8ca"/><text x="253.0" y="92.0" font-size="19" fill="#172b4d" text-anchor="middle">+4</text><text x="253.0" y="119.0" font-size="14" fill="#172b4d" text-anchor="middle"></text></g><text x="12" y="166" font-size="16" fill="#172b4d" text-anchor="start">加8編碼</text><g class="pulse step1"><rect x="125" y="134" width="80" height="48" rx="12" fill="#d7f5e6" stroke="#8da8ca"/><text x="165.0" y="154.0" font-size="19" fill="#172b4d" text-anchor="middle">0101</text><text x="165.0" y="181.0" font-size="14" fill="#172b4d" text-anchor="middle"></text></g><g class="pulse step2"><rect x="213" y="134" width="80" height="48" rx="12" fill="#d7f5e6" stroke="#8da8ca"/><text x="253.0" y="154.0" font-size="19" fill="#172b4d" text-anchor="middle">1100</text><text x="253.0" y="181.0" font-size="14" fill="#172b4d" text-anchor="middle"></text></g><text x="12" y="228" font-size="16" fill="#172b4d" text-anchor="start">高位|低位</text><g class="pulse step1"><rect x="125" y="196" width="80" height="48" rx="12" fill="#d7f5e6" stroke="#8da8ca"/><text x="165.0" y="216.0" font-size="19" fill="#172b4d" text-anchor="middle">11000101</text><text x="165.0" y="243.0" font-size="14" fill="#172b4d" text-anchor="middle"></text></g><text x="12" y="290" font-size="16" fill="#172b4d" text-anchor="start">還原</text><g class="pulse step1"><rect x="125" y="258" width="80" height="48" rx="12" fill="#d7f5e6" stroke="#8da8ca"/><text x="165.0" y="278.0" font-size="19" fill="#172b4d" text-anchor="middle">−3</text><text x="165.0" y="305.0" font-size="14" fill="#172b4d" text-anchor="middle"></text></g><g class="pulse step2"><rect x="213" y="258" width="80" height="48" rx="12" fill="#d7f5e6" stroke="#8da8ca"/><text x="253.0" y="278.0" font-size="19" fill="#172b4d" text-anchor="middle">+4</text><text x="253.0" y="305.0" font-size="14" fill="#172b4d" text-anchor="middle"></text></g><text x="400" y="342" font-size="15" fill="#172b4d" text-anchor="middle">本例signed加8：−3→0101，+4→1100，合成11000101。</text>
    </svg>