<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" role="img" aria-labelledby="title desc">
<title id="title">刻度0.5：浮點數對應整數格，再還原</title><desc id="desc">0.7除0.5得到1.4，取最近整數1，還原為0.5；1.2除0.5得到2.4，取整數2，還原為1.0。兩者與原值相差0.2。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#172b4d}.box{fill:#eef5ff;stroke:#8da8ca}.arrow{stroke:#466b97;stroke-width:2;fill:none}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466b97"/></marker></defs>
<rect width="860" height="240" fill="white"/><text x="430" y="29" font-size="22" text-anchor="middle">scale = 0.5；一格代表0.5</text>
<g font-size="17" text-anchor="middle"><text x="100" y="62">原數字</text><text x="320" y="62">除以scale</text><text x="540" y="62">取最近整數</text><text x="760" y="62">乘回scale</text>
<rect class="box" x="25" y="80" width="150" height="45" rx="8"/><text x="100" y="109">0.7</text><rect class="box" x="245" y="80" width="150" height="45" rx="8"/><text x="320" y="109">1.4</text><rect class="box" x="465" y="80" width="150" height="45" rx="8"/><text x="540" y="109">1</text><rect class="box" x="685" y="80" width="150" height="45" rx="8"/><text x="760" y="109">0.5</text>
<rect class="box" x="25" y="146" width="150" height="45" rx="8"/><text x="100" y="175">1.2</text><rect class="box" x="245" y="146" width="150" height="45" rx="8"/><text x="320" y="175">2.4</text><rect class="box" x="465" y="146" width="150" height="45" rx="8"/><text x="540" y="175">2</text><rect class="box" x="685" y="146" width="150" height="45" rx="8"/><text x="760" y="175">1.0</text></g>
<path class="arrow" d="M175 102L245 102" marker-end="url(#arrow)"/>
<path class="arrow" d="M395 102L465 102" marker-end="url(#arrow)"/>
<path class="arrow" d="M615 102L685 102" marker-end="url(#arrow)"/>
<path class="arrow" d="M175 168L245 168" marker-end="url(#arrow)"/>
<path class="arrow" d="M395 168L465 168" marker-end="url(#arrow)"/>
<path class="arrow" d="M615 168L685 168" marker-end="url(#arrow)"/>
<text x="430" y="226" font-size="16" text-anchor="middle">還原有損：0.7 − 0.5 = 0.2；1.2 − 1.0 = 0.2</text>
</svg>
