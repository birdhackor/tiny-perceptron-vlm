<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="title desc">
<title id="title">同一組候選，兩種選擇結果</title>
<desc id="desc">題目2加2的候選是3、3、4，集合包含正確答案4。兩條箭頭分別送全部候選給多數決與精確算術驗證器：多數決選3，驗證器選4。兩個方法平行比較，並非先丟棄候選再找回正解。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#496a93"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#172b4d}.main{font-size:21px}.small{font-size:17px}</style>
<rect width="880" height="390" fill="#fff"/>
<text x="440" y="36" text-anchor="middle" font-size="25">題目 2+2=?：找到正解與選中正解</text>
<rect x="35" y="119" width="230" height="165" rx="14" fill="#edf3ff" stroke="#8199be"/>
<text x="150" y="155" text-anchor="middle" class="main">全部候選 [3, 3, 4]</text>
<text x="150" y="198" text-anchor="middle" class="main">真值 = 4</text>
<text x="150" y="244" text-anchor="middle" class="small">coverage 命中：True</text>
<path d="M265 164L386 107" fill="none" stroke="#496a93" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M265 239L386 291" fill="none" stroke="#496a93" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="392" y="63" width="450" height="106" rx="13" fill="#fff2e5" stroke="#c98b43"/>
<text x="617" y="101" text-anchor="middle" class="main">多數決：3 出現兩次，4 出現一次</text>
<text x="617" y="143" text-anchor="middle" class="main">選出 3 → 答錯</text>
<rect x="392" y="236" width="450" height="106" rx="13" fill="#e8f6ed" stroke="#6b9c7b"/>
<text x="617" y="274" text-anchor="middle" class="main">算術 verifier：逐項檢查是否等於 2+2</text>
<text x="617" y="316" text-anchor="middle" class="main">選出 4 → 答對</text>
<text x="440" y="378" text-anchor="middle" class="small">兩條箭頭都保留整組候選；驗證器的精確規則只適用這個算術任務。</text>
</svg>
