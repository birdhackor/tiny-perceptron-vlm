<svg xmlns="http://www.w3.org/2000/svg" width="640" height="702" viewBox="0 0 640 702" role="img" aria-labelledby="title desc"><title id="title">同一來源的衍生題一起分</title><desc id="desc">示意：包A與短靴都來自訓練份，配對只用同份來源；A的單物件、配對和換位題全部留在訓練。B和C分別留給驗證及最後考卷。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#14724d"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#17324d} .main{font-size:30px;font-weight:700}.body{font-size:27px}.small{font-size:26px} .line{stroke:#14724d;stroke-width:3;fill:none}</style><rect width="640" height="702" fill="white"/><text x="28" y="48" font-size="32" font-weight="700">同一來源的衍生題一起分</text><text x="28" y="86" class="small">先分來源，再做衍生題（示意）</text><rect x="28" y="112" width="584" height="272" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="48" y="153" class="main">訓練份：包的來源 A</text><text x="48" y="201" class="body">原圖 A；短靴也取自訓練份</text><path d="M128 214 V239" class="line" marker-end="url(#arrow)"/><path d="M128 218 H328 V239" class="line" marker-end="url(#arrow)"/><path d="M128 218 H520 V239" class="line" marker-end="url(#arrow)"/><rect x="48" y="252" width="160" height="78" rx="12" fill="#ffffff" stroke="#7c8a9a" stroke-width="2"/><text x="60" y="286" class="small">單物件題</text><text x="60" y="317" class="small">只辨識包</text><rect x="240" y="252" width="160" height="78" rx="12" fill="#ffffff" stroke="#7c8a9a" stroke-width="2"/><text x="252" y="286" class="small">配對題</text><text x="252" y="317" class="small">包與短靴</text><rect x="432" y="252" width="160" height="78" rx="12" fill="#ffffff" stroke="#7c8a9a" stroke-width="2"/><text x="444" y="286" class="small">換位題</text><text x="444" y="317" class="small">交換左右</text><text x="48" y="365" class="small">原圖、配對、換位都留在同一份</text><rect x="28" y="416" width="584" height="104" rx="12" fill="#eaf1ff" stroke="#5276a5" stroke-width="2"/><text x="48" y="456" class="main">驗證份：另留的來源 B</text><text x="48" y="497" class="body">用來選檢查點</text><rect x="28" y="552" width="584" height="104" rx="12" fill="#fff2df" stroke="#a77427" stroke-width="2"/><text x="48" y="592" class="main">最後考卷：另留的來源 C</text><text x="48" y="633" class="body">定版後再核對</text></svg>