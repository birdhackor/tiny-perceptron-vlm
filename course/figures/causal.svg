="166" width="68" height="34" fill="#d7f5e6" stroke="#8da8ca"/><text x="412" y="189" font-size="15" fill="#172b4d" text-anchor="middle">可看</text><rect class="pulse step3" x="456" y="166" width="68" height="34" fill="#d7f5e6" stroke="#8da8ca"/><text x="490" y="189" font-size="15" fill="#172b4d" text-anchor="middle">可看</text><rect class="pulse step3" x="534" y="166" width="68" height="34" fill="#edf0f4" stroke="#8da8ca"/><text x="568" y="189" font-size="15" fill="#172b4d" text-anchor="middle">禁止</text><text x="235" y="236" font-size="16" fill="#172b4d" text-anchor="middle">查詢 3</text><rect class="pulse step4" x="300" y="208" width="68" height="34" fill="#d7f5e6" stroke="#8da8ca"/><text x="334" y="231" font-size="15" fill="#172b4d" text-anchor="middle">可看</text><rect class="pulse step4" x="378" y="208" width="68" height="34" fill="#d7f5e6" stroke="#8da8ca"/><text x="412" y="231" font-size="15" fill="#172b4d" text-anchor="middle">可看</text><rect class="pulse step4" x="456" y="208" width="68" height="34" fill="#d7f5e6" stroke="#8da8ca"/><text x="490" y="231" font-size="15" fill="#172b4d" text-anchor="middle">可看</text><rect class="pulse step4" x="534" y="208" width="68" height="34" fill="#d7f5e6" stroke="#8da8ca"/><text x="568" y="231" font-size="15" fill="#172b4d" text-anchor="middle">可看</text><text x="400" y="314" font-size="15" fill="#172b4d" text-anchor="middle">對角線可看；右上角未來位置禁止。</text>
