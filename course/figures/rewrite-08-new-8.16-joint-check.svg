<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1060" viewBox="0 0 640 1060" role="img" aria-labelledby="title desc">
  <title id="title">同一題的四項要求必須同時通過</title>
  <desc id="desc">要求只抄兩行中文、只有text欄位的JSON且正常結束。四張檢查卡依序問內容正確、指定範圍、格式符合、模型正常選EOS。右側連線把四項匯到全部通過才算完成。</desc>
  <defs>
    <style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#172b3a;font-size:28px}.heading{font-size:32px;font-weight:700}.label{font-size:30px;font-weight:700}.card{fill:#f5f8fc;stroke:#7794ad;stroke-width:2}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#29814a"/></marker>
  </defs>
  <rect width="640" height="1060" fill="#fff"/>
  <text x="28" y="48" class="heading">同一題，逐項核對</text>
  <rect x="28" y="77" width="532" height="151" rx="12" fill="#fff5d9" stroke="#ad8325" stroke-width="2"/>
  <text x="48" y="118">只抄兩行中文，依原順序；</text>
  <text x="48" y="161">只有text欄位的JSON；</text>
  <text x="48" y="204">JSON外不要加字，之後正常結束。</text>

  <rect x="28" y="264" width="532" height="125" rx="12" class="card"/>
  <text x="48" y="309" class="label">① 內容</text>
  <text x="48" y="355">兩句中文正確，順序沒有顛倒。</text>
  <rect x="28" y="421" width="532" height="125" rx="12" class="card"/>
  <text x="48" y="466" class="label">② 指定範圍</text>
  <text x="48" y="512">完整給兩行，排除英文與說明。</text>
  <rect x="28" y="578" width="532" height="125" rx="12" class="card"/>
  <text x="48" y="623" class="label">③ 格式</text>
  <text x="48" y="669">裸JSON、只有text、字串清單。</text>
  <rect x="28" y="735" width="532" height="125" rx="12" class="card"/>
  <text x="48" y="780" class="label">④ 正常結束</text>
  <text x="48" y="826">答完後模型選EOS，未被截停。</text>

  <path d="M560 327 H604 V969 H564" fill="none" stroke="#29814a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M560 484 H604 M560 641 H604 M560 798 H604" fill="none" stroke="#29814a" stroke-width="3"/>
  <rect x="28" y="919" width="532" height="102" rx="12" fill="#e3f5e8" stroke="#29814a" stroke-width="3"/>
  <text x="48" y="980" class="heading">四項全部通過，才算完成。</text>
</svg>
