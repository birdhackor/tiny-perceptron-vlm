<svg xmlns="http://www.w3.org/2000/svg" width="360" height="445" viewBox="0 0 360 445" role="img" aria-labelledby="title desc">
  <title id="title">三個區塊選成代碼一、二、零</title>
  <desc id="desc">十二點人工波形分成三個四點區塊，選固定碼本代碼一、二、零。灰線為原始波形，藍線為查表重建，前兩塊振幅增為一，第三塊重建成零。</desc>
  <style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#172b4d;font-size:17px}.title{font-size:21px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.axis{stroke:#7a8ba1;stroke-width:1.5}.original{fill:none;stroke:#65758b;stroke-width:4}.decoded{fill:none;stroke:#006eaa;stroke-width:2.3;stroke-dasharray:5 3}</style>
  <rect width="360" height="445" rx="12" fill="#f7f9fc"/>
  <text class="title" x="20" y="34">每四點，選一個固定碼</text>
  <line x1="22" y1="62" x2="55" y2="62" class="original"/><text x="64" y="68">輸入</text>
  <line x1="165" y1="62" x2="198" y2="62" class="decoded"/><text x="207" y="68">查表重建</text>
  <rect x="45" y="100" width="87.5" height="194" fill="#e2f0f4"/><rect x="132.5" y="100" width="100" height="194" fill="#fff0df"/><rect x="232.5" y="100" width="97.5" height="194" fill="#e7edf3"/>
  <line class="axis" x1="45" y1="200" x2="330" y2="200"/><line class="axis" x1="45" y1="100" x2="45" y2="294"/>
  <g text-anchor="end"><text x="36" y="118">1</text><text x="36" y="206">0</text><text x="36" y="294">−1</text></g>
  <path class="original" d="M45 120.8 L70 200 L95 279.2 L120 200 L145 200 L170 129.6 L195 200 L220 270.4 L245 191.2 L270 208.8 L295 191.2 L320 208.8"/>
  <path class="decoded" d="M45 112 L70 200 L95 288 L120 200 L145 200 L170 112 L195 200 L220 288 L245 200 L270 200 L295 200 L320 200"/>
  <g fill="#006eaa"><circle cx="45" cy="112" r="3"/><circle cx="95" cy="288" r="3"/><circle cx="170" cy="112" r="3"/><circle cx="220" cy="288" r="3"/><circle cx="245" cy="200" r="3"/><circle cx="270" cy="200" r="3"/><circle cx="295" cy="200" r="3"/><circle cx="320" cy="200" r="3"/></g>
  <g text-anchor="middle"><text x="45" y="320">0</text><text x="145" y="320">4</text><text x="245" y="320">8</text><text x="320" y="320">11</text></g>
  <text class="small" x="113" y="348">樣本索引（非秒數）</text>
  <g text-anchor="middle"><text class="label" x="88" y="383">ID 1</text><text class="label" x="185" y="383">ID 2</text><text class="label" x="283" y="383">ID 0</text></g>
  <text x="20" y="422">小幅差異被同一個查表結果取代</text>
</svg>
