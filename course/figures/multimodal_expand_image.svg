<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">插入圖片後，答案位置一起移動</title><desc id="desc">五格未展開序列，圖片換三格視覺特徵後有七格；最後做一次下一位置對齊成六格。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#54768c"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif}svg{background:white}</style><rect width="900" height="400" fill="#fff"/><text x="450" y="34" text-anchor="middle" font-size="24" fill="#18354a">插入圖片後，答案位置一起移動</text><text x="80" y="85" text-anchor="middle" font-size="17" fill="#18354a">未展開輸入</text><rect x="140" y="55" width="130" height="58" rx="8" fill="#eef5ff" stroke="#54768c"/><text x="205.0" y="90.0" text-anchor="middle" font-size="19" fill="#18354a">開頭</text><rect x="285" y="55" width="130" height="58" rx="8" fill="#fff3de" stroke="#54768c"/><text x="350.0" y="90.0" text-anchor="middle" font-size="19" fill="#18354a">圖片</text><rect x="430" y="55" width="130" height="58" rx="8" fill="#eef5ff" stroke="#54768c"/><text x="495.0" y="90.0" text-anchor="middle" font-size="19" fill="#18354a">助手</text><rect x="575" y="55" width="130" height="58" rx="8" fill="#eef5ff" stroke="#54768c"/><text x="640.0" y="90.0" text-anchor="middle" font-size="19" fill="#18354a">73</text><rect x="720" y="55" width="130" height="58" rx="8" fill="#eef5ff" stroke="#54768c"/><text x="785.0" y="90.0" text-anchor="middle" font-size="19" fill="#18354a">結束2</text><text x="450" y="149" text-anchor="middle" font-size="18" fill="#18354a">圖片1格 → 三條特徵；新增格的目標都是忽略 -100</text><rect x="110" y="180" width="100" height="48" rx="8" fill="#eef5ff" stroke="#54768c"/><text x="160.0" y="210.0" text-anchor="middle" font-size="19" fill="#18354a">開頭</text><rect x="220" y="180" width="100" height="48" rx="8" fill="#fff3de" stroke="#54768c"/><text x="270.0" y="210.0" text-anchor="middle" font-size="19" fill="#18354a">視覺1</text><rect x="330" y="180" width="100" height="48" rx="8" fill="#fff3de" stroke="#54768c"/><text x="380.0" y="210.0" text-anchor="middle" font-size="19" fill="#18354a">視覺2</text><rect x="440" y="180" width="100" height="48" rx="8" fill="#fff3de" stroke="#54768c"/><text x="490.0" y="210.0" text-anchor="middle" font-size="19" fill="#18354a">視覺3</text><rect x="550" y="180" width="100" height="48" rx="8" fill="#eef5ff" stroke="#54768c"/><text x="600.0" y="210.0" text-anchor="middle" font-size="19" fill="#18354a">助手</text><rect x="660" y="180" width="100" height="48" rx="8" fill="#eef5ff" stroke="#54768c"/><text x="710.0" y="210.0" text-anchor="middle" font-size="19" fill="#18354a">73</text><rect x="770" y="180" width="100" height="48" rx="8" fill="#eef5ff" stroke="#54768c"/><text x="820.0" y="210.0" text-anchor="middle" font-size="19" fill="#18354a">結束2</text><text x="450" y="265" text-anchor="middle" font-size="18" fill="#18354a">完整目標：[-100, -100, -100, -100, -100, 73, 2]</text><path d="M450 279L450 307" fill="none" stroke="#54768c" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="338" text-anchor="middle" font-size="18" fill="#18354a">去掉第一個目標 → [-100, -100, -100, -100, 73, 2]</text><text x="450" y="370" text-anchor="middle" font-size="17" fill="#18354a">輸入去最後一格；助手位置預測首個答案73。</text></svg>