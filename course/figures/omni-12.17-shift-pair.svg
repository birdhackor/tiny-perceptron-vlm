<svg xmlns="http://www.w3.org/2000/svg" width="360" height="555" viewBox="0 0 360 555" role="img" aria-labelledby="title desc">
  <title id="title">固定內容，只移錄音起點</title>
  <desc id="desc">八百毫秒錄音分四個兩百毫秒塊，第二塊發聲。共同畫面在兩千毫秒從圓切成方。錄音起點為一千時，發聲中心一千三百毫秒對上圓；起點為兩千時，發聲中心兩千三百毫秒對上方。兩者不改影格、波形或序列順序。</desc>
  <style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#172b4d;font-size:17px}.title{font-size:21px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.white{fill:white}.axis{stroke:#51657d;stroke-width:2}.guide{stroke:#8a9bb0;stroke-width:1;stroke-dasharray:4 4}.event{fill:#b83155}</style>
  <rect width="360" height="555" rx="12" fill="#f7f9fc"/>
  <text class="title" x="20" y="34">固定內容，只移錄音起點</text>
  <text x="20" y="70">錄音自己的時間（ms）</text>
  <g stroke="white" stroke-width="2"><rect x="30" y="86" width="75" height="43" fill="#d9e1eb"/><rect x="105" y="86" width="75" height="43" class="event"/><rect x="180" y="86" width="75" height="43" fill="#d9e1eb"/><rect x="255" y="86" width="75" height="43" fill="#d9e1eb"/></g>
  <g text-anchor="middle"><text x="67.5" y="114">塊 0</text><text class="white" x="142.5" y="114">塊 1</text><text x="217.5" y="114">塊 2</text><text x="292.5" y="114">塊 3</text></g>
  <g text-anchor="middle" class="small"><text x="30" y="154">0</text><text x="105" y="154">200</text><text x="180" y="154">400</text><text x="255" y="154">600</text><text x="330" y="154">800</text></g>
  <text x="20" y="189">塊 1 中心：錄音內 300 ms</text>
  <text class="label" x="20" y="232">共同時間軸（0–4000 ms）</text>
  <g class="guide"><line x1="30" y1="252" x2="30" y2="448"/><line x1="105" y1="252" x2="105" y2="448"/><line x1="180" y1="252" x2="180" y2="448"/><line x1="255" y1="252" x2="255" y2="448"/><line x1="330" y1="252" x2="330" y2="448"/></g>
  <rect x="30" y="257" width="150" height="40" fill="#237a9b"/><rect x="180" y="257" width="150" height="40" fill="#bd6c25"/>
  <text class="white" x="95" y="284">圓</text><text class="white" x="245" y="284">方</text>
  <g fill="#d9e1eb" stroke="#51657d"><rect x="105" y="329" width="15" height="25"/><rect x="120" y="329" width="15" height="25" class="event"/><rect x="135" y="329" width="15" height="25"/><rect x="150" y="329" width="15" height="25"/></g>
  <circle cx="127.5" cy="341.5" r="4" fill="white"/>
  <text class="label" x="20" y="320">A</text><text x="20" y="383">1000 + 300 = 1300 ms → 圓</text>
  <g fill="#d9e1eb" stroke="#51657d"><rect x="180" y="405" width="15" height="25"/><rect x="195" y="405" width="15" height="25" class="event"/><rect x="210" y="405" width="15" height="25"/><rect x="225" y="405" width="15" height="25"/></g>
  <circle cx="202.5" cy="417.5" r="4" fill="white"/>
  <text class="label" x="20" y="422">B</text><text x="20" y="466">2000 + 300 = 2300 ms → 方</text>
  <g text-anchor="middle" class="small"><text x="30" y="496">0</text><text x="105" y="496">1000</text><text x="180" y="496">2000</text><text x="255" y="496">3000</text><text x="320" y="496">4000</text></g>
  <text class="small" x="20" y="532">紅塊：發聲　白點：支持區間中心</text>
</svg>
