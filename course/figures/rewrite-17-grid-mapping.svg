<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" aria-labelledby="title desc"><title id="title">手算：刻度0.5如何保存小數？</title><desc id="desc">原值0.7除以刻度0.5得1.4，取最近整數，存下碼1；乘回刻度得到還原值0.5，捨入誤差0.2。原值1.2除以0.5得2.4，存下碼2；還原值1.0，捨入誤差0.2。碼只記住最近的整數，沒有保存捨入誤差；未截斷時捨入誤差最多半個刻度。</desc><defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#173047}.title{font-size:32px;font-weight:700}.bold{font-weight:700}.small{font-size:28px}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6e8b"/></marker></defs><rect width="640" height="760" fill="#ffffff"/><text x="32" y="48" class="title">手算：刻度0.5如何保存小數？</text><rect x="32" y="85" width="576" height="248" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="127" class="bold">原值 0.7</text><text x="50" y="167" class="">除以刻度：0.7 ÷ 0.5 = 1.4</text><text x="50" y="207" class="">取整，存下碼：1</text><text x="50" y="247" class="">乘回刻度：1 × 0.5 = 0.5</text><text x="50" y="287" class="">原值 − 還原值 = 0.2</text><rect x="32" y="364" width="576" height="248" rx="12" fill="#e8f6ef" stroke="#579478" stroke-width="2"/><text x="50" y="406" class="bold">原值 1.2</text><text x="50" y="446" class="">除以刻度：1.2 ÷ 0.5 = 2.4</text><text x="50" y="486" class="">取整，存下碼：2</text><text x="50" y="526" class="">乘回刻度：2 × 0.5 = 1.0</text><text x="50" y="566" class="">原值 − 還原值 = 0.2</text><text x="32" y="671" class="">只存下最近的碼，沒有保存捨入誤差。</text><text x="32" y="718" class="">未截斷時，捨入誤差最多半個刻度。</text></svg>