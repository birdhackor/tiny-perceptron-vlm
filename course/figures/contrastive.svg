<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="title desc">
    <title id="title">像把名字卡與照片配對</title><desc id="desc">對角線是正配對；重複描述可能造成假負例。。橘色輪流提示閱讀步驟，所有內容靜態可見。</desc>
    <style>
    text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .pulse,.pulse rect{animation:pulse 6s infinite}.step1,.step1 rect{animation-delay:0s}.step2,.step2 rect{animation-delay:1.5s}.step3,.step3 rect{animation-delay:3s}.step4,.step4 rect{animation-delay:4.5s}
    @keyframes pulse{0%,23%{stroke:#e87924;stroke-width:4}24%,100%{stroke:#8da8ca;stroke-width:1}}
    @media(prefers-reduced-motion:reduce){.pulse,.pulse rect{animation:none}}
    </style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#466b97"/></marker></defs>
    <rect width="800" height="330" fill="#fff"/><text x="400" y="32" font-size="24" fill="#172b4d" text-anchor="middle">像把名字卡與照片配對</text>
    <g class="pulse step1"><rect x="17" y="115" width="140" height="80" rx="12" fill="#e8f1ff" stroke="#8da8ca"/><text x="87.0" y="151.0" font-size="19" fill="#172b4d" text-anchor="middle">一批圖片</text><text x="87.0" y="178.0" font-size="14" fill="#172b4d" text-anchor="middle">圖encoder</text></g><path d="M157 155L171 155" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/><g class="pulse step2"><rect x="174" y="115" width="140" height="80" rx="12" fill="#e8f1ff" stroke="#8da8ca"/><text x="244.0" y="151.0" font-size="19" fill="#172b4d" text-anchor="middle">一批描述</text><text x="244.0" y="178.0" font-size="14" fill="#172b4d" text-anchor="middle">文字encoder</text></g><path d="M314 155L328 155" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/><g class="pulse step3"><rect x="331" y="115" width="140" height="80" rx="12" fill="#e8f1ff" stroke="#8da8ca"/><text x="401.0" y="151.0" font-size="19" fill="#172b4d" text-anchor="middle">cosine表</text><text x="401.0" y="178.0" font-size="14" fill="#172b4d" text-anchor="middle">每圖對每描述</text></g><path d="M471 155L485 155" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/><g class="pulse step4"><rect x="488" y="115" width="140" height="80" rx="12" fill="#e8f1ff" stroke="#8da8ca"/><text x="558.0" y="151.0" font-size="19" fill="#172b4d" text-anchor="middle">雙向CE</text><text x="558.0" y="178.0" font-size="14" fill="#172b4d" text-anchor="middle">image↔text</text></g><path d="M628 155L642 155" stroke="#466b97" stroke-width="2" marker-end="url(#arrow)"/><g class="pulse step1"><rect x="645" y="115" width="140" height="80" rx="12" fill="#e8f1ff" stroke="#8da8ca"/><text x="715.0" y="151.0" font-size="19" fill="#172b4d" text-anchor="middle">保留組合</text><text x="715.0" y="178.0" font-size="14" fill="#172b4d" text-anchor="middle">檢索驗證</text></g><text x="400" y="314" font-size="15" fill="#172b4d" text-anchor="middle">對角線是正配對；重複描述可能造成假負例。</text>
    </svg>