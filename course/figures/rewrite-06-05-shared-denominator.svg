<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc">
<title id="title">同原文，用同一分母</title><desc id="desc">原文包含貓與微笑符號U+1F642，分別為3與4個UTF-8 bytes，合計7。微笑符號用黃色向量笑臉示意，不依賴emoji字型。手寫總NLL5和4分別換算BPB1.0305及0.8244。</desc>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;font-size:28px;fill:#172b3a}.strong{font-weight:700}.small{font-size:24px}</style>
<rect width="640" height="660" fill="white"/>
<text x="28" y="48" style="font-size:32px" class="strong">同原文，用同一分母</text>
<text x="28" y="105">原文：貓</text>
<g aria-label="微笑符號U+1F642的向量示意"><circle cx="184" cy="95" r="18" fill="#fbd34d" stroke="#b57d12" stroke-width="1.5"/><circle cx="178" cy="90" r="2" fill="#172b3a"/><circle cx="190" cy="90" r="2" fill="#172b3a"/><path d="M175 98 Q184 108 193 98" fill="none" stroke="#172b3a" stroke-width="2.5" stroke-linecap="round"/></g>
<text x="228" y="105">共7個 UTF-8 bytes</text>
<text x="28" y="147" class="small">貓：3 bytes；笑臉：4 bytes</text>
<text x="28" y="181" class="small">黃色笑臉表示原文的微笑符號 U+1F642。</text>
<rect x="28" y="214" width="584" height="154" rx="10" fill="#e8f1fc" stroke="#3c70a4" stroke-width="2"/>
<text x="48" y="260" style="font-size:30px" class="strong">示例A：總NLL＝5</text>
<text x="48" y="326">5 ÷（7 × ln 2）≈ 1.0305 BPB</text>
<rect x="28" y="405" width="584" height="154" rx="10" fill="#e3f5e8" stroke="#29814a" stroke-width="2"/>
<text x="48" y="451" style="font-size:30px" class="strong">示例B：總NLL＝4</text>
<text x="48" y="517">4 ÷（7 × ln 2）≈ 0.8244 BPB</text>
<text x="28" y="620">兩條都按相同7 bytes計代價。</text>
</svg>
