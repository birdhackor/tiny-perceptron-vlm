<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-labelledby="title desc"><title id="title">同原文，用同一分母</title><desc id="desc">同一段貓和emoji有7個UTF-8 bytes，手寫總NLL5和4分別換算BPB1.0305及0.8244。</desc>
<defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#172b3a}.strong{font-weight:700}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#3c70a4"/></marker></defs>
<rect width="640" height="620" fill="white"/>
<text x="28" y="48" font-size="32" style="font-size:32px" text-anchor="start" class="strong">同原文，用同一分母</text>
<text x="28" y="105" font-size="28" style="font-size:28px" text-anchor="start">原文：貓🙂　共7個UTF-8 bytes</text>
<rect x="28" y="149" width="584" height="160" rx="10" fill="#e8f1fc" stroke="#3c70a4" stroke-width="2"/>
<text x="48" y="198" font-size="30" style="font-size:30px" text-anchor="start" class="strong">示例A：總NLL＝5</text>
<text x="48" y="263" font-size="28" style="font-size:28px" text-anchor="start">5 ÷（7 × log 2）≈ 1.0305 BPB</text>
<rect x="28" y="353" width="584" height="160" rx="10" fill="#e3f5e8" stroke="#29814a" stroke-width="2"/>
<text x="48" y="402" font-size="30" style="font-size:30px" text-anchor="start" class="strong">示例B：總NLL＝4</text>
<text x="48" y="467" font-size="28" style="font-size:28px" text-anchor="start">4 ÷（7 × log 2）≈ 0.8244 BPB</text>
<text x="28" y="578" font-size="28" style="font-size:28px" text-anchor="start">兩條都按相同7 bytes計代價。</text>
</svg>
