<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1020" viewBox="0 0 640 1020" role="img" aria-labelledby="title desc"><title id="title">QAT：體驗誤差與打包要分開</title><desc id="desc">訓練保留可更新的FP32主權重。前向計算時臨時模擬量化與還原：例子0.1、0.4、0.9以刻度0.9/7換成碼1、3、7，再還原成0.1286、0.3857、0.9。反向傳播用STE近似算出梯度；最佳化器的step()才改主權重，下次前向計算再重新模擬。訓練完成後才另外打包，存下碼、刻度與形狀。本節短程式只算梯度，沒有參數更新。</desc><defs><style>text{font-family:"Noto Sans CJK TC",sans-serif;font-size:28px;fill:#173047}.title{font-size:32px;font-weight:700}.bold{font-weight:700}.small{font-size:28px}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6e8b"/></marker></defs><rect width="640" height="1020" fill="#ffffff"/><text x="32" y="48" class="title">QAT：體驗誤差與打包要分開</text><rect x="32" y="84" width="576" height="116" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="126" class="bold">可更新的FP32主權重</text><text x="50" y="166" class="">算例：[0.1, 0.4, 0.9]</text><path d="M320 200 L320 241" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="255" width="576" height="165" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="297" class="bold">前向計算：臨時模擬量化與還原</text><text x="50" y="337" class="">刻度0.9/7，碼 [1, 3, 7]</text><text x="50" y="377" class="">使用還原值 [0.1286, 0.3857, 0.9]</text><path d="M320 420 L320 464" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="478" width="576" height="116" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="520" class="bold">反向傳播：STE是近似規則</text><text x="50" y="560" class="">backward()只算梯度</text><path d="M320 594 L320 638" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="652" width="576" height="116" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="694" class="bold">最佳化器step()才改主權重</text><text x="50" y="734" class="">下次前向計算重新模擬</text><path d="M320 768 L320 809" fill="none" stroke="#3b6e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="823" width="576" height="116" rx="12" fill="#eef5fb" stroke="#6487a0" stroke-width="2"/><text x="50" y="865" class="bold">訓練完成後另行打包</text><text x="50" y="905" class="">存下碼、刻度與形狀</text><text x="32" y="988" class="">流程示意；本節短程式沒有參數更新。</text></svg>