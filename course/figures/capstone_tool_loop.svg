<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">工具結果由程式算，最後答案仍由同一模型生成</title>
  <desc id="desc">人工流程例子一加二：同一語言模型先生成TOOL請求，程式檢查工具名、型別、範圍和可用性，真的計算得三，然後把真結果交回原模型生成DIRECT三。錯誤、未結束和錯誤最終回答各自保留；此圖不表示模型實測。</desc>
  <style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:600}.main{font-size:25px}.small{font-size:22px}</style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#496a93"/></marker></defs>
  <rect width="900" height="640" fill="#fff"/>
  <text x="450" y="41" text-anchor="middle" class="title">兩次生成，中間只有一次真正計算</text>
  <rect x="30" y="71" width="840" height="58" rx="12" fill="#f4f6fa" stroke="#8199be"/>
  <text x="450" y="109" text-anchor="middle" class="main">使用者：請算 1 加 2；計算器開啟</text>
  <path d="M450 134V161" fill="none" stroke="#496a93" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="30" y="173" width="840" height="80" rx="12" fill="#e8f1ff" stroke="#8199be"/>
  <text x="450" y="205" text-anchor="middle" class="main">① 模型生成請求：TOOL:calculator:1+2</text>
  <text x="450" y="238" text-anchor="middle" class="small">只是請求；另外檢查正常結束與格式</text>
  <path d="M450 258V285" fill="none" stroke="#496a93" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="30" y="297" width="840" height="87" rx="12" fill="#fff0d8" stroke="#c49855"/>
  <text x="450" y="332" text-anchor="middle" class="main">② 程式驗證：允許工具、整數、範圍與可用性</text>
  <text x="450" y="365" text-anchor="middle" class="small">實際計算 1+2 → 結果 3；錯誤就保存錯誤</text>
  <path d="M450 389V416" fill="none" stroke="#496a93" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="30" y="428" width="840" height="85" rx="12" fill="#e8f1ff" stroke="#8199be"/>
  <text x="450" y="462" text-anchor="middle" class="main">③ 原題＋真結果 → 同一模型生成 DIRECT:3</text>
  <text x="450" y="495" text-anchor="middle" class="small">不能把程式的 3 直接冒充這次模型回答</text>
  <rect x="30" y="540" width="840" height="57" rx="12" fill="#e0f3e8" stroke="#639778"/>
  <text x="450" y="577" text-anchor="middle" class="main">分開核對：選對動作 → 參數正確 → 執行 → 最後答對</text>
  <text x="450" y="628" text-anchor="middle" class="small">人工流程示意；主成品實報另外保留成功與失敗的完整紀錄。</text>
</svg>
