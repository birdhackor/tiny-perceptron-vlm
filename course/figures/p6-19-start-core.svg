<svg xmlns="http://www.w3.org/2000/svg" width="640" height="770" viewBox="0 0 640 770" role="img" aria-labelledby="title desc"><title id="title">不同入口，同一份文字核心</title><desc id="desc">V2成品資料流示意；文字、商品、指定字卡和聲音會合到同一核心。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#14724d"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#17324d} .main{font-size:30px;font-weight:700}.body{font-size:27px}.small{font-size:26px} .line{stroke:#14724d;stroke-width:3;fill:none}</style><rect width="640" height="770" fill="white"/><text x="28" y="48" font-size="32" font-weight="700">不同入口，同一份文字核心</text><text x="28" y="86" class="small">所有入口的神經權重均自行訓練</text><rect x="28" y="112" width="540" height="84" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="48" y="148" class="main">文字＋保留的對話歷史</text><text x="48" y="182" class="small">短問答、格式與更改條件</text><path d="M568 154 H606" class="line"/><rect x="28" y="220" width="540" height="84" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="48" y="256" class="main">商品像素 → 商品入口</text><text x="48" y="290" class="small">三類商品與公開兩格位置</text><path d="M568 262 H606" class="line"/><rect x="28" y="328" width="540" height="84" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="48" y="364" class="main">指定字卡 → 讀字入口</text><text x="48" y="398" class="small">已提供的連續1–4格區域</text><path d="M568 370 H606" class="line"/><rect x="28" y="436" width="540" height="84" rx="12" fill="#eef2f6" stroke="#7c8a9a" stroke-width="2"/><text x="48" y="472" class="main">實際錄音 → 聲音入口</text><text x="48" y="506" class="small">三種意圖；保留聲學時間順序</text><path d="M568 478 H606" class="line"/><path d="M606 154 V560 H320 V578" class="line" marker-end="url(#arrow)"/><rect x="28" y="590" width="584" height="90" rx="12" fill="#e5f4ec" stroke="#14724d" stroke-width="2"/><text x="48" y="628" class="main">同一份 MoE 文字核心</text><text x="48" y="663" class="body">生成回答／補問／工具請求</text><text x="28" y="720" class="body">工具程式實算，真結果再交回核心</text></svg>