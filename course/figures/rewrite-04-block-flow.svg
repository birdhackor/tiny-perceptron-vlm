<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1110" viewBox="0 0 640 1110" role="img" aria-labelledby="title desc"><title id="title">Block內兩次殘差與分支前正規化</title><desc id="desc">資料流示意。一個block先把LN後注意力的修正加回x成u，再把LN後FFN修正加回u成y，主路一直三位置每位置八格。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#54728c"/></marker></defs><rect width="640" height="1110" fill="#fff"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="320" y="46" text-anchor="middle" font-size="34" fill="#173047" font-weight="bold">一個 pre-norm block</text><rect x="50" y="82" width="540" height="68" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="320" y="128" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">x：3 位置，每位置 8 格</text><text x="40" y="223" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">x</text><path d="M115,160 L115,407" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="323" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">保留</text><path d="M320,160 L420,195" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="210" width="300" height="59" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="450" y="251" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">LN 整理尺度</text><path d="M450,278 L450,308" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="321" width="300" height="68" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="450" y="365" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">注意力讀前文</text><path d="M450,398 L320,449" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><path d="M115,420 L280,449" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="481" text-anchor="middle" font-size="46" fill="#173047" font-weight="bold">＋</text><rect x="50" y="497" width="540" height="62" rx="12" fill="#fff0d9" stroke="#54728c" stroke-width="2"/><text x="320" y="540" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">u：3 位置，每位置 8 格</text><text x="40" y="638" text-anchor="middle" font-size="32" fill="#173047" font-weight="normal">u</text><path d="M115,575 L115,822" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="738" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">保留</text><path d="M320,575 L420,610" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="625" width="300" height="59" rx="12" fill="#e7f1ff" stroke="#54728c" stroke-width="2"/><text x="450" y="666" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">LN 整理尺度</text><path d="M450,693 L450,723" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="736" width="300" height="68" rx="12" fill="#e7f6ec" stroke="#54728c" stroke-width="2"/><text x="450" y="780" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">FFN 加工每卡</text><path d="M450,813 L320,864" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><path d="M115,835 L280,864" fill="none" stroke="#54728c" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="896" text-anchor="middle" font-size="46" fill="#173047" font-weight="bold">＋</text><rect x="50" y="912" width="540" height="62" rx="12" fill="#fff0d9" stroke="#54728c" stroke-width="2"/><text x="320" y="955" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">y：3 位置，每位置 8 格</text><text x="320" y="1024" text-anchor="middle" font-size="28" fill="#173047" font-weight="normal">主路保留；分支先 LN、再算修正</text><text x="320" y="1069" text-anchor="middle" font-size="30" fill="#173047" font-weight="normal">同寬輸出可交下一個 block</text></g></svg>