<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="title desc">
<title id="title">換成共同原文尺度後，byte與BPE的代價排名不同</title><desc id="desc">同20篇最後檢查片段共4193個原文byte。逐byte模型的每目標代價2.77947低於BPE的3.98741，但共同原文byte尺度的BPB是4.02906高於BPE的3.43401。兩者計分目標數為4213與2503，均包含結束標記。</desc>
<style>text{font-family:system-ui,"Noto Sans TC",sans-serif;fill:#172033;font-size:23px}.title{font-size:27px;font-weight:700}.heading{font-size:25px;font-weight:700}.value{font-size:25px;font-weight:700}.small{font-size:22px}</style>
<rect width="640" height="700" rx="16" fill="#f8fafc"/>

<text x="24" y="42" class="title">同一批原文，換分母會改變排名</text>
<text x="24" y="78">20篇，共4,193個原文UTF-8 bytes</text>
<rect x="16" y="100" width="608" height="230" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="32" y="136" class="heading">每token平均代價：逐byte較低</text>
<text x="32" y="169">一個token含的原文量不同</text>
<text x="32" y="211">逐byte</text><rect x="140" y="187" width="222" height="32" fill="#d97706"/><text x="382" y="212" class="value">2.77947</text>
<text x="32" y="260">BPE</text><rect x="140" y="236" width="319" height="32" fill="#2563eb"/><text x="479" y="261" class="value">3.98741</text>
<text x="32" y="307" class="small">計分目標：逐byte 4,213；BPE 2,503</text>
<rect x="16" y="348" width="608" height="230" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="32" y="385" class="heading">每原文byte代價（BPB）：BPE較低</text>
<text x="32" y="419">兩份總代價都除以4,193，再換成bit</text>
<text x="32" y="461">逐byte</text><rect x="140" y="437" width="322" height="32" fill="#d97706"/><text x="482" y="462" class="value">4.02906</text>
<text x="32" y="514">BPE</text><rect x="140" y="490" width="275" height="32" fill="#2563eb"/><text x="435" y="515" class="value">3.43401</text>
<text x="32" y="558" class="small">兩種代價都以較低為佳。</text>
<text x="24" y="615" class="small">目標數包含各篇結束記號；bytes不含記號。</text>
<text x="24" y="650" class="small">只比較這批片段的預測，</text>
<text x="24" y="682" class="small">不代表一般回答能力或工具優劣。</text>
</svg>
