<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
<title id="title">相同起點記憶體上，手寫與Flash注意力的新增峰值</title><desc id="desc">FP16、固定Q/K/V形狀2乘4乘512乘32的L4補驗。四條路線暖機後的起點記憶體均為65MiB。手寫只做前向增加24.25、總峰值89.25MiB；Flash只做前向增加約0.267、總峰值約65.267MiB；手寫前向加反向傳播增加32.75、總峰值97.75MiB；Flash前向加反向傳播增加約2.032、總峰值約67.032MiB。灰色為起點記憶體，彩色為新增配置。這是PyTorch CUDA allocated bytes，並非整張GPU用量或完整模型訓練記憶體；只量注意力這一步，沒有任務代價或最佳化器。</desc>
<style>text{font-family:system-ui,"Noto Sans TC",sans-serif;fill:#172033;font-size:23px}.title{font-size:27px;font-weight:700}.heading{font-size:25px;font-weight:700}.value{font-size:25px;font-weight:700}.small{font-size:22px}</style>
<rect width="640" height="760" rx="16" fill="#f8fafc"/>

<text x="24" y="42" class="title">先看起點，再比較新增記憶體</text>
<text x="24" y="78">L4、FP16，固定Q/K/V形狀</text>
<text x="24" y="112">[2,4,512,32]；所有數字單位為MiB</text>
<text x="24" y="158" class="heading">手寫，只做前向：總峰值89.25</text>
<rect x="24" y="181" width="286" height="32" fill="#cbd5e1"/><rect x="310" y="181" width="106.7" height="32" fill="#f4a64c"/>
<text x="24" y="244">起點記憶體65.00　＋　新增24.25</text>
<text x="24" y="290" class="heading">Flash，只做前向：總峰值約65.27</text>
<rect x="24" y="312" width="286" height="32" fill="#cbd5e1"/><rect x="310" y="312" width="1.1748" height="32" fill="#167947"/>
<text x="24" y="376">起點記憶體65.00　＋　新增約0.267</text>
<text x="24" y="422" class="heading">手寫，前向＋反向傳播：總峰值97.75</text>
<rect x="24" y="444" width="286" height="32" fill="#cbd5e1"/><rect x="310" y="444" width="144.1" height="32" fill="#f4a64c"/>
<text x="24" y="508">起點記憶體65.00　＋　新增32.75</text>
<text x="24" y="554" class="heading">Flash，前向＋反向傳播：總峰值約67.03</text>
<rect x="24" y="576" width="286" height="32" fill="#cbd5e1"/><rect x="310" y="576" width="8.9408" height="32" fill="#167947"/>
<text x="24" y="640">起點記憶體65.00　＋　新增約2.032</text>
<text x="24" y="685" class="small">四柱尺度相同：灰色為起點記憶體，彩色為新增。</text>
<text x="24" y="717" class="small">只量注意力這一步；不等於整張GPU或模型訓練。</text>
<text x="24" y="749" class="small">三次暖機、九次量測；沒有任務代價或最佳化器。</text>
</svg>
