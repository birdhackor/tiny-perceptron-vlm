name: Bounded Omni product development

on:
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [dev-av, dev-choice, dev-sound]
        description: One bounded development job; final remains closed
        required: true

permissions:
  contents: write

concurrency:
  group: tiny-perceptron-course-gpu
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      MODAL_ENVIRONMENT: main
      MODAL_SANDBOX_V2: '0'
      GH_TOKEN: ${{ github.token }}
      OMNI_JOB: ${{ inputs.job }}
      OMNI_ATTEMPT: job-${{ github.run_id }}-${{ github.run_attempt }}
      OMNI_OUTPUT: outputs/omni-product-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install only the pinned Modal client
        run: python -m pip install modal==1.6.0
      - name: Reserve full bound, execute once, export then verify stop
        env:
          MODAL_TOKEN_ID: ${{ vars.MODAL_TOKEN_ID || secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m scripts.omni_revision.experiment_execution "$OMNI_JOB" --attempt-id "$OMNI_ATTEMPT" --output "$OMNI_OUTPUT"
      - name: Check the aggregate artifact storage bound
        if: always()
        id: artifact_bound
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.omni_revision.experiment_execution import check_artifact_limits
          print(check_artifact_limits(Path(os.environ["OMNI_OUTPUT"])))
          PY
      - name: Preserve the attempt including failures for seven days
        if: always() && steps.artifact_bound.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: omni-product-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OMNI_OUTPUT }}
          if-no-files-found: error
          retention-days: 7
