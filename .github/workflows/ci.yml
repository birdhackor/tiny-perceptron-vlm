name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1" # Windows runner 的輸出預設不是 UTF-8，印中文會出錯

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: uv.lock 與 pyproject.toml 一致
        if: hashFiles('uv.lock') != ''
        run: uv lock --check
      - run: uv run --only-group dev ruff check .
      - run: uv run --only-group dev ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            extra: --extra cpu
          - os: windows-latest
            extra: --extra cpu
          - os: macos-latest
            extra: "" # macOS 直接用 PyPI 預設的 torch（含 MPS）
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync ${{ matrix.extra }}
      - run: uv run ${{ matrix.extra }} python scripts/check_env.py
      - run: uv run ${{ matrix.extra }} pytest
