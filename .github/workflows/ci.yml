name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1" # Windows runner 的輸出預設不是 UTF-8，印中文會出錯

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_scope.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: uv.lock 與 pyproject.toml 一致
        if: hashFiles('uv.lock') != ''
        run: uv lock --check
      - run: uv run --only-group dev ruff check .
      - run: uv run --only-group dev ruff format --check .

  test:
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          # Linux 完整核對祖先與固定資料版本；其他平台只取當前程式。
          # '0' 必須是字串，避免 GitHub 把數字 0 當成 false 而改用 1。
          fetch-depth: ${{ runner.os == 'Linux' && '0' || '1' }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync ${{ matrix.extra }}
      - run: uv run ${{ matrix.extra }} python scripts/check_env.py
      - name: Require complete history for the Linux pin checks
        if: runner.os == 'Linux'
        run: |
          uv run --extra cpu python -c "import subprocess; assert subprocess.check_output(['git', 'rev-parse', '--is-shallow-repository']).strip() == b'false'; assert subprocess.run(['git', 'config', '--get-regexp', r'^remote\..*\.promisor$'], capture_output=True).returncode == 1"
      - run: uv run ${{ matrix.extra }} pytest --junitxml=outputs/pytest-results.xml
        env:
          # Some Windows runner CPUs expose inconsistent AMX capabilities
          # (oneDNN #5689, runner-images #14483); keep every dtype/test enabled.
          ONEDNN_MAX_CPU_ISA: ${{ runner.os == 'Windows' && 'AVX2' || '' }}
      - name: Verify the optional Dataset API once for runtime changes
        if: runner.os == 'Linux' && needs.scope.outputs.full == 'true'
        run: |
          uv sync --frozen --extra cpu --extra data
          uv run --extra cpu --extra data pytest -q tests/test_env.py::test_datasets_from_dict
      - name: Preserve failing test details in the job summary
        if: failure()
        shell: bash
        run: |
          uv run ${{ matrix.extra }} python - <<'PY'
          import html
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("outputs/pytest-results.xml")
          lines = ["## Test failure details", ""]
          if not report.is_file():
              lines.append("No JUnit report was written. The original failing step and exit code remain authoritative.")
          else:
              for case in ET.parse(report).iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is None:
                      continue
                  name = case.get("classname", "") + "::" + case.get("name", "")
                  lines.extend([
                      "<details><summary>" + html.escape(name) + "</summary>",
                      "<pre>" + html.escape(failure.text or failure.get("message", "")) + "</pre>",
                      "</details>",
                      "",
                  ])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY
