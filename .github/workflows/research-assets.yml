name: Publish fixed research inputs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-inputs-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout the immutable original Git source separately
        uses: actions/checkout@v7
        with:
          ref: 92b8763ca24511f0da1c259429851a314accea19
          path: outputs/research-source
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Publish unchanged source records and verify anonymous downloads
        run: python scripts/research_assets.py publish
      - uses: actions/upload-artifact@v6
        with:
          name: research-inputs-publication
          path: outputs/research-assets/publication.json
          retention-days: 30
