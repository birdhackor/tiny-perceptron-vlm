name: Download existing lesson product attempt without compute

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing terminal attempt ID
        type: string
        required: true
      expected_revision:
        description: Exact original training commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: lesson-products-read-only-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ vars.MODAL_TOKEN_ID || secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: ${{ vars.MODAL_ENVIRONMENT || 'main' }}
      INSPECT_RUN: ${{ inputs.run_id }}
      ORIGINAL_REVISION: ${{ inputs.expected_revision }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install modal==1.6.0
      - name: Read committed terminal receipt and bounded artifacts through Volume SDK
        run: |
          python -m scripts.lesson_products.inspect --run-id "$INSPECT_RUN" \
            --expected-revision "$ORIGINAL_REVISION"
      - name: Save read-only inspection evidence and model artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lesson-products-inspection
          path: outputs/lesson-products-inspect/
          if-no-files-found: ignore
