name: Transfer and verify the three frozen LFS objects
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.5
      - name: Issue only encrypted object-scoped upload actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BROKER_PHASE: issue
        run: python .github/natural-v4-lfs-broker.py
      - name: Deliver encrypted upload capabilities while this runner retains verification
        uses: actions/upload-artifact@v7
        with:
          name: natural-v4-lfs-capability-${{ github.run_id }}
          path: outputs/natural-v4/lfs-broker/encrypted-transfer.json
          retention-days: 1
          if-no-files-found: error
      - name: Await local upload and perform standard LFS verification in this runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BROKER_PHASE: await
        run: |
          python -c 'import time; time.sleep(30)'
          python .github/natural-v4-lfs-broker.py
      - name: Save only actual completed upload and byte verification receipt
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: natural-v4-lfs-receipt-${{ github.run_id }}
          path: outputs/natural-v4/lfs-broker/upload-receipt.json
          retention-days: 30
          if-no-files-found: warn
