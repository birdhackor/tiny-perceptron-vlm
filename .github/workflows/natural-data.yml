name: Transfer the three frozen LFS objects
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [issue, verify]
        default: issue
      verify_locators:
        type: string
        default: '[]'
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.5
      - name: Transfer only frozen object capabilities and verify exact bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BROKER_PHASE: ${{ inputs.phase }}
          VERIFY_LOCATORS: ${{ inputs.verify_locators }}
        run: python .github/natural-v4-lfs-broker.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: natural-v4-lfs-${{ inputs.phase }}-${{ github.run_id }}
          path: outputs/natural-v4/lfs-broker/*.json
          retention-days: 1
          if-no-files-found: warn
