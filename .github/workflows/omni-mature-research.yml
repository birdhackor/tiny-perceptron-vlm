name: Bounded limited mature-model research

on:
  workflow_dispatch:
    inputs:
      job:
        description: Fixed mature-model research job
        required: true
        type: choice
        options:
          - kev
          - qwen25

permissions:
  contents: write
  actions: read

concurrency:
  group: tiny-perceptron-course-gpu
  cancel-in-progress: false

jobs:
  limited-research:
    if: github.repository == 'birdhackor/tiny-perceptron-vlm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
      OMNI_JOB: ${{ inputs.job }}
      OMNI_ATTEMPT: mature-${{ inputs.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      OMNI_OUTPUT: outputs/omni-mature-${{ inputs.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      MODAL_ENVIRONMENT: main
      MODAL_SANDBOX_V2: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install fixed controller dependencies
        run: uv sync --extra cpu --locked
      - name: Install and verify Qwen input speech preparation before reservation
        if: inputs.job == 'qwen25'
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python - <<'PY'
          import io
          import subprocess
          import wave

          audio = subprocess.run(
              ["ffmpeg", "-hide_banner", "-loglevel", "error", "-f", "lavfi", "-i",
               "flite=text=ready:voice=slt", "-t", "0.25", "-ac", "1", "-ar", "16000",
               "-acodec", "pcm_s16le", "-f", "wav", "pipe:1"],
              check=True, capture_output=True, timeout=30,
          ).stdout
          with wave.open(io.BytesIO(audio), "rb") as source:
              assert (source.getnchannels(), source.getsampwidth(), source.getframerate()) == (1, 2, 16000)
              samples = source.readframes(16000)
              assert 1600 <= len(samples) <= 32000 and any(samples)
          print("FFmpeg flite/slt produced nonempty mono PCM16 speech at 16 kHz before reservation")
          PY
      - name: Verify the real Modal filesystem contract offline before reservation
        run: uv run --extra cpu --with modal==1.6.0 python -m pytest tests/test_omni_mature_modal_sdk.py -q
      - name: Prepare and reserve once, infer, export and stop the exact owned resources
        id: research
        env:
          GH_TOKEN: ${{ github.token }}
          MODAL_TOKEN_ID: ${{ vars.MODAL_TOKEN_ID || secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uv run --extra cpu --with modal==1.6.0 python -m scripts.omni_revision.research_execution run --job "$OMNI_JOB" --attempt-id "$OMNI_ATTEMPT" --output "$OMNI_OUTPUT"
      - name: Check all evidence size before artifact upload
        if: always() && steps.research.outputs.reserved == 'true'
        id: bound
        run: uv run --extra cpu python -m scripts.omni_revision.research_execution bound --job "$OMNI_JOB" --attempt-id "$OMNI_ATTEMPT" --output "$OMNI_OUTPUT"
      - name: Retain complete or partial original evidence for seven days
        if: always() && steps.bound.outcome == 'success'
        id: evidence
        uses: actions/upload-artifact@v6
        with:
          name: omni-mature-${{ inputs.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OMNI_OUTPUT }}
          retention-days: 7
          if-no-files-found: error
      - name: Verify provider artifact limits and finish the exact reservation without refund
        if: always() && steps.research.outputs.reserved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OMNI_ARTIFACT_OUTCOME: ${{ steps.evidence.outcome }}
        run: uv run --extra cpu python -m scripts.omni_revision.research_execution finish --job "$OMNI_JOB" --attempt-id "$OMNI_ATTEMPT" --output "$OMNI_OUTPUT"
