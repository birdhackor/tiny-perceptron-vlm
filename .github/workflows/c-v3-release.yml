name: Publish the verified C-v3 package

on:
  push:
    branches: [revision/c-product-v3-20261101]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c-v3-20261101-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'birdhackor/tiny-perceptron-vlm' && github.ref == 'refs/heads/revision/c-product-v3-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      C3_PACKAGE_PATH: assets/releases/c-v3-20261101/tiny-perceptron-c-v3-verified.zip
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch only the fixed model transport through Git LFS
        run: git lfs pull --include="$C3_PACKAGE_PATH" --exclude=''
      - name: Verify local identities, publish, and download without authentication
        run: python scripts/publish_c_v3_release.py
      - name: Preserve actual publication result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: c-v3-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/c-v3-release-publication/result.json
          if-no-files-found: ignore
          retention-days: 7
