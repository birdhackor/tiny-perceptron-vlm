name: Transfer pinned LFS lesson bundle to existing draft

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lesson-products-transport
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Retrieve only the pinned LFS transport
        run: git lfs pull --include=assets/lesson-products/lesson-products-v1-20261016-release.tar.gz --exclude=''
      - name: Verify source, upload without overwrite, download and compare exact bytes
        run: python -m scripts.lesson_products.upload_transport --descriptor docs/lesson-products/jobs/transport-v1.json
      - name: Preserve actual transport evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lesson-products-transport
          path: outputs/lesson-products-transport/receipt.json
          if-no-files-found: ignore
