name: Bounded Omni research execution

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [runtime-probe]
        default: runtime-probe
        description: One audited L4 runtime probe, no models or image build

permissions:
  contents: write

concurrency:
  group: tiny-perceptron-course-gpu
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MODAL_ENVIRONMENT: main
      MODAL_SANDBOX_V2: '0'
      GH_TOKEN: ${{ github.token }}
      OMNI_OPERATION: ${{ inputs.operation }}
      OMNI_ATTEMPT: probe-${{ github.run_id }}-${{ github.run_attempt }}
      OMNI_OUTPUT: outputs/omni-execution-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install only the pinned client SDK
        run: python -m pip install modal==1.6.0
      - name: Reserve full bound before the single owned runtime attempt
        env:
          MODAL_TOKEN_ID: ${{ vars.MODAL_TOKEN_ID || secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          python -m scripts.omni_revision.execution "$OMNI_OPERATION" --attempt-id "$OMNI_ATTEMPT" --output "$OMNI_OUTPUT"
      - name: Preserve reservation, raw runtime and stop evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: omni-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OMNI_OUTPUT }}
          if-no-files-found: error
