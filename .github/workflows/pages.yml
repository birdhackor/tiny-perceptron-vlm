name: Publish course

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen --extra cpu --group notebook --group site
      - name: Check numerical lesson order across sources and navigation
        run: .venv/bin/python scripts/check_lesson_order.py
      - run: .venv/bin/python scripts/build_course.py --check
      - name: Register notebook kernel
        run: .venv/bin/python -m ipykernel install --sys-prefix --name tiny-perceptron --display-name "Tiny Perceptron"
      - name: Identify execution inputs
        id: execution
        run: .venv/bin/python scripts/course_execution.py key --github-output "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: outputs/notebooks
          key: course-cpu-${{ runner.os }}-${{ steps.execution.outputs.key }}
      - name: Validate or execute the complete CPU bundle
        run: .venv/bin/python scripts/course_execution.py ensure --revision "$GITHUB_SHA"
      - name: Build Zensical website with verified outputs
        run: .venv/bin/python scripts/export_course.py --executed outputs/notebooks --publish --revision "$GITHUB_SHA"
      - name: Check links and lesson downloads
        run: .venv/bin/python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: outputs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
